<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK 2021 - Computer Based Test</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --border: #dfe6e9;
            --primary: #0984e3;
            --success: #00b894;
            --danger: #e17055;
            --warning: #fdcb6e;
            --section-physics: #6c5ce7;
            --section-chemistry: #e17055;
            --section-math: #00b894;
            --correct: #00b894;
            --incorrect: #e17055;
            --unanswered: #b2bec3;
            --hover: #f0f3f5;
            --selected: #e8f4fd;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
            --radius: 10px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }
        .header .logo {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header .logo span {
            color: #fdcb6e;
        }
        .timer-box {
            background: #2d2d44;
            border-radius: 25px;
            padding: 8px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .timer-box.warning {
            background: #e17055;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        .timer-icon {
            font-size: 1.3rem;
        }

        /* MAIN LAYOUT */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
            gap: 16px;
        }
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
            align-self: flex-start;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
        }
        .content-area {
            flex: 1;
            min-width: 0;
        }

        /* SECTION TABS */
        .section-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 5px;
            box-shadow: var(--shadow);
        }
        .section-tab {
            flex: 1;
            padding: 10px 16px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 2px solid transparent;
            background: transparent;
            color: #636e72;
        }
        .section-tab:hover {
            background: var(--hover);
        }
        .section-tab.active {
            color: #fff;
            border-color: transparent;
        }
        .section-tab.physics.active {
            background: var(--section-physics);
        }
        .section-tab.chemistry.active {
            background: var(--section-chemistry);
        }
        .section-tab.math.active {
            background: var(--section-math);
        }
        .section-tab .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 0.75rem;
            margin-left: 4px;
        }

        /* QUESTION NAV in sidebar */
        .question-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        .q-nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }
        .q-nav-btn:hover {
            border-color: var(--primary);
            background: #e8f4fd;
        }
        .q-nav-btn.answered {
            background: #dfe6e9;
            border-color: #b2bec3;
            color: #2d3436;
        }
        .q-nav-btn.current {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            transform: scale(1.15);
            box-shadow: 0 2px 8px rgba(9, 132, 227, 0.4);
        }
        .q-nav-btn.review-marked {
            background: #ffeaa7;
            border-color: #fdcb6e;
        }
        .sidebar-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        /* QUESTION CARD */
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 24px;
            margin-bottom: 12px;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }
        .question-card.current-question {
            border-left-color: var(--primary);
            box-shadow: 0 4px 20px rgba(9, 132, 227, 0.15);
        }
        .question-card.correct-review {
            border-left-color: var(--correct);
            background: #f0fdf6;
        }
        .question-card.incorrect-review {
            border-left-color: var(--incorrect);
            background: #fef5f3;
        }
        .question-card.unanswered-review {
            border-left-color: var(--unanswered);
            background: #fafafa;
        }
        .q-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .q-number {
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .q-text {
            font-size: 1rem;
            font-weight: 500;
            flex: 1;
            padding-top: 4px;
        }
        .q-text p {
            margin: 4px 0;
        }
        .q-text .math {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.05rem;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid transparent;
            background: #fafbfc;
        }
        .option-item:hover {
            background: #e8f4fd;
            border-color: #b8d8f0;
        }
        .option-item.selected {
            background: #e8f4fd;
            border-color: var(--primary);
            font-weight: 500;
        }
        .option-item.correct-answer {
            background: #d4f7e8 !important;
            border-color: var(--correct) !important;
            font-weight: 600;
        }
        .option-item.wrong-answer {
            background: #fde8e4 !important;
            border-color: var(--incorrect) !important;
        }
        .option-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #b2bec3;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            margin-top: 2px;
        }
        .option-item.selected .option-radio {
            border-color: var(--primary);
            background: var(--primary);
        }
        .option-item.selected .option-radio::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
        }
        .option-item.correct-answer .option-radio {
            border-color: var(--correct);
            background: var(--correct);
        }
        .option-item.wrong-answer .option-radio {
            border-color: var(--incorrect);
            background: var(--incorrect);
        }
        .option-item.correct-answer .option-radio::after,
        .option-item.wrong-answer .option-radio::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
        }
        .option-label {
            font-weight: 600;
            color: #636e72;
            min-width: 20px;
        }
        .option-text {
            flex: 1;
        }

        /* SVG IMAGE CONTAINER */
        .figure-container {
            text-align: center;
            margin: 12px 0;
            background: #fafbfc;
            border-radius: 8px;
            padding: 12px;
            border: 1px dashed #dfe6e9;
        }
        .figure-container svg {
            max-width: 100%;
            height: auto;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: #0773c5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.3);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #00a381;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: #e8f4fd;
        }
        .btn-warning {
            background: var(--warning);
            color: #2d3436;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 16px 0;
            position: sticky;
            bottom: 0;
            background: var(--bg);
            z-index: 50;
        }

        /* REVIEW MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 1.5rem;
        }
        .score-summary {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .score-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
            min-width: 100px;
        }
        .score-card .score-value {
            font-size: 2rem;
            font-weight: 700;
        }
        .score-card .score-label {
            font-size: 0.8rem;
            color: #636e72;
            text-transform: uppercase;
        }
        .score-card.correct .score-value {
            color: var(--correct);
        }
        .score-card.incorrect .score-value {
            color: var(--incorrect);
        }
        .score-card.unanswered .score-value {
            color: var(--unanswered);
        }

        /* REVIEW LIST */
        .review-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 4px 0;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.15s;
        }
        .review-item:hover {
            background: #f0f3f5;
        }
        .review-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .review-dot.correct {
            background: var(--correct);
        }
        .review-dot.incorrect {
            background: var(--incorrect);
        }
        .review-dot.unanswered {
            background: var(--unanswered);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                position: static;
                max-height: none;
                order: -1;
            }
            .question-grid {
                grid-template-columns: repeat(10, 1fr);
            }
            .q-nav-btn {
                width: 28px;
                height: 28px;
                font-size: 0.65rem;
            }
            .header {
                padding: 8px 12px;
            }
            .header .logo {
                font-size: 1rem;
            }
            .timer-box {
                font-size: 0.9rem;
                padding: 6px 14px;
            }
        }
        @media (max-width: 500px) {
            .question-grid {
                grid-template-columns: repeat(8, 1fr);
            }
            .q-nav-btn {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
            .section-tab {
                font-size: 0.7rem;
                padding: 8px 6px;
            }
            .question-card {
                padding: 12px;
            }
            .option-item {
                padding: 8px 10px;
            }
        }
        .hidden {
            display: none !important;
        }
        .solution-text {
            background: #fffef5;
            border: 1px solid #fdcb6e;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            font-size: 0.85rem;
            display: none;
        }
        .solution-text.show {
            display: block;
        }
    </style>
</head>

        </div>

        // ==================== TIMER ====================
        function updateTimerDisplay() {
            const h = Math.floor(timerSeconds / 3600);
            const m = Math.floor((timerSeconds % 3600) / 60);
            const s = timerSeconds % 60;
            document.getElementById('timerDisplay').textContent =
                `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            const timerBox = document.getElementById('timerBox');
            if (timerSeconds < 600) timerBox.classList.add('warning');
            else timerBox.classList.remove('warning');
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert('Time is up! The exam will be submitted automatically.');
                    submitExam();
                }
            }, 1000);

            const grid = document.getElementById('questionGrid');

                const btn = document.createElement('button');
                btn.className = 'q-nav-btn';
                if (userAnswers[qNum]) btn.classList.add('answered');
                if (markedForReview[qNum]) btn.classList.add('review-marked');
                if (qNum === getCurrentQuestionNumber()) btn.classList.add('current');
                btn.textContent = qNum;
                btn.title = `Q${qNum}` + (markedForReview[qNum] ? ' (Marked)' : '');
                btn.onclick = () => {
                    const idx = qs.indexOf(qNum);
                    if (idx >= 0) {
                        currentQuestionIndex = idx;
                        renderAll();
                    }
                };
                grid.appendChild(btn);
            });
            document.getElementById('statAnswered').textContent = Object.keys(userAnswers).length;
            document.getElementById('statMarked').textContent = Object.keys(markedForReview).length;
        }

            let optionsHtml = qData.options.map((opt, idx) => {
                const letter = ['a', 'b', 'c', 'd'][idx];
                let itemClass = 'option-item';
                if (userAns === letter) itemClass += ' selected';
                if (examSubmitted) {
                    if (letter === correctAns || (qNum === 124 && letter === 'x')) itemClass += ' correct-answer';
                    else if (userAns === letter && userAns !== correctAns) itemClass += ' wrong-answer';
                }
                return `
                    <li class="${itemClass}" onclick="selectAnswer(${qNum}, '${letter}')" id="opt-${qNum}-${letter}">
                        <span class="option-radio"></span>
                        <span class="option-label">${letter.toUpperCase()}.</span>
                        <span class="option-text">${opt}</span>
                    </li>`;
            }).join('');

            let reviewBadge = '';
            if (markedForReview[qNum]) reviewBadge =
                '<span style="background:#fdcb6e;color:#2d3436;padding:2px 8px;border-radius:10px;font-size:0.75rem;margin-left:8px;">📌 Marked</span>';

            let solutionHtml = '';
            if (examSubmitted) {
                const solText = getSolutionText(qNum);
                solutionHtml = `
                    <div class="solution-text show">
                        <strong>💡 Answer:</strong> ${correctAns === 'x' ? 'None of the options is correct (as per answer key)' : correctAns?.toUpperCase() || 'N/A'}
                        ${solText ? `<br><strong>📝 Hint:</strong> ${solText}` : ''}
                        ${userAns ? (userAns === correctAns || (qNum===124 && userAns==='x') ? ' ✅ <span style="color:#00b894;">Correct!</span>' : ' ❌ <span style="color:#e17055;">Your answer: ' + userAns.toUpperCase() + '</span>') : ' ⚠️ <span style="color:#b2bec3;">Not answered</span>'}
                    </div>`;
            }

            container.innerHTML = `
                <div class="${cardClass}" id="questionCard">
                    <div class="q-header">
                        <span class="q-number">${qNum}</span>
                        <span class="q-text">
                            ${qData.text}
                            ${reviewBadge}
                            ${figureHtml}
                        </span>
                    </div>
                    <ul class="options-list">${optionsHtml}</ul>
                    ${solutionHtml}
                </div>
            `;

            // Scroll to card
            document.getElementById('questionCard')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

                57: 'sin θ = λ/d = 589×10⁻⁹/(0.589×10⁻³) = 10⁻³.',
                58: 'KE_max depends linearly on frequency (straight line graph).',
                59: 'Total work = μRT₁log(V₂/V₁) − μRT₂log(V₃/V₄).',

        }

        function renderAll() {
            renderQuestionGrid();
            renderQuestion();
            updateSectionTabs();
        }

        function updateSectionTabs() {
            document.querySelectorAll('.section-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.section === currentSection) tab.classList.add('active');
            });
        }

        function switchSection(section) {
            currentSection = section;
            currentQuestionIndex = 0;
            renderAll();
            document.getElementById('questionsContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function selectAnswer(qNum, letter) {
            if (examSubmitted) return;
            userAnswers[qNum] = letter;
            markedForReview[qNum] = false;
            renderAll();
        }

        function markForReview() {
            if (examSubmitted) return;
            const qNum = getCurrentQuestionNumber();
            markedForReview[qNum] = !markedForReview[qNum];
            renderAll();
        }

        function nextQuestion() {
            const qs = getSectionQuestions(currentSection);
            if (currentQuestionIndex < qs.length - 1) {
                currentQuestionIndex++;
                renderAll();
            } else {
                // Move to next section
                if (currentSection === 'physics') {
                    switchSection('chemistry');
                } else if (currentSection === 'chemistry') {
                    switchSection('math');
                }
            }
        }

        function prevQuestion() {
            const qs = getSectionQuestions(currentSection);
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderAll();
            } else {
                if (currentSection === 'math') {
                    switchSection('chemistry');
                    const chemQs = getSectionQuestions('chemistry');
                    currentQuestionIndex = chemQs.length - 1;
                    renderAll();
                } else if (currentSection === 'chemistry') {
                    switchSection('physics');
                    const physQs = getSectionQuestions('physics');
                    currentQuestionIndex = physQs.length - 1;
                    renderAll();
                }
            }
        }

        // ==================== SUBMIT & REVIEW ====================
        function submitExam() {
            if (examSubmitted) return;
            if (!confirm('Are you sure you want to submit the paper? You cannot change answers after submission.'))
        return;
            examSubmitted = true;
            clearInterval(timerInterval);
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('reviewBtn').disabled = true;
            renderAll();
            showReviewModal();
        }

        function showReviewModal() {
            const modal = document.getElementById('reviewModal');
            const content = document.getElementById('reviewModalContent');

            let totalCorrect = 0;
            let totalIncorrect = 0;
            let totalUnanswered = 0;
            const reviewItems = [];

            for (let qNum = 1; qNum <= 180; qNum++) {
                const userAns = userAnswers[qNum];
                const correctAns = answerKey[qNum];
                let status = 'unanswered';
                if (!userAns) {
                    totalUnanswered++;
                    status = 'unanswered';
                } else if (userAns === correctAns || (qNum === 124 && userAns === 'x')) {
                    totalCorrect++;
                    status = 'correct';
                } else {
                    totalIncorrect++;
                    status = 'incorrect';
                }
                const sectionName = qNum <= 60 ? 'Physics' : qNum <= 120 ? 'Chemistry' : 'Math';
                reviewItems.push({ qNum, status, sectionName, userAns, correctAns });
            }

            const scorePercent = ((totalCorrect / 180) * 100).toFixed(1);

            content.innerHTML = `
                <h2>📊 Exam Results</h2>
                <div class="score-summary">
                    <div class="score-card correct">
                        <div class="score-value">${totalCorrect}</div>
                        <div class="score-label">✅ Correct</div>
                    </div>
                    <div class="score-card incorrect">
                        <div class="score-value">${totalIncorrect}</div>
                        <div class="score-label">❌ Incorrect</div>
                    </div>
                    <div class="score-card unanswered">
                        <div class="score-value">${totalUnanswered}</div>
                        <div class="score-label">⚠️ Unanswered</div>
                    </div>
                    <div class="score-card" style="background:#e8f4fd;">
                        <div class="score-value" style="color:#0984e3;">${scorePercent}%</div>
                        <div class="score-label">📈 Score</div>
                    </div>
                </div>
                <p style="text-align:center;color:#636e72;margin:8px 0;">Total: <strong>${totalCorrect}/180</strong> marks (1 mark per correct answer, no negative marking)</p>
                <h3 style="margin-top:16px;">📋 Question-wise Review</h3>
                <div style="max-height:300px;overflow-y:auto;">
                    ${reviewItems.map(r => `
                        <div class="review-item" onclick="jumpToQuestion(${r.qNum})" style="cursor:pointer;">
                            <span class="review-dot ${r.status}"></span>
                            <span><strong>Q${r.qNum}</strong> (${r.sectionName})</span>
                            <span style="font-size:0.8rem;color:#636e72;">
                                ${r.status === 'correct' ? '✅' : r.status === 'incorrect' ? '❌ Your: '+r.userAns?.toUpperCase()+' | Correct: '+r.correctAns?.toUpperCase() : '⚠️ Not answered'}
                            </span>
                        </div>
                    `).join('')}
                </div>
                <div style="text-align:center;margin-top:16px;">
                    <button class="btn btn-primary" onclick="closeReviewModal()">🔍 Review Questions on Page</button>
                </div>
            `;
            modal.classList.add('show');
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').classList.remove('show');
            // Navigate to first section
            switchSection('physics');
            currentQuestionIndex = 0;
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function jumpToQuestion(qNum) {
            closeReviewModal();
            if (qNum <= 60) switchSection('physics');
            else if (qNum <= 120) switchSection('chemistry');
            else switchSection('math');
            const qs = getSectionQuestions(currentSection);
            const idx = qs.indexOf(qNum);
            if (idx >= 0) currentQuestionIndex = idx;
            renderAll();
            setTimeout(() => {
                document.getElementById('questionCard')?.scrollIntoView({ behavior: 'smooth' });
            }, 200);
        }

        // ==================== KEYBOARD NAVIGATION ====================
        document.addEventListener('keydown', (e) => {
            if (examSubmitted) return;
            const qNum = getCurrentQuestionNumber();
            switch (e.key.toLowerCase()) {
                case 'a':
                case 'b':
                case 'c':
                case 'd':
                    selectAnswer(qNum, e.key.toLowerCase());
                    break;
                case 'arrowright':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'arrowleft':
                    e.preventDefault();
                    prevQuestion();
                    break;
                case 'm':
                    e.preventDefault();
                    markForReview();
                    break;
            }
        });

        // ==================== INIT ====================
        function init() {
            renderAll();
            startTimer();
            // Show first question
            document.getElementById('questionsContainer')?.scrollIntoView({ behavior: 'smooth' });
        }

        // Handle section tab clicks
        document.querySelectorAll('.section-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchSection(tab.dataset.section);
            });
        });

        // Close modal on overlay click
        document.getElementById('reviewModal').addEventListener('click', function(e) {
            if (e.target === this) closeReviewModal();
        });

        // Start the app
        init();

        console.log('✅ COMEDK 2021 CBT Ready!');
        console.log('📋 180 Questions Loaded: Physics Q1-60 | Chemistry Q61-120 | Mathematics Q121-180');
        console.log('⌨️  Keyboard shortcuts: A/B/C/D to answer, ←→ to navigate, M to mark for review');
        console.log('⏱  Timer set to 3 hours');
    </script>
</body>
