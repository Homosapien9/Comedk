<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>COMEDK 2012 · JEE Mains Style Mock Test</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card: #ffffff;
            --primary: #1a56db;
            --primary-light: #e8f0fe;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #ddd;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius: 8px;
            --physics: #1a56db;
            --chemistry: #dc2626;
            --math: #d97706;
            --font-mono: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
            --nav-bg: #ffffff;
            --header-bg: #1a56db;
            --header-text: #ffffff;
            --palette-notvisited: #e5e7eb;
            --palette-visited: #fecaca;
            --palette-answered: #bbf7d0;
            --palette-marked: #e9d5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 120;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            min-height: 52px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .avatar-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #ffffff;
            color: #1a56db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: 2px solid #fff;
        }
        .candidate-name {
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .test-title {
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .timer-box {
            background: #1e3a6e;
            padding: 7px 14px;
            border-radius: 4px;
            font-weight: 700;
            font-family: var(--font-mono);
            font-size: 1rem;
            letter-spacing: 1px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .timer-box.warning {
            background: #78350f;
            animation: pulse 1.2s infinite;
        }
        .timer-box.danger {
            background: #7f1d1d;
            animation: pulse 0.7s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        .header-right {
            flex-shrink: 0;
        }
        .btn-submit-header {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.3px;
            white-space: nowrap;
            min-height: 38px;
            transition: background 0.15s;
        }
        .btn-submit-header:hover {
            background: #b91c1c;
        }

        .subject-tabs-bar {
            background: #ffffff;
            display: flex;
            gap: 0;
            border-bottom: 2px solid #e5e7eb;
            position: sticky;
            top: 52px;
            z-index: 110;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .subject-tab-btn {
            flex: 1;
            text-align: center;
            padding: 11px 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.78rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            transition: 0.15s;
            border-bottom: 3px solid transparent;
            min-height: 44px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .subject-tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .subject-tab-btn .tab-count {
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: block;
        }
        .subject-tab-btn.active .tab-count {
            color: var(--primary);
        }

        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px;
            gap: 10px;
            min-height: calc(100vh - 160px);
        }

        .question-panel {
            flex: 1;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: clamp(14px, 2.5vw, 24px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }
        .qp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .badge {
            padding: 5px 14px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.75rem;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .badge.physics {
            background: var(--physics);
        }
        .badge.chemistry {
            background: var(--chemistry);
        }
        .badge.math {
            background: var(--math);
        }
        .question-num-label {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
        }
        .mark-indicator {
            color: #7c3aed;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .question-text {
            font-size: 1rem;
            padding: 4px 0;
            word-break: break-word;
            line-height: 1.7;
        }
        .question-text img,
        .question-text svg {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 8px 0;
            display: block;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
        }
        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            background: var(--card);
            transition: 0.12s;
            min-height: 52px;
            align-items: center;
        }
        .option-item:hover {
            border-color: #90a4d0;
            background: #f8fafc;
        }
        .option-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            font-weight: 600;
        }
        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .option-item.selected .option-letter {
            background: var(--primary);
            color: #fff;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .btn {
            padding: 10px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            transition: 0.15s;
            letter-spacing: 0.2px;
            min-height: 44px;
            white-space: nowrap;
        }
        .btn-save-next {
            background: #16a34a;
            color: #fff;
        }
        .btn-save-next:hover {
            background: #15803d;
        }
        .btn-clear {
            background: #dc2626;
            color: #fff;
        }
        .btn-clear:hover {
            background: #b91c1c;
        }
        .btn-prev {
            background: #e5e7eb;
            color: #1e293b;
            border: 1px solid #d1d5db;
        }
        .btn-prev:hover {
            background: #d1d5db;
        }
        .btn-mark {
            background: #f3e8ff;
            color: #7c3aed;
            border: 1px solid #c4b5fd;
        }
        .btn-mark:hover {
            background: #ede9fe;
        }

        .palette-sidebar {
            width: 280px;
            flex-shrink: 0;
            background: var(--nav-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 160px);
            position: sticky;
            top: 110px;
            overflow: hidden;
        }
        .palette-title {
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text);
        }
        .palette-legend {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.65rem;
            justify-content: center;
        }
        .legend-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid #ccc;
            vertical-align: middle;
            margin-right: 3px;
        }
        .legend-dot.notvisited {
            background: #e5e7eb;
        }
        .legend-dot.visited {
            background: #fecaca;
        }
        .legend-dot.answered {
            background: #bbf7d0;
        }
        .legend-dot.marked {
            background: #e9d5ff;
        }
        .question-nav {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            overflow-y: auto;
            max-height: 380px;
            padding-right: 3px;
            flex: 1;
        }
        .q-nav-btn {
            aspect-ratio: 1;
            border-radius: 3px;
            border: 1px solid #d1d5db;
            background: #e5e7eb;
            cursor: pointer;
            font-size: 0.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            transition: 0.1s;
            min-width: 22px;
            min-height: 22px;
            padding: 0;
        }
        .q-nav-btn:hover {
            border-color: #9ca3af;
            transform: scale(1.05);
        }
        .q-nav-btn.answered {
            background: #bbf7d0;
            border-color: #86efac;
            color: #16a34a;
            font-weight: 700;
        }
        .q-nav-btn.visited {
            background: #fecaca;
            border-color: #fca5a5;
            color: #dc2626;
            font-weight: 600;
        }
        .q-nav-btn.marked {
            background: #e9d5ff;
            border-color: #c4b5fd;
            color: #7c3aed;
            font-weight: 700;
        }
        .q-nav-btn.active {
            border: 2px solid #1a56db;
            font-weight: 800;
            box-shadow: 0 0 0 2px rgba(26, 86, 219, 0.3);
            z-index: 2;
            position: relative;
        }

        .mobile-bottom-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 2px solid #e5e7eb;
            padding: 8px 12px;
            z-index: 150;
            gap: 8px;
            justify-content: center;
        }
        .btn-questions-drawer {
            background: #1a56db;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            min-height: 48px;
            width: 100%;
            max-width: 300px;
        }

        .mobile-drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
        }
        .mobile-drawer-overlay.open {
            display: block;
        }
        .mobile-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            z-index: 210;
            padding: 16px;
            max-height: 65vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
        }
        .mobile-drawer.open {
            transform: translateY(0);
        }
        .drawer-handle {
            width: 40px;
            height: 4px;
            background: #d1d5db;
            border-radius: 2px;
            margin: 0 auto 12px;
        }
        .drawer-close {
            float: right;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
            min-height: 44px;
            min-width: 44px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal {
            background: #ffffff;
            border-radius: 10px;
            padding: clamp(16px, 4vw, 28px);
            max-width: 780px;
            width: 96%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #ddd;
        }
        .result-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }
        .result-card {
            background: #f9fafb;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .result-card .value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a56db;
        }
        .result-card .value.danger {
            color: #dc2626;
        }
        .result-card .value.warning {
            color: #d97706;
        }
        .result-card .value.success {
            color: #16a34a;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.85rem;
        }
        th,
        td {
            padding: 8px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        th {
            background: #1e293b;
            color: #fff;
            font-weight: 600;
        }
        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: #e5e7eb;
            min-width: 60px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
        }
        .progress-fill.good {
            background: #16a34a;
        }
        .progress-fill.avg {
            background: #d97706;
        }
        .progress-fill.poor {
            background: #dc2626;
        }
        .solution-box {
            background: #f0fdf4;
            border-left: 5px solid #16a34a;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }
        .solution-box.show {
            display: block;
        }
        .solution-box.incorrect {
            background: #fef2f2;
            border-left-color: #dc2626;
        }
        .name-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .name-input-row input {
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            flex: 1;
            min-width: 150px;
            font-family: Arial, sans-serif;
        }
        .name-input-row input:focus {
            outline: none;
            border-color: #1a56db;
        }

        @media (max-width: 900px) {
            .palette-sidebar {
                width: 240px;
            }
            .question-nav {
                grid-template-columns: repeat(8, 1fr);
            }
            .subject-tab-btn {
                font-size: 0.7rem;
                padding: 10px 2px;
            }
        }
        @media (max-width: 768px) {
            .palette-sidebar {
                display: none;
            }
            .main-container {
                flex-direction: column;
                padding: 6px;
                min-height: calc(100vh - 190px);
                padding-bottom: 80px;
            }
            .question-panel {
                border-radius: 6px;
                padding: 12px;
            }
            .mobile-bottom-bar {
                display: flex;
            }
            .header {
                padding: 6px 10px;
                gap: 6px;
                min-height: 48px;
            }
            .header-center {
                gap: 6px;
            }
            .test-title {
                font-size: 0.7rem;
            }
            .timer-box {
                font-size: 0.8rem;
                padding: 5px 10px;
            }
            .btn-submit-header {
                padding: 7px 12px;
                font-size: 0.7rem;
                min-height: 34px;
            }
            .candidate-name {
                max-width: 70px;
                font-size: 0.7rem;
            }
            .avatar-circle {
                width: 26px;
                height: 26px;
                font-size: 0.7rem;
            }
            .subject-tabs-bar {
                top: 48px;
            }
            .subject-tab-btn {
                font-size: 0.68rem;
                padding: 9px 2px;
                min-height: 40px;
            }
            .question-text {
                font-size: 0.9rem;
            }
            .option-item {
                padding: 10px 12px;
                min-height: 48px;
                gap: 8px;
            }
            .option-letter {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            .btn {
                padding: 8px 12px;
                font-size: 0.72rem;
                min-height: 40px;
            }
            .action-buttons {
                gap: 5px;
            }
            .question-num-label {
                font-size: 0.78rem;
            }
            .badge {
                font-size: 0.68rem;
                padding: 4px 10px;
            }
        }
        @media (max-width: 480px) {
            .header {
                padding: 5px 8px;
                gap: 4px;
                min-height: 44px;
            }
            .test-title {
                display: none;
            }
            .timer-box {
                font-size: 0.72rem;
                padding: 4px 8px;
                letter-spacing: 0.5px;
            }
            .btn-submit-header {
                padding: 6px 10px;
                font-size: 0.65rem;
                min-height: 30px;
            }
            .candidate-name {
                max-width: 55px;
                font-size: 0.65rem;
            }
            .avatar-circle {
                width: 22px;
                height: 22px;
                font-size: 0.6rem;
            }
            .subject-tabs-bar {
                top: 44px;
            }
            .subject-tab-btn {
                font-size: 0.6rem;
                padding: 8px 1px;
                min-height: 36px;
            }
            .subject-tab-btn .tab-count {
                font-size: 0.55rem;
            }
            .question-panel {
                padding: 8px;
                gap: 8px;
            }
            .question-text {
                font-size: 0.82rem;
            }
            .option-item {
                padding: 8px 10px;
                min-height: 44px;
                gap: 6px;
                border-width: 1.5px;
            }
            .option-letter {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
            }
            .btn {
                padding: 7px 10px;
                font-size: 0.68rem;
                min-height: 38px;
            }
            .action-buttons {
                gap: 4px;
            }
            .q-nav-btn {
                font-size: 0.5rem;
                min-width: 18px;
                min-height: 18px;
            }
            .mobile-drawer {
                max-height: 55vh;
                padding: 10px;
            }
            .question-nav {
                grid-template-columns: repeat(8, 1fr);
                gap: 2px;
            }
            .modal {
                padding: 12px;
                border-radius: 8px;
            }
            .result-card .value {
                font-size: 1.3rem;
            }
            table {
                font-size: 0.7rem;
            }
            th,
            td {
                padding: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="header" id="headerBar">
        <div class="header-left">
            <div class="avatar-circle" id="avatarCircle">C</div>
            <span class="candidate-name" id="candidateNameDisplay">Candidate</span>
        </div>
        <div class="header-center">
            <span class="test-title">COMEDK 2012</span>
            <div class="timer-box" id="timerBox"><span>⏱</span> <span id="timerDisplay">03:00:00</span></div>
        </div>
        <div class="header-right">
            <button class="btn-submit-header" onclick="confirmSubmit()">📝 Submit Test</button>
        </div>
    </div>

    <div class="subject-tabs-bar" id="subjectTabsBar">
        <button class="subject-tab-btn active" id="tabPhysics" onclick="switchSubject('physics')">⚛ Physics<span class="tab-count" id="tabCountPhysics">(0/60)</span></button>
        <button class="subject-tab-btn" id="tabChemistry" onclick="switchSubject('chemistry')">🧪 Chemistry<span class="tab-count" id="tabCountChemistry">(0/60)</span></button>
        <button class="subject-tab-btn" id="tabMath" onclick="switchSubject('math')">📐 Math<span class="tab-count" id="tabCountMath">(0/60)</span></button>
    </div>

    <div class="main-container" id="mainContainer">
        <main class="question-panel" id="questionContent"></main>
        <aside class="palette-sidebar" id="paletteSidebar">
            <div class="palette-title">📋 Question Palette</div>
            <div class="palette-legend">
                <span><span class="legend-dot notvisited"></span> Not Visited</span>
                <span><span class="legend-dot visited"></span> Not Answered</span>
                <span><span class="legend-dot answered"></span> Answered</span>
                <span><span class="legend-dot marked"></span> Marked</span>
            </div>
            <div class="question-nav" id="questionNav"></div>
            <div style="text-align:center;font-size:0.7rem;color:#64748b;" id="paletteCandidateName"></div>
        </aside>
    </div>

    <div class="mobile-bottom-bar" id="mobileBottomBar">
        <button class="btn-questions-drawer" onclick="openMobileDrawer()">📋 Questions</button>
    </div>

            function formatTime(s) { const h = Math.floor(s / 3600),
                    m = Math.floor((s % 3600) / 60),
                    sec = s % 60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

            function updateTimer() { document.getElementById('timerDisplay').textContent = formatTime(timeRemaining);
                const tb = document.getElementById('timerBox');
                tb.classList.remove('warning', 'danger'); if (timeRemaining <= 300 && timeRemaining > 120) tb.classList
                    .add('warning'); else if (timeRemaining <= 120) tb.classList.add('danger'); }

            function startTimer() { updateTimer();
                timerInterval = setInterval(() => { timeRemaining--;
                    updateTimer(); if (timeRemaining <= 0) { clearInterval(timerInterval);
                        submitTest(); } }, 1000); }

            function getSubjectQuestions(s) { return subjectRanges[s].qs; }

            function getSubjectById(id) { return id <= 60 ? 'physics' : id <= 120 ? 'chemistry' : 'math'; }

            function saveTime() { if (testSubmitted) return; const elapsed = Math.round((Date.now() - questionStartTime) /
                    1000);
                questionTimes[currentQuestionId] = (questionTimes[currentQuestionId] || 0) + elapsed;
                questionStartTime = Date.now(); }

            function selectOption(l) { if (testSubmitted) return;
                userAnswers[currentQuestionId] = l;
                markedQuestions[currentQuestionId] = false;
                renderQuestion();
                updateAllUI(); }

            function clearAnswer() { if (testSubmitted) return;
                userAnswers[currentQuestionId] = null;
                renderQuestion();
                updateAllUI(); }

            function toggleMark() { if (testSubmitted) return;
                markedQuestions[currentQuestionId] = !markedQuestions[currentQuestionId]; if (markedQuestions[
                    currentQuestionId]) userAnswers[currentQuestionId] = null;
                renderQuestion();
                updateAllUI(); }

            function saveAndNext() { saveTime(); const sq = getSubjectQuestions(currentSubject); const idx = sq.findIndex(
                    q => q.id === currentQuestionId); if (idx < sq.length - 1) { currentQuestionId = sq[idx + 1].id; } else { if (
                    currentSubject === 'physics') { switchSubject('chemistry');
                    currentQuestionId = 61; } else if (currentSubject === 'chemistry') { switchSubject('math');
                    currentQuestionId = 121; } }
                renderQuestion();
                renderAllNav();
                updateAllUI(); }

            function goToPrevious() { saveTime(); const sq = getSubjectQuestions(currentSubject); const idx = sq.findIndex(
                    q => q.id === currentQuestionId); if (idx > 0) { currentQuestionId = sq[idx - 1].id; } else { if (
                    currentSubject === 'math') { switchSubject('chemistry');
                    currentQuestionId = 120; } else if (currentSubject === 'chemistry') { switchSubject('physics');
                    currentQuestionId = 60; } }
                renderQuestion();
                renderAllNav();
                updateAllUI(); }

            function switchSubject(s) { saveTime();
                currentSubject = s;
                currentQuestionId = subjectRanges[s].start;
                document.getElementById('tabPhysics').classList.toggle('active', s === 'physics');
                document.getElementById('tabChemistry').classList.toggle('active', s === 'chemistry');
                document.getElementById('tabMath').classList.toggle('active', s === 'math');
                questionStartTime = Date.now();
                renderQuestion();
                renderAllNav();
                updateAllUI(); }

            function getSubjectStats(s) { const sq = subjectRanges[s].qs; let a = 0,
                    m = 0; sq.forEach(q => { if (userAnswers[q.id] !== null) a++; if (markedQuestions[q.id]) m++; }); return {
                    ans: a,
                    total: sq.length,
                    mark: m }; }

                const statsP = getSubjectStats('physics'),

                    statsM = getSubjectStats('math');

                    const cls = getPaletteClass(q);
                    const activeCls = q.id === currentQuestionId ? ' active' : '';
                    return `<button class="q-nav-btn ${cls}${activeCls}" onclick="navigateToQuestion(${q.id})" title="Q${q.id}">${q.id}</button>`;
                }).join('');
                if (desktopNav) desktopNav.innerHTML = html;
                if (mobileNav) mobileNav.innerHTML = html;
            }

            function renderQuestion() {
                if (testSubmitted) { renderReview(); return; }
                const q = allQuestions.find(x => x.id === currentQuestionId);
                if (!q) return;
                visitedQuestions[q.id] = true;
                const sub = getSubjectById(q.id),
                    sel = userAnswers[q.id],
                    mk = markedQuestions[q.id];
                const qIndex = allQuestions.findIndex(x => x.id === q.id) + 1;
                document.getElementById('questionContent').innerHTML = `
          <div class="qp-header">
            <span class="badge ${sub}">${sub.toUpperCase()}</span>
            <span class="question-num-label">Question ${qIndex} of 180</span>
            ${mk?'<span class="mark-indicator">★ Marked for Review</span>':''}
            ${q.correct==='*'?'<span style="color:#b45309;font-size:0.75rem;">⚠ No correct option</span>':''}
          </div>
          <div class="question-text">${q.text}</div>
          <ul class="options-list">${['a','b','c','d'].map((l,i)=>`
            <li class="option-item ${sel===l?'selected':''}" onclick="selectOption('${l}')">
              <span class="option-letter">${l.toUpperCase()}</span><span>${q.options[i]}</span>
            </li>`).join('')}</ul>
          <div class="action-buttons">
            <button class="btn btn-save-next" onclick="saveAndNext()">🟢 Save & Next</button>
            <button class="btn btn-clear" onclick="clearAnswer()">🔴 Clear Response</button>
            <button class="btn btn-mark" onclick="toggleMark()">${mk?'★ Unmark':'☆ Mark for Review'}</button>
            <button class="btn btn-prev" onclick="goToPrevious()">⬅ Previous</button>
          </div>`;
                renderAllNav();
                updateAllUI();
            }

            function renderReview() {
                const q = allQuestions.find(x => x.id === currentQuestionId);
                if (!q) return;
                const ua = userAnswers[q.id],
                    ca = q.correct;
                let solText = q.solution || '';
                if (ca === '*') solText = 'No correct option per official key. ' + solText;
                else if (ua === null) solText = '⏭ Skipped. Correct: ' + ca.toUpperCase() + '. ' + solText;
                else if (ua === ca) solText = '✅ Correct! ' + solText;
                else solText = '❌ Your: ' + ua.toUpperCase() + '. Correct: ' + ca.toUpperCase() + '. ' + solText;
                const qIndex = allQuestions.findIndex(x => x.id === q.id) + 1;
                document.getElementById('questionContent').innerHTML = `
          <div class="qp-header">
            <span class="badge ${getSubjectById(q.id)}">REVIEW</span>
            <span class="question-num-label">Question ${qIndex} of 180</span>
          </div>
          <div class="question-text">${q.text}</div>
          <ul class="options-list">${['a','b','c','d'].map((l,i)=>{ let cls=''; if(l===ca&&ca!=='*') cls='selected'; else if(l===ua&&l!==ca) cls='selected'; return `<li class="option-item ${cls}" style="pointer-events:none;"><span class="option-letter">${l.toUpperCase()}</span><span>${q.options[i]}</span></li>`; }).join('')}</ul>
          <div class="solution-box show ${(ua!==ca&&ca!=='*')?'incorrect':''}"><strong>📝 Solution:</strong> ${solText}</div>
          <p style="font-size:0.78rem;color:#64748b;">⏱ Time spent: ${questionTimes[q.id]||0}s</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-prev" onclick="goToPrevious()">⬅ Prev</button>
            <button class="btn btn-save-next" onclick="saveAndNext()">Next →</button>
          </div>`;
                renderAllNav();
            }

            function confirmSubmit() {
                if (testSubmitted) return;
                const unanswered = allQuestions.filter(q => userAnswers[q.id] === null && !markedQuestions[q.id]).length;
                const msg = unanswered > 0 ?
                    `You have ${unanswered} unanswered question(s). Are you sure you want to submit?` :
                    'Are you sure you want to submit the test?';
                if (confirm(msg)) { submitTest(); }
            }

            function submitTest() {
                if (testSubmitted) return;
                saveTime();
                clearInterval(timerInterval);
                testSubmitted = true;
                let tc = 0,
                    ti = 0,
                    ts = 0,
                    tno = 0;
                const sr = { physics: { c: 0, i: 0, s: 0, t: 60, no: 0 }, chemistry: { c: 0, i: 0, s: 0, t: 60,
                        no: 0 }, math: { c: 0, i: 0, s: 0, t: 60, no: 0 } };
                allQuestions.forEach(q => {
                    const s = getSubjectById(q.id),
                        ua = userAnswers[q.id];
                    if (q.correct === '*') { sr[s].no++;
                        tno++; if (ua === null) { sr[s].s++; } else { sr[s].s++;
                        ts++; } } else if (ua === null) { sr[s].s++;
                        ts++; } else if (ua === q.correct) { sr[s].c++;
                        tc++; } else { sr[s].i++;
                        ti++; }
                });
                const scored = 180 - tno,
                    pct = scored > 0 ? Math.round(tc / scored * 100) : 0;
                const existingName = localStorage.getItem('comedk_username') || '';

                function showResults(nameToUse) {
                    const nameForDisplay = nameToUse || 'Anonymous';
                    document.getElementById('resultModal').innerHTML = `
            <h2>📊 Result · COMEDK 2012</h2>
            <div class="result-summary">
              <div class="result-card"><div class="value success">${tc}/${scored}</div>Correct</div>
              <div class="result-card"><div class="value danger">${ti}</div>Incorrect</div>
              <div class="result-card"><div class="value warning">${ts}</div>Skipped</div>
              <div class="result-card"><div class="value">${pct}%</div>Accuracy</div>
            </div>
            <p style="text-align:center;font-weight:600;">Candidate: ${nameForDisplay}</p>
            <table><tr><th>Subject</th><th>Correct</th><th>Incorrect</th><th>Skipped</th><th>Performance</th></tr>
            ${['physics','chemistry','math'].map(s=>{ const r=sr[s]; const sc=r.t-r.no; const sp=sc>0?Math.round(r.c/sc*100):0; const cls=sp>=70?'good':sp>=40?'avg':'poor'; return `<tr><td><strong>${s}</strong></td><td>${r.c}</td><td>${r.i}</td><td>${r.s}</td><td><div class="progress-bar"><div class="progress-fill ${cls}" style="width:${sp}%"></div></div>${sp}%</td></tr>`; }).join('')}</table>
            ${!existingName?`
            <div class="name-input-row">
              <input type="text" id="nameInput" placeholder="Enter your name for leaderboard" maxlength="40">
              <button class="btn btn-save-next" onclick="saveNameAndSubmit()">💾 Save & Submit</button>
            </div>`:''}
            <div style="text-align:center;margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
              <button class="btn btn-save-next" onclick="reviewAll()">🔎 Review All Questions</button>
              <button class="btn btn-prev" onclick="retakeTest()">🔄 Retake Test</button>
              <a href="index.html" class="btn btn-prev" style="text-decoration:none;">🏠 Back to Home</a>
            </div>`;
                    document.getElementById('resultOverlay').style.display = 'flex';

                    if (existingName) {
                        tryFirebaseSave(existingName, tc, pct);
                    }
                }

                window.saveNameAndSubmit = function() {
                    const input = document.getElementById('nameInput');
                    const nameVal = (input?.value?.trim()) || 'Anonymous';
                    localStorage.setItem('comedk_username', nameVal);
                    updateAllUI();
                    tryFirebaseSave(nameVal, tc, pct);
                    document.getElementById('resultModal').querySelector('.name-input-row')?.remove();
                    const pEl = document.getElementById('resultModal').querySelector('p');
                    if (pEl && pEl.textContent.includes('Candidate:')) {
                        pEl.textContent = 'Candidate: ' + nameVal;
                    }
                };

                function tryFirebaseSave(name, score, accuracy) {
                    if (typeof window.saveScoreToFirebase === 'function') {
                        window.saveScoreToFirebase(name, '2012', score, 180, accuracy);
                    } else {
                        setTimeout(() => {
                            if (typeof window.saveScoreToFirebase === 'function') {
                                window.saveScoreToFirebase(name, '2012', score, 180, accuracy);
                            } else {
                                console.warn('Firebase not loaded, score not saved remotely.');
                            }
                        }, 1500);
                    }
                }

                showResults(existingName);
            }

            window.saveNameAndSubmit = function() {
                const input = document.getElementById('nameInput');
                const nameVal = (input?.value?.trim()) || 'Anonymous';
                localStorage.setItem('comedk_username', nameVal);
                updateAllUI();
                if (typeof window.saveScoreToFirebase === 'function') {
                    const tc = parseInt(document.querySelector('.result-card .value.success')?.textContent?.split(
                        '/')[0]) || 0;
                    const pct = parseInt(document.querySelector('.result-card .value:last-child')?.textContent) ||
                        0;
                    window.saveScoreToFirebase(nameVal, '2012', tc, 180, pct);
                }
                const nameRow = document.getElementById('resultModal')?.querySelector('.name-input-row');
                if (nameRow) nameRow.remove();
                const pEl = document.getElementById('resultModal')?.querySelector('p');
                if (pEl && pEl.textContent.includes('Candidate:')) {
                    pEl.textContent = 'Candidate: ' + nameVal;
                }
            };

            function reviewAll() { document.getElementById('resultOverlay').style.display = 'none';
                testSubmitted = true;
                currentSubject = 'physics';
                currentQuestionId = 1;
                renderQuestion();
                renderAllNav();
                updateAllUI(); }

            function retakeTest() { location.reload(); }

            function openMobileDrawer() {
                document.getElementById('mobileDrawerOverlay').classList.add('open');
                document.getElementById('mobileDrawer').classList.add('open');
                renderAllNav();
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawerOverlay').classList.remove('open');
                document.getElementById('mobileDrawer').classList.remove('open');
            }

            window.navigateToQuestion = navigateToQuestion;
            window.openMobileDrawer = openMobileDrawer;
            window.closeMobileDrawer = closeMobileDrawer;
            window.saveNameAndSubmit = window.saveNameAndSubmit;

            document.addEventListener('keydown', e => {
                if (testSubmitted) return;
                const k = e.key.toLowerCase();
                if (['a', 'b', 'c', 'd'].includes(k)) selectOption(k);
                else if (k === 'arrowright') { e.preventDefault();
                    saveAndNext(); } else if (k === 'arrowleft') { e.preventDefault();
                    goToPrevious(); } else if (k === 'm') toggleMark();
            });

            window.addEventListener('load', () => {
                const savedName = localStorage.getItem('comedk_username') || '';
                if (savedName) {
                    document.getElementById('candidateNameDisplay').textContent = savedName;
                    document.getElementById('avatarCircle').textContent = savedName.charAt(0).toUpperCase();
                }
                switchSubject('physics');
                currentQuestionId = 1;
                questionStartTime = Date.now();
                renderQuestion();
                startTimer();
                updateAllUI();
            });

            window.confirmSubmit = confirmSubmit;
            window.submitTest = submitTest;
            window.reviewAll = reviewAll;
            window.retakeTest = retakeTest;
            window.selectOption = selectOption;
            window.clearAnswer = clearAnswer;
            window.toggleMark = toggleMark;
            window.saveAndNext = saveAndNext;
            window.goToPrevious = goToPrevious;
            window.switchSubject = switchSubject;
        })();
    </script>
</body>
</html>
