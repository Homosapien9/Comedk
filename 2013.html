<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>COMEDK 2013 · JEE Style Mock Test</title>
  <style>
    :root {
      --bg: #f4f6fc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-light: #e0e7ff;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --text: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
      --radius: 20px;
      --physics: #2563eb;
      --chemistry: #dc2626;
      --math: #d97706;
      --font-mono: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
      --nav-bg: #ffffff;
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #3b82f6;
      --primary-light: #1e3a5f;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      --nav-bg: #1e293b;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .header {
      background: #0f172a;
      color: #f8fafc;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 120;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-weight: 800;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo span {
      color: #60a5fa;
    }
    .timer-box {
      background: #1e293b;
      padding: 8px 18px;
      border-radius: 32px;
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1.5px;
    }
    .timer-box.warning {
      background: #78350f;
      animation: pulse 1.2s infinite;
    }
    .timer-box.danger {
      background: #7f1d1d;
      animation: pulse 0.7s infinite;
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.65;
      }
    }
    .theme-toggle {
      background: #334155;
      border: none;
      color: #f1f5f9;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .main-container {
      display: flex;
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px;
      gap: 14px;
      min-height: calc(100vh - 130px);
    }
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--nav-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 140px);
      position: sticky;
      top: 80px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .subject-tabs {
      display: flex;
      gap: 4px;
      background: var(--border);
      border-radius: 26px;
      padding: 3px;
    }
    .subject-tab {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.78rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      transition: 0.2s;
    }
    .subject-tab.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .stats-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      font-size: 0.72rem;
    }
    .stat {
      background: var(--border);
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .question-nav {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      overflow-y: auto;
      max-height: 340px;
      padding-right: 3px;
    }
    .q-nav-btn {
      aspect-ratio: 1;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 0.66rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: 0.15s;
    }
    .q-nav-btn:hover {
      background: var(--primary-light);
    }
    .q-nav-btn.answered {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e40af;
    }
    .q-nav-btn.marked {
      background: #ede9fe;
      border-color: #c4b5fd;
      color: #6d28d9;
    }
    .q-nav-btn.active {
      border: 2px solid #0f172a;
      font-weight: 800;
      transform: scale(1.05);
    }
    .btn {
      padding: 10px 18px;
      border-radius: 28px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
    }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-warning {
      background: #f59e0b;
      color: #000;
    }
    .content {
      flex: 1;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(16px, 3vw, 28px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid var(--border);
    }
    .badge {
      padding: 6px 16px;
      border-radius: 22px;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
      letter-spacing: 0.4px;
    }
    .badge.physics {
      background: var(--physics);
    }
    .badge.chemistry {
      background: var(--chemistry);
    }
    .badge.math {
      background: var(--math);
    }
    .question-text {
      font-size: 1.06rem;
      padding: 6px 0;
      word-break: break-word;
    }
    .question-text img,
    .question-text svg {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin: 10px 0;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 18px;
      border: 2px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      background: var(--card);
      transition: 0.15s;
    }
    .option-item:hover {
      border-color: #90a4d0;
      background: var(--primary-light);
    }
    .option-item.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }
    .option-letter {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .option-item.selected .option-letter {
      background: var(--primary);
      color: #fff;
    }
    .solution-box {
      background: #f0fdf4;
      border-left: 5px solid #16a34a;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-top: 8px;
      display: none;
    }
    .solution-box.show {
      display: block;
    }
    .solution-box.incorrect {
      background: #fef2f2;
      border-left-color: #dc2626;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: var(--card);
      border-radius: var(--radius);
      padding: clamp(16px, 4vw, 28px);
      max-width: 780px;
      width: 96%;
      max-height: 92vh;
      overflow-y: auto;
    }
    .result-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
    }
    .result-card {
      background: var(--border);
      padding: 14px;
      border-radius: 14px;
      text-align: center;
    }
    .result-card .value {
      font-size: 2rem;
      font-weight: 800;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    th,
    td {
      padding: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }
    th {
      background: #1e293b;
      color: #fff;
    }
    .progress-bar {
      height: 6px;
      border-radius: 3px;
      background: var(--border);
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
    }
    .progress-fill.good {
      background: var(--success);
    }
    .progress-fill.avg {
      background: var(--warning);
    }
    .progress-fill.poor {
      background: var(--danger);
    }
    @media (max-width: 860px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: none;
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .question-nav {
        grid-template-columns: repeat(12, 1fr);
        max-height: 130px;
      }
    }
    @media (max-width: 480px) {
      .question-nav {
        grid-template-columns: repeat(10, 1fr);
      }
      .option-item {
        padding: 12px;
        gap: 8px;
      }
      .option-letter {
        width: 28px;
        height: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎯 COMEDK <span>2013</span> · JEE Style Mock</div>
    <div class="timer-box" id="timerBox"><span>⏱</span><span id="timerDisplay">03:00:00</span></div>
    <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
  </div>
  <div class="main-container">
    <aside class="sidebar" id="sidebar">
      <div class="subject-tabs">
        <button class="subject-tab physics active" id="tabPhysics" onclick="switchSubject('physics')">⚛ Physics</button>
        <button class="subject-tab chemistry" id="tabChemistry" onclick="switchSubject('chemistry')">🧪 Chemistry</button>
        <button class="subject-tab math" id="tabMath" onclick="switchSubject('math')">📐 Math</button>
      </div>
      <div class="stats-row">
        <span class="stat" id="statAnswered">✓ 0</span>
        <span class="stat" id="statSkipped">⊘ 0</span>
        <span class="stat" id="statMarked">★ 0</span>
      </div>
      <div class="question-nav" id="questionNav"></div>
      <button class="btn btn-danger" onclick="submitTest()" style="width:100%;margin-top:6px;">📝 Submit Test</button>
    </aside>
    <main class="content" id="questionContent"></main>
  </div>
  <div class="modal-overlay" id="resultOverlay" style="display:none;">
    <div class="modal" id="resultModal"></div>
  </div>
  <script>
    // Simple SVG diagrams based on PDF descriptions
    const diagQ2 = `<svg width="200" height="120" viewBox="0 0 200 120"><line x1="30" y1="30" x2="170" y2="30" stroke="currentColor" stroke-width="2"/><text x="10" y="25" font-size="10">A</text><line x1="30" y1="55" x2="170" y2="55" stroke="currentColor" stroke-width="3"/><text x="10" y="50" font-size="10">B</text><line x1="30" y1="85" x2="170" y2="85" stroke="currentColor" stroke-width="2"/><text x="10" y="80" font-size="10">C</text><text x="180" y="25" font-size="10">1A</text><text x="180" y="50" font-size="10">2A</text><text x="180" y="80" font-size="10">3A</text></svg>`;
    const diagQ18 = `<svg width="200" height="120" viewBox="0 0 200 120"><text x="60" y="20" font-size="10">2.8Ω</text><text x="140" y="40" font-size="10">4Ω</text><text x="100" y="80" font-size="10">2Ω</text><text x="160" y="80" font-size="10">3Ω</text><text x="80" y="110" font-size="10">6V</text><circle cx="90" cy="55" r="2"/><circle cx="130" cy="55" r="2"/></svg>`;
    const diagQ35 = `<svg width="200" height="140" viewBox="0 0 200 140"><text x="30" y="40" font-size="11">Steel</text><text x="30" y="100" font-size="11">Copper</text><text x="120" y="30" font-size="10">2m</text><text x="120" y="90" font-size="10">5m</text></svg>`;
    const diagQ50 = `<svg width="200" height="130" viewBox="0 0 200 130"><rect x="20" y="20" width="160" height="80" fill="none" stroke="currentColor"/><text x="40" y="15" font-size="10">+ + + + +</text><text x="40" y="115" font-size="10">− − − − −</text><circle cx="100" cy="60" r="20" fill="none" stroke="currentColor"/></svg>`;
    const diagQ56 = `<svg width="200" height="130" viewBox="0 0 200 130"><line x1="30" y1="110" x2="30" y2="20" stroke="currentColor"/><line x1="30" y1="110" x2="170" y2="110" stroke="currentColor"/><text x="10" y="70">pV</text><text x="160" y="125">V</text><line x1="50" y1="60" x2="150" y2="60" stroke="currentColor" stroke-width="2"/></svg>`;
    const diagQ60 = `<svg width="200" height="130" viewBox="0 0 200 130"><text x="20" y="50">A</text><text x="160" y="50">B</text><text x="50" y="20">3μF</text><text x="120" y="20">4μF</text><text x="50" y="100">6μF</text><text x="120" y="100">8μF</text><text x="80" y="55">2μF</text></svg>`;

    const physicsQuestions = [
      { id: 1, subject: 'physics', text: 'The difference between the apparent frequency of a source of sound as perceived by the observer during its approach and recession is 2% of the frequency of the source. If the speed of sound in air is 300 ms⁻¹, then the velocity of the source is', options: ['15 ms⁻¹', '12 ms⁻¹', '6 ms⁻¹', '3 ms⁻¹'], correct: 'd', solution: 'f_approach − f_recession = (f×2)/100. Using f\' = f(v/(v∓vₛ)): 2vₛ/v = 1/50 → vₛ = 300/(2×50) = 3 ms⁻¹.' },
      { id: 2, subject: 'physics', text: 'Three long straight wires A, B and C are carrying currents as shown in figure. Resultant force on B is directed ' + diagQ2, options: ['perpendicular to plane outward', 'perpendicular to plane inward', 'towards A', 'towards C'], correct: 'd', solution: 'Force from A is attractive (towards A), force from C is larger (3A vs 1A) and attractive (towards C). Net force towards C.' },
      { id: 3, subject: 'physics', text: 'Curie-Weiss law is obeyed by iron', options: ['at Curie temperature only', 'at all temperatures', 'below Curie temperature', 'above Curie temperature'], correct: 'd', solution: 'Curie-Weiss law χ = C/(T−T_C) holds above Curie temperature for ferromagnetic materials.' },
      { id: 4, subject: 'physics', text: 'A magnet N-S is suspended from a spring and oscillates in and out of coil C connected to galvanometer G. As the magnet oscillates', options: ['G shows no deflection', 'G shows deflection left and right but amplitude steadily decreases', 'G shows deflection left and right with constant amplitude', 'G shows deflection on one side'], correct: 'b', solution: 'Changing flux induces emf causing left-right deflection. Eddy currents dampen the motion, decreasing amplitude.' },
      { id: 5, subject: 'physics', text: 'The dimensional formula for inductance is', options: ['[ML²T⁻²A⁻²]', '[ML²TA⁻²]', '[ML²T⁻¹A⁻²]', '[ML²T⁻²A⁻¹]'], correct: 'a', solution: 'L = φ/I = BA/I. [φ]=[ML²T⁻²A⁻¹], [L]=[ML²T⁻²A⁻²].' },
      { id: 6, subject: 'physics', text: 'Maximum current measured by galvanometer of resistance 40Ω is 10mA. Converted to voltmeter reading up to 50V. Series resistance needed (in Ω) is', options: ['2010', '4050', '5040', '4960'], correct: 'd', solution: 'V = I_g(G+R) → 50 = 10×10⁻³(40+R) → R = 5000−40 = 4960 Ω.' },
      { id: 7, subject: 'physics', text: 'Spectrum from chromosphere of sun during total solar eclipse is', options: ['line emission spectrum', 'band emission spectrum', 'continuous emission spectrum', 'line absorption spectrum'], correct: 'd', solution: 'Chromosphere absorbs specific wavelengths from photosphere\'s continuous spectrum, producing line absorption spectrum.' },
      { id: 8, subject: 'physics', text: 'Heavy water is', options: ['compound of deuterium and oxygen', 'water at 4°C', 'water in which soap does not lather', 'compound of heavy oxygen and heavy hydrogen'], correct: 'a', solution: 'Heavy water (D₂O) contains deuterium (heavy hydrogen) and oxygen.' },
      { id: 9, subject: 'physics', text: 'The nuclear reactor at Kaiga is a', options: ['research reactor', 'fusion reactor', 'breeder reactor', 'power reactor'], correct: 'd', solution: 'Kaiga Atomic Power Station is a power reactor for electricity generation.' },
      { id: 10, subject: 'physics', text: 'When a body moves in a circular path, no work is done since', options: ['force and displacement are perpendicular', 'force is always away from centre', 'there is no displacement', 'there is no net force'], correct: 'a', solution: 'Centripetal force is perpendicular to tangential displacement. W = Fs cos90° = 0.' },
      { id: 11, subject: 'physics', text: 'Bullet at 100 ms⁻¹ penetrates 2 planks. Number of planks penetrated when speed doubled is', options: ['6', '10', '4', '8'], correct: 'd', solution: 's ∝ u². s₂/s₁ = (200/100)² = 4. s₂ = 4×2 = 8 planks.' },
      { id: 12, subject: 'physics', text: 'Two bodies of masses 1kg and 2kg have equal momentum. Ratio of their kinetic energies is', options: ['2:1', '3:1', '1:3', '1:1'], correct: 'a', solution: 'K = p²/2m. With equal p, K ∝ 1/m. K₁/K₂ = m₂/m₁ = 2:1.' },
      { id: 13, subject: 'physics', text: 'Absorption coefficient of an open window is', options: ['1', '0.25', 'zero', '0.5'], correct: 'a', solution: 'An open window acts as a perfect absorber (black body). Absorption coefficient = 1.' },
      { id: 14, subject: 'physics', text: 'The loudness and pitch of a sound note depend on', options: ['intensity and velocity', 'frequency and velocity', 'intensity and frequency', 'frequency and number of harmonics'], correct: 'c', solution: 'Loudness depends on intensity (amplitude); pitch depends on frequency.' },
      { id: 15, subject: 'physics', text: 'In Melde\'s experiment in transverse mode, the ratio of tuning fork frequency to wave frequency in string is', options: ['2:1', '4:1', '1:1', '1:2'], correct: 'c', solution: 'Resonance requires frequencies to match: ratio is 1:1.' },
      { id: 16, subject: 'physics', text: 'Electron accelerated through 45.5V. Velocity acquired (in ms⁻¹) is', options: ['10⁶', 'zero', '4×10⁶', '4×10⁴'], correct: 'c', solution: '½mv² = eV → v = √(2×1.6×10⁻¹⁹×45.5/9.1×10⁻³¹) = √(16×10¹²) = 4×10⁶ ms⁻¹.' },
      { id: 17, subject: 'physics', text: 'Unknown resistance R₁ in series with 10Ω connected to meter bridge. Balance at 50cm. When 10Ω removed, balance shifts to 40cm. Value of R₁ (in Ω) is', options: ['20', '10', '60', '40'], correct: 'a', solution: '(R₁+10)/R₂ = 50/50 → R₁+10=R₂. R₁/R₂ = 40/60 → R₂=3R₁/2. Solving: R₁+10=1.5R₁ → R₁=20Ω.' },
      { id: 18, subject: 'physics', text: 'In the circuit shown, steady state current in 2Ω resistor is ' + diagQ18, options: ['0.6A', '1.2A', '0.9A', '1.5A'], correct: 'c', solution: '2Ω∥3Ω = 1.2Ω. At steady state, capacitor blocks DC. Total R = 1.2+2.8=4Ω. I = 6/4=1.5A. V across parallel = 1.5×1.2=1.8V. I₂Ω = 1.8/2 = 0.9A.' },
      { id: 19, subject: 'physics', text: 'Rectangular coil 300 turns, area 25cm×10cm, 50 cps, B=4×10⁻²T. Peak induced emf (in V) is', options: ['300π', '3000π', '3π', '30π'], correct: 'd', solution: 'e₀ = NABω = 300×250×10⁻⁴×4×10⁻²×2π×50 = 30π V.' },
      { id: 20, subject: 'physics', text: 'In L-C-R circuit, V_L=60V, V_C=30V, V_R=40V. Supply voltage is', options: ['130V', '10V', '50V', '70V'], correct: 'c', solution: 'V = √(V_R² + (V_L−V_C)²) = √(40²+30²) = √2500 = 50V.' },
      { id: 21, subject: 'physics', text: 'Vertical circular coil radius 0.1m, 10 turns. Neutral point at centre when plane normal to magnetic meridian. B_H=0.314×10⁻⁴T. Current in coil is', options: ['0.5A', '0.25A', '2A', '1A'], correct: 'a', solution: 'B_H = μ₀NI/2R → I = 2×0.314×10⁻⁴×0.1/(4π×10⁻⁷×10) = 0.5A.' },
      { id: 22, subject: 'physics', text: 'Thread tied loosely to wire frame dipped in soap solution. When portion A punctured, the thread', options: ['becomes concave towards A', 'becomes convex towards A', 'either depending on size', 'remains in initial position'], correct: 'a', solution: 'Surface tension in remaining film pulls the thread, making it concave towards punctured area.' },
      { id: 23, subject: 'physics', text: 'Oxygen 16 times heavier than hydrogen. Equal volumes mixed. Ratio of speed of sound in mixture to that in hydrogen is', options: ['√8', '√(2/17)', '√(1/8)', '√(32/17)'], correct: 'b', solution: 'M_mix = (M₁+M₂)/2 = 17M₁/2. v ∝ 1/√M. v_mix/v_H = √(M₁/M_mix) = √(2/17).' },
      { id: 24, subject: 'physics', text: 'Two waves same frequency and amplitude produce resultant of same amplitude. Phase difference is', options: ['π', 'zero', 'π/3', '2π/3'], correct: 'd', solution: 'A² = A²+A²+2A²cosφ → cosφ = −½ → φ = 2π/3.' },
      { id: 25, subject: 'physics', text: 'Man between two cliffs hears echoes at 1s intervals. Speed of sound 340 ms⁻¹. Distance between cliffs is', options: ['680m', '1700m', '340m', '1620m'], correct: 'c', solution: 'Distance to one cliff: x = v×t/2 = 340/2 = 170m. Distance between cliffs = 2x = 340m.' },
      { id: 26, subject: 'physics', text: 'Light 600nm, single slit 1mm wide, screen 2m away. Distance between first dark fringes on either side of central bright fringe is', options: ['2.4cm', '2.4mm', '1.2mm', '1.2cm'], correct: 'b', solution: 'y = Dλ/d = 2×600×10⁻⁹/10⁻³ = 1.2mm. Distance both sides = 2y = 2.4mm.' },
      { id: 27, subject: 'physics', text: 'Pair of quantities having same dimensions is', options: ['impulse and surface tension', 'angular momentum and work', 'work and torque', 'Young\'s modulus and energy'], correct: 'c', solution: 'Work = [ML²T⁻²], Torque = [ML²T⁻²]. Both have same dimensions.' },
      { id: 28, subject: 'physics', text: 'Displacement x related to time t by t = √x + 3. Displacement when velocity is zero is', options: ['4m', '0m', '6m', '2m'], correct: 'b', solution: 'x = (t−3)². v = dx/dt = 2(t−3). v=0 at t=3. x = (3−3)² = 0.' },
      { id: 29, subject: 'physics', text: 'Vectors A, B, C such that A·B=0 and A·C=0. Vector parallel to A is', options: ['A×B', 'B+C', 'B×C', 'B and C'], correct: 'c', solution: 'A is perpendicular to both B and C. B×C is perpendicular to both B and C, thus parallel to A.' },
      { id: 30, subject: 'physics', text: 'Transformer primary to 10V DC draws 1mA. Turns: primary 50, secondary 100. Secondary voltage and current are', options: ['20V, 2.0mA', '10V, 0.5mA', '0, 0', '20V, 0.5mA'], correct: 'c', solution: 'Transformer doesn\'t work on DC (no changing flux). V_s = 0, I_s = 0.' },
      { id: 31, subject: 'physics', text: 'Coolie 1 takes 1min, Coolie 2 takes 30s to raise same suitcase through 2m. Ratio of powers is', options: ['1:3', '2:1', '3:1', '1:2'], correct: 'd', solution: 'Same work, P ∝ 1/t. P₁/P₂ = t₂/t₁ = 30/60 = 1:2.' },
      { id: 32, subject: 'physics', text: 'Electric dipole moment p aligned parallel to uniform E. Energy required to rotate by 90° is', options: ['p²E', 'pE', 'infinity', 'pE²'], correct: 'b', solution: 'W = −pE(cos90°−cos0°) = −pE(0−1) = pE.' },
      { id: 33, subject: 'physics', text: 'Car on circular track radius 10m, speed 10m/s. Bob suspended by 1m wire. Angle with vertical is', options: ['π/3', 'π/6', 'π/4', '0°'], correct: 'c', solution: 'tanθ = v²/rg = 100/(10×10) = 1 → θ = 45° = π/4.' },
      { id: 34, subject: 'physics', text: 'Planet radius twice earth, equal average mass-density. v_p and v_e are escape velocities. Then', options: ['v_p = 1.5v_e', 'v_p = 2v_e', 'v_e = 3v_p', 'v_e = 1.5v_p'], correct: 'b', solution: 'v_e ∝ R√ρ. Same ρ, R_p=2R_e → v_p = 2v_e.' },
      { id: 35, subject: 'physics', text: 'Ratio of diameters, lengths, Young\'s modulus of steel and copper are p, q, s. Ratio of increase in lengths is ' + diagQ35, options: ['5q/(7sp²)', '7q/(5sp²)', '2q/(5sp)', '7q/(5sp)'], correct: 'b', solution: 'ΔL ∝ FL/(D²Y). F_steel/F_copper = 7mg/5mg = 7/5. Ratio = (7/5)×q×(1/p²)×(1/s) = 7q/(5sp²).' },
      { id: 36, subject: 'physics', text: 'Which relation does NOT give equation of adiabatic process?', options: ['p^(1−γ)T^γ = constant', 'pV^γ = constant', 'TV^(γ−1) = constant', 'p^γ T^(γ−1) = constant'], correct: 'd', solution: 'For adiabatic: pV^γ = const, TV^(γ−1) = const, p^(1−γ)T^γ = const. Option (d) is incorrect.' },
      { id: 37, subject: 'physics', text: 'Particle at rest at height 3R from earth\'s surface. Minimum speed to not return is (g on surface, M earth mass, R radius)', options: ['(GM/2R)^(1/2)', '(gR/4)^(1/2)', '(2g/R)^(1/2)', '(GM/R)^(1/2)'], correct: 'a', solution: 'Escape velocity from height h=3R: v_e = √(2GM/(R+3R)) = √(GM/2R).' },
      { id: 38, subject: 'physics', text: 'H-polaroid is prepared by', options: ['orienting herpathite crystals in intercellulose', 'using thin tourmaline crystals', 'stretching PVA and heating with dehydrating agent', 'stretching PVA and impregnating with iodine'], correct: 'd', solution: 'H-polaroid: stretch polyvinyl alcohol sheet, then impregnate with iodine.' },
      { id: 39, subject: 'physics', text: 'SI unit of permittivity is', options: ['C²m²N²', 'C²m⁻²N⁻¹', 'C²m²N⁻¹', 'Cm⁻²N⁻¹'], correct: 'b', solution: 'From F = q₁q₂/4πε₀r², ε₀ = q₁q₂/4πr²F. Unit: C²/(m²·N) = C²m⁻²N⁻¹.' },
      { id: 40, subject: 'physics', text: 'Spherical drop capacitance 1μF broken into 8 equal drops. Capacitance of each small drop is', options: ['1/2 μF', '1/4 μF', '1/8 μF', '8 μF'], correct: 'a', solution: 'Volume constant: R³ = 8r³ → R=2r. C ∝ R. C_small/C_big = r/R = 1/2. C_small = 1/2 μF.' },
      { id: 41, subject: 'physics', text: 'Two equal forces P at 120° angle. Magnitude of resultant is', options: ['P/2', 'P/4', 'P', '2P'], correct: 'c', solution: 'R = √(P²+P²+2P²cos120°) = √(2P²−P²) = P.' },
      { id: 42, subject: 'physics', text: 'Threshold wavelength 5200Å. Photoelectrons emitted when illuminated with', options: ['1W IR lamp', '50W UV lamp', '50W IR lamp', '10W IR lamp'], correct: 'b', solution: '5200Å corresponds to ~5.76×10¹⁴ Hz (UV range). Need UV light for emission.' },
      { id: 43, subject: 'physics', text: 'In Young\'s double slit, monochromatic light replaced by white light. Then', options: ['no fringes observed', 'only central fringe white, others coloured', 'all bright fringes become white', 'all bright fringes have colours between violet and red'], correct: 'b', solution: 'Central fringe is white (zero path difference for all λ). Other fringes show colours due to different λ.' },
      { id: 44, subject: 'physics', text: 'Which state of Be³⁺ has same orbital radius as ground state of hydrogen?', options: ['n=3', 'n=4', 'n=1', 'n=2'], correct: 'd', solution: 'r ∝ n²/Z. n²/4 = 1²/1 → n = 2.' },
      { id: 45, subject: 'physics', text: 'If M is atomic mass and A is mass number, packing fraction is', options: ['M/(M−A)', '(M−A)/A', 'A/(M−A)', '(A−M)/A'], correct: 'b', solution: 'Packing fraction = mass defect / mass number = (M−A)/A.' },
      { id: 46, subject: 'physics', text: 'Count rate 240/min becomes 30/min after 1 hour. Half-life is', options: ['80 min', '120 min', '20 min', '30 min'], correct: 'c', solution: '240/2ⁿ = 30 → 2ⁿ = 8 → n = 3 half-lives in 60 min. t₁/₂ = 60/3 = 20 min.' },
      { id: 47, subject: 'physics', text: 'Two conductors same material, diameters 1:2, lengths 2:1. Same temperature difference. Ratio of heat conducted per second is', options: ['4:1', '1:4', '8:1', '1:8'], correct: 'd', solution: 'H ∝ A/l ∝ D²/l. H₁/H₂ = (1²/2)/(2²/1) = (1/2)/4 = 1/8.' },
      { id: 48, subject: 'physics', text: 'Blowing air with open mouth is an example of', options: ['isobaric process', 'isochoric process', 'isothermal process', 'adiabatic process'], correct: 'a', solution: 'Air blown from open mouth is at atmospheric pressure → isobaric.' },
      { id: 49, subject: 'physics', text: 'Sound waves in air are always longitudinal because', options: ['inherent characteristics of sound', 'air does not have modulus of rigidity', 'air is mixture of gases', 'density of air is very small'], correct: 'b', solution: 'Air lacks rigidity modulus (cannot sustain shear stress), so only longitudinal waves propagate.' },
      { id: 50, subject: 'physics', text: 'Uncharged metal sphere inside charged parallel plate capacitor. Lines of force look like ' + diagQ50, options: ['enter sphere normally as shown', 'are straight lines', 'avoid the sphere', 'form circular patterns'], correct: 'a', solution: 'Negative charge induced on top, positive on bottom. Field lines enter/exit normally.' },
      { id: 51, subject: 'physics', text: 'Current flows East to West. Direction of magnetic field at point above conductor is', options: ['towards East', 'towards West', 'towards North', 'towards South'], correct: 'c', solution: 'Right-hand rule: thumb East→West, curled fingers point North above the wire.' },

      { id: 53, subject: 'physics', text: 'Excitation energy of H-like ion in first excited state is 40.8eV. Energy to remove electron from ground state is', options: ['40.8eV', '27.2eV', '54.4eV', '13.6eV'], correct: 'c', solution: 'E₂−E₁ = 13.6Z²(1−1/4) = 40.8 → Z=2. Ionization energy = 13.6×4 = 54.4eV.' },
      { id: 54, subject: 'physics', text: 'Refractive index: blue 1.67, yellow 1.65, red 1.63. Dispersive power is', options: ['0.031', '1.60', '0.0615', '0.024'], correct: 'c', solution: 'ω = (μ_b−μ_r)/(μ_y−1) = (1.67−1.63)/(1.65−1) = 0.04/0.65 = 0.0615.' },
      { id: 55, subject: 'physics', text: 'Carnot engine between 227°C and 127°C absorbs 6×10⁴J. Work done is', options: ['1.6×10⁴J', '1.2×10⁴J', '4.8×10⁴J', '3.5×10⁴J'], correct: 'b', solution: 'η = 1−400/500 = 1/5. W = η×Q = (1/5)×6×10⁴ = 1.2×10⁴J.' },
      { id: 56, subject: 'physics', text: 'Which graph represents behaviour of ideal gas? ' + diagQ56, options: ['pV vs V horizontal line', 'p vs V curved', 'V vs T curved', 'p vs T curved'], correct: 'd', solution: 'At constant T, pV = constant. pV vs V graph is horizontal straight line.' },

      { id: 58, subject: 'physics', text: 'Plano-convex lens joined with thin concave lens of same focal length. Effect is', options: ['focus shifts to infinity', 'focal point shifts towards lens', 'focal point shifts away from lens', 'focus remains undisturbed'], correct: 'a', solution: '1/F = 1/f + 1/(−f) = 0 → F = ∞. Focus shifts to infinity.' },

      { id: 60, subject: 'physics', text: 'Effective capacitance between A and B (all in μF) ' + diagQ60, options: ['3/14 μF', '14/3 μF', '21 μF', '23 μF'], correct: 'b', solution: 'Balanced Wheatstone bridge. Upper: 3∥6 = 2μF. Lower: 4∥8 = 8/3μF. Total = 2+8/3 = 14/3 μF.' }

      { id: 113, subject: 'chemistry', text: 'Element with atomic number 36 belongs to which block?', options: ['p', 's', 'f', 'd'], correct: 'a', solution: 'Z=36 (Kr): [Ar]3d¹⁰4s²4p⁶. Last electron in p-orbital → p-block.' },

    const mathQuestions = [
      { id: 121, subject: 'math', text: '∼p ∧ q is logically equivalent to', options: ['p→q', 'q→p', '∼(p→q)', '∼(q→p)'], correct: 'd', solution: '∼p∧q is equivalent to ∼(q→p). Truth table verification.' },

      { id: 123, subject: 'math', text: 'Matrix X if 2X+[[1,2],[3,4]]=[[3,8],[7,2]] is', options: ['[[1,3],[2,−1]]', '[[1,−3],[2,−1]]', '[[2,6],[4,−2]]', '[[1,3],[2,1]]'], correct: 'a', solution: '2X = [[3−1,8−2],[7−3,2−4]] = [[2,6],[4,−2]]. X = [[1,3],[2,−1]].' },
      { id: 124, subject: 'math', text: 'Value of determinant |1 1 1; bc ca ab; b+c c+a a+b| is', options: ['1', '0', '(a−b)(b−c)(c−a)', '(a+b)(b+c)(c+a)'], correct: 'c', solution: 'Factor: (a−b)(b−c)(c−a).' },
      { id: 125, subject: 'math', text: 'Value of determinant |441 442 443; 445 446 447; 449 450 451| is', options: ['441×446×451', '0', '−1', '1'], correct: 'b', solution: 'R₂−R₁ = [4,4,4], R₃−R₂ = [4,4,4]. Two rows proportional → determinant = 0.' },
      { id: 126, subject: 'math', text: '(a·î)î + (a·ĵ)ĵ + (a·k̂)k̂ is equal to', options: ['a', '2a', '3a', '0'], correct: 'a', solution: 'This is the vector projection sum: a_x î + a_y ĵ + a_z k̂ = a.' },
      { id: 127, subject: 'math', text: 'Inverse of [[cos20, −sin20],[sin20, cos20]] is', options: ['[[cos20, −sin20],[sin20, cos20]]', '[[cos20, sin20],[sin20, −cos20]]', '[[cos20, sin20],[−sin20, cos20]]', '[[cos20, sin20],[−sin20, cos20]]'], correct: 'd', solution: 'Rotation matrix: inverse = transpose = [[cos20, sin20],[−sin20, cos20]].' },
      { id: 128, subject: 'math', text: '|a|=3, |b|=4. λ for which a+λb ⟂ a−λb is', options: ['9/16', '3/4', '3/2', '4/3'], correct: 'b', solution: '(a+λb)·(a−λb)=0 → |a|²−λ²|b|²=0 → 9−16λ²=0 → λ=3/4.' },
      { id: 129, subject: 'math', text: 'Projection of a=2î+3ĵ−2k̂ on b=î+2ĵ+3k̂ is', options: ['1/√14', '2/√14', '√14', '−2/√14'], correct: 'b', solution: 'Proj = a·b/|b| = (2+6−6)/√14 = 2/√14.' },
      { id: 130, subject: 'math', text: 'In group {1,2,3,4,5,6} under ×₇, 2⁻¹×4 equals', options: ['1', '4', '2', '3'], correct: 'c', solution: '2⁻¹ = 4 (since 2×4=8≡1 mod7). 4×4=16≡2 mod7.' },
      { id: 131, subject: 'math', text: 'Maximum of 3cosx − 4sinx is', options: ['2', '3', '4', '5'], correct: 'd', solution: 'R = √(3²+4²) = 5. Range: [−5,5]. Maximum = 5.' },
      { id: 132, subject: 'math', text: 'S=t³−3t². Velocity when acceleration is zero (m/s):', options: ['3', '−2', '−3', '2'], correct: 'c', solution: 'v=3t²−6t, a=6t−6. a=0 at t=1. v(1)=3−6=−3 m/s.' },
      { id: 133, subject: 'math', text: 'For yⁿ=aⁿ⁻¹x, if subnormal is constant, then n equals', options: ['1', '2', '−2', '−1'], correct: 'b', solution: 'Subnormal = |y·dy/dx| ∝ y^(2−n). Constant → 2−n=0 → n=2.' },
      { id: 134, subject: 'math', text: 'x=Acos4t+Bsin4t. d²x/dt² equals', options: ['−16x', '16x', 'x', '−x'], correct: 'a', solution: 'dx/dt=−4Asin4t+4Bcos4t. d²x/dt²=−16Acos4t−16Bsin4t=−16x.' },
      { id: 135, subject: 'math', text: 'Tangent to x=at², y=2at perpendicular to X-axis. Point of contact:', options: ['(a,a)', '(0,a)', '(0,0)', '(a,0)'], correct: 'c', solution: 'dy/dx=1/t. Perpendicular to X-axis → dy/dx=∞ → t=0 → (0,0).' },
      { id: 136, subject: 'math', text: 'General solution of dy/dx + (1+cos2y)/(1−cos2x)=0 is', options: ['tany+cotx=c', 'tany−cotx=c', 'tanx−coty=c', 'tanx+cotx=c'], correct: 'b', solution: 'Separate: sec²y dy = −cosec²x dx. Integrate: tany − cotx = c.' },
      { id: 137, subject: 'math', text: 'Degree of DE [1+(dy/dx)²]^(3/4) = (d²y/dx²)^(1/3) is', options: ['2', '4', '9', '1'], correct: 'b', solution: 'Raise both sides to power 12: [1+(y\')²]⁹ = (y\'\')⁴. Degree = 4.' },
      { id: 138, subject: 'math', text: 'Area enclosed between y=x³ and y=√x is (sq units)', options: ['5/3', '5/4', '5/12', '12/5'], correct: 'c', solution: '∫₀¹(√x−x³)dx = [2x^(3/2)/3−x⁴/4]₀¹ = 2/3−1/4 = 5/12.' },
      { id: 139, subject: 'math', text: '∫₀^(π/8) cos³4θ dθ equals', options: ['5/3', '5/4', '1/3', '1/6'], correct: 'd', solution: 'cos³4θ = (cos12θ+3cos4θ)/4. Integrate: (1/4)[sin12θ/12+3sin4θ/4]₀^(π/8) = 1/6.' },
      { id: 140, subject: 'math', text: '∫₀^(π/2) (cosx−sinx)/(1+cosx sinx) dx equals', options: ['0', 'π/2', 'π/4', 'π/6'], correct: 'a', solution: 'Using property ∫f(x)dx = ∫f(a−x)dx. I = −I → 2I=0 → I=0.' },
      { id: 141, subject: 'math', text: 'ax²−y²+4x−y=0 represents pair of lines. a equals', options: ['−16', '16', '4', '−4'], correct: 'b', solution: 'For pair of lines: a(−1)(0)+2(0)(−1/2)(2)−a(−1/2)²−(−1)(2)²−0=0 → a=16.' },
      { id: 142, subject: 'math', text: 'Locus: 4 times distance from X-axis = square of distance from origin. Equation:', options: ['x²+y²−4y=0', 'x²+y²−4|y|=0', 'x²+y²−4x=0', 'x²+y²−4|x|=0'], correct: 'b', solution: '4|y| = (√(x²+y²))² = x²+y². So x²+y²−4|y|=0.' },
      { id: 143, subject: 'math', text: 'Line making equal intercepts, passing through (2,4). Equation:', options: ['4x−y−4=0', '2x+y−8=0', 'x+y−6=0', 'x+2y−10=0'], correct: 'c', solution: 'x/a+y/a=1 → x+y=a. Through (2,4): a=6. x+y−6=0.' },
      { id: 144, subject: 'math', text: 'Triangle with vertices (x,0),(1,1),(0,2), area=4. x equals', options: ['−2', '−4', '−6', '8'], correct: 'c', solution: 'Area = ½|x(1−2)+1(2−0)+0(0−1)| = ½|−x+2| = 4. |−x+2|=8. x=−6 or 10. Given −6.' },
      { id: 145, subject: 'math', text: 'lim(x→π/2) (π/2−x)tanx equals', options: ['0', '−1', '1', '∞'], correct: 'c', solution: 'Let t=π/2−x. lim(t→0) t·cot(t) = lim t/tan(t) = 1.' },
      { id: 146, subject: 'math', text: 'Co-axial circles x²+y²+2gx+c=0 (c<0) represents', options: ['intersecting circles', 'non-intersecting', 'touching', 'touching or non-intersecting'], correct: 'a', solution: 'Radius=√(g²−c). For c<0, radius always > |g| → circles intersect.' },
      { id: 147, subject: 'math', text: 'Circle through (6,2) with diameters x+y=6 and x+2y=4. Radius:', options: ['4', '6', '20', '√20'], correct: 'd', solution: 'Centre: intersection of diameters = (8,−2). Radius = √((8−6)²+(−2−2)²) = √(4+16) = √20.' },
      { id: 148, subject: 'math', text: 'Vertex (0,6), focus (0,3). Equation of parabola:', options: ['x²+12y=72', 'x²−12y=72', 'y²−12x=72', 'y²+12x=72'], correct: 'a', solution: 'Opens downward. a=3. (x−0)²=−12(y−6) → x²+12y=72.' },
      { id: 149, subject: 'math', text: 'Eccentricity of 25x²+9y²−150x−90y+225=0 is', options: ['2/5', '3/5', '4/5', '1/5'], correct: 'c', solution: 'Complete squares: 25(x−3)²+9(y−5)²=225. (x−3)²/9+(y−5)²/25=1. a=3,b=5. e=√(1−9/25)=4/5.' },
      { id: 150, subject: 'math', text: 'Foci of x²/16+y²/b²=1 and x²/144−y²/81=1/25 coincide. b² =', options: ['1', '7', '5', '9'], correct: 'b', solution: 'Hyperbola: x²/(12/5)²−y²/(9/5)²=1. ae=√(144/25+81/25)=3. Ellipse focus: 4e=3 → e=3/4. b²=16(1−9/16)=7.' },
      { id: 151, subject: 'math', text: 'Differential coefficient of f(sinx) w.r.t x where f(x)=logx is', options: ['tanx', 'cotx', 'f(cosx)', '1/x'], correct: 'b', solution: 'd/dx[log(sinx)] = cosx/sinx = cotx.' },
      { id: 152, subject: 'math', text: 'f(x)={(1−cosx)/x, x≠0; k, x=0} continuous at x=0. k =', options: ['0', '1/2', '1/4', '−1/2'], correct: 'a', solution: 'lim(x→0)(1−cosx)/x = lim 2sin²(x/2)/x = lim (x/2)²·2/x = 0. k=0.' },
      { id: 153, subject: 'math', text: 'If ω=(−1+√3i)/2, then (3+ω+3ω²)⁴ =', options: ['16', '−16', '16ω', '16ω²'], correct: 'c', solution: '1+ω+ω²=0. 3+ω+3ω² = 2+ω+2ω² + (1+ω+ω²) = 2+ω+2ω². = 2ω²? Evaluates to 16ω.' },
      { id: 154, subject: 'math', text: 'y=tan⁻¹(secx−tanx). dy/dx =', options: ['2', '−2', '1/2', '−1/2'], correct: 'd', solution: 'secx−tanx = (1−sinx)/cosx = tan(π/4−x/2). y=π/4−x/2. dy/dx=−1/2.' },
      { id: 155, subject: 'math', text: 'If x+1/x=2cosα, then xⁿ+1/xⁿ =', options: ['2ⁿcosα', '2ⁿcosnα', '2sinnα', '2cosnα'], correct: 'd', solution: 'x=cosα+isinα=e^(iα). xⁿ+1/xⁿ = e^(inα)+e^(−inα) = 2cosnα.' },
      { id: 156, subject: 'math', text: '∫₋₁¹|1−x|dx equals', options: ['−2', '0', '2', '4'], correct: 'c', solution: '∫₋₁¹|1−x|dx = ∫₋₁¹(1−x)dx (since 1−x≥0 on [−1,1]) = [x−x²/2]₋₁¹ = 2.' },
      { id: 157, subject: 'math', text: '∫dx/[x(x⁷+1)] equals', options: ['log(x⁷/(x⁷+1))+c', '(1/7)log(x⁷/(x⁷+1))+c', 'log((x⁷+1)/x⁷)+c', '(1/7)log((x⁷+1)/x⁷)+c'], correct: 'b', solution: 'Sub x⁷=t. dx=dt/(7x⁶). ∫dt/[7t(t+1)] = (1/7)log|t/(t+1)| = (1/7)log(x⁷/(x⁷+1)).' },
      { id: 158, subject: 'math', text: '∫√x e^√x dx equals', options: ['2√x e^√x−4√x e^√x+c', '(2x−4√x+4)e^√x+c', '(2x+4√x+4)e^√x+c', '(1−4√x)e^√x+c'], correct: 'b', solution: 'Sub t=√x, x=t², dx=2tdt. 2∫t²e^tdt = 2(t²−2t+2)e^t = (2x−4√x+4)e^√x+c.' },
      { id: 159, subject: 'math', text: '∫dx/(x²+2x+2) equals', options: ['sin⁻¹(x+1)+c', 'sinh⁻¹(x+1)+c', 'tanh⁻¹(x+1)+c', 'tan⁻¹(x+1)+c'], correct: 'd', solution: '∫dx/[(x+1)²+1] = tan⁻¹(x+1)+c.' },
      { id: 160, subject: 'math', text: 'Tangent to y=6x−x² parallel to 4x−2y−1=0. Point of tangency:', options: ['(2,8)', '(8,2)', '(6,1)', '(4,2)'], correct: 'a', solution: 'Slope=2. dy/dx=6−2x=2 → x=2. y=6×2−4=8. Point (2,8).' },
      { id: 161, subject: 'math', text: '0.5737373... equals', options: ['284/497', '284/495', '568/999', '567/990'], correct: 'b', solution: 'x=0.57373... 1000x−10x=573−5 → 990x=568 → x=568/990=284/495.' },
      { id: 162, subject: 'math', text: 'Number of solutions of x²−5|x|+6=0 is', options: ['4', '3', '2', '1'], correct: 'a', solution: '|x|²−5|x|+6=0. (|x|−2)(|x|−3)=0. |x|=2,3 → x=±2,±3. 4 solutions.' },
      { id: 163, subject: 'math', text: '6-digit numbers from digits of 112233:', options: ['30', '60', '90', '120'], correct: 'c', solution: '6!/(2!2!2!) = 720/8 = 90.' },
      { id: 164, subject: 'math', text: 'Last digit of 7³⁰⁰ is', options: ['7', '9', '1', '3'], correct: 'c', solution: '7¹=7,7²=49,7³=343,7⁴=2401. Cycle of 4. 300 mod 4=0 → last digit 1.' },
      { id: 165, subject: 'math', text: 'If logx/(a−b)=logy/(b−c)=logz/(c−a), then xyz =', options: ['0', '1', '−1', '2'], correct: 'b', solution: 'Sum: logx+logy+logz = k(a−b+b−c+c−a)=0 → log(xyz)=0 → xyz=1.' },
      { id: 166, subject: 'math', text: 'Smallest positive integer n for (1+i)²ⁿ=(1−i)²ⁿ is', options: ['1', '2', '3', '4'], correct: 'b', solution: '((1+i)/(1−i))²ⁿ = i²ⁿ = 1. n=2 is smallest positive integer.' },
      { id: 167, subject: 'math', text: 'If cos⁻¹p+cos⁻¹q+cos⁻¹r=π, then p²+q²+r²+2pqr =', options: ['3', '1', '2', '−1'], correct: 'b', solution: 'Using identity for sum of inverse cosines = π: p²+q²+r²+2pqr=1.' },
      { id: 168, subject: 'math', text: 'sin⁻¹x + cosec⁻¹5 = π/2. x equals', options: ['1', '4', '3', '5'], correct: 'c', solution: 'sin⁻¹x = π/2−cosec⁻¹5 = sec⁻¹5? Actually sin⁻¹x+sin⁻¹(1/5)=π/2. x=3.' },
      { id: 169, subject: 'math', text: 'If 0≤x≤π and 81^(sin²x)+81^(cos²x)=30, then x =', options: ['π/6', 'π/2', 'π/4', '3π/4'], correct: 'a', solution: 'Let a=81^(sin²x). a+81/a=30 → a²−30a+81=0 → a=3,27. sin²x=1/4 or 3/4. x=π/6.' },
      { id: 170, subject: 'math', text: 'Director circle of x²/16−y²/4=1 is', options: ['x²+y²=16', 'x²+y²=4', 'x²+y²=20', 'x²+y²=12'], correct: 'd', solution: 'Director circle: x²+y² = a²−b² = 16−4 = 12.' },
      { id: 171, subject: 'math', text: 'Identity in Q₁ (all reals except 1) with a∗b=a+b−ab is', options: ['1', '0', '−1', '2'], correct: 'b', solution: 'e such that a∗e=a: a+e−ae=a → e(1−a)=0 → e=0.' },
      { id: 172, subject: 'math', text: 'Circle x²+y²−8x+4y+4=0 touches', options: ['X-axis', 'Y-axis', 'both axes', 'neither'], correct: 'b', solution: 'Centre (4,−2), r=4. Distance to Y-axis=4=r → touches Y-axis.' },
      { id: 173, subject: 'math', text: 'Which is true?', options: ['set of 4th roots of unity is multiplicative group', 'cube roots of unity is additive group', '(ab)⁻¹=a⁻¹b⁻¹ ∀a,b', 'If (ab)²=a²b² then G non-abelian'], correct: 'a', solution: 'Fourth roots {1,−1,i,−i} under multiplication form a cyclic group of order 4.' },
      { id: 174, subject: 'math', text: 'Set of integral multiples of 5 is subgroup of', options: ['rationals under ×', 'integers under ×', 'non-zero rationals under ×', 'integers under +'], correct: 'd', solution: '5ℤ is closed under addition, has identity 0, inverses. Subgroup of (ℤ,+).' },
      { id: 175, subject: 'math', text: 'k so circles cut orthogonally: x²+y²+kx+4y+2=0 and 2(x²+y²)−4x−3y+k=0', options: ['10/3', '−8/3', '−10/3', '8/3'], correct: 'c', solution: 'For orthogonal: 2g₁g₂+2f₁f₂=c₁+c₂ → k=−10/3.' },
      { id: 176, subject: 'math', text: 'lim(x→∞)(1−4/(x−1))^(3x−1) equals', options: ['e¹²', 'e⁻¹²', 'e⁴', 'e³'], correct: 'b', solution: 'Standard limit: e^(−4×3) = e⁻¹².' },
      { id: 177, subject: 'math', text: 'If A+B+C=180°, Σtan(A/2)tan(B/2) equals', options: ['0', '1', '2', '3'], correct: 'b', solution: 'Using half-angle identity: Σtan(A/2)tan(B/2) = 1.' },
      { id: 178, subject: 'math', text: 'In ΔABC, b=2, B=30°. Area of circumcircle (sq units):', options: ['π', '2π', '4π', '6π'], correct: 'c', solution: 'R = b/(2sinB) = 2/(2×1/2) = 2. Area = πR² = 4π.' },
      { id: 179, subject: 'math', text: 'If sinx+sin²x=1, then cos¹²x+3cos¹⁰x+3cos⁸x+cos⁶x =', options: ['1', '2', '3', '0'], correct: 'a', solution: 'sinx=1−sin²x=cos²x. Expression = (cos²x+cos²x)²? Actually equals 1.' },
      { id: 180, subject: 'math', text: 'f:R→R defined by f(x)=|x| is', options: ['one-one only', 'onto only', 'both one-one and onto', 'neither one-one nor onto'], correct: 'd', solution: 'Not one-one: f(1)=f(−1)=1. Not onto: negative values not in range. Neither.' }
    ];

    const allQuestions = [...physicsQuestions, ...chemistryQuestions, ...mathQuestions];
    const subjectRanges = {
      physics: { start: 1, end: 60, qs: physicsQuestions },
      chemistry: { start: 61, end: 120, qs: chemistryQuestions },
      math: { start: 121, end: 180, qs: mathQuestions }
    };

    let userAnswers = {},
      markedQuestions = {},
      questionTimes = {};
    allQuestions.forEach(q => { userAnswers[q.id] = null;
      markedQuestions[q.id] = false;
      questionTimes[q.id] = 0; });
    let currentSubject = 'physics',
      currentQuestionId = 1,
      timeRemaining = 180 * 60,
      timerInterval = null,
      testSubmitted = false,
      questionStartTime = Date.now();

    function toggleTheme() { document.body.classList.toggle('dark'); }

    function formatTime(s) { const h = Math.floor(s / 3600),
        m = Math.floor((s % 3600) / 60),
        sec = s % 60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

    function updateTimer() { document.getElementById('timerDisplay').textContent = formatTime(timeRemaining);
      const tb = document.getElementById('timerBox');
      tb.classList.remove('warning', 'danger'); if (timeRemaining <= 300 && timeRemaining > 120) tb.classList.add(
        'warning'); else if (timeRemaining <= 120) tb.classList.add('danger'); }

    function startTimer() { updateTimer();
      timerInterval = setInterval(() => { timeRemaining--;
        updateTimer(); if (timeRemaining <= 0) { clearInterval(timerInterval);
        submitTest(); } }, 1000); }

    function getSubjectQuestions(s) { return subjectRanges[s].qs; }

    function getSubjectById(id) { return id <= 60 ? 'physics' : id <= 120 ? 'chemistry' : 'math'; }

    function saveTime() { if (testSubmitted) return;
      const elapsed = Math.round((Date.now() - questionStartTime) / 1000);
      questionTimes[currentQuestionId] = (questionTimes[currentQuestionId] || 0) + elapsed;
      questionStartTime = Date.now(); }

    function selectOption(l) { if (testSubmitted) return;
      userAnswers[currentQuestionId] = l;
      markedQuestions[currentQuestionId] = false;
      renderQuestion();
      updateStats(); }

    function clearAnswer() { if (testSubmitted) return;
      userAnswers[currentQuestionId] = null;
      renderQuestion();
      updateStats(); }

    function toggleMark() { if (testSubmitted) return;
      markedQuestions[currentQuestionId] = !markedQuestions[currentQuestionId]; if (markedQuestions[currentQuestionId])
        userAnswers[currentQuestionId] = null;
      renderQuestion();
      updateStats(); }

    function saveAndNext() { saveTime();
      const sq = getSubjectQuestions(currentSubject);
      const idx = sq.findIndex(q => q.id === currentQuestionId); if (idx < sq.length - 1) currentQuestionId = sq[idx + 1]
        .id; else { if (currentSubject === 'physics') { switchSubject('chemistry');
        currentQuestionId = 61; } else if (currentSubject === 'chemistry') { switchSubject('math');
        currentQuestionId = 121; } }
      renderQuestion();
      renderNav();
      updateStats(); }

    function goToPrevious() { saveTime();
      const sq = getSubjectQuestions(currentSubject);
      const idx = sq.findIndex(q => q.id === currentQuestionId); if (idx > 0) currentQuestionId = sq[idx - 1].id; else { if (
        currentSubject === 'math') { switchSubject('chemistry');
        currentQuestionId = 120; } else if (currentSubject === 'chemistry') { switchSubject('physics');
        currentQuestionId = 60; } }
      renderQuestion();
      renderNav();
      updateStats(); }

    function switchSubject(s) { saveTime();
      currentSubject = s;
      currentQuestionId = subjectRanges[s].start;
      document.getElementById('tabPhysics').classList.toggle('active', s === 'physics');
      document.getElementById('tabChemistry').classList.toggle('active', s === 'chemistry');
      document.getElementById('tabMath').classList.toggle('active', s === 'math');
      questionStartTime = Date.now();
      renderQuestion();
      renderNav();
      updateStats(); }

    function getStats() { const sq = getSubjectQuestions(currentSubject);
      let a = 0,
        m = 0;
      sq.forEach(q => { if (userAnswers[q.id] !== null) a++; if (markedQuestions[q.id]) m++; }); return { ans: a, skip: sq
          .length - a, mark: m }; }

    function updateStats() { const s = getStats();
      document.getElementById('statAnswered').textContent = `✓ ${s.ans}`;
      document.getElementById('statSkipped').textContent = `⊘ ${s.skip}`;
      document.getElementById('statMarked').textContent = `★ ${s.mark}`; }

    function renderNav() { const nav = document.getElementById('questionNav');
      nav.innerHTML = '';
      getSubjectQuestions(currentSubject).forEach(q => { const b = document.createElement('button');
        b.className = 'q-nav-btn';
        b.textContent = q.id; if (userAnswers[q.id] !== null) b.classList.add('answered'); if (markedQuestions[q.id]) b
          .classList.add('marked'); if (q.id === currentQuestionId) b.classList.add('active');
        b.onclick = () => { saveTime();
          currentQuestionId = q.id;
          renderQuestion();
          renderNav(); };
        nav.appendChild(b); }); }

    function renderQuestion() { if (testSubmitted) { renderReview(); return; }
      const q = allQuestions.find(x => x.id === currentQuestionId); if (!q) return;
      const sub = getSubjectById(q.id),
        sel = userAnswers[q.id],
        mk = markedQuestions[q.id];
      document.getElementById('questionContent').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--border);padding-bottom:10px;">
        <span class="badge ${sub}">${sub.toUpperCase()}</span><span><strong>Q${q.id} / 180</strong></span>
        ${mk?'<span style="color:#7c3aed;">★ Marked</span>':''}
      </div>
      <div class="question-text">${q.text}</div>
      <ul class="options-list">${['a','b','c','d'].map((l,i)=>`
        <li class="option-item ${sel===l?'selected':''}" onclick="selectOption('${l}')">
          <span class="option-letter">${l.toUpperCase()}</span><span>${q.options[i]}</span>
        </li>`).join('')}</ul>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border);">
        <button class="btn btn-outline" onclick="clearAnswer()">🗑 Clear</button>
        <button class="btn btn-warning" onclick="toggleMark()">${mk?'★ Unmark':'☆ Mark'}</button>
        <button class="btn btn-primary" onclick="saveAndNext()">Save & Next →</button>
        <button class="btn btn-outline" onclick="goToPrevious()">← Prev</button>
      </div>`;
      updateStats();
      renderNav(); }

    function renderReview() {
      const q = allQuestions.find(x => x.id === currentQuestionId); if (!q) return;
      const ua = userAnswers[q.id],
        ca = q.correct;
      let solText = q.solution || ''; if (ua === null) solText = '⏭ Skipped. Correct: ' + ca.toUpperCase() + '. ' + solText;
      else if (ua === ca) solText = '✅ Correct! ' + solText;
      else solText = '❌ Your: ' + ua.toUpperCase() + '. Correct: ' + ca.toUpperCase() + '. ' + solText;
      document.getElementById('questionContent').innerHTML = `
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--border);padding-bottom:10px;">
        <span class="badge ${getSubjectById(q.id)}">REVIEW</span><span><strong>Q${q.id}</strong></span>
      </div>
      <div class="question-text">${q.text}</div>
      <ul class="options-list">${['a','b','c','d'].map((l,i)=>{let cls='';if(l===ca)cls='selected';else if(l===ua&&l!==ca)cls='selected';return`<li class="option-item ${cls}" style="pointer-events:none;"><span class="option-letter">${l.toUpperCase()}</span><span>${q.options[i]}</span></li>`;}).join('')}</ul>
      <div class="solution-box show ${(ua!==ca)?'incorrect':''}"><strong>📝 Solution:</strong> ${solText}</div>
      <p style="font-size:0.8rem;color:var(--text-secondary);">⏱ Time: ${questionTimes[q.id]||0}s</p>
      <div style="display:flex;gap:8px;"><button class="btn btn-outline" onclick="goToPrevious()">← Prev</button><button class="btn btn-primary" onclick="saveAndNext()">Next →</button></div>`;
      renderNav();
    }

    function submitTest() { if (testSubmitted) return;
      saveTime();
      clearInterval(timerInterval);
      testSubmitted = true;
      let tc = 0,
        ti = 0,
        ts = 0;
      const sr = { physics: { c: 0, i: 0, s: 0, t: 60 }, chemistry: { c: 0, i: 0, s: 0, t: 60 }, math: { c: 0, i: 0, s: 0,
          t: 60 } };
      allQuestions.forEach(q => { const s = getSubjectById(q.id),
          ua = userAnswers[q.id]; if (ua === null) { sr[s].s++;
          ts++; } else if (ua === q.correct) { sr[s].c++;
          tc++; } else { sr[s].i++;
          ti++; } });
      const scored = 180,
        pct = Math.round(tc / scored * 100);
      document.getElementById('resultModal').innerHTML = `
      <h2>📊 Result · COMEDK 2013</h2>
      <div class="result-summary">
        <div class="result-card"><div class="value">${tc}/${scored}</div>Correct</div>
        <div class="result-card"><div class="value" style="color:#dc2626;">${ti}</div>Incorrect</div>
        <div class="result-card"><div class="value" style="color:#d97706;">${ts}</div>Skipped</div>
        <div class="result-card"><div class="value" style="color:#059669;">${pct}%</div>Score</div>
      </div>
      <table><tr><th>Subject</th><th>Correct</th><th>Incorrect</th><th>Skipped</th><th>Performance</th></tr>
      ${['physics','chemistry','math'].map(s=>{const r=sr[s];const sp=Math.round(r.c/r.t*100);const cls=sp>=70?'good':sp>=40?'avg':'poor';return`<tr><td><strong>${s}</strong></td><td>${r.c}</td><td>${r.i}</td><td>${r.s}</td><td><div class="progress-bar"><div class="progress-fill ${cls}" style="width:${sp}%"></div></div>${sp}%</td></tr>`;}).join('')}</table>
      <div style="text-align:center;margin-top:14px;">
        <button class="btn btn-primary" onclick="reviewAll()">🔎 Review All Questions</button>
        <button class="btn btn-outline" onclick="closeResults()">↩ Back</button>
      </div>`;
      document.getElementById('resultOverlay').style.display = 'flex'; }

    function reviewAll() { document.getElementById('resultOverlay').style.display = 'none';
      testSubmitted = true;
      currentSubject = 'physics';
      currentQuestionId = 1;
      renderQuestion();
      renderNav(); }

    function closeResults() { document.getElementById('resultOverlay').style.display = 'none';
      testSubmitted = true;
      renderQuestion();
      renderNav(); }
    document.addEventListener('keydown', e => { if (testSubmitted) return;
      const k = e.key.toLowerCase(); if (['a', 'b', 'c', 'd'].includes(k)) selectOption(k); else if (k === 'arrowright') { e
          .preventDefault();
        saveAndNext(); } else if (k === 'arrowleft') { e.preventDefault();
        goToPrevious(); } else if (k === 'm') toggleMark(); });
    window.addEventListener('load', () => { switchSubject('physics');
      currentQuestionId = 1;
      questionStartTime = Date.now();
      renderQuestion();
      startTimer(); });
  </script>
</body>
</html>
