<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK 2024 - CBT Exam</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #fff;
            --text: #1a1a2e;
            --border: #e0e0e0;
            --accent: #2563eb;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --neutral: #6b7280;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 10px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 100px;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .header .info {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .header .info span {
            background: #ffffff1a;
            padding: 6px 14px;
            border-radius: 20px;
        }
        .header .timer {
            font-weight: 700;
            font-size: 1.1rem;
            background: #ef4444;
            padding: 6px 16px;
            border-radius: 20px;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s;
            letter-spacing: 0.3px;
        }
        .btn-submit {
            background: #22c55e;
            color: #fff;
            font-size: 1rem;
            padding: 12px 32px;
        }
        .btn-submit:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
        }
        .btn-reset {
            background: #6b7280;
            color: #fff;
        }
        .btn-reset:hover {
            background: #4b5563;
        }
        .btn-review {
            background: #f59e0b;
            color: #fff;
        }
        .btn-review:hover {
            background: #d97706;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 28px 0 14px;
            padding: 10px 18px;
            background: #1a1a2e;
            color: #fff;
            border-radius: var(--radius);
            letter-spacing: 0.5px;
        }
        .question-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            position: relative;
        }
        .question-card:hover {
            border-color: #c4c4c4;
        }
        .question-card.review-correct {
            border-color: var(--correct) !important;
            background: #f0fdf4 !important;
        }
        .question-card.review-incorrect {
            border-color: var(--incorrect) !important;
            background: #fef2f2 !important;
        }
        .question-card.review-unanswered {
            border-color: #f59e0b !important;
            background: #fffbeb !important;
        }
        .q-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .q-num {
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            font-size: 0.95rem;
            min-width: 50px;
        }
        .q-text {
            font-weight: 500;
            flex: 1;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            padding-left: 10px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1.5px solid transparent;
            font-size: 0.93rem;
        }
        .option:hover {
            background: #f8fafc;
            border-color: #d1d5db;
        }
        .option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }
        .option.selected {
            background: #eff6ff;
            border-color: var(--accent);
            font-weight: 500;
        }
        .review-badge {
            display: none;
            position: absolute;
            top: 12px;
            right: 16px;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 15px;
            letter-spacing: 0.3px;
        }
        .review-correct .review-badge.correct-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
        }
        .review-incorrect .review-badge.incorrect-badge {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
        }
        .review-unanswered .review-badge.unanswered-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
        }
        .review-answer {
            display: none;
            margin-top: 8px;
            padding: 8px 14px;
            background: #f0fdf4;
            border-radius: 6px;
            font-weight: 600;
            color: #166534;
            font-size: 0.88rem;
        }
        .review-correct .review-answer,
        .review-incorrect .review-answer,
        .review-unanswered .review-answer {
            display: block;
        }
        .review-incorrect .review-answer {
            background: #fef2f2;
            color: #991b1b;
        }
        .review-unanswered .review-answer {
            background: #fffbeb;
            color: #92400e;
        }
        .score-bar {
            position: sticky;
            bottom: 0;
            background: #1a1a2e;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.3);
            z-index: 100;
            border-radius: 16px 16px 0 0;
        }
        .score-bar .score {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            margin: 10px 0;
        }
        .legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        svg {
            max-width: 100%;
            height: auto;
        }
        .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        @media (max-width: 640px) {
            .header {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
            .header h1 {
                font-size: 1rem;
            }
            .question-card {
                padding: 12px 14px;
            }
            .options {
                padding-left: 0;
            }
            .option {
                padding: 6px 10px;
                font-size: 0.85rem;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📝 COMEDK 2024 - CBT Mock Test</h1>
        <div class="info">
            <span>📋 Total: 180 Questions</span>
            <span>📐 Maths: 1-60</span>
            <span>🧪 Chemistry: 61-120</span>
            <span>⚛️ Physics: 121-180</span>
            <span class="timer" id="timer">⏱ 180:00</span>
        </div>
    </div>

    <div class="container" id="examContainer">
        <!-- Questions will be injected here by JS -->
    </div>

    <div class="score-bar" id="scoreBar" style="display:none;">
        <div class="score" id="scoreText">✅ Score: 0 / 180</div>
        <div>
            <button class="btn btn-reset" onclick="resetExam()">🔄 Retake Test</button>
            <button class="btn btn-review" onclick="scrollToTop()">📋 Review All</button>
        </div>
    </div>
    <div style="text-align:center;padding:20px;">
        <button class="btn btn-submit" id="submitBtn" onclick="submitExam()">📤 Submit & Review Answers</button>
    </div>

    <script>
        // ==================== QUESTION DATA ====================
        const allQuestions = [];

        // Helper to create a question object
        function q(data) {
            allQuestions.push(data);
        }

        // ==================== MATHEMATICS (1-60) ====================
        q({ id: 1, subject: 'maths', text: 'The rate of change of the volume of a sphere with respect to its surface area S is',
            options: ['A. \\(\\frac{1}{2}\\sqrt{\\frac{S}{\\pi}}\\)', 'B. \\(\\sqrt{\\frac{S}{\\pi}}\\)',
                'C. \\(\\frac{2}{3}\\sqrt{\\frac{S}{\\pi}}\\)', 'D. \\(\\frac{1}{4}\\sqrt{\\frac{S}{\\pi}}\\)'
            ], answer: 3 });
        q({ id: 2, subject: 'maths',
            text: 'While shuffling a pack of cards, 3 cards were accidentally dropped, then find the probability that the missing cards belong to different suits?',
            options: ['A. 104/425', 'B. 169/425', 'C. 261/425', 'D. 169/261'], answer: 1 });
        q({ id: 3, subject: 'maths',
            text: 'The area of the triangle whose vertices are (−2,a), (2,−6) and (5,4) is 35 sq units then the value of \'a\' is',
            options: ['A. 4', 'B. 53/3', 'C. −23/3', 'D. 128/3'], answer: 0 });
        q({ id: 4, subject: 'maths',
            text: 'Given matrix equations 3A + 4Bᵗ = [7 −10 17; 0 6 31] and 2B − 3Aᵗ = [−1 4 −5; 18 −6 −7], find (5B)ᵗ',
            options: ['A. [5 5 10; 15 0 20]', 'B. [−5 5 10; −15 0 20]', 'C. [5 −5 −10; 15 0 −20]',
                'D. [5 −5 10; 15 0 20]'
            ], answer: 3 });
        q({ id: 5, subject: 'maths',
            text: 'The domain of the function y = 1/log₁₀(3−x) + √(x+7) is',
            options: ['A. [−7,3] − {1}', 'B. (−7,3) − {0}', 'C. [−7,3) − {2}', 'D. (−7,3)'], answer: 2 });
        q({ id: 6, subject: 'maths',
            text: 'Consider an infinite geometric series with first term \'a\' and common ratio \'r\'. If the sum is 4 and the second term is 3/4, then',
            options: ['A. a=1, r=−3/4', 'B. a=3, r=1/4', 'C. a=−3, r=−1/4', 'D. a=−1, r=3/4'], answer: 1 });
        q({ id: 7, subject: 'maths',
            text: 'Let α and β be the distinct roots of ax²+bx+c=0, then lim(x→α) [1−cos(ax²+bx+c)]/(x−α)² equals',
            options: ['A. a²(α−β)²/2', 'B. (α−β)²/2', 'C. −a²(α−β)²/2', 'D. 0'], answer: 0 });
        q({ id: 8, subject: 'maths',
            text: 'If two positive numbers are in the ratio (3+2√2):(3−2√2), then the ratio between their A.M and G.M is',
            options: ['A. 3:4', 'B. 6:1', 'C. 3:2', 'D. 3:1'], answer: 3 });
        q({ id: 9, subject: 'maths', text: 'The value of the integral ∫[1/3 to 1] (x−x³)^(1/3)/x⁴ dx is',
            options: ['A. 4', 'B. 0', 'C. 3', 'D. 6'], answer: 3 });
        q({ id: 10, subject: 'maths', text: 'The area of the region enclosed by the curve 4x²+25y²=100 is',
            options: ['A. 16π/3 sq units', 'B. 9π sq units', 'C. 10π sq units', 'D. 9π/5 sq units'], answer: 2 });
        q({ id: 11, subject: 'maths',
            text: 'Five observations have mean 4 and variance 5.2. Three observations are 1, 2, 6. Find the other two.',
            options: ['A. 4,7', 'B. 2,10', 'C. 5,6', 'D. 2,9'], answer: 0 });
        q({ id: 12, subject: 'maths',
            text: 'The line joining A(2,0) and B(3,1) is rotated about A anticlockwise through 15°. Find coordinates of C (new position of B).',
            options: ['A. (2+1/√3, √(3/2))', 'B. (2, √(3/2))', 'C. (2+1/√2, 1/√2)', 'D. (2+1/√2, √(3/2))'],
        answer: 3 });
        q({ id: 13, subject: 'maths', text: 'lim(x→1) (x¹⁵−1)/(x¹⁰−1) =',
            options: ['A. 2/3', 'B. 1', 'C. 3/2', 'D. Does not exist'], answer: 2 });
        q({ id: 14, subject: 'maths',
            text: 'Let A and B be two events with P(A|B)=1/2, P(B|A)=1/3, P(A∩B)=1/6. Which is NOT true?',
            options: ['A. A and B are not independent', 'B. P(A∪B)=2/3', 'C. P(A′∩B)=1/6',
            'D. A and B are independent'], answer: 0 });
        q({ id: 15, subject: 'maths', text: 'If cos x / cos(x−2y) = λ, then tan(x−y) tan y =',
            options: ['A. (1+λ)/(1−λ)', 'B. (1−λ)/(1+λ)', 'C. λ/(1−λ)', 'D. λ/(1+λ)'], answer: 1 });
        q({ id: 16, subject: 'maths', text: 'If y=f(x), p=dy/dx, q=d²y/dx², then d²x/dy² equals',
            options: ['A. −q/p²', 'B. q/p', 'C. −q/p³', 'D. q/p²'], answer: 2 });
        q({ id: 17, subject: 'maths',
            text: 'If î+ĵ−k̂ and 2î−3ĵ+k̂ are adjacent sides of a parallelogram, then lengths of its diagonals are',
            options: ['A. √3, √14', 'B. √13, √14', 'C. √21, √3', 'D. √21, √13'], answer: 3 });
        q({ id: 18, subject: 'maths', text: 'Which relation on ℝ is an equivalence relation?',
            options: ['A. aR₁b ⇔ |a|=|b|', 'B. aR₃b ⇔ a divides b', 'C. aR₂b ⇔ a≥b', 'D. aR₄b ⇔ a<b'], answer: 0 });
        q({ id: 19, subject: 'maths',
            text: 'A number has three digits in GP. Sum of right & left digits exceeds twice middle by 1; sum of left & middle is 2/3 of sum of middle & right. Sum of digits is',
            options: ['A. 1/4', 'B. 19', 'C. 469', 'D. 109'], answer: 1 });
        q({ id: 20, subject: 'maths', text: 'If y=√(sin x + y), find dy/dx at x=0, y=1',
            options: ['A. 0', 'B. 1', 'C. 2', 'D. −1'], answer: 1 });
        q({ id: 21, subject: 'maths', text: 'If A=[5a −b; 3 2] and A adj A = AAᵗ, then 5a+b equals',
            options: ['A. 5', 'B. −1', 'C. 4', 'D. 13'], answer: 0 });
        q({ id: 22, subject: 'maths', text: 'f(x)={x, 0≤x≤1; 2x−1, x>1}. At x=1, f is',
            options: ['A. not continuous but differentiable', 'B. differentiable', 'C. continuous but not differentiable',
                'D. discontinuous'
            ], answer: 2 });
        q({ id: 24, subject: 'maths',
            text: 'Evaluate: cot⁻¹(−3/√3) − sec⁻¹(−2/√2) − cosec⁻¹(−1) − tan⁻¹(1)',
            options: ['A. π/6', 'B. −2π/3', 'C. 0', 'D. π/3'], answer: 3 });
        q({ id: 25, subject: 'maths', text: 'The shaded region in the Venn diagram represents',
            options: ['A. A′∩B', 'B. A∩B', 'C. (A∩B)′', 'D. A′∩B′'], answer: 3,
            svg: '<svg width="180" height="120" viewBox="0 0 180 120"><rect x="0" y="0" width="180" height="120" fill="#fff" rx="8"/><circle cx="70" cy="55" r="40" fill="none" stroke="#333" stroke-width="2"/><circle cx="110" cy="55" r="40" fill="none" stroke="#333" stroke-width="2"/><rect x="0" y="0" width="180" height="120" fill="none" stroke="#333" stroke-width="2" rx="8"/><text x="90" y="110" text-anchor="middle" font-size="12">Shaded: outside both circles</text></svg>' });
        q({ id: 26, subject: 'maths', text: 'Solve: 13x−5 < 15x+4 < 7x+12; x∈W (whole numbers)',
            options: ['A. {0}', 'B. {0,1}', 'C. {1}', 'D. {−4,−3,−2,−1,0}'], answer: 0 });
        q({ id: 27, subject: 'maths', text: 'General solution of x dy/dx = y + x tan(y/x) is',
            options: ['A. sin(y/x)=C/x', 'B. sin(y/x)=Cx', 'C. sin(x/y)=Cx', 'D. sin(x/y)=Cy'], answer: 1 });
        q({ id: 28, subject: 'maths', text: '√(2+√(2+√(2+2cos8θ))) =',
            options: ['A. sin 2θ', 'B. 2 cos θ', 'C. cos 2θ', 'D. 2 sin θ'], answer: 1 });
        q({ id: 29, subject: 'maths', text: 'The turning point of y=(ax−b)/((x−1)(x−4)) at P(2,−1) is',
            options: ['A. neither max nor min', 'B. both max and min', 'C. a minimum', 'D. a maximum'], answer: 3 });
        q({ id: 30, subject: 'maths',
            text: 'A coin is tossed until head appears or 3 tosses done. Given no head on 1st toss, probability coin is tossed thrice?',
            options: ['A. 1/2', 'B. 3/8', 'C. 1/8', 'D. 1/4'], answer: 0 });
        q({ id: 31, subject: 'maths', text: '∫ dx/√(2x−x²) =',
            options: ['A. sin⁻¹(x−1)+C', 'B. sin⁻¹(2x−1)+C', 'C. sin⁻¹(x+1)+C', 'D. −√(2x−x²)+C'], answer: 0 });
        q({ id: 32, subject: 'maths',
            text: 'Circle touches x-axis, passes through (1,1), centre on x+y=3 in first quadrant. Equation is',
            options: ['A. x²+y²+4x+2y+4=0', 'B. x²+y²−4x−2y+4=0', 'C. x²+y²+4x−2y+4=0', 'D. x²+y²−4x+2y+4=0'],
        answer: 1 });
        q({ id: 33, subject: 'maths', text: 'If A[−1 2; 3 1] = [−4 1; 7 7], then A equals',
            options: ['A. [1 1; 2 −3]', 'B. [−1 1; 2 3]', 'C. [1 1; −2 3]', 'D. [1 −1; 2 3]'], answer: 3 });
        q({ id: 34, subject: 'maths',
            text: 'Parabola y²=4ax, latus rectum=6, chord through vertex & negative end of latus rectum. Equation is',
            options: ['A. x+2y=0', 'B. 2x+y=0', 'C. x−2y=0', 'D. 2x−y=0'], answer: 1 });
        q({ id: 35, subject: 'maths',
            text: 'Points on x-axis whose perpendicular distance from line x/3+y/4=1 is 4 units are',
            options: ['A. (8,0) and (−2,0)', 'B. (−8,0) and (−2,0)', 'C. (8,0) and (2,0)', 'D. (−8,0) and (2,0)'],
        answer: 0 });
        q({ id: 36, subject: 'maths',
            text: 'Cube side = sphere diameter. Both increase at same rate. Ratio of increase of surface areas is',
            options: ['A. 3:π', 'B. π:6', 'C. 2π:3', 'D. 3:2π'], answer: 0 });
        q({ id: 37, subject: 'maths',
            text: '3 cards: both red, both black, one red/one black. Upper side is red. Probability other side is black?',
            options: ['A. 1/6', 'B. 1/2', 'C. 0', 'D. 1/3'], answer: 3 });
        q({ id: 38, subject: 'maths', text: 'f(x)=tan⁻¹(sin x+cos x) is increasing in',
            options: ['A. (π/4, π/2)', 'B. (0, π/2)', 'C. (−π/2, π/4)', 'D. (−π/2, π/2)'], answer: 2 });
        q({ id: 39, subject: 'maths',
            text: 'Candidate selects 7 questions from groups A(4), B(5), C(6) with at least 2 from each. Number of ways:',
            options: ['A. 1500', 'B. 1800', 'C. 2700', 'D. 2100'], answer: 2 });
        q({ id: 40, subject: 'maths',
            text: 'Letters of "COCHIN" permuted alphabetically. Number of words before "COCHIN" is',
            options: ['A. 48', 'B. 96', 'C. 192', 'D. 360'], answer: 1 });
        q({ id: 41, subject: 'maths',
            text: 'Foot of perpendicular from P(1,8,4) on line joining R(0,−1,3) and Q(2,−3,−1) is',
            options: ['A. (−5/3,−2/3,−19/3)', 'B. (5/3,2/3,−19/3)', 'C. (−5/3,2/3,19/3)', 'D. (5/3,2/3,19/3)'],
        answer: 2 });
        q({ id: 42, subject: 'maths', text: 'General solution of (1+tan y)(dx−dy)+2x dy=0 is',
            options: ['A. y(sin x+cos x)=sin x+ceˣ', 'B. y(sin x+cos x)=sin x+ce⁻ˣ', 'C. x(sin y+cos y)=sin y+ceʸ',
                'D. x(sin y+cos y)=sin y+ce⁻ʸ'
            ], answer: 3 });
        q({ id: 43, subject: 'maths', text: 'If ∫₀ᵃ x dx ≤ a+4, then',
            options: ['A. −2≤a≤0', 'B. 0≤a≤4', 'C. −2≤a≤4', 'D. a≤−2 or a≥4'], answer: 2 });
        q({ id: 44, subject: 'maths',
            text: 'Find b such that scalar product of (î+ĵ+k̂) with unit vector parallel to (2î+4ĵ−5k̂)+(bî+2ĵ+3k̂) is unity',
            options: ['A. −2', 'B. 0', 'C. −1', 'D. 1'], answer: 3 });
        q({ id: 45, subject: 'maths', text: 'Value of cos 105° is',
            options: ['A. (√3+1)/(2√2)', 'B. −(√3−1)/(2√2)', 'C. −(√3+1)/(2√2)', 'D. −(1−√3)/(2√2)'], answer: 1 });
        q({ id: 46, subject: 'maths', text: 'Area bounded by y=cos x, x=0 and x=π is',
            options: ['A. 2 sq units', 'B. 1 sq unit', 'C. 4 sq units', 'D. 3 sq units'], answer: 0 });
        q({ id: 47, subject: 'maths', text: 'If Iₙ=∫₀^(π/4) tanⁿx dx for n≥2, then Iₙ+Iₙ₋₂=',
            options: ['A. 1/(n−1)', 'B. 1/(n+1)', 'C. 1/n+1/(n−2)', 'D. 1/n'], answer: 0 });
        q({ id: 48, subject: 'maths',
            text: 'In expansion (1/x + x sin x)¹⁰, coefficient of 6th term = 7⁷⁄₈. Principal value of x is',
            options: ['A. 45°', 'B. 60°', 'C. 25°', 'D. 30°'], answer: 3 });

            text: 'Relation of contact angles θ₁,θ₂,θ₃ for liquids of densities P₁<P₂<P₃ (same capillary height, same T):',
            options: ['A. 0≤θ₃<θ₂<θ₁<π/2', 'B. π/2>θ₁>θ₂>θ₃≥0', 'C. π>θ₁>θ₂>θ₃≥π/2',
            'D. 0≤θ₁<θ₂<θ₃<π/2'], answer: 0 });

            options: ['A. II', 'B. III', 'C. IV', 'D. I'], answer: 3 });

        // ==================== RENDER QUESTIONS ====================
        const subjectNames = { maths: '📐 Mathematics (Q1-Q60)', chem: '🧪 Chemistry (Q61-Q120)',
            phys: '⚛️ Physics (Q121-Q180)' };
        const subjectColors = { maths: '#2563eb', chem: '#16a34a', phys: '#dc2626' };
        let currentSubject = '';
        const container = document.getElementById('examContainer');
        const optionLabels = ['A', 'B', 'C', 'D'];

        function renderAllQuestions() {
            let html = '';
            allQuestions.forEach((qdata, idx) => {
                if (qdata.subject !== currentSubject) {
                    currentSubject = qdata.subject;
                    html +=
                        `<div class="section-title" style="background:${subjectColors[currentSubject]};">${subjectNames[currentSubject]}</div>`;
                }
                html += `<div class="question-card" id="qcard-${qdata.id}" data-correct="${qdata.answer}">
            <div class="q-header">
              <span class="q-num">Q${qdata.id}.</span>
              <span class="q-text">${qdata.text}</span>
            </div>`;
                if (qdata.svg) {
                    html +=
                        `<div style="margin:10px 0;text-align:center;background:#fafafa;border-radius:8px;padding:8px;">${qdata.svg}</div>`;
                }
                html += `<div class="options">`;
                qdata.options.forEach((opt, oi) => {
                    html += `
              <label class="option" data-qid="${qdata.id}" data-oi="${oi}">
                <input type="radio" name="q${qdata.id}" value="${oi}">
                <span>${opt}</span>
              </label>`;
                });
                html += `</div>
            <span class="review-badge correct-badge">✅ Correct</span>
            <span class="review-badge incorrect-badge">❌ Incorrect</span>
            <span class="review-badge unanswered-badge">⚠ Unanswered</span>
            <div class="review-answer">📝 Correct Answer: ${optionLabels[qdata.answer]}. ${qdata.options[qdata.answer]}</div>
          </div>`;
            });
            container.innerHTML = html;

            // Add click listeners to labels for visual selection
            document.querySelectorAll('.option').forEach(label => {
                label.addEventListener('click', function() {
                    const qid = this.dataset.qid;
                    // Remove selected class from all options of this question
                    document.querySelectorAll(`.option[data-qid="${qid}"]`).forEach(l => l
                        .classList.remove('selected'));
                    this.classList.add('selected');
                    // Check the radio
                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;
                });
            });

            // Also handle radio change directly
            document.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const qid = this.name.replace('q', '');
                    document.querySelectorAll(`.option[data-qid="${qid}"]`).forEach(l => l
                        .classList.remove('selected'));
                    const parentLabel = this.closest('.option');
                    if (parentLabel) parentLabel.classList.add('selected');
                });
            });
        }

        // ==================== SUBMIT & REVIEW ====================
        function submitExam() {
            if (!confirm('Are you sure you want to submit? You can review answers after submission.')) return;

            let score = 0;
            let answered = 0;
            const total = allQuestions.length;

            allQuestions.forEach(qdata => {
                const card = document.getElementById(`qcard-${qdata.id}`);
                const selectedRadio = document.querySelector(`input[name="q${qdata.id}"]:checked`);
                const correctAnswer = qdata.answer;

                // Remove previous review classes
                card.classList.remove('review-correct', 'review-incorrect', 'review-unanswered');

                if (selectedRadio) {
                    answered++;
                    const selectedValue = parseInt(selectedRadio.value);
                    if (selectedValue === correctAnswer) {
                        card.classList.add('review-correct');
                        score++;
                    } else {
                        card.classList.add('review-incorrect');
                    }
                } else {
                    card.classList.add('review-unanswered');
                }

                // Disable all radios
                const allRadios = document.querySelectorAll(`input[name="q${qdata.id}"]`);
                allRadios.forEach(r => r.disabled = true);
            });

            // Show score bar
            const scoreBar = document.getElementById('scoreBar');
            scoreBar.style.display = 'flex';
            document.getElementById('scoreText').textContent =
                `✅ Score: ${score} / ${total} (${Math.round(score/total*100)}%) | Answered: ${answered}/${total}`;

            // Hide submit button
            document.getElementById('submitBtn').style.display = 'none';

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Add legend
            if (!document.getElementById('legend')) {
                const legend = document.createElement('div');
                legend.id = 'legend';
                legend.className = 'legend';
                legend.style.cssText = 'text-align:center;padding:10px;margin:10px 0;';
                legend.innerHTML = `
            <span><span class="dot" style="background:#16a34a;"></span> Correct</span>
            <span><span class="dot" style="background:#dc2626;"></span> Incorrect</span>
            <span><span class="dot" style="background:#f59e0b;"></span> Unanswered</span>`;
                container.insertBefore(legend, container.firstChild);
            }
        }

        function resetExam() {
            if (!confirm('Reset all answers and start over?')) return;
            document.querySelectorAll('input[type="radio"]').forEach(r => {
                r.checked = false;
                r.disabled = false;
            });
            document.querySelectorAll('.option').forEach(l => l.classList.remove('selected'));
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('review-correct', 'review-incorrect', 'review-unanswered');
            });
            document.getElementById('scoreBar').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
            const legend = document.getElementById('legend');
            if (legend) legend.remove();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== TIMER ====================
        let timeLeft = 180 * 60; // 180 minutes in seconds
        const timerEl = document.getElementById('timer');

        function updateTimer() {
            if (timeLeft <= 0) {
                timerEl.textContent = '⏱ 00:00';
                timerEl.style.background = '#ef4444';
                submitExam();
                return;
            }
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerEl.textContent = `⏱ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            if (timeLeft < 600) timerEl.style.background = '#ef4444';
            else if (timeLeft < 1800) timerEl.style.background = '#f59e0b';
            timeLeft--;
        }
        setInterval(updateTimer, 1000);

        // ==================== INIT ====================
        renderAllQuestions();
        console.log(
            `✅ COMEDK 2024 CBT loaded: ${allQuestions.length} questions ready. Select answers and click Submit to review.`
            );
    </script>
