<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK 5 - Mock Test (CBT)</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #fff;
            --text: #2d3436;
            --border: #dfe6e9;
            --primary: #0984e3;
            --success: #00b894;
            --danger: #e17055;
            --warning: #fdcb6e;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 100px;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }
        .header .info {
            font-size: 0.85rem;
            opacity: 0.85;
        }
        .nav-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-btns button {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .nav-btns button:hover,
        .nav-btns button.active {
            background: #fff;
            color: #16213e;
            border-color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .section-title {
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            color: #fff;
            padding: 15px 25px;
            border-radius: var(--radius);
            margin: 30px 0 20px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 22px 25px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
        }
        .question-card:hover {
            border-color: #dfe6e9;
        }
        .question-card.answered {
            border-color: #74b9ff;
            background: #f8fbff;
        }
        .question-card.correct-review {
            border-color: #00b894 !important;
            background: #f0fff8 !important;
        }
        .question-card.incorrect-review {
            border-color: #e17055 !important;
            background: #fff5f5 !important;
        }
        .q-num {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            text-align: center;
            line-height: 36px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .q-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 1rem;
        }
        .q-header .q-text {
            flex: 1;
            padding-top: 5px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-left: 46px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            background: #fafafa;
        }
        .option:hover {
            background: #eef5ff;
            border-color: #74b9ff;
        }
        .option input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .option.selected {
            background: #e3f0ff;
            border-color: #0984e3;
            font-weight: 500;
        }
        .option.correct-ans {
            background: #d4f7e8 !important;
            border-color: #00b894 !important;
            font-weight: 600 !important;
        }
        .option.wrong-ans {
            background: #ffe0d9 !important;
            border-color: #e17055 !important;
        }
        .svg-container {
            text-align: center;
            margin: 15px 0;
            max-width: 100%;
            overflow-x: auto;
        }
        .svg-container svg {
            max-width: 100%;
            height: auto;
        }
        .feedback-icon {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            display: none;
        }
        .correct-review .feedback-icon.correct {
            display: block;
            color: #00b894;
        }
        .incorrect-review .feedback-icon.incorrect {
            display: block;
            color: #e17055;
        }
        .submit-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 15px 25px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 99;
            flex-wrap: wrap;
        }
        .submit-section button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-submit {
            background: var(--primary);
            color: #fff;
        }
        .btn-submit:hover {
            background: #0652DD;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(9, 132, 227, 0.4);
        }
        .btn-reset {
            background: #fff;
            color: #636e72;
            border: 2px solid #b2bec3 !important;
        }
        .btn-reset:hover {
            background: #f5f6fa;
        }
        .score-banner {
            text-align: center;
            padding: 20px;
            border-radius: var(--radius);
            margin: 20px 0;
            font-size: 1.3rem;
            font-weight: 700;
            display: none;
        }
        .score-banner.show {
            display: block;
        }
        .timer {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        @media (max-width: 600px) {
            .header {
                padding: 15px;
                flex-direction: column;
                text-align: center;
            }
            .header h1 {
                font-size: 1.1rem;
            }
            .question-card {
                padding: 15px 12px;
            }
            .options {
                margin-left: 10px;
            }
            .option {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
            .q-header {
                font-size: 0.9rem;
            }
            .q-num {
                width: 28px;
                height: 28px;
                line-height: 28px;
                font-size: 0.75rem;
            }
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #00b894;
            border-radius: 2px;
            transition: width 0.4s;
        }
    </style>
</head>

        let submitted = false;
        let timerInterval;
        let totalSeconds = 180 * 60; // 180 minutes

        function startTimer() {
            timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                    return;
                }
                totalSeconds--;
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                document.getElementById('timerDisplay').textContent =
                    `⏱ ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                if (totalSeconds < 300) {
                    document.getElementById('timerDisplay').style.color = '#e17055';
                }
            }, 1000);
        }

        // ==================== QUESTION DATA ====================
        function buildAllQuestions() {
            buildPhysicsQuestions();
            buildChemistryQuestions();
            buildMathsQuestions();
            attachOptionListeners();
        }

        function createQuestionCard(qNum, questionHTML, options, svgHTML = '') {
            const labels = ['a', 'b', 'c', 'd'];
            let optHTML = '';
            options.forEach((opt, i) => {
                optHTML += `
                <label class="option" data-q="${qNum}" data-opt="${labels[i]}">
                    <input type="radio" name="q${qNum}" value="${labels[i]}">
                    <span>${labels[i]}. ${opt}</span>
                </label>`;
            });
            return `
            <div class="question-card" id="qcard${qNum}">
                <div class="feedback-icon correct">✅</div>
                <div class="feedback-icon incorrect">❌</div>
                <div class="q-header">
                    <span class="q-num">${qNum}</span>
                    <span class="q-text">${questionHTML}</span>
                </div>
                ${svgHTML ? `<div class="svg-container">${svgHTML}</div>` : ''}
                <div class="options">${optHTML}</div>
            </div>`;
        }

        function buildPhysicsQuestions() {
            const container = document.getElementById('physicsQuestions');
            let html = '';

            // Q1
            html += createQuestionCard(1,
                'A galvanometer of resistance <b>70Ω</b> is converted into an ammeter by a shunt resistance r<sub>s</sub> = 0.03Ω. The value of its resistance will become',
                ['0.025Ω', '0.022Ω', '0.035Ω', '0.030Ω']);

            // Q2
            html += createQuestionCard(2,
                'The horizontal range and maximum height of a projectile are equal. The angle of projection is',
                ['θ = tan<sup>−1</sup>(1/4)', 'θ = tan<sup>−1</sup>(4)', 'θ = tan<sup>−1</sup>(2)',
                    'θ = 45°'
                ]);

            // Q3
            html += createQuestionCard(3,
                'The speed of an electron in ground state energy level is 2.6×10<sup>6</sup> ms<sup>−1</sup>, then its speed in third excited state will be',
                ['5.6×10<sup>6</sup> ms<sup>−1</sup>', '6.5×10<sup>6</sup> ms<sup>−1</sup>',
                    '5.5×10<sup>5</sup> ms<sup>−1</sup>', '4.3×10<sup>6</sup> ms<sup>−1</sup>'
                ]);

            // Q4
            html += createQuestionCard(4,
                'The excess pressure inside an air bubble of radius r just below the surface of water is p<sub>1</sub>. The excess pressure inside a drop of the same radius just outside the surface is p<sub>2</sub>. If T is the surface tension, then',
                ['p<sub>1</sub> = 2p<sub>2</sub>', 'p<sub>1</sub> = p<sub>2</sub>', 'p<sub>2</sub> = 2p<sub>1</sub>', 'None']);

            // Q5 - with graph
            html += createQuestionCard(5,
                'Among the four graphs, there is only one graph for which average velocity over the time interval (0,T) can vanish for suitably chosen T. Which one is it?',
                ['Graph (a)', 'Graph (b)', 'Graph (c)', 'Graph (d)'],
                `<svg width="400" height="200" viewBox="0 0 400 200"><text x="200" y="50" text-anchor="middle" font-size="11" fill="#555">[Graph: Position-time plots - Option (b) shows symmetric displacement returning to zero]</text><rect x="60" y="70" width="70" height="90" rx="6" fill="#f0f0f0" stroke="#ccc"/><text x="95" y="120" text-anchor="middle" font-size="10">(a)</text><rect x="150" y="70" width="70" height="90" rx="6" fill="#e3f0ff" stroke="#0984e3" stroke-width="2"/><text x="185" y="120" text-anchor="middle" font-size="10">(b) ✓</text><rect x="240" y="70" width="70" height="90" rx="6" fill="#f0f0f0" stroke="#ccc"/><text x="275" y="120" text-anchor="middle" font-size="10">(c)</text><rect x="330" y="70" width="50" height="90" rx="6" fill="#f0f0f0" stroke="#ccc"/><text x="355" y="120" text-anchor="middle" font-size="10">(d)</text><text x="200" y="180" text-anchor="middle" font-size="9" fill="#888">Graph (b): Displacement returns to initial → avg velocity = 0</text></svg>`
            );

            // Q6
            html += createQuestionCard(6,
                'A cell can be balanced against 110 cm and 100 cm of potentiometer wire respectively, with and without being short-circuited through a resistance of 10Ω. Its internal resistance is',
                ['1.0Ω', '0.5Ω', '2.0Ω', 'zero']);

            // Q7
            html += createQuestionCard(7,
                'If two vectors are equal in magnitude and their resultant is also equal in magnitude to one of them, then the angle between the two vectors is',
                ['60°', '120°', '90°', '0°']);

            // Q8
            html += createQuestionCard(8,
                'A particle moves in a circle of radius 10 m with speed 5 ms<sup>−1</sup> and tangential acceleration 2 ms<sup>−2</sup>. Net acceleration is',
                ['3.2 ms<sup>−2</sup>', '2.5 ms<sup>−2</sup>', '2 ms<sup>−2</sup>', '4.5 ms<sup>−2</sup>']);

            // Q9
            html += createQuestionCard(9,
                'Three charges are placed at vertices of a right triangle. The change in potential energy when q<sub>3</sub> is moved from C to D involves K =',
                ['8q<sub>2</sub>', '6q<sub>2</sub>', '4q<sub>2</sub>', '2q<sub>2</sub>']);

            // Q10
            html += createQuestionCard(10,
                'If 36 units of force in a system with kg, m, min as base units is converted to CGS (g, cm, s), the value is',
                ['10<sup>3</sup> dyn', '10<sup>5</sup> dyn', '10<sup>7</sup> dyn', '10<sup>9</sup> dyn']);

            // Q11
            html += createQuestionCard(11,
                'From V-Q graphs of two capacitors A and B, if V<sub>B</sub> > V<sub>A</sub> for same Q, then',
                ['C<sub>A</sub> > C<sub>B</sub>', 'C<sub>B</sub> > C<sub>A</sub>', 'C<sub>A</sub> = C<sub>B</sub>',
                    'Cannot be determined'
                ]);

            // Q12
            html += createQuestionCard(12,
                'For a car of mass M moving in a circle of radius R, the maximum safe velocity without slipping is',
                ['√(μ<sub>A</sub>Rg)', '≤ √(μ<sub>A</sub>Rg)', '> √(μ<sub>A</sub>Rg)', 'Independent of μ<sub>A</sub>']);

            // Q13
            html += createQuestionCard(13,
                'A 1 kW pump lifts water through 10 m height. Quantity of water pumped per second is (g=10 ms<sup>−2</sup>)',
                ['10 kg', '100 kg', '1 kg', '50 kg']);

            // Q14
            html += createQuestionCard(14,
                'If (KE)<sub>A</sub> = (KE)<sub>B</sub> and I<sub>B</sub> > I<sub>A</sub> for rotating bodies, then',
                ['L<sub>A</sub> > L<sub>B</sub>', 'L<sub>A</sub> = L<sub>B</sub>', 'L<sub>B</sub> > L<sub>A</sub>',
                    'Cannot compare']);

            // Q15
            html += createQuestionCard(15,
                'Wire A has twice the radius of wire B. Under same tension, the ratio of transverse wave speeds v<sub>A</sub>/v<sub>B</sub> is',
                ['1/2', '2', '1/4', '4']);

            // Q16
            html += createQuestionCard(16,
                'Momentum transferred to a perfectly reflecting surface by EM radiation of energy E is',
                ['E/c', '2E/c', 'E/2c', 'zero']);

            // Q17
            html += createQuestionCard(17,
                'EM wave with E<sub>0</sub>=120 NC<sup>−1</sup>, ν=50 MHz propagating along X-axis. The expression for E is',
                ['120 sin(kx−ωt) ĵ', '120 cos(kx−ωt) ĵ', '120 sin(kx−ωt) k̂', '120 cos(kx−ωt) k̂']);

            // Q18
            html += createQuestionCard(18,
                'In Pfund series, the ratio λ<sub>max</sub>/λ<sub>min</sub> is',
                ['25/11', '11/25', '36/11', '11/36']);

            // Q19
            html += createQuestionCard(19,
                'Net resultant force at a point P inside a hollow spherical shell is',
                ['GMm/r²', 'GMm/R²', 'zero', 'GMm/(R−r)²']);

            // Q20
            html += createQuestionCard(20,
                'A particle of charge 10<sup>−12</sup> C moving along x-direction with velocity 10<sup>5</sup> ms<sup>−1</sup> experiences force 10<sup>−10</sup> N in y-direction. Minimum magnetic field is',
                ['6.25×10³ T in z-direction', '10<sup>−15</sup> T in z-direction', '6.25×10<sup>−3</sup> T in z-direction',
                    '10<sup>−3</sup> T in z-direction'
                ]);

            // Q21
            html += createQuestionCard(21,
                'Ratio of angular accelerations (α<sub>hollow cylinder</sub>/α<sub>solid sphere</sub>) under same torque is',
                ['2/5', '5/2', '5/4', '4/5']);

            // Q22 - with SVG

        function attachOptionListeners() {
            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', function() {
                    if (submitted) return;
                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;
                    const qNum = this.dataset.q;
                    const card = document.getElementById('qcard' + qNum);
                    // Remove selected from all options in this card
                    card.querySelectorAll('.option').forEach(o => o.classList.remove(
                        'selected'));
                    this.classList.add('selected');
                    card.classList.add('answered');
                    updateProgress();
                });
            });
        }

        function updateProgress() {
            const total = 180;
            let answered = 0;
            for (let i = 1; i <= total; i++) {
                const card = document.getElementById('qcard' + i);
                if (card && card.querySelector('input[type="radio"]:checked')) {
                    answered++;
                }
            }
            const pct = Math.round((answered / total) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
        }

        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function submitTest() {
            if (submitted) return;
            submitted = true;
            clearInterval(timerInterval);
            let correct = 0;
            let total = 180;

            for (let i = 1; i <= total; i++) {
                const card = document.getElementById('qcard' + i);
                if (!card) continue;
                const selectedRadio = card.querySelector('input[type="radio"]:checked');
                const userAns = selectedRadio ? selectedRadio.value : null;
                const correctAns = answerKey[i];

                // Reset classes
                card.querySelectorAll('.option').forEach(o => {
                    o.classList.remove('selected', 'correct-ans', 'wrong-ans');
                });

                if (userAns === correctAns) {
                    correct++;
                    card.classList.add('correct-review');
                    card.classList.remove('incorrect-review');
                    // Highlight correct option
                    card.querySelectorAll('.option').forEach(o => {
                        if (o.dataset.opt === correctAns) o.classList.add('correct-ans');
                    });
                } else {
                    card.classList.add('incorrect-review');
                    card.classList.remove('correct-review');
                    // Highlight wrong user answer
                    if (userAns) {
                        card.querySelectorAll('.option').forEach(o => {
                            if (o.dataset.opt === userAns) o.classList.add('wrong-ans');
                        });
                    }
                    // Highlight correct answer
                    card.querySelectorAll('.option').forEach(o => {
                        if (o.dataset.opt === correctAns) o.classList.add('correct-ans');
                    });
                }
            }

            const scoreBanner = document.getElementById('scoreBanner');
            const pct = Math.round((correct / total) * 100);
            let grade = '';
            let color = '#00b894';
            if (pct >= 90) { grade = '🏆 Excellent!';
                color = '#00b894'; } else if (pct >= 75) { grade = '👍 Very Good!';
                color = '#0984e3'; } else if (pct >= 60) { grade = '📚 Good, keep practicing!';
                color = '#fdcb6e'; } else if (pct >= 40) { grade = '📖 Needs improvement';
                color = '#e17055'; } else { grade = '📝 Keep studying!';
                color = '#d63031'; }

            scoreBanner.innerHTML = `
            <div style="background:${color};color:#fff;padding:25px;border-radius:12px;">
                <h2>${grade}</h2>
                <p style="font-size:1.5rem;margin:10px 0;">Score: ${correct} / ${total} (${pct}%)</p>
                <p style="font-size:0.9rem;opacity:0.9;">✅ Correct: ${correct} | ❌ Incorrect: ${total-correct} | 📋 Review answers below</p>
            </div>`;
            scoreBanner.classList.add('show');
            scoreBanner.scrollIntoView({ behavior: 'smooth' });

            // Update progress bar
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressFill').style.background = color;
        }

        function resetAll() {
            if (confirm('Are you sure you want to reset all answers? This cannot be undone.')) {
                submitted = false;
                document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
                document.querySelectorAll('.question-card').forEach(card => {
                    card.classList.remove('answered', 'correct-review', 'incorrect-review');
                });
                document.querySelectorAll('.option').forEach(o => {
                    o.classList.remove('selected', 'correct-ans', 'wrong-ans');
                });
                document.getElementById('scoreBanner').classList.remove('show');
                document.getElementById('scoreBanner').innerHTML = '';
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressFill').style.background = '#00b894';
                totalSeconds = 180 * 60;
                document.getElementById('timerDisplay').style.color = '#fff';
                clearInterval(timerInterval);
                startTimer();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Initialize
        buildAllQuestions();
        startTimer();

        // Update progress periodically
        setInterval(updateProgress, 3000);

        console.log('✅ COMEDK 5 CBT Ready! 180 questions loaded with answer key.');
        console.log('📋 Physics: Q1-60 | Chemistry: Q61-120 | Mathematics: Q121-180');
        console.log('🖱️ Click options to answer | Click "Submit & Review" to check | "Reset All" to restart');
    </script>
</body>
</html>
