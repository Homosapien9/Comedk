<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK UGET Mock Test - 2025 | CBT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #555;
            --accent: #1a56db;
            --accent-hover: #1647b8;
            --accent-light: #e8f0fe;
            --correct: #059669;
            --incorrect: #dc2626;
            --border: #ddd;
            --shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            --radius: 6px;
            --transition: 0.15s ease;
            --font: 'Inter', 'Arial', sans-serif;
            --palette-gray: #e2e8f0;
            --palette-red: #fecaca;
            --palette-green: #bbf7d0;
            --palette-answered-border: #059669;
            --header-bg: #1a56db;
            --header-text: #ffffff;
            --submit-red: #dc2626;
            --submit-red-hover: #b91c1c;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== HEADER ===== */
        header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            min-height: 52px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            min-width: 0;
        }
        .candidate-photo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #fff;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .candidate-name-header {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .test-title-header {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .timer-box {
            background: #0d3b8c;
            color: #fff;
            padding: 7px 14px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1.5px;
            min-width: 95px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-family: 'Courier New', monospace;
            transition: background 0.3s;
        }
        .timer-box.warning {
            background: #f59e0b;
            color: #000;
            animation: pulse-timer 1s infinite;
        }
        .timer-box.danger {
            background: #dc2626;
            color: #fff;
            animation: pulse-timer 0.5s infinite;
        }
        @keyframes pulse-timer {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.65;
            }
        }
        .header-right {
            flex-shrink: 0;
        }
        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            letter-spacing: 0.3px;
            font-family: var(--font);
            white-space: nowrap;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-submit-header {
            background: var(--submit-red);
            color: #fff;
            font-weight: 700;
            padding: 9px 18px;
            font-size: 0.9rem;
        }
        .btn-submit-header:hover {
            background: var(--submit-red-hover);
        }
        .btn-submit-header:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* ===== SUBJECT TABS ===== */
        .subject-tabs {
            display: flex;
            gap: 0;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 52px;
            z-index: 150;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .subject-tab {
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            border: none;
            background: transparent;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font);
            color: #555;
            position: relative;
            flex-shrink: 0;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .subject-tab:hover {
            color: var(--accent);
            background: #f8fafc;
        }
        .subject-tab.active {
            color: var(--accent);
            font-weight: 700;
        }
        .subject-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 8px;
            right: 8px;
            height: 3px;
            background: var(--accent);
            border-radius: 3px 3px 0 0;
        }
        .subject-tab .tab-count {
            font-size: 0.7rem;
            color: #888;
            font-weight: 500;
        }
        .subject-tab.active .tab-count {
            color: var(--accent);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px;
            min-height: calc(100vh - 160px);
        }
        .question-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .question-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .question-num-label {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            background: #f0f4ff;
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid #d0d8f0;
        }
        .subject-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            background: #e8f0fe;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .question-text-display {
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.65;
            margin-bottom: 10px;
            color: #1a1a2e;
            word-wrap: break-word;
        }
        .question-text-display svg {
            max-width: 100%;
            height: auto;
            margin: 8px 0;
            border-radius: 4px;
            background: #fafafa;
            display: block;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .option-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: var(--transition);
            font-size: 0.95rem;
            min-height: 52px;
            background: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .option-row:hover {
            border-color: #93c5fd;
            background: #fafcff;
        }
        .option-row input[type="radio"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
        }
        .option-row.selected {
            border-color: var(--accent);
            background: var(--accent-light);
            font-weight: 500;
        }
        .option-letter {
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
            font-size: 0.9rem;
            min-width: 20px;
        }
        .option-text {
            flex: 1;
            word-wrap: break-word;
        }
        .nav-buttons-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-save-next {
            background: #059669;
            color: #fff;
            font-weight: 600;
        }
        .btn-save-next:hover {
            background: #047857;
        }
        .btn-clear {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            font-weight: 600;
        }
        .btn-clear:hover {
            background: #fee2e2;
        }
        .btn-prev {
            background: #f1f5f9;
            color: #1a1a2e;
            border: 1px solid #ddd;
            font-weight: 600;
        }
        .btn-prev:hover {
            background: #e2e8f0;
        }

        /* ===== PALETTE SIDEBAR ===== */
        .palette-sidebar {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 14px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 110px;
            align-self: start;
            max-height: calc(100vh - 130px);
            overflow-y: auto;
        }
        .palette-title {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #333;
            text-align: center;
        }
        .palette-name {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        .palette-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 1.5px solid #d1d5db;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7rem;
            transition: var(--transition);
            background: #e2e8f0;
            color: #555;
            min-width: 22px;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .palette-btn:hover {
            border-color: var(--accent);
            background: #dbeafe;
        }
        .palette-btn.visited-unanswered {
            background: #fecaca;
            border-color: #f87171;
            color: #991b1b;
        }
        .palette-btn.answered {
            background: #bbf7d0;
            border-color: #4ade80;
            color: #065f46;
        }
        .palette-btn.current {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(26, 86, 219, 0.35);
            border-width: 2.5px;
            z-index: 2;
        }
        .palette-legend {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.68rem;
            color: #666;
        }
        .palette-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            flex-shrink: 0;
            border: 1px solid #ccc;
        }
        .legend-dot.gray {
            background: #e2e8f0;
        }
        .legend-dot.red {
            background: #fecaca;
            border-color: #f87171;
        }
        .legend-dot.green {
            background: #bbf7d0;
            border-color: #4ade80;
        }

        /* ===== MOBILE BOTTOM BAR ===== */
        .mobile-bottom-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid var(--border);
            padding: 8px 10px;
            z-index: 180;
            gap: 8px;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -1px 6px rgba(0, 0, 0, 0.08);
        }
        .mobile-bottom-bar .btn {
            font-size: 0.78rem;
            padding: 8px 10px;
            min-height: 40px;
            flex: 1;
            justify-content: center;
        }
        .btn-palette-toggle {
            background: #1a56db;
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
        }

        /* ===== MOBILE PALETTE DRAWER ===== */
        .palette-drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 250;
        }
        .palette-drawer-overlay.show {
            display: block;
        }
        .palette-drawer {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            z-index: 260;
            border-radius: 16px 16px 0 0;
            padding: 16px;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .palette-drawer.show {
            display: block;
            transform: translateY(0);
        }
        .palette-drawer-close {
            display: block;
            margin: 0 auto 10px;
            width: 40px;
            height: 5px;
            background: #ccc;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .palette-drawer .palette-grid {
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
        }
        .palette-drawer .palette-btn {
            font-size: 0.75rem;
            min-height: 34px;
            aspect-ratio: auto;
            height: 34px;
        }

        /* ===== RESULTS OVERLAY ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 300;
            display: none;
        }
        .overlay.show {
            display: block;
        }
        .results-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            z-index: 310;
            text-align: center;
            display: none;
            max-width: 520px;
            width: 94%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .results-panel.show {
            display: block;
        }
        .results-panel h2 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #1a1a2e;
        }
        .results-panel .big-score {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
        }
        .results-panel .score-sub {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 0.82rem;
        }
        .results-table th,
        .results-table td {
            padding: 8px 6px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .results-table th {
            background: #f9fafb;
            font-weight: 700;
            color: #333;
        }
        .results-table td {
            color: #444;
        }
        .results-name-input {
            margin: 10px 0;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .results-name-input input {
            padding: 9px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 0.9rem;
            font-family: var(--font);
            flex: 1;
            min-width: 150px;
            max-width: 250px;
        }
        .results-name-input button {
            padding: 9px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-family: var(--font);
            font-size: 0.85rem;
        }
        .results-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }
        .btn-retake {
            background: #f1f5f9;
            color: #1a1a2e;
            border: 1px solid #ddd;
        }
        .btn-home {
            background: var(--accent);
            color: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 8px;
                gap: 8px;
            }
            .palette-sidebar {
                display: none;
            }
            .mobile-bottom-bar {
                display: flex;
            }
            .question-panel {
                padding: 14px 10px;
                margin-bottom: 70px;
            }
            .question-text-display {
                font-size: 0.9rem;
            }
            .option-row {
                min-height: 52px;
                padding: 12px 10px;
                font-size: 0.85rem;
                gap: 8px;
            }
            .option-row input[type="radio"] {
                width: 20px;
                height: 20px;
            }
            header {
                padding: 6px 10px;
                gap: 6px;
                min-height: 46px;
            }
            .candidate-photo {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .candidate-name-header {
                font-size: 0.7rem;
                max-width: 70px;
            }
            .test-title-header {
                font-size: 0.72rem;
            }
            .timer-box {
                font-size: 0.8rem;
                padding: 5px 8px;
                min-width: 70px;
                letter-spacing: 1px;
            }
            .btn-submit-header {
                font-size: 0.7rem;
                padding: 7px 10px;
                min-height: 32px;
            }
            .subject-tabs {
                top: 46px;
            }
            .subject-tab {
                font-size: 0.7rem;
                padding: 9px 10px;
                min-height: 38px;
            }
            .nav-buttons-row {
                gap: 6px;
            }
            .nav-buttons-row .btn {
                font-size: 0.75rem;
                padding: 8px 10px;
                min-height: 40px;
                flex: 1;
                justify-content: center;
            }
            .question-meta {
                gap: 8px;
                margin-bottom: 10px;
            }
            .question-num-label {
                font-size: 0.78rem;
                padding: 4px 10px;
            }
            .subject-badge {
                font-size: 0.68rem;
            }
            .results-panel {
                padding: 20px 14px;
            }
            .results-panel .big-score {
                font-size: 2.8rem;
            }
        }
        @media (max-width: 480px) {
            header {
                padding: 5px 8px;
                gap: 4px;
                min-height: 42px;
            }
            .candidate-photo {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
            .candidate-name-header {
                font-size: 0.65rem;
                max-width: 55px;
            }
            .test-title-header {
                font-size: 0.65rem;
            }
            .timer-box {
                font-size: 0.7rem;
                padding: 4px 6px;
                min-width: 60px;
                letter-spacing: 0.8px;
            }
            .btn-submit-header {
                font-size: 0.65rem;
                padding: 5px 8px;
                min-height: 28px;
            }
            .subject-tabs {
                top: 42px;
            }
            .subject-tab {
                font-size: 0.65rem;
                padding: 7px 8px;
                min-height: 34px;
            }
            .question-panel {
                padding: 10px 6px;
                margin-bottom: 65px;
            }
            .question-text-display {
                font-size: 0.82rem;
            }
            .option-row {
                min-height: 52px;
                padding: 11px 8px;
                font-size: 0.8rem;
                gap: 6px;
            }
            .option-row input[type="radio"] {
                width: 20px;
                height: 20px;
            }
            .nav-buttons-row .btn {
                font-size: 0.7rem;
                padding: 7px 6px;
                min-height: 38px;
            }
            .palette-drawer .palette-grid {
                grid-template-columns: repeat(8, 1fr);
                gap: 3px;
            }
            .palette-drawer .palette-btn {
                font-size: 0.65rem;
                height: 28px;
                min-height: 28px;
            }
            .results-panel {
                padding: 16px 10px;
                width: 98%;
            }
            .results-panel .big-score {
                font-size: 2.2rem;
            }
            .results-table {
                font-size: 0.68rem;
            }
            .results-table th,
            .results-table td {
                padding: 5px 3px;
            }
        }

        /* Review mode classes */
        .question-card-reviewed .option-row.correct-answer-highlight {
            border-color: #059669 !important;
            background: #d1fae5 !important;
        }
        .question-card-reviewed .option-row.user-wrong-highlight {
            border-color: #dc2626 !important;
            background: #fee2e2 !important;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }
        @media (min-width: 769px) {
            .mobile-bottom-bar {
                display: none !important;
            }
            .palette-drawer,
            .palette-drawer-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-left">
            <div class="candidate-photo" id="candidatePhoto">👤</div>
            <span class="candidate-name-header" id="candidateNameHeader">Candidate</span>
        </div>
        <div class="header-center">
            <span class="test-title-header">COMEDK 2012</span>
            <div class="timer-box" id="timer">03:00:00</div>
        </div>
        <div class="header-right">
            <button class="btn btn-submit-header" onclick="submitTest()" id="submitBtn">📤 Submit Test</button>
        </div>
    </header>

    <!-- ===== SUBJECT TABS ===== -->

            // ============ STATE ============

            // ============ DOM REFS ============
            const questionTextDisplay = document.getElementById('questionTextDisplay');
            const optionsList = document.getElementById('optionsList');
            const questionNumLabel = document.getElementById('questionNumLabel');
            const subjectBadge = document.getElementById('subjectBadge');
            const timerEl = document.getElementById('timer');
            const submitBtn = document.getElementById('submitBtn');
            const paletteGrid = document.getElementById('paletteGrid');
            const paletteDrawerGrid = document.getElementById('paletteDrawerGrid');
            const paletteName = document.getElementById('paletteName');
            const paletteDrawerName = document.getElementById('paletteDrawerName');
            const candidateNameHeader = document.getElementById('candidateNameHeader');
            const candidatePhoto = document.getElementById('candidatePhoto');
            const overlay = document.getElementById('overlay');
            const resultsPanel = document.getElementById('resultsPanel');
            const bigScoreEl = document.getElementById('bigScore');
            const scoreDetail = document.getElementById('scoreDetail');
            const nameInputArea = document.getElementById('nameInputArea');
            const resultsContentArea = document.getElementById('resultsContentArea');
            const resultsTable = document.getElementById('resultsTable');
            const firebaseStatus = document.getElementById('firebaseStatus');
            const mobileBottomBar = document.getElementById('mobileBottomBar');
            const paletteDrawer = document.getElementById('paletteDrawer');
            const paletteDrawerOverlay = document.getElementById('paletteDrawerOverlay');

            // ============ INIT ============
            function getCandidateName() {
                return localStorage.getItem('comedk_username') || 'Candidate';
            }

            function updateCandidateDisplay() {
                const name = getCandidateName();
                candidateNameHeader.textContent = name;
                paletteName.textContent = name;
                paletteDrawerName.textContent = name;
                const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || '👤';
                candidatePhoto.textContent = initials;
            }

            function getSubjectName(subject) {
                if (subject === 'physics') return 'PHYSICS';
                if (subject === 'chemistry') return 'CHEMISTRY';
                if (subject === 'maths') return 'MATHEMATICS';
                return '';
            }

            function getSubjectFromId(qId) {
                if (qId <= 60) return 'physics';
                if (qId <= 120) return 'chemistry';
                return 'maths';
            }

            function getSubjectRange(subject) {
                if (subject === 'physics') return { start: 1, end: 60 };
                if (subject === 'chemistry') return { start: 61, end: 120 };
                if (subject === 'maths') return { start: 121, end: 180 };
                return { start: 1, end: 180 };
            }

            function getAnsweredCountForSubject(subject) {
                const range = getSubjectRange(subject);
                let count = 0;
                for (let id = range.start; id <= range.end; id++) {
                    if (userAnswers[id] !== undefined && userAnswers[id] !== null) count++;
                }
                return count;
            }

            function updateSubjectTabCounts() {
                const physCount = getAnsweredCountForSubject('physics');
                const chemCount = getAnsweredCountForSubject('chemistry');
                const mathCount = getAnsweredCountForSubject('maths');
                document.getElementById('tabCountPhysics').textContent = `(${physCount}/60)`;
                document.getElementById('tabCountChemistry').textContent = `(${chemCount}/60)`;
                document.getElementById('tabCountMaths').textContent = `(${mathCount}/60)`;
            }

            function updateActiveSubjectTab() {
                const currentSubject = questionsData[currentQuestionIndex].subject;
                document.querySelectorAll('.subject-tab').forEach(t => t.classList.remove('active'));
                const tab = document.querySelector(`.subject-tab[data-subject="${currentSubject}"]`);
                if (tab) tab.classList.add('active');
            }

            // ============ RENDER QUESTION ============
            function renderCurrentQuestion() {
                const q = questionsData[currentQuestionIndex];
                questionNumLabel.textContent = `Question ${q.id} of 180`;
                subjectBadge.textContent = getSubjectName(q.subject);

                let html = q.text;
                if (q.image) {
                    html += '<br>' + q.image;
                }
                questionTextDisplay.innerHTML = html;

                const labels = ['A', 'B', 'C', 'D'];
                let optionsHTML = '';
                q.options.forEach((opt, i) => {
                    const letter = labels[i];
                    const isSelected = userAnswers[q.id] === letter;
                    optionsHTML += `
                    <label class="option-row${isSelected ? ' selected' : ''}" id="optRow_${q.id}_${letter}">
                        <input type="radio" name="q${q.id}" value="${letter}" id="opt_${q.id}_${letter}" ${isSelected ? 'checked' : ''}>
                        <span class="option-letter">(${letter})</span>
                        <span class="option-text">${opt}</span>
                    </label>`;
                });
                optionsList.innerHTML = optionsHTML;

                // Add event listeners
                optionsList.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.addEventListener('change', function() {
                        const val = this.value;
                        userAnswers[q.id] = val;
                        updateAllOptionRowStyles(q.id);
                        updatePaletteButton(q.id);
                        updatePaletteDrawerButton(q.id);
                        updateSubjectTabCounts();
                    });
                });

                // Mark as visited
                visitedQuestions.add(q.id);
                updatePaletteButton(q.id);
                updatePaletteDrawerButton(q.id);
                updateActiveSubjectTab();
                updateSubjectTabCounts();

                // Update nav button states
                document.getElementById('btnPrev').style.visibility = currentQuestionIndex === 0 ? 'hidden' :
                    'visible';
            }

            function updateAllOptionRowStyles(qId) {
                const labels = ['A', 'B', 'C', 'D'];
                const selectedVal = userAnswers[qId] || null;
                labels.forEach(letter => {
                    const row = document.getElementById(`optRow_${qId}_${letter}`);
                    if (row) {
                        if (selectedVal === letter) {
                            row.classList.add('selected');
                        } else {
                            row.classList.remove('selected');
                        }
                    }
                });
            }

            // ============ NAVIGATION ============
            function goToQuestion(index) {
                if (index < 0 || index >= questionsData.length) return;
                currentQuestionIndex = index;
                renderCurrentQuestion();
                // Scroll question panel to top
                const panel = document.getElementById('questionPanel');
                if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                updateActiveSubjectTab();
            }

            function saveAndNext() {
                if (currentQuestionIndex < questionsData.length - 1) {
                    goToQuestion(currentQuestionIndex + 1);
                }
            }

            function previousQuestion() {
                if (currentQuestionIndex > 0) {
                    goToQuestion(currentQuestionIndex - 1);
                }
            }

            function clearResponse() {
                const q = questionsData[currentQuestionIndex];
                delete userAnswers[q.id];
                const radios = optionsList.querySelectorAll('input[type="radio"]');
                radios.forEach(r => r.checked = false);
                updateAllOptionRowStyles(q.id);
                updatePaletteButton(q.id);
                updatePaletteDrawerButton(q.id);
                updateSubjectTabCounts();
            }

            function jumpToSubject(subject) {
                const range = getSubjectRange(subject);
                const idx = questionsData.findIndex(q => q.id === range.start);
                if (idx >= 0) goToQuestion(idx);
            }

            function jumpToQuestionById(qId) {
                const idx = questionsData.findIndex(q => q.id === qId);
                if (idx >= 0) {
                    goToQuestion(idx);
                    closePaletteDrawer();
                }
            }

            // ============ PALETTE ============
            function getPaletteButtonClass(qId) {
                const isAnswered = userAnswers[qId] !== undefined && userAnswers[qId] !== null;
                const isVisited = visitedQuestions.has(qId);
                const isCurrent = questionsData[currentQuestionIndex].id === qId;
                let cls = 'palette-btn';
                if (isAnswered) cls += ' answered';
                else if (isVisited) cls += ' visited-unanswered';
                if (isCurrent) cls += ' current';
                return cls;
            }

            function updatePaletteButton(qId) {
                const btn = document.getElementById(`paletteBtn_${qId}`);
                if (btn) {
                    btn.className = getPaletteButtonClass(qId);
                }
            }

            function updatePaletteDrawerButton(qId) {
                const btn = document.getElementById(`paletteDrawerBtn_${qId}`);
                if (btn) {
                    btn.className = getPaletteButtonClass(qId);
                }
            }

            function buildPaletteGrid(containerId, btnPrefix) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';
                for (let id = 1; id <= 180; id++) {
                    const btn = document.createElement('button');
                    btn.className = 'palette-btn';
                    btn.id = `${btnPrefix}${id}`;
                    btn.textContent = id;
                    btn.title = `Question ${id}`;
                    btn.addEventListener('click', () => jumpToQuestionById(id));
                    container.appendChild(btn);
                }
            }

            function refreshAllPaletteButtons() {
                for (let id = 1; id <= 180; id++) {
                    updatePaletteButton(id);
                    updatePaletteDrawerButton(id);
                }
            }

            function openPaletteDrawer() {
                paletteDrawerOverlay.classList.add('show');
                paletteDrawer.classList.add('show');
                refreshAllPaletteButtons();
            }

            function closePaletteDrawer() {
                paletteDrawerOverlay.classList.remove('show');
                paletteDrawer.classList.remove('show');
            }

            // ============ TIMER ============
            function updateTimer() {
                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                timerEl.textContent =
                    `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                timerEl.classList.remove('warning', 'danger');
                if (totalSeconds <= 300) timerEl.classList.add('danger');
                else if (totalSeconds <= 600) timerEl.classList.add('warning');
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                }
                totalSeconds--;
            }

            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            }

            // ============ SUBMIT ============
            function submitTest() {
                if (testSubmitted) return;
                testSubmitted = true;
                clearInterval(timerInterval);
                submitBtn.textContent = '✅ Submitted';
                submitBtn.disabled = true;

                // Calculate scores
                let score = 0;
                let correct = 0;
                let incorrect = 0;
                let unanswered = 0;

                questionsData.forEach(q => {
                    const userAns = userAnswers[q.id] || null;
                    if (userAns === null || userAns === undefined) {
                        unanswered++;
                    } else if (userAns === answerKey[q.id]) {
                        score++;
                        correct++;
                    } else {
                        incorrect++;
                    }
                });

                finalScore = score;
                finalCorrect = correct;
                finalIncorrect = incorrect;
                finalUnanswered = unanswered;
                finalAccuracy = (correct + incorrect) > 0 ? Math.round((correct / (correct + incorrect)) *
                    100) : 0;

                // Show results
                bigScoreEl.textContent = score;
                scoreDetail.innerHTML = `
                    <p>✅ Correct: <strong>${correct}</strong> | ❌ Incorrect: <strong>${incorrect}</strong> | ⬜ Unanswered: <strong>${unanswered}</strong></p>
                    <p>📊 Accuracy: <strong>${finalAccuracy}%</strong></p>
                `;

                // Check if name exists
                const savedName = localStorage.getItem('comedk_username');
                if (!savedName) {
                    nameInputArea.classList.remove('hidden');
                    resultsContentArea.classList.add('hidden');
                } else {
                    nameInputArea.classList.add('hidden');
                    resultsContentArea.classList.remove('hidden');
                    buildResultsTable();
                    triggerFirebaseSave(savedName);
                }

                overlay.classList.add('show');
                resultsPanel.classList.add('show');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function buildResultsTable() {
                const subjects = [
                    { name: 'Physics', subject: 'physics', range: [1, 60] },
                    { name: 'Chemistry', subject: 'chemistry', range: [61, 120] },
                    { name: 'Mathematics', subject: 'maths', range: [121, 180] },
                ];
                let html = `<thead><tr><th>Subject</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Unattempted</th></tr></thead><tbody>`;
                subjects.forEach(s => {
                    let sc = 0,
                        cor = 0,
                        wr = 0,
                        un = 0;
                    for (let id = s.range[0]; id <= s.range[1]; id++) {
                        const ua = userAnswers[id] || null;
                        if (ua === null || ua === undefined) un++;
                        else if (ua === answerKey[id]) { sc++;
                            cor++; } else wr++;
                    }
                    html +=
                        `<tr><td><strong>${s.name}</strong></td><td>${sc}</td><td>${cor}</td><td>${wr}</td><td>${un}</td></tr>`;
                });
                html +=
                    `<tr style="font-weight:700;background:#f9fafb;"><td>Total</td><td>${finalScore}</td><td>${finalCorrect}</td><td>${finalIncorrect}</td><td>${finalUnanswered}</td></tr></tbody>`;
                resultsTable.innerHTML = html;
            }

            function triggerFirebaseSave(name) {
                firebaseStatus.textContent = '⏳ Saving to leaderboard...';
                if (typeof window.saveScoreToFirebase === 'function') {
                    window.saveScoreToFirebase(name, '2012', finalScore, 180, finalAccuracy)
                        .then(() => {
                            firebaseStatus.textContent = '✅ Score saved to leaderboard!';
                        })
                        .catch(() => {
                            firebaseStatus.textContent = '⚠️ Could not save to leaderboard.';
                        });
                } else {
                    firebaseStatus.textContent = '⚠️ Leaderboard unavailable.';
                }
                // Update localStorage best score
                const bestKey = 'comedk_best_score_2012';
                const prevBest = parseInt(localStorage.getItem(bestKey) || '0');
                if (finalScore > prevBest) {
                    localStorage.setItem(bestKey, finalScore);
                }
                const attemptsKey = 'comedk_attempts_2012';
                const prevAttempts = parseInt(localStorage.getItem(attemptsKey) || '0');
                localStorage.setItem(attemptsKey, prevAttempts + 1);
            }

            function saveNameAndProceed() {
                const input = document.getElementById('nameInputField');
                const name = input.value.trim();
                if (!name) {
                    alert('Please enter your name.');
                    return;
                }
                localStorage.setItem('comedk_username', name);
                updateCandidateDisplay();
                nameInputArea.classList.add('hidden');
                resultsContentArea.classList.remove('hidden');
                buildResultsTable();
                triggerFirebaseSave(name);
                nameSubmittedForResults = true;
            }

            function retakeTest() {
                testSubmitted = false;
                userAnswers = {};
                visitedQuestions = new Set();
                totalSeconds = 180 * 60;
                currentQuestionIndex = 0;
                finalScore = 0;
                finalCorrect = 0;
                finalIncorrect = 0;
                finalUnanswered = 0;
                finalAccuracy = 0;
                nameSubmittedForResults = false;
                submitBtn.textContent = '📤 Submit Test';
                submitBtn.disabled = false;
                overlay.classList.remove('show');
                resultsPanel.classList.remove('show');
                nameInputArea.classList.add('hidden');
                resultsContentArea.classList.add('hidden');
                startTimer();
                buildPaletteGrid('paletteGrid', 'paletteBtn_');
                buildPaletteGrid('paletteDrawerGrid', 'paletteDrawerBtn_');
                refreshAllPaletteButtons();
                goToQuestion(0);
                updateCandidateDisplay();
                updateSubjectTabCounts();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function goHome() {
                window.location.href = 'index.html';
            }

            // Close overlay on click
            overlay.addEventListener('click', function() {
                if (testSubmitted && nameSubmittedForResults) {
                    // Don't close if results are being shown after name entry
                }
            });

            // ============ KEYBOARD NAVIGATION ============
            document.addEventListener('keydown', function(e) {
                if (testSubmitted) return;
                if (e.key === 'ArrowRight' && !e.ctrlKey && !e.metaKey && document.activeElement ===
                    document.body) {
                    e.preventDefault();
                    saveAndNext();
                } else if (e.key === 'ArrowLeft' && !e.ctrlKey && !e.metaKey && document.activeElement ===
                    document.body) {
                    e.preventDefault();
                    previousQuestion();
                } else if (e.key === 'c' && e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    clearResponse();
                }
            });

            // ============ INITIALIZATION ============
            function init() {
                updateCandidateDisplay();
                buildPaletteGrid('paletteGrid', 'paletteBtn_');
                buildPaletteGrid('paletteDrawerGrid', 'paletteDrawerBtn_');
                goToQuestion(0);
                refreshAllPaletteButtons();
                updateSubjectTabCounts();
                startTimer();
                updateActiveSubjectTab();
            }

            init();

            console.log('✅ COMEDK UGET Mock Test 2025 CBT loaded successfully!');
            console.log('📝 180 questions ready | ⏱ 180-minute timer | JEE CBT Interface');
            console.log('💡 Use subject tabs, palette, or arrow keys to navigate.');
        })();
    </script>
</body>
</html>
