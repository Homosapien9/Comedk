    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #555;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --correct: #059669;
            --incorrect: #dc2626;
            --border: #e2e8f0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --transition: 0.2s ease;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow);
        }
        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .timer-box {
            background: #1a1a2e;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 1px;
            min-width: 90px;
            text-align: center;
        }
        .timer-box.warning {
            background: #f59e0b;
            animation: pulse 0.8s infinite;
        }
        .timer-box.danger {
            background: #dc2626;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .btn-submit {
            background: var(--accent);
            color: #fff;
        }
        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-reset {
            background: #e2e8f0;
            color: #1a1a2e;
        }
        .btn-reset:hover {
            background: #cbd5e1;
        }
        .btn-review {
            background: #059669;
            color: #fff;
        }
        .btn-review:hover {
            background: #047857;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }
        .subject-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            position: sticky;
            top: 90px;
            z-index: 50;
            background: var(--bg);
            padding: 10px 0;
        }
        .subject-tab {
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid var(--border);
            background: #fff;
            transition: var(--transition);
            white-space: nowrap;
        }
        .subject-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .subject-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: var(--transition);
            scroll-margin-top: 140px;
        }
        .question-card.reviewed-correct {
            border-color: var(--correct);
            background: #f0fdf6;
        }
        .question-card.reviewed-incorrect {
            border-color: var(--incorrect);
            background: #fef2f2;
        }
        .question-card.reviewed-unanswered {
            border-color: #f59e0b;
            background: #fffbeb;
        }
        .q-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .q-num {
            background: var(--accent);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .q-text {
            font-weight: 500;
            font-size: 1rem;
            flex: 1;
            padding-top: 4px;
        }
        .q-text svg {
            max-width: 100%;
            height: auto;
            margin: 8px 0;
            border-radius: 6px;
            background: #fafafa;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            padding-left: 46px;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: var(--transition);
            font-size: 0.95rem;
        }
        .option-label:hover {
            border-color: #93c5fd;
            background: #f8fafc;
        }
        .option-label input[type="radio"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .option-label.selected {
            border-color: var(--accent);
            background: #eff6ff;
            font-weight: 500;
        }
        .review-badge {
            display: none;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .reviewed-correct .review-badge.correct-badge {
            display: inline-block;
            background: #d1fae5;
            color: #059669;
        }
        .reviewed-incorrect .review-badge.incorrect-badge {
            display: inline-block;
            background: #fee2e2;
            color: #dc2626;
        }
        .reviewed-unanswered .review-badge.unanswered-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
        }
        .correct-answer-reveal {
            display: none;
            font-size: 0.85rem;
            color: #059669;
            font-weight: 600;
            margin-top: 4px;
            padding-left: 46px;
        }
        .reviewed-incorrect .correct-answer-reveal,
        .reviewed-unanswered .correct-answer-reveal {
            display: block;
        }
        .score-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 16px;
            padding: 30px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            z-index: 200;
            text-align: center;
            display: none;
            max-width: 500px;
            width: 90%;
        }
        .score-panel.show {
            display: block;
        }
        .score-panel h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .score-panel .big-score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent);
        }
        .score-panel .score-detail {
            color: #666;
            margin: 8px 0;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 199;
            display: none;
        }
        .overlay.show {
            display: block;
        }
        .nav-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            justify-content: center;
        }
        @media (max-width: 640px) {
            .container {
                padding: 10px;
            }
            .question-card {
                padding: 14px 10px;
            }
            .options {
                padding-left: 10px;
            }
            .q-num {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }
            header {
                padding: 8px 12px;
            }
            header h1 {
                font-size: 0.95rem;
            }
            .timer-box {
                font-size: 0.85rem;
                padding: 6px 12px;
            }
            .subject-tabs {
                top: 70px;
            }
            .score-panel {
                padding: 20px;
            }
            .score-panel .big-score {
                font-size: 3rem;
            }
        }
    </style>
</head>

                text: 'α=î−3ĵ, β=î+2ĵ−k̂. β=β₁+β₂, β₁∥α, β₂⊥α. β₁ =',
                options: ['−½î+³⁄₂ĵ', '5/8(î+3ĵ)', 'î−3ĵ', 'î+3ĵ'],
                image: null
            }, {
                id: 175,
                subject: 'maths',
                text: 'ā=î+ĵ+k̂, b̄=î−ĵ+k̂, c̄=î−ĵ−k̂. v̄ in plane of ā,b̄ with projection on c̄ = 1/√3 is',
                options: ['î−3ĵ+3k̂', '−3î−3ĵ−k̂', '3î−ĵ+3k̂', 'î+3ĵ−3k̂'],
                image: null
            }, {
                id: 176,
                subject: 'maths',
                text: 'ā=î−ĵ+2k̂, b̄=2î+4ĵ+k̂, c̄=pî+ĵ+qk̂ are mutually orthogonal. (p,q)=',
                options: ['(3,−2)', '(−2,3)', '(−3,2)', '(2,−3)'],
                image: null
            }, {
                id: 177,
                subject: 'maths',
                text: '(ū+v̄−w̄)·[(ū−v̄)×(v̄−w̄)] =',
                options: ['ū·(v̄×w̄)', 'ū·(w̄×v̄)', '3ū·(v̄×w̄)', '0'],
                image: null
            }, {
                id: 178,
                subject: 'maths',
                text: 'ū=î+ĵ, v̄=î−ĵ, w̄=î+2ĵ+3k̂. n̂ unit vector with ū·n̂=0, v̄·n̂=0. |w̄·n̂|=',
                options: ['0', '1', '2', '3'],
                image: null
            }, {
                id: 179,
                subject: 'maths',
                text: 'Volume of parallelopiped with edges ĵ+k̂, î+k̂, î+ĵ is',
                options: ['6 cu units', '2 cu units', '4 cu units', '3 cu units'],
                image: null
            }, {
                id: 180,
                subject: 'maths',
                text: 'If p=(b×c)/[abc], q=(c×a)/[abc], r=(a×b)/[abc], then (a+b)·p+(b+c)·q+(c+a)·r =',
                options: ['0', '1', '2', '3'],
                image: null
            }
        ];

        // ============ RENDER QUESTIONS ============
        const container = document.getElementById('questionsContainer');
        const subjectSections = { physics: [], chemistry: [], maths: [] };

        questionsData.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q${q.id}`;
            card.setAttribute('data-subject', q.subject);

            let html = `<div class="q-header"><div class="q-num">${q.id}</div><div class="q-text">${q.text}`;
            if (q.image) {
                html += `<br>${q.image}`;
            }
            html += `</div></div><div class="options">`;
            const labels = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                html += `
                <label class="option-label" id="optLabel_${q.id}_${labels[i]}">
                    <input type="radio" name="q${q.id}" value="${labels[i]}" id="opt_${q.id}_${labels[i]}">
                    <span><strong>(${labels[i]})</strong> ${opt}</span>
                </label>`;
            });
            html += `</div>`;
            html +=
                `<span class="review-badge correct-badge">✅ Correct</span><span class="review-badge incorrect-badge">❌ Incorrect</span><span class="review-badge unanswered-badge">⚠ Unanswered</span>`;
            html +=
                `<div class="correct-answer-reveal">✅ Correct Answer: <strong id="correctAns_${q.id}"></strong></div>`;
            card.innerHTML = html;
            container.appendChild(card);

            // Track option selection
            card.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const allLabels = card.querySelectorAll('.option-label');
                    allLabels.forEach(l => l.classList.remove('selected'));
                    const parentLabel = this.closest('.option-label');
                    if (parentLabel) parentLabel.classList.add('selected');
                });
            });

            subjectSections[q.subject].push(q.id);
        });

        // ============ TIMER ============
        let totalSeconds = 180 * 60;
        let timerInterval;
        const timerEl = document.getElementById('timer');

        function updateTimer() {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            timerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            timerEl.classList.remove('warning', 'danger');
            if (totalSeconds <= 300) timerEl.classList.add('danger');
            else if (totalSeconds <= 600) timerEl.classList.add('warning');
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                submitTest();
            }
            totalSeconds--;
        }
        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();

        // ============ SCROLL TO SUBJECT ============
        function scrollToSubject(subject) {
            const firstId = subjectSections[subject][0];
            const el = document.getElementById(`q${firstId}`);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
            document.querySelectorAll('.subject-tab').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.subject-tab');
            if (subject === 'physics') tabs[0].classList.add('active');
            if (subject === 'chemistry') tabs[1].classList.add('active');
            if (subject === 'maths') tabs[2].classList.add('active');
        }

        // Highlight active tab on scroll
        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY + 160;
            let activeSubject = 'physics';
            for (const subj of ['maths', 'chemistry', 'physics']) {
                const firstId = subjectSections[subj][0];
                const el = document.getElementById(`q${firstId}`);
                if (el && el.offsetTop <= scrollPos) {
                    activeSubject = subj;
                    break;
                }
            }
            document.querySelectorAll('.subject-tab').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.subject-tab');
            if (activeSubject === 'physics') tabs[0].classList.add('active');
            if (activeSubject === 'chemistry') tabs[1].classList.add('active');
            if (activeSubject === 'maths') tabs[2].classList.add('active');
        });

        // ============ SUBMIT & REVIEW ============
        let testSubmitted = false;
        let userAnswers = {};

        function submitTest() {
            if (testSubmitted) return;
            testSubmitted = true;
            clearInterval(timerInterval);
            document.getElementById('submitBtn').textContent = '✅ Submitted';
            document.getElementById('submitBtn').disabled = true;

            // Collect answers
            userAnswers = {};
            let score = 0;
            let answered = 0;
            let unanswered = 0;
            let incorrect = 0;

            questionsData.forEach(q => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (selected) {
                    userAnswers[q.id] = selected.value;
                    answered++;
                    if (selected.value === answerKey[q.id]) {
                        score++;
                    } else {
                        incorrect++;
                    }
                } else {
                    userAnswers[q.id] = null;
                    unanswered++;
                }
            });

            // Show score panel
            document.getElementById('bigScore').textContent = score;
            document.getElementById('scoreDetail').innerHTML = `
                <p>✅ Correct: <strong>${score}</strong></p>
                <p>❌ Incorrect: <strong>${incorrect}</strong></p>
                <p>⚠ Unanswered: <strong>${unanswered}</strong></p>
                <p>📋 Total Answered: <strong>${answered}/180</strong></p>
                <p>📊 Accuracy: <strong>${answered>0?Math.round(score/answered*100):0}%</strong></p>
            `;
            document.getElementById('overlay').classList.add('show');
            document.getElementById('scorePanel').classList.add('show');

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reviewAnswers() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('scorePanel').classList.remove('show');

            // Apply review classes
            questionsData.forEach(q => {
                const card = document.getElementById(`q${q.id}`);
                card.classList.remove('reviewed-correct', 'reviewed-incorrect', 'reviewed-unanswered');
                const userAns = userAnswers[q.id];
                const correctAns = answerKey[q.id];
                const correctAnsEl = document.getElementById(`correctAns_${q.id}`);
                if (correctAnsEl) correctAnsEl.textContent = `(${correctAns})`;

                if (userAns === null) {
                    card.classList.add('reviewed-unanswered');
                } else if (userAns === correctAns) {
                    card.classList.add('reviewed-correct');
                } else {
                    card.classList.add('reviewed-incorrect');
                }
            });

            // Scroll to first question
            const firstQ = document.getElementById('q1');
            if (firstQ) firstQ.scrollIntoView({ behavior: 'smooth' });
        }

        function closeScorePanel() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('scorePanel').classList.remove('show');
        }

        function resetTest() {
            if (testSubmitted && !confirm('This will reset all your answers. Continue?')) return;
            testSubmitted = false;
            userAnswers = {};
            totalSeconds = 180 * 60;
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
            document.getElementById('submitBtn').textContent = '📤 Submit Test';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('scorePanel').classList.remove('show');

            // Clear all radio buttons and styles
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('reviewed-correct', 'reviewed-incorrect', 'reviewed-unanswered');
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Close overlay on click
        document.getElementById('overlay').addEventListener('click', closeScorePanel);

        console.log('✅ COMEDK UGET Mock Test 2025 CBT loaded successfully!');
        console.log('📝 180 questions ready | ⏱ 180-minute timer | 📊 Submit to review');
        console.log('💡 Tip: Use the subject tabs to navigate between Physics, Chemistry & Mathematics.');
    </script>
</body>
</html>
