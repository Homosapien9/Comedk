<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>COMEDK 2025‑s2 • Full Mock Test</title>
  <!-- MathJax for LaTeX rendering -->
  <script>
    MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      startup: { ready() { MathJax.startup.defaultReady(); } },
      options: { enableMenu: false }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --danger: #dc2626;
      --success: #16a34a;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --radius: 8px;
      --radius-sm: 4px;
      --shadow: 0 1px 3px rgba(0,0,0,.1);
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --transition: 0.15s ease;
    }
    body {
      font-family: var(--font);
      background: #f0f2f5;
      color: var(--gray-800);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 70px;
      -webkit-tap-highlight-color: transparent;
    }
    .header {
      background: var(--primary);
      color: #fff;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      flex-wrap: wrap;
      min-height: 52px;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--primary);
      font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .timer-box {
      background: #1e3a8a; padding: 5px 14px; border-radius: var(--radius-sm); font-weight: 700;
      font-size: 16px; font-family: 'Courier New', monospace; letter-spacing: 1px; transition: background 0.3s;
    }
    .timer-box.warning { background: #dc2626; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    .btn-submit {
      background: #dc2626; color: #fff; border: none; padding: 8px 18px; border-radius: var(--radius-sm);
      font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .btn-submit:disabled { opacity:0.6; cursor:not-allowed; }
    .subject-tabs {
      display: flex; background: #fff; border-bottom: 2px solid var(--gray-200);
      position: sticky; top: 52px; z-index: 99; overflow-x: auto; scrollbar-width: none;
    }
    .subject-tab {
      flex: 1; text-align: center; padding: 10px 4px; font-weight: 600; font-size: 12px;
      border: none; background: transparent; cursor: pointer; color: var(--gray-600);
      border-bottom: 3px solid transparent; white-space: nowrap; transition: all var(--transition);
    }
    .subject-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--primary-light); }
    .main-container { display: flex; max-width: 1300px; margin: 0 auto; }
    .question-panel {
      flex: 1 1 70%; background: #fff; padding: 18px 20px; border-right: 1px solid var(--gray-200);
    }
    .palette-sidebar {
      flex: 0 0 260px; background: #fff; padding: 14px; position: sticky; top: 100px;
      align-self: flex-start; max-height: calc(100vh - 120px); overflow-y: auto;
    }
    .q-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .q-number { font-weight: 700; font-size: 15px; }
    .q-subject-badge { background: var(--primary); color: #fff; padding: 2px 12px; border-radius: 20px; font-size: 10px; }
    .q-text { font-size: 14px; margin-bottom: 14px; word-wrap: break-word; }
    .q-image { max-width: 100%; height: auto; margin: 8px 0; border-radius: var(--radius); border: 1px solid var(--gray-200); display: block; background: #fafafa; }
    .options-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .option-btn {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border: 1px solid var(--gray-300);
      border-radius: var(--radius); cursor: pointer; font-size: 13px; background: #fff; transition: all var(--transition);
      min-height: 46px; word-wrap: break-word;
    }
    .option-btn:hover { border-color: var(--primary); background: #f8faff; }
    .option-btn.selected { background: var(--primary-light); border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
    .option-label { font-weight: 700; color: var(--primary); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .option-btn.selected .option-label { background: var(--primary); color: #fff; }
    .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-action { padding: 9px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12px; cursor: pointer; border: 1px solid var(--gray-300); background: #fff; min-height: 42px; }
    .btn-save-next { background: #16a34a; color: #fff; border-color: #16a34a; }
    .btn-clear { background: #fff; color: var(--danger); border-color: var(--danger); }
    .btn-prev { background: #fff; color: var(--gray-700); }
    .palette-grid { display: grid; grid-template-columns: repeat(10,1fr); gap: 3px; }
    .palette-btn {
      aspect-ratio: 1; border: 1px solid var(--gray-300); border-radius: 3px; font-size: 10px; font-weight: 600;
      cursor: pointer; background: #e5e7eb; color: var(--gray-600); transition: all var(--transition);
    }
    .palette-btn.answered { background: #86efac; color: #166534; border-color: #4ade80; }
    .palette-btn.visited { background: #fca5a5; color: #991b1b; border-color: #f87171; }
    .palette-btn.current { box-shadow: 0 0 0 3px var(--primary); }
    .mobile-palette-toggle { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); color: #fff; padding: 10px; text-align: center; font-weight: 700; cursor: pointer; z-index: 200; border: none; }
    .mobile-palette-drawer {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #fff; z-index: 199; max-height: 55vh;
      overflow-y: auto; padding: 14px; border-top: 2px solid var(--gray-200); box-shadow: 0 -4px 16px rgba(0,0,0,.15);
      border-radius: 16px 16px 0 0; transform: translateY(100%); transition: transform 0.3s;
    }
    .mobile-palette-drawer.open { transform: translateY(0); }
    .drawer-overlay { display: none; position: fixed; inset:0; background: rgba(0,0,0,.4); z-index: 198; }
    .drawer-overlay.open { display: block; }
    .results-container {
      display: none; max-width: 800px; margin: 30px auto; background: #fff; border-radius: var(--radius);
      padding: 24px; box-shadow: var(--shadow); text-align: center;
    }
    .results-container.active { display: block; }
    .results-score { font-size: 48px; font-weight: 800; color: var(--primary); }
    .subject-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
    .subject-table th, .subject-table td { padding: 8px; border: 1px solid var(--gray-200); text-align: center; }
    .subject-table th { background: var(--gray-100); }
    .detailed-analysis { text-align: left; margin-top: 20px; }
    .analysis-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--gray-100); font-size: 12px; }
    @media (max-width: 768px) {
      .palette-sidebar { display: none; }
      .question-panel { border-right: none; padding: 14px 10px; }
      .mobile-palette-toggle { display: block; }
      .mobile-palette-drawer { display: block; }
    }
  </style>
</head>
<body>
  <header class="header" id="header">
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="user-avatar" id="avatar">?</div>
      <span id="usernameDisplay" style="font-weight:600;">Candidate</span>
    </div>
    <div style="text-align:center;">
      <div style="font-weight:700;">COMEDK 2025‑s2</div>
      <div class="timer-box" id="timerBox">03:00:00</div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitTest()">Submit Test</button>
  </header>
  <div class="subject-tabs" id="subjectTabs">
    <button class="subject-tab active" data-subject="physics" onclick="switchSubject('physics')">Physics <span class="count" id="physicsCount">(0/60)</span></button>
    <button class="subject-tab" data-subject="chemistry" onclick="switchSubject('chemistry')">Chemistry <span class="count" id="chemistryCount">(0/60)</span></button>
    <button class="subject-tab" data-subject="math" onclick="switchSubject('math')">Mathematics <span class="count" id="mathCount">(0/60)</span></button>
  </div>
  <div class="main-container" id="mainContainer">
    <div class="question-panel" id="questionPanel">
      <div class="q-header"><span class="q-number" id="qNumber"></span><span class="q-subject-badge" id="qSubjectBadge"></span></div>
      <div class="q-text" id="qText"></div>
      <div id="qImageContainer"></div>
      <div class="options-list" id="optionsList"></div>
      <div class="action-buttons">
        <button class="btn-action btn-save-next" onclick="saveAndNext()">💾 Save & Next</button>
        <button class="btn-action btn-clear" onclick="clearResponse()">🧹 Clear</button>
        <button class="btn-action btn-prev" onclick="goToPrev()">⬅ Previous</button>
      </div>
    </div>
    <div class="palette-sidebar" id="paletteSidebar">
      <div style="font-weight:700; margin-bottom:6px;">Question Palette</div>
      <div class="palette-grid" id="paletteGrid"></div>
      <div style="display:flex; gap:8px; font-size:11px; margin-top:8px;">
        <span><span style="background:#e5e7eb; display:inline-block; width:12px; height:12px;"></span> Not visited</span>
        <span><span style="background:#fca5a5; display:inline-block; width:12px; height:12px;"></span> Visited</span>
        <span><span style="background:#86efac; display:inline-block; width:12px; height:12px;"></span> Answered</span>
      </div>
    </div>
  </div>
  <button class="mobile-palette-toggle" id="mobileToggle" onclick="toggleMobilePalette()">📋 Questions</button>
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMobilePalette()"></div>
  <div class="mobile-palette-drawer" id="mobilePaletteDrawer">
    <div style="font-weight:700; margin-bottom:8px;">Question Palette</div>
    <div class="palette-grid" id="mobilePaletteGrid"></div>
  </div>
  <div class="results-container" id="resultsContainer">
    <h2>Test Completed!</h2>
    <div class="results-score" id="resultsScore">0 / 180</div>
    <div style="display:flex; gap:16px; justify-content:center; margin:12px 0;">
      <div><span style="color:#16a34a; font-weight:700;" id="correctCount">0</span> Correct</div>
      <div><span style="color:#dc2626; font-weight:700;" id="incorrectCount">0</span> Wrong</div>
      <div><span style="color:#6b7280; font-weight:700;" id="unattemptedCount">0</span> Unattempted</div>
    </div>
    <div id="nameInputRow" style="margin:10px 0;">
      <input id="nameInput" placeholder="Enter your name" maxlength="40" style="padding:6px 10px; border-radius:4px; border:1px solid #ccc;">
      <button onclick="saveName()" style="padding:6px 16px; background:var(--primary); color:#fff; border:none; border-radius:4px; cursor:pointer;">Save & Submit Score</button>
    </div>
    <table class="subject-table">
      <thead><tr><th>Subject</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Unattempted</th></tr></thead>
      <tbody id="subjectTableBody"></tbody>
    </table>
    <div class="detailed-analysis" id="detailedAnalysis"></div>
    <button onclick="retakeTest()" style="padding:8px 20px; background:var(--primary); color:#fff; border:none; border-radius:4px; cursor:pointer; margin-top:10px;">🔄 Retake Test</button>
  </div>

  <script>
    // ========== GLOBAL ERROR HANDLING ==========
    window.addEventListener('error', (e) => { console.warn('Global error:', e.message); safeRender(); });
    window.addEventListener('unhandledrejection', (e) => { console.warn('Rejection:', e.reason); safeRender(); });
    function safeRun(fn, fallback) { try { return fn(); } catch(e) { console.error(e); return typeof fallback==='function'?fallback():fallback; } }

    // ========== ALL 180 QUESTIONS (extracted from provided PDF) ==========
    const allQuestions = { physics: [], chemistry: [], math: [] };
    function addQ(sub, id, text, options, answer, svg=null) {
      allQuestions[sub].push({ id, text, options, answer, imageSvg:svg, subject:sub, subjectLabel:sub.toUpperCase() });
    }

    // ---------- PHYSICS (60 questions) ----------
    addQ('physics',1,'A circular coil of area \\(2\\sqrt{2}\\,\\text{cm}^2\\) and resistance \\(2\\,\\Omega\\) is arranged vertically in the east‑west direction. A uniform magnetic field \\(0.2\\,\\text{T}\\) is set up across the plane in the north‑east direction. The magnetic field is removed at a steady rate in \\(0.4\\,\\text{s}\\). Current developed in the coil?',
      ['\\(0.5\\times10^{-3}\\,\\text{A}\\)','\\(0.5\\times10^{-4}\\,\\text{A}\\)','\\(1\\times10^{-4}\\,\\text{A}\\)','\\(0.5\\times10^{-5}\\,\\text{A}\\)'],1,
      `<svg viewBox="0 0 200 120" width="200" height="120"><rect width="200" height="120" fill="#f9fafb" rx="8"/><circle cx="100" cy="60" r="40" fill="none" stroke="#2563eb" stroke-width="2"/><text x="100" y="55" text-anchor="middle" font-size="12" fill="#1f2937">Coil</text><line x1="100" y1="20" x2="100" y2="15" stroke="#2563eb"/></svg>`);

    addQ('physics',2,'A car starts from rest, accelerates at rate \\(f\\) through distance \\(S\\), continues at constant speed for time \\(t\\), then decelerates at \\(\\frac{f}{2}\\) to rest. Total distance \\(5S\\). Then:',
      ['\\(S=\\frac14 ft^2\\)','\\(S=\\frac12 ft^2\\)','\\(S=4ft^2\\)','\\(S=2ft^2\\)'],1);

    addQ('physics',3,'Particle X (charge \\(+Q\\)) moves in circular path of radius \\(R\\) around particle Y (charge \\(-Q\\)) with frequency \\(\\nu\\). Mass \\(m\\) of X is:',
      ['\\(M=\\frac{Q^2}{16\\pi^3\\epsilon_0 R^3\\nu^2}\\)','\\(M=\\frac{Q^2}{16\\pi^2\\epsilon_0 R\\nu^2}\\)','\\(M=\\frac{Q^2}{16\\pi^2\\epsilon_0 R^3\\nu^2}\\)','\\(M=\\frac{Q^2}{16\\pi^3\\epsilon_0 R^2\\nu^2}\\)'],0);

    addQ('physics',4,'Three ideal diodes and resistors connected as shown. Find current through \\(10\\,\\Omega\\) resistor.',
      ['1 A','2 A','0.5 A','0.1 A'],2,
      `<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#f9fafb"/><line x1="20" y1="60" x2="60" y2="60" stroke="#1f2937" stroke-width="2"/><polygon points="60,50 70,60 60,70" fill="#2563eb"/><line x1="70" y1="60" x2="100" y2="60" stroke="#1f2937" stroke-width="2"/><text x="50" y="80" font-size="10">10Ω</text></svg>`);

    addQ('physics',5,'A coin on a rotating disc (angular velocity \\(\\omega\\)), coefficient of friction \\(\\mu\\). Maximum distance from centre without slipping:',
      ['\\(\\sqrt{\\frac{\\mu}{\\omega^2}}\\)','\\(\\frac{\\mu g}{\\omega^2}\\)','\\(\\sqrt{\\frac{\\mu g}{\\omega^2}}\\)','\\(\\frac{\\mu g}{\\omega}\\)'],1);

    addQ('physics',6,'A beam of light parallel to principal axis passes first through concave lens (f = 0.5 m) then convex lens (f = 1.75 m) placed 1.25 m apart. Which statement is true?',
      ['Emergent beam focuses at 1.75 m','Emergent beam focuses at 1.25 m','Emergent beam is parallel to axis','Emergent beam focuses at 0.75 m'],2);

    addQ('physics',7,'Frequency \\(\\nu\\) of electron in Bohr’s first orbit (radius \\(r\\)) of hydrogen:',
      ['\\(\\nu=\\frac{e^2}{4\\pi\\epsilon_0 h r}\\)','\\(\\nu=\\frac{e^2}{2\\pi\\epsilon_0 h r^2}\\)','\\(\\nu=\\frac{e^2}{4\\pi\\epsilon_0 h r^2}\\)','\\(\\nu=\\frac{e^2}{2\\pi\\epsilon_0 h r}\\)'],0);

    addQ('physics',8,'Water emerges vertically downward from tap (initial speed 1.0 m/s, area 1 cm²). Cross‑sectional area 15 cm below (g=10 m/s²):',
      ['0.5 cm²','5 cm²','0.2 cm²','0.05 cm²'],0);

    addQ('physics',9,'(Repeat of Q7) Frequency of electron in first Bohr orbit:',
      ['\\(\\frac{e^2}{4\\pi\\epsilon_0 h r}\\)','\\(\\frac{e^2}{2\\pi\\epsilon_0 h r^2}\\)','\\(\\frac{e^2}{4\\pi\\epsilon_0 h r^2}\\)','\\(\\frac{e^2}{2\\pi\\epsilon_0 h r}\\)'],0);

    addQ('physics',10,'Water tap (initial speed 1 m/s, area 1 cm²). Area 15 cm below:',
      ['0.5 cm²','5 m²','0.2 cm²','0.05 m²'],0);

    addQ('physics',11,'Bullet of momentum p embeds at centre of door (1.0 m wide, 12 kg). Angular speed:',
      ['\\(\\frac{p}{4}\\)','\\(\\frac{3p}{5}\\)','\\(\\frac{p}{8}\\)','\\(\\frac{3}{8p}\\)'],2);

    addQ('physics',12,'Wind mill converts fixed fraction of wind energy. Electrical power P ∝ v^?',
      ['\\(v^3\\)','\\(v^2\\)','\\(v^{3/2}\\)','\\(v^{5/2}\\)'],0);

    addQ('physics',13,'Universal gravitational constant first determined by:',
      ['Newton','Cavendish','Einstein','Galileo'],1);

    addQ('physics',14,'Primary coil current 2 A, flux linkage 2000×10⁻⁶ Wb. di/dt = 0.2 A/s. Induced emf in secondary:',
      ['2×10⁻⁴ V','4×10⁻⁴ V','1×10⁻⁴ V','8×10⁻⁴ V'],0);

    addQ('physics',15,'300 MW for 0.5 h. Mass converted to energy:',
      ['6×10⁻² kg','3×10⁻⁶ kg','6×10⁻³ kg','6×10⁻⁶ kg'],3);

    addQ('physics',16,'Electric field vs distance graph (increases linearly to R, then 1/r²). Correct statement:',
      ['Conducting ring','Non‑conducting solid sphere','Conducting solid sphere','Non‑conducting cylinder'],1,
      `<svg viewBox="0 0 200 100"><rect width="200" height="100" fill="#f9fafb"/><polyline points="20,80 80,20 120,60 180,60" fill="none" stroke="#2563eb" stroke-width="2"/><text x="40" y="95" font-size="10">R</text></svg>`);

    addQ('physics',17,'Nylon rope (dia 10 mm, length 1 m). Monkey weight 100 N. Change in diameter (Y, σ):',
      ['\\(\\frac{4000\\sigma}{\\pi Y}\\)','\\(\\frac{400\\sigma}{\\pi Y}\\)','\\(\\frac{40000\\sigma}{\\pi Y}\\)','\\(\\frac{40000\\pi}{\\sigma Y}\\)'],2);

    addQ('physics',18,'Planets P, Q same density ρ, areas A and 4A. R has mass M_P+M_Q. Escape velocities:',
      ['\\(V_R > V_Q > V_P\\)','\\(V_R < V_Q < V_P\\)','\\(V_R = V_Q > V_P\\)','\\(V_R > V_Q = V_P\\)'],0);

    addQ('physics',19,'Dimensional formula of electric flux:',
      ['\\([M^1 L^3 T^{-2} A^{-1}]\\)','\\([M^2 L^3 T^{-3} A^{-1}]\\)','\\([M^1 L^2 T^{-3} A^{-1}]\\)','\\([M^1 L^3 T^{-3} A^{-1}]\\)'],3);

    addQ('physics',20,'Transformer primary 220 V, Np:Ns=5:1, output resistance 11 Ω. Output power:',
      ['1760 W','1100 W','176 W','100 W'],2);

    addQ('physics',21,'Phosphor bronze suspension in galvanometer because:',
      ['large restoring torque','more flexible','less tensile strength','small restoring torque per twist'],3);

    addQ('physics',22,'Fusion more energetic than fission because:',
      ['chain reaction','high temperature','energy per unit mass larger','lighter nuclei combine'],2);

    addQ('physics',23,'Unit joule/tesla belongs to:',
      ['magnetic permeability','magnetic induction','magnetic susceptibility','magnetic dipole moment'],3);

    addQ('physics',24,'Two charged particles (same m,q), radii ratio 1:4. Velocity ratio:',
      ['4:1','2:1','1:2','1:4'],3);

    addQ('physics',25,'Heat to raise 4 mol monoatomic gas from 273°C to 473°C at constant volume:',
      ['1600 R','600 R','1200 R','400 R'],2);

    addQ('physics',26,'Rods length ratio 1:2, conductivities K₁,K₂, equal heat flow. Area ratio A_A:A_B:',
      ['\\(\\frac{2K_2}{K_1}\\)','\\(\\frac{K_2}{4K_1}\\)','\\(\\frac{K_2}{K_1}\\)','\\(\\frac{K_2}{2K_1}\\)'],3);

    addQ('physics',27,'Square of resultant of two equal E vectors = 3 times product. Angle:',
      ['π/5','π/6','π/8','π/3'],3);

    addQ('physics',28,'Oxygen nucleus (8p+8n). Mass defect (amu): [mp=1.00727, mn=1.00866, m=15.99053]',
      ['0.12691','0.13692','0.13691','0.12961'],2);

    addQ('physics',29,'Monoatomic gas adiabatic expansion L→2L. T₁/T₂:',
      ['\\(2^{3/2}\\)','\\(2^{2/3}\\)','\\((1/2)^{2/3}\\)','\\((1/2)^{3/2}\\)'],1);

    addQ('physics',30,'Spring cut into 4 equal parts, same mass. Fractional change in period:',
      ['1/8','1/4','1/2','1/6'],2);

    addQ('physics',31,'Ten cells (1.5V, 1Ω) in series, three reversed. Effective internal resistance & emf:',
      ['0.1Ω, 1.5V','6Ω, 10V','10Ω, 6V','10Ω, 15V'],2);

    addQ('physics',32,'Galvanometer 50Ω, shunt 10Ω → ammeter; same 10Ω in series → voltmeter. Resistance ratio ammeter:voltmeter:',
      ['5:1','5:36','5:6','1:5'],1);

    addQ('physics',33,'Bullet fired at 30° and 60°. Ratios of heights and ranges:',
      ['1:1,1:1','1:3,1:1','3:1,1:1','1:1,3:1'],1);

    addQ('physics',34,'Diamond is insulator because:',
      ['large forbidden gap','overlapping bands','weak covalent bonds','low refractive index'],0);

    addQ('physics',35,'Light from glass (3/2) to water (4/3). Critical angle:',
      ['\\(\\sin^{-1}(9/8)\\)','\\(\\sin^{-1}(8/9)\\)','\\(\\sin^{-1}(2/3)\\)','\\(\\sin^{-1}(1/2)\\)'],1);

    addQ('physics',36,'Ideal gas PT²=constant. Volume expansion coefficient:',
      ['2/T','3T','3/T','1/T'],2);

    addQ('physics',37,'Compound microscope f_o=1cm, f_e=10cm, tube 25cm, final image at infinity. Magnifying power:',
      ['70','35','7.0','3.5'],1);

    addQ('physics',38,'Earth radius shrinks 2%, mass same. g would:',
      ['decrease 4%','increase 1%','increase 4%','increase 2%'],2);

    addQ('physics',39,'Resistance √3 Ω. Angle of V‑I graph with voltage axis:',

    addQ('math',152,'Transformation to linear du/dx+P(x)u=Q(x) for dz/dx+(z/x)log z=(z/x²)(log z)²:',
      ['u=(log z)⁻¹','u=log x','u=(log z)²','u=e^x'],0);
    addQ('math',153,'Least area of circumcircle of right triangle area 9/π:',
      ['9','π','9π','4.5'],0);
    addQ('math',154,'lim_{θ→π/2} (1‑sinθ)/((π/2‑θ)cosθ) =',
      ['-1/2','-1','1','1/2'],3);
    addQ('math',155,'P(A‑B)=1/5, P(A)=3/5, then P(B|A):',
      ['2/3','1/2','3/5','2/5'],0);
    addQ('math',156,'∫ x/((x‑1)(x‑2)²) dx = a log|(x‑1)/(x‑2)| + b/(x‑2) + c. a,b:',
      ['a=-1,b=2','a=-1,b=-2','a=1,b=-2','a=1,b=2'],2);
    addQ('math',157,'f(x)=x²‑4x+5, x≥2. Range:',
      ['[1,∞)','[5,∞)','(0,∞)','[2,∞)'],0);
    addQ('math',158,'Feasible corners (0,3),(1,1),(3,0), Z=px+qy. Min at (3,0) & (1,1) if:',
      ['p=3q','3p=q','p=q/2','p=2q'],2);
    addQ('math',159,'Three bags, P(bag i)=i/6. White ball from Bag III:',
      ['9/11','2/11','0','1/11'],0);
    addQ('math',160,'Line AB through P(-4,3), intercepts divided 5:3 internally. x‑intercept:',
      ['-32/3','32/3','-24/5','24/5'],0);
    addQ('math',161,'Q(1,0,1) image of P(a,b,c) in line (x+1)/2=(y‑3)/‑2=z/‑1. a+b+c:',
      ['4','2','0','-2'],2);
    addQ('math',162,'Cost equations → AX=B. |5A⁻¹|:',
      ['5','125','1','25'],0);
    addQ('math',163,'Min of 5ˣ+5¹⁻ˣ:',
      ['2√5','0','1','√5'],0);
    addQ('math',164,'Triangle A(1,2), medians x+y=5, x=4. Equation AB:',
      ['2x‑3y+4=0','2x+3y=8','3x‑2y+1=0','3x+2y=5'],1);
    addQ('math',165,'Circle through foci of x²/16+y²/9=1, centre (0,3). Diameter:',
      ['7','2√12','8','4'],2);
    addQ('math',166,'A={1,2,4}, B={2,4,5}, C={2,5}. (A‑B)∩(B‑C):',
      ['{2,4,5}','{1,2,4,5}','∅','{4,5}'],2);
    addQ('math',167,'∫ dx/(x√(4x²‑9)) =',
      ['(2/3)log|(x‑3)/(x+3)|+c','(4/3)tan⁻¹(√(4x²‑9)/3)+c','(2/3)log|(x+3)/(x‑3)|+c','(1/3)tan⁻¹(√(4x²‑9)/3)+c'],3);
    addQ('math',168,'f(x)=x²‑x+1 on (0,1):',
      ['strictly decreasing','increasing','neither','decreasing'],2);
    addQ('math',169,'|a⃗|=2√2, |b⃗|=3, angle π/4. Diagonals of parallelogram with sides 2a⃗‑3b⃗, a⃗+b⃗. Product of lengths:',
      ['12√26','6','60√2','18√260'],0);
    addQ('math',170,'tan⁻¹(tan(7π/6)) =',
      ['π/6','π/3','5π/6','7π/6'],0);
    addQ('math',171,'Cofactor a₂₁ of determinant |1 4 4; -3 5 9; 2 1 2|:',
      ['5','-24','-4','-5'],2);
    addQ('math',172,'cos θ = x + 1/x. True:',
      ['θ obtuse','no possible θ','θ right','θ acute'],1);
    addQ('math',173,'y dy/dx + x = 0 represents:',
      ['ellipses','parabolas','circles','hyperbolas'],2);
    addQ('math',174,'Inequality from graph: x ∈ (-∞, 11/2],(please ignore this question)',
      ['x∈(11/2,∞)','x∈[11/2,∞)','x∈(-∞,11/2)','x∈(-∞,11/2]'],3);
    addQ('math',175,'P(1,3,-7), Q(5,-2,4). Cosine of angle between PQ⃗ and y‑axis:',
      ['4/√162','5/√162','-5/√162','-4/√162'],2);
    addQ('math',176,'Domain of f(x)=√(sin⁻¹(2x)+π/6):',
      ['[-1/4,1/2]','[-1/2,1/2]','[-1/4,1/4]','(-1/2,1/9)'],0);
    addQ('math',177,'Shortest distance between lines r⃗=(8+3λ)î‑(9+16λ)ĵ+(10+7λ)k̂ and r⃗=15î+29ĵ+5k̂+μ(3î+8ĵ‑5k̂):',
      ['3','7','14','2'],2);
    addQ('math',178,'lim_{x→1} ((√x‑1)(2x‑3))/(2x²+x‑3):',
      ['1/10','0','1','-1/10'],3);
    addQ('math',179,'f(x)=x²‑4x+5, x≥2. Range:',
      ['[1,∞)','[5,∞)','(-∞,1]','(-∞,∞)'],0);
    addQ('math',180,'lim_{x→1} ((√x‑1)(2x‑3))/(2x²+x‑3):',
      ['1/10','0','1','-1/10'],3);

    // ========== FLATTEN ==========
    const questions = [...allQuestions.physics, ...allQuestions.chemistry, ...allQuestions.math];
    const TOTAL = questions.length;

    // ========== STATE ==========
    let currentIndex = 0;
    let userAnswers = new Array(TOTAL).fill(null);
    let visited = new Array(TOTAL).fill(false);
    let timeLeft = 3 * 3600;
    let timer = null;
    let submitted = false;
    let currentSubject = 'physics';

    // ========== DOM HELPERS ==========
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    // ========== CORE FUNCTIONS ==========
    function updateTimerDisplay() {
      const h = Math.floor(timeLeft / 3600), m = Math.floor((timeLeft % 3600) / 60), s = timeLeft % 60;
      $('#timerBox').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if (timeLeft < 300) $('#timerBox').classList.add('warning');
    }
    function startTimer() {
      updateTimerDisplay();
      timer = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) { clearInterval(timer); submitTest(); }
      }, 1000);
    }
    function switchSubject(sub) {
      currentSubject = sub;
      $$('.subject-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.subject-tab[data-subject="${sub}"]`)?.classList.add('active');
      const first = questions.findIndex(q => q.subject === sub);
      if (first >= 0 && questions[currentIndex]?.subject !== sub) {
        currentIndex = first;
        visited[currentIndex] = true;
      }
      safeRender();
      updateCounts();
    }
    function updateCounts() {
      ['physics','chemistry','math'].forEach(sub => {
        const total = allQuestions[sub].length;
        const answered = allQuestions[sub].filter(q => userAnswers[q.id-1] !== null).length;
        const el = document.getElementById(`${sub}Count`);
        if (el) el.textContent = `(${answered}/${total})`;
      });
    }
    function renderQuestion() {
      const q = questions[currentIndex];
      if (!q) return;
      $('#qNumber').textContent = `Question ${q.id} of ${TOTAL}`;
      $('#qSubjectBadge').textContent = q.subjectLabel;
      $('#qText').innerHTML = q.text;
      $('#qImageContainer').innerHTML = q.imageSvg || '';
      const list = $('#optionsList');
      list.innerHTML = '';
      const labels = ['A','B','C','D'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('div');
        btn.className = 'option-btn' + (userAnswers[currentIndex] === i ? ' selected' : '');
        btn.innerHTML = `<span class="option-label">${labels[i]}</span><span>${opt}</span>`;
        btn.onclick = () => selectOption(i);
        list.appendChild(btn);
      });
      // MathJax re‑render
      if (window.MathJax) MathJax.typesetPromise?.();
    }
    function selectOption(idx) {
      if (submitted) return;
      userAnswers[currentIndex] = idx;
      visited[currentIndex] = true;
      renderQuestion();
      renderPalette();
      updateCounts();
    }
    function saveAndNext() {
      if (submitted) return;
      visited[currentIndex] = true;
      if (currentIndex < TOTAL-1) {
        currentIndex++;
        visited[currentIndex] = true;
        currentSubject = questions[currentIndex].subject;
        $$('.subject-tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.subject-tab[data-subject="${currentSubject}"]`)?.classList.add('active');
      }
      safeRender();
      updateCounts();
    }
    function clearResponse() {
      if (submitted) return;
      userAnswers[currentIndex] = null;
      renderQuestion();
      renderPalette();
      updateCounts();
    }
    function goToPrev() {
      if (submitted || currentIndex === 0) return;
      currentIndex--;
      visited[currentIndex] = true;
      currentSubject = questions[currentIndex].subject;
      $$('.subject-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.subject-tab[data-subject="${currentSubject}"]`)?.classList.add('active');
      safeRender();
      updateCounts();
    }
    function goToQuestion(idx) {
      if (submitted || idx < 0 || idx >= TOTAL) return;
      currentIndex = idx;
      visited[idx] = true;
      currentSubject = questions[idx].subject;
      $$('.subject-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.subject-tab[data-subject="${currentSubject}"]`)?.classList.add('active');
      safeRender();
      updateCounts();
      if (window.innerWidth <= 768) toggleMobilePalette(true);
    }
    function renderPalette() {
      const renderGrid = (containerId) => {
        const grid = document.getElementById(containerId);
        if (!grid) return;
        grid.innerHTML = '';
        for (let i = 0; i < TOTAL; i++) {
          const btn = document.createElement('button');
          btn.className = 'palette-btn';
          if (userAnswers[i] !== null) btn.classList.add('answered');
          else if (visited[i]) btn.classList.add('visited');
          if (i === currentIndex) btn.classList.add('current');
          btn.textContent = questions[i].id;
          btn.onclick = () => goToQuestion(i);
          grid.appendChild(btn);
        }
      };
      renderGrid('paletteGrid');
      renderGrid('mobilePaletteGrid');
    }
    function toggleMobilePalette(forceClose = false) {
      const drawer = $('#mobilePaletteDrawer'), overlay = $('#drawerOverlay');
      if (forceClose) { drawer.classList.remove('open'); overlay.classList.remove('open'); return; }
      drawer.classList.toggle('open');
      overlay.classList.toggle('open');
    }
    function safeRender() {
      safeRun(() => { renderQuestion(); renderPalette(); updateCounts(); });
    }
    function submitTest() {
      if (submitted) return;
      if (!confirm('Submit the test? This cannot be undone.')) return;
      submitted = true;
      clearInterval(timer);
      $('#submitBtn').disabled = true;

      let correct = 0, wrong = 0, unattempted = 0;
      const stats = { physics:{correct:0,wrong:0,unattempted:0,score:0}, chemistry:{correct:0,wrong:0,unattempted:0,score:0}, math:{correct:0,wrong:0,unattempted:0,score:0} };
      const analysis = [];
      questions.forEach((q, idx) => {
        const ua = userAnswers[idx];
        const isCorrect = ua === q.answer;
        if (ua === null) {
          unattempted++; stats[q.subject].unattempted++;
          analysis.push(`<div class="analysis-row"><span>Q${q.id} (${q.subjectLabel})</span><span>❓ Unattempted</span><span>✔ ${q.options[q.answer]}</span></div>`);
        } else if (isCorrect) {
          correct++; stats[q.subject].correct++; stats[q.subject].score++;
          analysis.push(`<div class="analysis-row"><span>Q${q.id} ✅</span><span>Your: ${q.options[ua]}</span><span>✔ Correct</span></div>`);
        } else {
          wrong++; stats[q.subject].wrong++;
          analysis.push(`<div class="analysis-row"><span>Q${q.id} ❌</span><span>Your: ${q.options[ua]}</span><span>✔ ${q.options[q.answer]}</span></div>`);
        }
      });

      $('#mainContainer').style.display = 'none';
      $('#subjectTabs').style.display = 'none';
      $('#mobileToggle').style.display = 'none';
      $('#resultsContainer').classList.add('active');
      $('#resultsScore').textContent = `${correct} / ${TOTAL}`;
      $('#correctCount').textContent = correct;
      $('#incorrectCount').textContent = wrong;
      $('#unattemptedCount').textContent = unattempted;

      let tableHtml = '';
      for (const [sub, name] of [['physics','Physics'],['chemistry','Chemistry'],['math','Mathematics']]) {
        const s = stats[sub];
        tableHtml += `<tr><td>${name}</td><td>${s.score}/60</td><td>${s.correct}</td><td>${s.wrong}</td><td>${s.unattempted}</td></tr>`;
      }
      $('#subjectTableBody').innerHTML = tableHtml;
      $('#detailedAnalysis').innerHTML = `<h3>Detailed Analysis</h3>${analysis.join('')}`;

      const best = parseInt(localStorage.getItem('comedk_best')||'0');
      if (correct > best) localStorage.setItem('comedk_best', correct);
    }
    function retakeTest() {
      userAnswers = new Array(TOTAL).fill(null);
      visited = new Array(TOTAL).fill(false);
      timeLeft = 3*3600;
      submitted = false;
      currentIndex = 0;
      currentSubject = 'physics';
      visited[0] = true;
      $('#timerBox').classList.remove('warning');
      $('#resultsContainer').classList.remove('active');
      $('#mainContainer').style.display = 'flex';
      $('#subjectTabs').style.display = 'flex';
      $('#mobileToggle').style.display = 'block';
      $('#submitBtn').disabled = false;
      $$('.subject-tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.subject-tab[data-subject="physics"]')?.classList.add('active');
      clearInterval(timer);
      startTimer();
      safeRender();
      window.scrollTo(0,0);
    }
    function saveName() {
      const name = $('#nameInput').value.trim();
      if (!name) return alert('Enter name');
      localStorage.setItem('comedk_username', name);
      $('#usernameDisplay').textContent = name;
      $('#avatar').textContent = name.charAt(0).toUpperCase();
      $('#nameInputRow').style.display = 'none';
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (submitted) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); saveAndNext(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); goToPrev(); }
      else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); clearResponse(); }
      else if (['1','2','3','4'].includes(e.key)) { e.preventDefault(); selectOption(parseInt(e.key)-1); }
    });

    // Init
    window.addEventListener('load', () => {
      const savedName = localStorage.getItem('comedk_username');
      if (savedName) {
        $('#usernameDisplay').textContent = savedName;
        $('#avatar').textContent = savedName.charAt(0).toUpperCase();
        $('#nameInputRow').style.display = 'none';
      }
      visited[0] = true;
      safeRender();
      startTimer();
      // Automatic button recovery
      setInterval(() => {
        if (!submitted && $('#submitBtn').disabled) $('#submitBtn').disabled = false;
      }, 2000);
    });
  </script>
</body>
</html>
