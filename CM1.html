<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK Mock Test - CBT</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #fff;
            --text: #1a1a2e;
            --border: #dde1e7;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --correct: #059669;
            --incorrect: #dc2626;
            --neutral: #6b7280;
            --shadow: 0 1px 3px rgba(0, 0, 0, .08);
            --radius: 10px;
            --transition: 0.2s ease;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a2e;
            white-space: nowrap;
        }
        .header-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: .9rem;
        }
        .header-info .timer {
            background: #1a1a2e;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 1px;
        }
        .header-info .badge {
            background: #eef2ff;
            color: #2563eb;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: .85rem;
        }
        nav.tabs {
            display: flex;
            gap: 2px;
            background: #e5e7eb;
            border-radius: 25px;
            padding: 4px;
            margin: 0 10px;
            flex-wrap: wrap;
        }
        nav.tabs button {
            padding: 10px 22px;
            border: none;
            background: transparent;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 600;
            font-size: .9rem;
            color: #4b5563;
            transition: var(--transition);
            white-space: nowrap;
        }
        nav.tabs button.active {
            background: #fff;
            color: #1a1a2e;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
        }
        nav.tabs button:hover:not(.active) {
            color: #1a1a2e;
            background: #d1d5db;
        }
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 16px 60px;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .question-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }
        .question-card:hover {
            box-shadow: 0 3px 10px rgba(0, 0, 0, .1);
        }
        .question-card.review-correct {
            border-left: 5px solid var(--correct);
            background: #f0fdf6;
        }
        .question-card.review-incorrect {
            border-left: 5px solid var(--incorrect);
            background: #fef2f2;
        }
        .question-card.review-unanswered {
            border-left: 5px solid #f59e0b;
            background: #fffdf5;
        }
        .q-num {
            font-weight: 700;
            color: #2563eb;
            font-size: .85rem;
            margin-bottom: 6px;
            letter-spacing: .5px;
        }
        .q-text {
            font-weight: 500;
            margin-bottom: 12px;
            font-size: .95rem;
        }
        .q-text svg {
            display: block;
            max-width: 100%;
            margin: 8px 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .options label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: .9rem;
            background: #fafbfc;
        }
        .options label:hover {
            background: #eef2ff;
            border-color: #2563eb;
        }
        .options input[type="radio"] {
            accent-color: #2563eb;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .review-badge {
            display: none;
            position: absolute;
            top: 14px;
            right: 16px;
            font-weight: 700;
            font-size: .8rem;
            padding: 4px 10px;
            border-radius: 12px;
        }
        .review-correct .review-badge.correct-badge {
            display: inline;
            background: #d1fae5;
            color: #065f46;
        }
        .review-incorrect .review-badge.incorrect-badge {
            display: inline;
            background: #fee2e2;
            color: #991b1b;
        }
        .review-unanswered .review-badge.unanswered-badge {
            display: inline;
            background: #fef3c7;
            color: #92400e;
        }
        .review-answer {
            display: none;
            margin-top: 8px;
            font-size: .85rem;
            font-weight: 600;
        }
        .review-correct .review-answer,
        .review-incorrect .review-answer,
        .review-unanswered .review-answer {
            display: block;
        }
        .review-correct .review-answer {
            color: #065f46;
        }
        .review-incorrect .review-answer {
            color: #991b1b;
        }
        .review-unanswered .review-answer {
            color: #92400e;
        }
        .btn-submit {
            display: block;
            margin: 20px auto;
            padding: 14px 40px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: .5px;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(37, 99, 235, .3);
        }
        .btn-submit:hover {
            background: #1d4ed8;
            box-shadow: 0 6px 18px rgba(37, 99, 235, .4);
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .results-panel {
            display: none;
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            margin: 16px 0;
            text-align: center;
            box-shadow: var(--shadow);
            border: 2px solid #2563eb;
        }
        .results-panel.show {
            display: block;
        }
        .results-panel h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }
        .results-panel .score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2563eb;
        }
        .results-panel .breakdown {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 12px;
            font-size: .9rem;
        }
        .results-panel .breakdown span {
            padding: 6px 14px;
            border-radius: 16px;
            font-weight: 600;
        }
        .breakdown .correct-count {
            background: #d1fae5;
            color: #065f46;
        }
        .breakdown .incorrect-count {
            background: #fee2e2;
            color: #991b1b;
        }
        .breakdown .unanswered-count {
            background: #fef3c7;
            color: #92400e;
        }
        .btn-reset {
            display: none;
            margin: 10px auto 30px;
            padding: 10px 28px;
            background: #fff;
            color: #2563eb;
            border: 2px solid #2563eb;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-reset.show {
            display: block;
        }
        .btn-reset:hover {
            background: #eef2ff;
        }
        .q-image-svg {
            max-width: 100%;
            height: auto;
            margin: 8px 0;
            background: #fafbfc;
            border-radius: 6px;
            padding: 4px;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            nav.tabs button {
                padding: 8px 14px;
                font-size: .8rem;
            }
            .question-card {
                padding: 12px 14px;
            }
            .q-text {
                font-size: .9rem;
            }
            .options label {
                font-size: .85rem;
                padding: 6px 10px;
            }
        }
        .scroll-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2563eb;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
            z-index: 99;
            transition: var(--transition);
        }
        .scroll-top:hover {
            background: #1d4ed8;
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <header>
        <h1>📝 COMEDK Mock Test</h1>
        <nav class="tabs" id="tabNav">
            <button class="active" data-section="physics">⚛ Physics (1–60)</button>
            <button data-section="chemistry">🧪 Chemistry (61–120)</button>
            <button data-section="mathematics">📐 Mathematics (121–180)</button>

        <div class="header-info">
            <span class="badge">180 Questions</span>
            <span class="timer" id="timer">00:00:00</span>
        </div>
    </header>

    <div class="container" id="mainContainer">

        <div class="section active" id="section-physics"></div>

        <div class="section" id="section-chemistry"></div>

        <div class="section" id="section-mathematics"></div>

        <button class="btn-submit" id="btnSubmit" onclick="submitTest()">✅ Submit & Review Answers</button>
        <button class="btn-reset" id="btnReset" onclick="resetTest()">🔄 Retake Test</button>
        <div class="results-panel" id="resultsPanel"></div>
    </div>

    <button class="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">↑</button>

    <script>
        // ─────────────────── DATA ───────────────────
        const answerKey = {
            physics: 'a b c b d b b b a a b b a c c c a a b b a a c a c c b b c b a c c d c b b d c d c b c b a b b c c a b d d c b b d a a d'.split(
                ' '),
            chemistry: 'a c b a c d a a b a b d a a a a d b b c c c a c d c b b b c a d a c b d c d a d a b c b d c b d a d b d c c b d c a b a b d a a d c a b d a c a b b a'.split(
                ' '),
            mathematics: 'b c b a b d c d c d a d a d a c b a a c b a c a c d b b d a d c b c b d c b c d a b b a c c a b c a c b c b d a c a b c b d b d b a c d b a d a c d a a c d a a a d c c a a'.split(

        // ─────────────────── QUESTIONS DATA ───────────────────
        // Physics Questions (1-60)
        const physicsQuestions = [
            { num: 1,
                text: 'Hydrogen atom from excited state comes to the ground state by emitting a photon of wavelength λ. If R is the Rydberg constant, then the principal quantum number n of the excited state is',
                opts: ['√(λR/(λR−1))', '√(λ/(λR−1))', '√(λR²/(λR−1))', '√(λ/(λ−1))'] },
            { num: 2,
                text: 'A car accelerates from rest at constant rate for first 10 s and covers a distance x. It covers a distance y in next 10 s at the same acceleration. Which of the following is true?',
                opts: ['x = 3y', 'y = 3x', 'x = y', 'y = 2x'] }, { num: 3,
                text: 'Tritium having a half-life of 12.5 yr undergoes β-decay. Fraction of sample remaining undecayed after 25 yr will be',
                opts: ['1/8', '1/2', '1/4', '1/16'] }, { num: 4,
                text: 'The period of oscillation of a simple pendulum is T = 2π√(L/g). Measured value of L is 20.0 cm known to 1 mm accuracy and time for 100 oscillations is 90 s using a wrist watch of 1 s resolution. The accuracy in determination of g is',

                text: 'The plot of the number N of decayed nuclei versus activity R of a radioactive sample is correctly depicted in which graph?',

                svg: '<svg viewBox="0 0 200 120" class="q-image-svg"><line x1="30" y1="90" x2="170" y2="20" stroke="#dc2626" stroke-width="2"/><text x="140" y="14" font-size="10">N</text><text x="175" y="95" font-size="10">R</text></svg>' },
            { num: 6,
                text: 'If F = 6πηᵃrᵇvᶜ, where F = viscous force, η = coefficient of viscosity, r = radius, v = terminal velocity. Values of a, b, c are',
                opts: ['a=1,b=2,c=1', 'a=1,b=1,c=1', 'a=2,b=1,c=1', 'a=2,b=1,c=2'] }, { num: 7,
                text: 'A body initially at rest at height R above earth\'s surface (radius R) falls freely. Its velocity on reaching the surface is',
                opts: ['√(2gR)', '√(gR)', '√(3gR/2)', '√(4gR)'] }, { num: 8,
                text: 'A sample of gas expands from V₁ to V₂. The work done is greatest when expansion is',
                opts: ['Adiabatic', 'Isobaric', 'Isothermal', 'Equal in all cases'] }, { num: 9,
                text: 'A particle executing SHM has max speed 30 cm/s and max acceleration 60 cm/s². The period is',
                opts: ['π s', 'π/2 s', '2π s', 'π/4 s'] }, { num: 10,
                text: 'I-V graph for a metallic wire at T₁ and T₂ is shown. It is concluded that',
                opts: ['T₁ > T₂', 'T₁ < T₂', 'T₁ = T₂', 'T₁ = 2T₂'],
                svg: '<svg viewBox="0 0 180 130" class="q-image-svg"><line x1="20" y1="110" x2="160" y2="20" stroke="#2563eb" stroke-width="2"/><line x1="20" y1="110" x2="160" y2="50" stroke="#dc2626" stroke-width="2"/><text x="150" y="14" font-size="10">I</text><text x="165" y="115" font-size="10">V</text><text x="90" y="40" fill="#2563eb" font-size="9">slope 1</text><text x="90" y="60" fill="#dc2626" font-size="9">slope 2</text></svg>' },
            { num: 11, text: 'In a simple pendulum, time period versus length is depicted by',
                opts: ['Straight line', 'Parabola (T² ∝ L)', 'Hyperbola', 'Exponential'], svg: '<svg viewBox="0 0 150 100" class="q-image-svg"><path d="M30 80 Q70 10 130 20" fill="none" stroke="#2563eb" stroke-width="2"/><text x="10" y="50" font-size="10">T</text><text x="100" y="95" font-size="10">L</text></svg>' },
            { num: 12, text: 'A carbon resistor of (47±4.7) kΩ colour code sequence will be',
                opts: ['Yellow-Green-Violet-Gold', 'Yellow-Violet-Orange-Silver', 'Violet-Yellow-Orange-Silver',
                    'Green-Orange-Violet-Gold'
                ] }, { num: 13,
                text: 'A load on a massless spring gives extension x cm. Cut into two unequal parts, larger part (60 cm) gives 7.5 cm extension, smaller gives 5.0 cm. Then',
                opts: ['x = 12.5 cm', 'x = 3.0 cm', 'Original length = 90 cm', 'Original length = 80 cm'] },
            { num: 14,
                text: 'Parallel plate air capacitor has C = 18 μF. Distance tripled, dielectric introduced → C = 72 μF. Dielectric constant is',
                opts: ['4', '9', '12', '2'] }, { num: 15,
                text: 'Metal block at atmospheric pressure 10⁵ N/m² placed in vacuum. Bulk modulus = 1.25×10¹¹ N/m². Fractional volume change is',
                opts: ['4×10⁻⁷', '2×10⁻⁷', '8×10⁻⁷', '1×10⁻⁷'] }, { num: 16,
                text: 'Three equipotential surfaces are shown. Which option correctly represents the corresponding field lines?',
                opts: ['Option (a)', 'Option (b)', 'Option (c) - perpendicular to surfaces', 'Option (d)'],
                svg: '<svg viewBox="0 0 180 80" class="q-image-svg"><ellipse cx="60" cy="40" rx="50" ry="20" fill="none" stroke="#333" stroke-width="1.5"/><ellipse cx="60" cy="40" rx="35" ry="13" fill="none" stroke="#333" stroke-width="1.5"/><ellipse cx="60" cy="40" rx="20" ry="7" fill="none" stroke="#333" stroke-width="1.5"/><line x1="60" y1="5" x2="60" y2="75" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4"/><line x1="30" y1="25" x2="90" y2="55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4"/><line x1="90" y1="25" x2="30" y2="55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4"/></svg>' },
            { num: 17,
                text: 'Hole at bottom of tank (water, ρ=1000 kg/m³). Total pressure at bottom = 3 atm (1 atm = 10⁵ N/m²). Velocity of efflux is nearest to',
                opts: ['√400 m/s', '√200 m/s', '√600 m/s', '√500 m/s'] }, { num: 18,
                text: 'Same charge q inside sphere (r=1 m) and cube (side=2 m). Ratio of flux through them is',
                opts: ['1:1', '1:8', '8:1', '1:2'] }, { num: 19,
                text: 'Uniform metallic rod rotates about perpendicular bisector. Heated uniformly → its speed of rotation',
                opts: ['Increases', 'Decreases', 'Remains same', 'Increases due to I increase'] }, { num: 20,
                text: 'Ratio of forces between two small charged spheres (i) in air (ii) in medium of dielectric constant K is',
                opts: ['1:K', 'K:1', '1:K²', 'K²:1'] }, { num: 21,
                text: 'At what temperature is rms velocity of H₂ equal to that of O₂ at 47°C?', opts: ['20 K', '80 K',

                text: 'Distance of 5th dark fringe from centre = 4 mm. D = 2 m, λ = 600 nm. Distance between slits is',
                opts: ['1.35 mm', '2.00 mm', '3.25 mm', '10.35 mm'] }, { num: 23,
                text: 'Body cools from 50°C to 40°C in 5 min. Surrounding = 20°C. Further time to cool to 30°C (min)',
                opts: ['5', '15/2', '25/3', '10'] }, { num: 24,
                text: 'E = 10 cos(10⁷t + kx) j V/m. It can be inferred that', opts: ['λ = 188.4 m', 'k = 0.33 rad/m',

                text: 'Straight wire (I=12 A) bent into semicircle (r=2 cm). B at centre (⊙ = out, ⊗ = in)',
                opts: ['B=1.9×10⁻⁴ T ⊙', 'B=1.9×10⁴ T ⊙', 'B=1.9×10⁻⁴ T ⊗', 'B=1.9×10⁴ T ⊗'] }, { num: 26,
                text: 'Critical angle for light from medium A to B is θ. Speed in A = υ. Speed in B is',
                opts: ['υ(1−cosθ)', 'υ/cosθ', 'υ/sinθ', 'υ(1−sinθ)'] }, { num: 27,
                text: 'Toroid: inner r=0.25 m, outer r=0.26 m, N=3500, I=11 A. B inside core is',

                text: 'YDSE with blue (4360 Å) and green (5460 Å). x = distance of 4th max. Then',
                opts: ['x(blue)=x(green)', 'x(blue)>x(green)', 'x(blue)<x(green)', 'ratio = 5460/4360'] },
            { num: 30, text: 'Masses 5,4,2 kg at speeds 5,4,2 m/s along X-axis. |v_CM| ≈', opts: ['1.0 m/s', '4 m/s',
                    '0.9 m/s', '1.3 m/s'] }, { num: 31,
                text: 'Concave lens (n=1.5) both surfaces radius R. Immersed in n=1.75. Behaves as',
                opts: ['Convergent, f=3.5R', 'Convergent, f=3.0R', 'Divergent, f=3.5R', 'Divergent, f=3.0R'] },

                opts: ['(3/4)ml²', '2ml²', '(5/4)ml²', '(3/2)ml²'],
                svg: '<svg viewBox="0 0 120 100" class="q-image-svg"><polygon points="20,85 100,85 60,15" fill="none" stroke="#333" stroke-width="2"/><text x="8" y="90" font-size="11">A</text><text x="100" y="90" font-size="11">B</text><text x="55" y="12" font-size="11">C</text><line x1="20" y1="85" x2="95" y2="15" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5"/><text x="70" y="45" font-size="10" fill="#dc2626">AX</text></svg>' },
            { num: 33, text: 'Horizontal component = √3 × vertical component. Angle of dip is', opts: ['0', 'π/3', 'π/6',

                opts: ['70 J', '270 J', '35 J', '135 J'] }, { num: 35,
                text: 'M-H curve for paramagnetic material is represented by', opts: ['Hysteresis loop', 'Curved line',
                    'Straight line through origin', 'Saturation curve'],
                svg: '<svg viewBox="0 0 150 100" class="q-image-svg"><line x1="20" y1="80" x2="130" y2="20" stroke="#2563eb" stroke-width="2"/><text x="10" y="50" font-size="10">M</text><text x="100" y="95" font-size="10">H</text></svg>' },
            { num: 36, text: 'Momentum increased by 20%. % increase in KE =', opts: ['54%', '44%', '100%', '50%'] },
            { num: 37, text: 'Series LCR: C=80μF, L=5H, R=40Ω. Resonance frequency =', opts: ['25 Hz', '25/π Hz',
                    '50 Hz', '50/π Hz'] }, { num: 38,
                text: 'Cyclist at 14√3 m/s, turn radius 20√3 m without skidding. Inclination to vertical =',
                opts: ['30°', '90°', '48°', '60°'] }, { num: 39,
                text: 'ε=200 sin(314t) V, I=sin(314t+π/3) A. Average power =', opts: ['200 W', '100 W', '50 W', '25 W'] },
            { num: 40,
                text: 'Radius of curvature ratio 1:2 for same mass, constant centripetal force. Velocity ratio =',
                opts: ['1:4', '4:1', '4:2', '1:√2'] }, { num: 41,
                text: 'Train v=72 km/h, rail separation=1 m, B_vert=2×10⁻⁵ T. Millivoltmeter reading (mV) =',
                opts: ['1.44', '0.72', '0.4', '0.2'] }, { num: 42,

                    '(2/6)[6log2+√3]', 'None'] }, { num: 160,

                    '25'] }, { num: 161, text: 'f(x)=2x²−3x. True:', opts: ['Strictly increasing (3/4,∞)',
                    'Strictly decreasing (−∞,3/4)', 'Both true', 'Both false'] }, { num: 162,

            { num: 163, text: 'd/dx{f(x)}=1/(1+x²). d/dx{f(x³)}=', opts: ['3x/(1+x³)', '3x²/(1+x⁶)',
                    '−6x⁵/(1+x⁶)²', 'None'] }, { num: 164, text: '∫(10x⁹+10ˣln10)/(x¹⁰+10ˣ) dx =',
                opts: ['10ˣ−x¹⁰+C', 'ln|x¹⁰+10ˣ|+C', '(10ˣ−x¹⁰)⁻¹+C', 'ln|x¹⁰+10ˣ|+C'] }, { num: 165,

            { num: 166, text: '∫√x/√(a³−x³) dx =', opts: ['(1/3)sin⁻¹(√x³/a³)+C', '(2/3)sin⁻¹(√x³/a³)+C',
                    '(2/3)sin⁻¹(√x/a)+C', '(1/3)sin⁻¹(x/a)+C'] }, { num: 167,
                text: '∫dx/(x(x²+1)) =', opts: ['ln|x|−½ln(x²+1)+C', 'ln|x|+½ln(x²+1)+C', '−ln|x|+½ln(x²+1)+C',
                    '½ln|x|+ln(x²+1)+C'] }, { num: 168, text: '∫(x+sinx)/(1+cosx) dx =',
                opts: ['ln|1+cosx|+C', 'ln|x+sinx|+C', 'x−tan(x/2)+C', 'x·tan(x/2)+C'] }, { num: 169,
                text: 'lim(x→∞) ∫₀ˣ [1/√(1+t²)−1/(1+t)] dt =', opts: ['log₂e', 'ln2', 'log₂(1/e)',
                'log_{1/e}2'] }, { num: 170, text: 'Area bounded by y=−x²+2x+3 and y=0:', opts: ['32 sq units',
                    '32/3 sq units', '1/32 sq unit', '1/3 sq unit'] }, { num: 171,
                text: 'y=√(a²−x²), x∈(−a,a) solves DE:', opts: ['x+y·dy/dx=0', 'y+x·dy/dx=0', 'x−y·dy/dx=0',
                    'y−x·dy/dx=0'] }, { num: 172,
                text: 'DE of circles radius 5, centre on y=2:', opts: ['(x−2)²y\'²=25−(y−2)²',
                    '(x−2)y\'²=25−(y−2)²', '(y−2)y\'²=25−(y−2)²', '(y−2)²y\'²=25−(y−2)²'] }, { num: 173,
                text: '|a|=50, collinear with b=6i−8j−(15/2)k, acute with +Z. a=', opts: ['−24i+32j+30k',
                    '24i−32j−30k', '−12i+16j−15k', '12i−16j−15k'] }, { num: 174,
                text: '2a+3b−5c=0. Ratio c divides AB:', opts: ['3:2 internally', '3:2 externally', '2:3 internally',
                    '2:3 externally'] }, { num: 175, text: 'B is inverse of A. α=', opts: ['−2', '1', '2', '5'] },
            { num: 176, text: 'A²=I. (A−I)³+(A+I)³−7A=', opts: ['A', 'I−A', 'I+A', '3A'] }, { num: 177,
                text: 'Determinant Δ =', opts: ['abc', 'a²b²', '0', '−ab'] }, { num: 178,
                text: 'P(B)=3/5, P(A|B)=1/2, P(A∪B)=4/5. P(A)=', opts: ['3/10', '1/5', '1/2', '3/5'] },
            { num: 179, text: 'Negation of "72 divisible by 2 and 3":', opts: ['72 not divisible by 2 OR by 3',
                    '72 not divisible by 2 AND by 3', '72 divisible by 2 AND not by 3',
                    '72 not divisible by 2 AND divisible by 3'] }, { num: 180,
                text: 'Max Z=4x+3y for given feasible region:', opts: ['112', '100', '72', '0'],
                svg: '<svg viewBox="0 0 150 100" class="q-image-svg"><polygon points="20,80 80,30 120,80" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/><circle cx="20" cy="80" r="3" fill="#333"/><circle cx="80" cy="30" r="3" fill="#333"/><circle cx="120" cy="80" r="3" fill="#333"/><text x="5" y="85" font-size="9">O(0,0)</text><text x="70" y="22" font-size="9">B(16,16)</text><text x="118" y="85" font-size="9">C(0,24)</text></svg>' }
        ];

        // ─────────────────── BUILD QUESTIONS ───────────────────
        function buildQuestionHTML(q, section) {
            const svgHTML = q.svg ? q.svg : '';
            const opts = q.opts.map((opt, i) => {
                const letter = String.fromCharCode(97 + i);
                return `<label><input type="radio" name="q_${section}_${q.num}" value="${letter}"> <span>${letter}. ${opt}</span></label>`;
            }).join('');
            return `
        <div class="question-card" id="card_${section}_${q.num}">
          <span class="review-badge correct-badge">✓ Correct</span>
          <span class="review-badge incorrect-badge">✗ Incorrect</span>
          <span class="review-badge unanswered-badge">⚠ Unanswered</span>
          <div class="q-num">Question ${q.num}</div>
          <div class="q-text">${q.text}${svgHTML}</div>
          <div class="options">${opts}</div>
          <div class="review-answer" id="review_${section}_${q.num}"></div>
        </div>`;
        }

        function populateSection(sectionId, questions, sectionKey) {
            const container = document.getElementById('section-' + sectionId);
            container.innerHTML = questions.map(q => buildQuestionHTML(q, sectionKey)).join('');
        }

        populateSection('physics', physicsQuestions, 'physics');
        populateSection('chemistry', chemistryQuestions, 'chemistry');
        populateSection('mathematics', mathematicsQuestions, 'mathematics');

        // ─────────────────── TIMER ───────────────────
        let timerInterval;
        let elapsedSeconds = 0;

        function startTimer() {
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
                const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
                const s = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${h}:${m}:${s}`;
            }, 1000);
        }
        startTimer();

        // ─────────────────── TAB NAVIGATION ───────────────────
        const tabButtons = document.querySelectorAll('#tabNav button');
        const sections = document.querySelectorAll('.section');
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const target = btn.getAttribute('data-section');
                sections.forEach(s => s.classList.remove('active'));
                document.getElementById('section-' + target).classList.add('active');
                window.scrollTo({ top: 200, behavior: 'smooth' });
            });
        });

        // ─────────────────── SUBMIT & REVIEW ───────────────────
        let testSubmitted = false;

        function submitTest() {
            if (testSubmitted) return;
            testSubmitted = true;
            clearInterval(timerInterval);

            const allSections = [
                { key: 'physics', questions: physicsQuestions },
                { key: 'chemistry', questions: chemistryQuestions },
                { key: 'mathematics', questions: mathematicsQuestions }
            ];

            let totalCorrect = 0;
            let totalIncorrect = 0;
            let totalUnanswered = 0;
            const totalQuestions = 180;

            allSections.forEach(section => {
                section.questions.forEach(q => {
                    const card = document.getElementById(`card_${section.key}_${q.num}`);
                    const reviewDiv = document.getElementById(`review_${section.key}_${q.num}`);
                    const correctAnswer = answerKey[section.key][q.num - 1];
                    const selected = document.querySelector(
                        `input[name="q_${section.key}_${q.num}"]:checked`);
                    const selectedValue = selected ? selected.value : null;

                    // Disable all radios in this question
                    const radios = document.querySelectorAll(
                        `input[name="q_${section.key}_${q.num}"]`);
                    radios.forEach(r => r.disabled = true);

                    if (!selectedValue) {
                        totalUnanswered++;
                        card.classList.add('review-unanswered');
                        reviewDiv.textContent =
                            `Unanswered. Correct answer: ${correctAnswer.toUpperCase()}`;
                    } else if (selectedValue === correctAnswer) {
                        totalCorrect++;
                        card.classList.add('review-correct');
                        reviewDiv.textContent =
                            `Your answer: ${selectedValue.toUpperCase()} — Correct ✓`;
                    } else {
                        totalIncorrect++;
                        card.classList.add('review-incorrect');
                        reviewDiv.textContent =
                            `Your answer: ${selectedValue.toUpperCase()} — Incorrect. Correct: ${correctAnswer.toUpperCase()}`;
                    }
                });
            });

            // Show results
            const resultsPanel = document.getElementById('resultsPanel');
            const scorePercent = ((totalCorrect / totalQuestions) * 100).toFixed(1);
            resultsPanel.innerHTML = `
        <h2>📊 Test Results</h2>
        <div class="score">${totalCorrect} / ${totalQuestions}</div>
        <p style="font-size:1.2rem;font-weight:600;color:#2563eb;">Score: ${scorePercent}%</p>
        <div class="breakdown">
          <span class="correct-count">✅ Correct: ${totalCorrect}</span>
          <span class="incorrect-count">❌ Incorrect: ${totalIncorrect}</span>
          <span class="unanswered-count">⚠ Unanswered: ${totalUnanswered}</span>
        </div>
        <p style="margin-top:10px;font-size:0.85rem;color:#6b7280;">Scroll through questions to review color-coded answers.</p>
      `;
            resultsPanel.classList.add('show');
            document.getElementById('btnReset').classList.add('show');
            document.getElementById('btnSubmit').disabled = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetTest() {
            testSubmitted = false;
            document.querySelectorAll('input[type="radio"]').forEach(r => {
                r.checked = false;
                r.disabled = false;
            });
            document.querySelectorAll('.question-card').forEach(card => {
                card.classList.remove('review-correct', 'review-incorrect', 'review-unanswered');
            });
            document.querySelectorAll('.review-answer').forEach(d => d.textContent = '');
            document.getElementById('resultsPanel').classList.remove('show');
            document.getElementById('btnReset').classList.remove('show');
            document.getElementById('btnSubmit').disabled = false;
            elapsedSeconds = 0;
            document.getElementById('timer').textContent = '00:00:00';
            clearInterval(timerInterval);
            startTimer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
