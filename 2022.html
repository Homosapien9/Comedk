<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK 2022 - CBT Examination</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a56db;
            --primary-light: #e8f0fe;
            --primary-dark: #1e40af;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --bg: #f5f5f5;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #ddd;
            --border-light: #e5e7eb;
            --radius: 6px;
            --radius-lg: 10px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
            --shadow: 0 1px 3px rgba(0, 0, 0, .1), 0 1px 2px rgba(0, 0, 0, .06);
            --shadow-lg: 0 4px 12px rgba(0, 0, 0, .12);
            --font: 'Inter', Arial, sans-serif;
            --header-height: 56px;
            --tab-height: 42px;
            --palette-width: 260px;
            --mobile-bottom-nav-height: 56px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* ── HEADER ── */
        #mainHeader {
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: var(--header-height);
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
            gap: 10px;
            flex-shrink: 0;
        }
        #mainHeader .candidate-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-shrink: 1;
        }
        #mainHeader .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, .5);
        }
        #mainHeader .candidate-name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        #mainHeader .center-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        #mainHeader .test-title {
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
            letter-spacing: .02em;
        }
        #mainHeader .timer-box {
            background: #fff;
            color: #1a1a1a;
            padding: 6px 14px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            letter-spacing: .03em;
            white-space: nowrap;
            transition: all .3s;
        }
        #mainHeader .timer-box.warning {
            background: #dc2626;
            color: #fff;
            animation: pulse-warn 1s infinite;
        }
        @keyframes pulse-warn {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, .5);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
            }
        }
        #mainHeader .btn-submit-header {
            background: #fff;
            color: var(--primary);
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
            flex-shrink: 0;
            letter-spacing: .02em;
        }
        #mainHeader .btn-submit-header:hover {
            background: #f0f4ff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        /* ── SUBJECT TABS ── */
        #subjectTabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: var(--header-height);
            z-index: 150;
            gap: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        #subjectTabs button {
            flex: 1 1 0;
            min-width: 0;
            padding: 11px 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            transition: all .15s;
            white-space: nowrap;
            font-family: var(--font);
            letter-spacing: .01em;
            text-align: center;
            min-height: var(--tab-height);
        }
        #subjectTabs button:hover {
            background: #f9fafb;
            color: var(--text);
        }
        #subjectTabs button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--primary-light);
        }
        #subjectTabs button .tab-count {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            display: block;
            line-height: 1;
            margin-top: 2px;
        }
        #subjectTabs button.active .tab-count {
            color: var(--primary);
        }

        /* ── MAIN LAYOUT ── */
        #mainLayout {
            display: flex;
            gap: 0;
            max-width: 1300px;
            margin: 0 auto;
            min-height: calc(100vh - var(--header-height) - var(--tab-height));
            position: relative;
        }
        #questionPanel {
            flex: 1 1 75%;
            min-width: 0;
            padding: 16px 20px 40px;
            background: var(--bg);
        }
        #palettePanel {
            width: var(--palette-width);
            flex-shrink: 0;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 16px 12px;
            position: sticky;
            top: calc(var(--header-height) + var(--tab-height));
            height: calc(100vh - var(--header-height) - var(--tab-height));
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            z-index: 50;
        }
        #palettePanel .palette-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            text-align: center;
            margin-bottom: 2px;
        }
        #palettePanel .palette-name {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
            word-break: break-word;
        }
        #paletteGrid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
        }
        #paletteGrid button {
            aspect-ratio: 1;
            min-width: 0;
            padding: 0;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            background: #e5e7eb;
            color: #6b7280;
            transition: all .12s;
            font-family: var(--font);
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #paletteGrid button:hover {
            border-color: #9ca3af;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
        }
        #paletteGrid button.visited-not-answered {
            background: #fca5a5;
            border-color: #ef4444;
            color: #7f1d1d;
        }
        #paletteGrid button.answered-palette {
            background: #86efac;
            border-color: #22c55e;
            color: #14532d;
        }
        #paletteGrid button.current-palette {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, .3);
            background: #fff;
            color: var(--primary);
            font-weight: 800;
            z-index: 2;
            position: relative;
        }
        #paletteGrid button.current-palette.answered-palette {
            background: #bbf7d0;
        }
        #paletteGrid button.current-palette.visited-not-answered {
            background: #fecaca;
        }
        .palette-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            justify-content: center;
            padding-top: 6px;
            border-top: 1px solid var(--border-light);
        }
        .palette-legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .palette-legend .dot {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1.5px solid var(--border);
            flex-shrink: 0;
        }
        .palette-legend .dot.gray {
            background: #e5e7eb;
        }
        .palette-legend .dot.red {
            background: #fca5a5;
            border-color: #ef4444;
        }
        .palette-legend .dot.green {
            background: #86efac;
            border-color: #22c55e;
        }

        /* ── QUESTION CARD ── */
        .question-card-main {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .question-card-main .q-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .question-card-main .q-counter {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            background: #f3f4f6;
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .question-card-main .q-subject-badge {
            font-weight: 600;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 4px;
            color: #fff;
            white-space: nowrap;
            letter-spacing: .03em;
        }
        .q-subject-badge.physics {
            background: #7c3aed;
        }
        .q-subject-badge.chemistry {
            background: #059669;
        }
        .q-subject-badge.maths {
            background: #dc2626;
        }
        .question-card-main .q-text {
            font-weight: 500;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #1a1a1a;
        }
        .question-card-main .svg-diagram {
            display: flex;
            justify-content: center;
            margin: 10px 0 16px;
            max-width: 100%;
            overflow-x: auto;
        }
        .question-card-main .svg-diagram svg {
            max-width: 100%;
            height: auto;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            background: #fafbfc;
            transition: all .12s;
            text-align: left;
            font-family: var(--font);
            min-height: 52px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .option-btn:hover {
            background: #f0f4ff;
            border-color: #93b4f5;
        }
        .option-btn.selected-option {
            background: var(--primary-light);
            border-color: var(--primary);
            font-weight: 600;
            color: #1a1a1a;
        }
        .option-btn .opt-letter {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
            background: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary);
            flex-shrink: 0;
        }
        .option-btn.selected-option .opt-letter {
            background: var(--primary);
            color: #fff;
        }
        .option-btn.correct-highlight {
            background: #dcfce7 !important;
            border-color: #16a34a !important;
        }
        .option-btn.correct-highlight .opt-letter {
            background: #16a34a !important;
            border-color: #16a34a !important;
            color: #fff !important;
        }
        .option-btn.incorrect-highlight {
            background: #fee2e2 !important;
            border-color: #dc2626 !important;
        }
        .option-btn.incorrect-highlight .opt-letter {
            background: #dc2626 !important;
            border-color: #dc2626 !important;
            color: #fff !important;
        }
        .correct-answer-display {
            font-size: 13px;
            color: #15803d;
            font-weight: 600;
            margin-top: 4px;
            display: none;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
        }
        .nav-buttons button {
            padding: 12px 20px;
            font-weight: 600;
            font-size: 14px;
            border-radius: var(--radius);
            cursor: pointer;
            border: none;
            font-family: var(--font);
            transition: all .15s;
            min-height: 48px;
            white-space: nowrap;
            letter-spacing: .02em;
        }
        .btn-save-next {
            background: #16a34a;
            color: #fff;
        }
        .btn-save-next:hover {
            background: #15803d;
            box-shadow: 0 2px 8px rgba(22, 163, 74, .3);
        }
        .btn-clear {
            background: #fff;
            color: #dc2626;
            border: 2px solid #dc2626 !important;
        }
        .btn-clear:hover {
            background: #fef2f2;
        }
        .btn-prev {
            background: #fff;
            color: #374151;
            border: 2px solid #d1d5db !important;
        }
        .btn-prev:hover {
            background: #f9fafb;
            border-color: #9ca3af !important;
        }

        /* ── RESULTS PANEL ── */
        #resultsPanel {
            display: none;
            background: var(--surface);
            border: 2px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-lg);
        }
        #resultsPanel.visible {
            display: block;
        }
        #resultsPanel h2 {
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 16px;
            color: #1a1a1a;
        }
        .results-summary {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .results-summary .res-item {
            text-align: center;
            padding: 14px 20px;
            background: #f9fafb;
            border-radius: var(--radius);
            min-width: 80px;
            border: 1px solid var(--border-light);
        }
        .results-summary .res-item .big-num {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }
        .results-summary .res-item .big-num.green {
            color: #16a34a;
        }
        .results-summary .res-item .big-num.red {
            color: #dc2626;
        }
        .results-summary .res-item .label {
            font-size: 11px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .subject-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 20px;
            font-size: 13px;
        }
        .subject-table th,
        .subject-table td {
            padding: 10px 12px;
            border: 1px solid var(--border-light);
            text-align: center;
            font-weight: 500;
        }
        .subject-table th {
            background: #f3f4f6;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .03em;
            color: #374151;
        }
        .results-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .results-buttons button {
            padding: 11px 22px;
            font-weight: 600;
            font-size: 14px;
            border-radius: var(--radius);
            cursor: pointer;
            border: none;
            font-family: var(--font);
            min-height: 48px;
            transition: all .15s;
        }
        .btn-retake {
            background: var(--primary);
            color: #fff;
        }
        .btn-retake:hover {
            background: var(--primary-dark);
        }
        .btn-home {
            background: #fff;
            color: #374151;
            border: 2px solid #d1d5db !important;
        }
        .btn-home:hover {
            background: #f9fafb;
        }

        /* ── MOBILE PALETTE DRAWER ── */
        #mobileDrawerOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 300;
        }
        #mobileDrawerOverlay.open {
            display: block;
        }
        #mobileDrawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            z-index: 310;
            max-height: 70vh;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, .2);
            padding: 16px 12px 20px;
            transform: translateY(100%);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #mobileDrawer.open {
            transform: translateY(0);
        }
        #mobileDrawer .drawer-handle {
            width: 40px;
            height: 5px;
            background: #d1d5db;
            border-radius: 3px;
            margin: 0 auto 10px;
        }
        #mobileDrawer .palette-title {
            font-weight: 700;
            font-size: 14px;
            text-align: center;
        }
        #mobileDrawer #mobilePaletteGrid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
        }
        #mobileDrawer #mobilePaletteGrid button {
            aspect-ratio: 1;
            min-width: 0;
            padding: 0;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 10px;
            background: #e5e7eb;
            color: #6b7280;
            font-family: var(--font);
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .12s;
        }
        #mobileDrawer #mobilePaletteGrid button.visited-not-answered {
            background: #fca5a5;
            border-color: #ef4444;
            color: #7f1d1d;
        }
        #mobileDrawer #mobilePaletteGrid button.answered-palette {
            background: #86efac;
            border-color: #22c55e;
            color: #14532d;
        }
        #mobileDrawer #mobilePaletteGrid button.current-palette {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, .3);
            background: #fff;
            color: var(--primary);
            font-weight: 800;
        }
        #mobileDrawer .palette-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            justify-content: center;
            padding-top: 6px;
            border-top: 1px solid var(--border-light);
        }
        #mobileDrawer .palette-legend .dot {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1.5px solid var(--border);
            flex-shrink: 0;
        }
        #mobileDrawer .palette-legend .dot.gray {
            background: #e5e7eb;
        }
        #mobileDrawer .palette-legend .dot.red {
            background: #fca5a5;
            border-color: #ef4444;
        }
        #mobileDrawer .palette-legend .dot.green {
            background: #86efac;
            border-color: #22c55e;
        }
        #mobileDrawer .btn-close-drawer {
            background: #374151;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: var(--font);
            min-height: 48px;
            text-align: center;
        }
        #floatingPaletteBtn {
            display: none;
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 290;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(26, 86, 219, .4);
            font-family: var(--font);
            min-height: 48px;
            letter-spacing: .02em;
            transition: all .15s;
        }
        #floatingPaletteBtn:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(26, 86, 219, .5);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            #palettePanel {
                display: none !important;
            }
            #floatingPaletteBtn {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            #questionPanel {
                padding: 10px 8px 80px;
            }
            .question-card-main {
                padding: 14px 12px;
                border-radius: 8px;
            }
            .question-card-main .q-text {
                font-size: 15px;
            }
            .option-btn {
                padding: 12px 14px;
                font-size: 14px;
                min-height: 52px;
            }
            .option-btn .opt-letter {
                width: 28px;
                height: 28px;
                font-size: 13px;
            }
            .nav-buttons button {
                padding: 11px 14px;
                font-size: 13px;
                min-height: 48px;
                flex: 1 1 auto;
                min-width: 0;
            }
            #mainHeader {
                padding: 0 8px;
                gap: 6px;
                height: 50px;
            }
            #mainHeader .candidate-name {
                font-size: 12px;
                max-width: 90px;
            }
            #mainHeader .test-title {
                font-size: 12px;
            }
            #mainHeader .timer-box {
                font-size: 13px;
                padding: 5px 10px;
            }
            #mainHeader .btn-submit-header {

        // ──────────────────────────────────────
        // GET QUESTION BY ID
        // ──────────────────────────────────────
        function getQuestionById(id) {
            return questionBank.find(q => q.id === id);
        }

        // ──────────────────────────────────────
        // RENDER CURRENT QUESTION
        // ──────────────────────────────────────
        function renderCurrentQuestion() {
            const q = getQuestionById(currentQId);
            if (!q) return;
            const card = document.getElementById('currentQuestionCard');
            const subjectClass = q.subject;
            const subjectBadgeClass = q.subject === 'physics' ? 'physics' : q.subject === 'chemistry' ? 'chemistry' :
                'maths';
            const subjectLabel = q.subject === 'physics' ? 'PHYSICS' : q.subject === 'chemistry' ? 'CHEMISTRY' :
            'MATHEMATICS';
            const diagramHTML = getDiagramSVG(q.diagram);
            const userAns = userAnswers[q.id] || '';
            const letters = ['A', 'B', 'C', 'D'];

            let optionsHTML = '<div class="options-list">';
            q.options.forEach((opt, i) => {
                const isSelected = userAns === letters[i];
                let cls = 'option-btn';
                if (isSelected) cls += ' selected-option';
                if (examSubmitted && q.answer.includes(letters[i])) cls += ' correct-highlight';
                if (examSubmitted && isSelected && !q.answer.includes(userAns)) cls += ' incorrect-highlight';
                optionsHTML += `
                <div class="${cls}" onclick="${examSubmitted ? '' : `selectOption(${q.id}, '${letters[i]}')`}" id="opt-btn-${q.id}-${letters[i]}">
                    <span class="opt-letter">${letters[i]}</span>
                    <span>${opt}</span>
                </div>`;
            });
            optionsHTML += '</div>';

            let correctDisplayHTML = '';
            if (examSubmitted) {
                correctDisplayHTML =
                    `<div class="correct-answer-display" style="display:block;">✅ Correct Answer: <strong>${q.answer}</strong></div>`;
            }

            card.innerHTML = `
            <div class="question-card-main" id="card-${q.id}">
                <div class="q-meta">
                    <span class="q-counter">Question ${q.id} of 180</span>
                    <span class="q-subject-badge ${subjectBadgeClass}">${subjectLabel}</span>
                </div>
                <div class="q-text">${q.text}</div>
                ${diagramHTML}
                ${optionsHTML}
                ${correctDisplayHTML}
            </div>`;

            // Mark as visited
            visitedQuestions.add(q.id);
            updatePalette();
            updateSubjectTabs();
            updateNavButtons();
        }

        function updateNavButtons() {
            const navDiv = document.getElementById('navButtons');
            if (examSubmitted) {
                navDiv.style.display = 'none';
                return;
            }
            navDiv.style.display = 'flex';
            const prevBtn = navDiv.querySelector('.btn-prev');
            const nextBtn = navDiv.querySelector('.btn-save-next');
            if (currentQId <= 1) {
                prevBtn.style.opacity = '0.5';
                prevBtn.style.pointerEvents = 'none';
            } else {
                prevBtn.style.opacity = '1';
                prevBtn.style.pointerEvents = 'auto';
            }
            if (currentQId >= TOTAL_QUESTIONS) {
                nextBtn.textContent = '✅ Last Question';
            } else {
                nextBtn.textContent = '🟢 Save & Next';
            }
        }

        // ──────────────────────────────────────
        // SELECT OPTION
        // ──────────────────────────────────────
        function selectOption(qId, letter) {
            if (examSubmitted) return;
            userAnswers[qId] = letter;
            renderCurrentQuestion();
            updatePalette();
            updateSubjectTabs();
            // Scroll to top of question card on mobile
            const card = document.getElementById('card-' + qId);
            if (card && window.innerWidth <= 768) {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function clearResponse() {
            if (examSubmitted) return;
            const qId = currentQId;
            if (userAnswers[qId]) {
                delete userAnswers[qId];
                renderCurrentQuestion();
                updatePalette();
                updateSubjectTabs();
            }
        }

        // ──────────────────────────────────────
        // NAVIGATION
        // ──────────────────────────────────────
        function saveAndNext() {
            if (examSubmitted) return;
            if (currentQId < TOTAL_QUESTIONS) {
                currentQId++;
                renderCurrentQuestion();
                scrollToQuestionCard();
            }
        }

        function prevQuestion() {
            if (examSubmitted) return;
            if (currentQId > 1) {
                currentQId--;
                renderCurrentQuestion();
                scrollToQuestionCard();
            }
        }

        function jumpToQuestion(qId) {
            if (qId < 1 || qId > TOTAL_QUESTIONS) return;
            currentQId = qId;
            renderCurrentQuestion();
            scrollToQuestionCard();
            // Close mobile drawer if open
            closeMobileDrawer();
        }

        function jumpToSubject(subject) {
            const firstQ = questionBank.find(q => q.subject === subject);
            if (firstQ) {
                currentQId = firstQ.id;
                renderCurrentQuestion();
                scrollToQuestionCard();
            }
            // Update tab active state
            document.querySelectorAll('#subjectTabs button').forEach((btn, i) => {
                btn.classList.remove('active');
                if ((subject === 'physics' && i === 0) || (subject === 'chemistry' && i === 1) || (
                        subject === 'maths' && i === 2)) {
                    btn.classList.add('active');
                }
            });
            closeMobileDrawer();
        }

        function scrollToQuestionCard() {
            const card = document.getElementById('card-' + currentQId);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ──────────────────────────────────────
        // PALETTE
        // ──────────────────────────────────────
        function updatePalette() {
            // Desktop palette
            const grid = document.getElementById('paletteGrid');
            if (grid) {
                let html = '';
                for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                    let cls = '';
                    if (i === currentQId) cls += ' current-palette';
                    if (userAnswers[i]) {
                        cls += ' answered-palette';
                    } else if (visitedQuestions.has(i)) {
                        cls += ' visited-not-answered';
                    }
                    html +=
                        `<button class="${cls.trim()}" onclick="jumpToQuestion(${i})" title="Q${i}">${i}</button>`;
                }
                grid.innerHTML = html;
            }

            // Mobile palette
            const mobileGrid = document.getElementById('mobilePaletteGrid');
            if (mobileGrid) {
                let html = '';
                for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                    let cls = '';
                    if (i === currentQId) cls += ' current-palette';
                    if (userAnswers[i]) {
                        cls += ' answered-palette';
                    } else if (visitedQuestions.has(i)) {
                        cls += ' visited-not-answered';
                    }
                    html +=
                        `<button class="${cls.trim()}" onclick="jumpToQuestion(${i})" title="Q${i}">${i}</button>`;
                }
                mobileGrid.innerHTML = html;
            }
        }

        function openMobileDrawer() {
            document.getElementById('mobileDrawerOverlay').classList.add('open');
            document.getElementById('mobileDrawer').classList.add('open');
            updatePalette();
            document.body.style.overflow = 'hidden';
        }

        function closeMobileDrawer() {
            document.getElementById('mobileDrawerOverlay').classList.remove('open');
            document.getElementById('mobileDrawer').classList.remove('open');
            document.body.style.overflow = '';
        }

        // ──────────────────────────────────────
        // SUBJECT TABS
        // ──────────────────────────────────────
        function updateSubjectTabs() {
            const physicsAnswered = questionBank.filter(q => q.subject === 'physics' && userAnswers[q.id]).length;
            const chemistryAnswered = questionBank.filter(q => q.subject === 'chemistry' && userAnswers[q.id]).length;
            const mathsAnswered = questionBank.filter(q => q.subject === 'maths' && userAnswers[q.id]).length;

            document.getElementById('tabCountPhysics').textContent = `(${physicsAnswered}/60)`;
            document.getElementById('tabCountChemistry').textContent = `(${chemistryAnswered}/60)`;
            document.getElementById('tabCountMaths').textContent = `(${mathsAnswered}/60)`;

            // Update active tab based on current question
            const q = getQuestionById(currentQId);
            if (q) {
                document.querySelectorAll('#subjectTabs button').forEach((btn, i) => {
                    btn.classList.remove('active');
                    if ((q.subject === 'physics' && i === 0) || (q.subject === 'chemistry' && i === 1) || (q
                            .subject === 'maths' && i === 2)) {
                        btn.classList.add('active');
                    }
                });
            }
        }

        // ──────────────────────────────────────
        // TIMER
        // ──────────────────────────────────────
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!examSubmitted && totalSeconds > 0) {
                    totalSeconds--;
                    updateTimerDisplay();
                    if (totalSeconds <= 0 && !examSubmitted) {
                        alert('⏰ Time is up! The exam will be auto-submitted.');
                        submitExam();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            const timerBox = document.getElementById('timerBox');
            timerBox.textContent =
                String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            if (totalSeconds < 300) {
                timerBox.classList.add('warning');
            } else {
                timerBox.classList.remove('warning');
            }
        }

        // ──────────────────────────────────────
        // SUBMIT EXAM
        // ──────────────────────────────────────
        function submitExam() {
            if (examSubmitted) {
                alert('Exam already submitted!');
                return;
            }
            if (!confirm('Are you sure you want to submit? You cannot change answers after submission.')) return;

            examSubmitted = true;
            clearInterval(timerInterval);

            let correct = 0;
            let incorrect = 0;
            let unanswered = 0;

            // Subject-wise tracking
            let subStats = { physics: { correct: 0, incorrect: 0, unanswered: 0 },
                chemistry: { correct: 0, incorrect: 0, unanswered: 0 }, maths: { correct: 0, incorrect: 0,
                    unanswered: 0 } };

            questionBank.forEach(q => {
                const userAns = userAnswers[q.id];
                if (!userAns) {
                    unanswered++;
                    subStats[q.subject].unanswered++;
                } else if (q.answer.includes(userAns)) {
                    correct++;
                    subStats[q.subject].correct++;
                } else {
                    incorrect++;
                    subStats[q.subject].incorrect++;
                }
            });

            const totalScore = correct;
            const attempted = correct + incorrect;
            const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : '0.0';

            // Update results panel
            document.getElementById('resultsSummary').innerHTML = `
            <div class="res-item"><div class="big-num">${totalScore}/180</div><div class="label">Total Score</div></div>
            <div class="res-item"><div class="big-num green">${correct}</div><div class="label">Correct</div></div>
            <div class="res-item"><div class="big-num red">${incorrect}</div><div class="label">Incorrect</div></div>
            <div class="res-item"><div class="big-num">${unanswered}</div><div class="label">Unattempted</div></div>
            <div class="res-item"><div class="big-num">${accuracy}%</div><div class="label">Accuracy</div></div>
          `;

            document.getElementById('subjectBreakdownTable').innerHTML = `
            <thead><tr><th>Subject</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Unattempted</th></tr></thead>
            <tbody>
                <tr><td><strong>Physics</strong></td><td>${subStats.physics.correct}</td><td>${subStats.physics.correct}</td><td>${subStats.physics.incorrect}</td><td>${subStats.physics.unanswered}</td></tr>
                <tr><td><strong>Chemistry</strong></td><td>${subStats.chemistry.correct}</td><td>${subStats.chemistry.correct}</td><td>${subStats.chemistry.incorrect}</td><td>${subStats.chemistry.unanswered}</td></tr>
                <tr><td><strong>Mathematics</strong></td><td>${subStats.maths.correct}</td><td>${subStats.maths.correct}</td><td>${subStats.maths.incorrect}</td><td>${subStats.maths.unanswered}</td></tr>
            </tbody>
          `;

            document.getElementById('resultsPanel').classList.add('visible');
            document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth' });

            // Re-render current question with highlights
            renderCurrentQuestion();
            updatePalette();
            document.getElementById('navButtons').style.display = 'none';

            // Disable all option buttons
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.style.pointerEvents = 'none';
            });

            // Get candidate name
            let candidateName = localStorage.getItem('comedk_username');
            if (!candidateName || candidateName === 'null' || candidateName.trim() === '') {
                candidateName = prompt('Please enter your name for the leaderboard:', '');
                if (candidateName && candidateName.trim() !== '') {
                    localStorage.setItem('comedk_username', candidateName.trim());
                } else {
                    candidateName = 'Anonymous';
                    localStorage.setItem('comedk_username', 'Anonymous');
                }
            }
            updateCandidateDisplay();

            // Save to localStorage for history
            const testHistory = JSON.parse(localStorage.getItem('comedk_test_history') || '[]');
            testHistory.push({
                testName: '2022',
                score: totalScore,
                total: TOTAL_QUESTIONS,
                correct,
                incorrect,
                unanswered,
                accuracy,
                date: new Date().toISOString()
            });
            localStorage.setItem('comedk_test_history', JSON.stringify(testHistory));

            // Save best score
            const bestScoreKey = 'comedk_best_score_2022';
            const previousBest = parseInt(localStorage.getItem(bestScoreKey) || '0');
            if (totalScore > previousBest) {
                localStorage.setItem(bestScoreKey, totalScore);
            }

            // Call Firebase
            if (typeof window.saveScoreToFirebase === 'function') {
                window.saveScoreToFirebase(candidateName, '2022', totalScore, TOTAL_QUESTIONS, accuracy);
            }
        }

        function retakeTest() {
            if (!confirm('Reset the exam? This will clear all answers.')) return;
            examSubmitted = false;
            userAnswers = {};
            visitedQuestions = new Set();
            totalSeconds = 3 * 3600;
            currentQId = 1;
            document.getElementById('timerBox').textContent = '03:00:00';
            document.getElementById('timerBox').classList.remove('warning');
            document.getElementById('resultsPanel').classList.remove('visible');
            document.getElementById('navButtons').style.display = 'flex';
            clearInterval(timerInterval);
            startTimer();
            renderCurrentQuestion();
            updatePalette();
            updateSubjectTabs();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            // Re-enable option buttons
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.style.pointerEvents = 'auto';
            });
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // ──────────────────────────────────────
        // CANDIDATE DISPLAY
        // ──────────────────────────────────────
        function updateCandidateDisplay() {
            let name = localStorage.getItem('comedk_username');
            if (!name || name === 'null' || name.trim() === '') {
                name = 'Candidate';
            }
            document.getElementById('headerCandidateName').textContent = name;
            document.getElementById('paletteCandidateName').textContent = name;
            // Avatar initial
            const initial = name.charAt(0).toUpperCase();
            document.getElementById('headerAvatar').textContent = initial;
        }

        // ──────────────────────────────────────
        // INITIALIZATION
        // ──────────────────────────────────────
        function init() {
            updateCandidateDisplay();
            renderCurrentQuestion();
            updatePalette();
            updateSubjectTabs();
            startTimer();
            // Ensure nav buttons are visible
            document.getElementById('navButtons').style.display = 'flex';
            document.getElementById('resultsPanel').classList.remove('visible');
        }

        document.addEventListener('DOMContentLoaded', init);

        // Handle window resize for mobile drawer
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeMobileDrawer();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (examSubmitted) return;
            if (e.key === 'ArrowRight' || e.key === 'n') {
                e.preventDefault();
                saveAndNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'p') {
                e.preventDefault();
                prevQuestion();
            } else if (e.key === 'c' || e.key === 'C') {
                e.preventDefault();
                clearResponse();
            }
        });
    </script>
