<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK 2022 - CBT Examination</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --border: #e0e0e0;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --warning: #f59e0b;
            --muted: #6b7280;
            --shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .06);
            --radius: 10px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
        }
        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -.01em;
        }
        header .badge {
            background: var(--accent-light);
            color: var(--accent);
            padding: .35rem .85rem;
            border-radius: 20px;
            font-size: .8rem;
            font-weight: 600;
        }
        .timer-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: .6rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
            font-size: .9rem;
            position: sticky;
            top: 64px;
            z-index: 99;
        }
        .timer-bar .time {
            background: #1a1a2e;
            color: #fff;
            padding: .3rem .8rem;
            border-radius: 6px;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-size: 1rem;
        }
        .tab-nav {
            display: flex;
            gap: .25rem;
            background: #fff;
            padding: .5rem 1.5rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 110px;
            z-index: 98;
            flex-wrap: wrap;
        }
        .tab-nav button {
            padding: .55rem 1.2rem;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            font-size: .85rem;
            transition: all .15s;
            white-space: nowrap;
        }
        .tab-nav button:hover {
            background: var(--accent-light);
            border-color: var(--accent);
        }
        .tab-nav button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600;
        }
        .tab-nav button.answered-tab {
            border-color: #16a34a;
            box-shadow: inset 0 0 0 2px #16a34a40;
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }
        .subject-section {
            display: none;
        }
        .subject-section.active {
            display: block;
        }
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
            transition: box-shadow .2s;
            scroll-margin-top: 160px;
        }
        .question-card:hover {
            box-shadow: 0 4px 14px rgba(0, 0, 0, .1);
        }
        .question-card.reviewed {
            border-left: 4px solid var(--accent);
        }
        .question-card.correct-card {
            border-left: 4px solid var(--correct);
            background: #f0fdf4;
        }
        .question-card.incorrect-card {
            border-left: 4px solid var(--incorrect);
            background: #fef2f2;
        }
        .q-header {
            display: flex;
            align-items: flex-start;
            gap: .6rem;
            margin-bottom: .6rem;
        }
        .q-num {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: .8rem;
            padding: .25rem .55rem;
            border-radius: 5px;
            flex-shrink: 0;
            min-width: 2.5rem;
            text-align: center;
        }
        .q-num.physics {
            background: #7c3aed;
        }
        .q-num.chemistry {
            background: #059669;
        }
        .q-num.maths {
            background: #dc2626;
        }
        .q-text {
            font-weight: 500;
            font-size: .95rem;
            flex: 1;
        }
        .q-text p {
            margin: 0;
        }
        .svg-diagram {
            display: flex;
            justify-content: center;
            margin: .8rem 0;
            max-width: 100%;
            overflow-x: auto;
        }
        .svg-diagram svg {
            max-width: 100%;
            height: auto;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: .4rem;
            margin-top: .6rem;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .55rem .8rem;
            border: 1.5px solid var(--border);
            border-radius: 7px;
            cursor: pointer;
            transition: all .15s;
            font-size: .9rem;
            background: #fafbfc;
        }
        .option-label:hover {
            background: var(--accent-light);
            border-color: var(--accent);
        }
        .option-label input[type="radio"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .option-label.selected {
            background: #dbeafe;
            border-color: var(--accent);
            font-weight: 500;
        }
        .option-label.correct-highlight {
            background: #dcfce7;
            border-color: var(--correct);
            font-weight: 600;
        }
        .option-label.incorrect-highlight {
            background: #fee2e2;
            border-color: var(--incorrect);
        }
        .result-indicator {
            display: inline-block;
            font-size: .75rem;
            font-weight: 700;
            margin-left: .4rem;
            padding: .15rem .5rem;
            border-radius: 4px;
        }
        .result-indicator.correct-tag {
            background: #dcfce7;
            color: #15803d;
        }
        .result-indicator.incorrect-tag {
            background: #fee2e2;
            color: #b91c1c;
        }
        .correct-answer-display {
            font-size: .8rem;
            color: #15803d;
            font-weight: 600;
            margin-top: .3rem;
            display: none;
        }
        .btn-row {
            display: flex;
            gap: .75rem;
            flex-wrap: wrap;
            justify-content: center;
            margin: 2rem 0;
        }
        .btn {
            padding: .7rem 2rem;
            font-weight: 600;
            font-size: .9rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all .2s;
            letter-spacing: .01em;
        }
        .btn-submit {
            background: #16a34a;
            color: #fff;
        }
        .btn-submit:hover {
            background: #15803d;
            box-shadow: 0 4px 12px rgba(22, 163, 74, .35);
        }
        .btn-reset {
            background: #fff;
            color: #6b7280;
            border: 1.5px solid #d1d5db;
        }
        .btn-reset:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
        .btn-print {
            background: #2563eb;
            color: #fff;
        }
        .btn-print:hover {
            background: #1d4ed8;
        }
        .score-panel {
            background: #fff;
            border-radius: var(--radius);
            padding: 1.5rem 2rem;
            margin: 1.5rem 0;
            box-shadow: var(--shadow);
            text-align: center;
            display: none;
            border: 2px solid var(--accent);
        }
        .score-panel.visible {
            display: block;
        }
        .score-panel h2 {
            font-size: 1.5rem;
            margin-bottom: .5rem;
        }
        .score-grid {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1rem 0;
        }
        .score-item {
            text-align: center;
            padding: 1rem 1.5rem;
            background: #f9fafb;
            border-radius: 8px;
            min-width: 100px;
        }
        .score-item .big-num {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
        }
        .score-item .big-num.green {
            color: #16a34a;
        }
        .score-item .big-num.red {
            color: #dc2626;
        }
        .score-item .label {
            font-size: .8rem;
            color: #6b7280;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .progress-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin: .5rem 0;
            justify-content: center;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d1d5db;
            cursor: pointer;
            transition: all .2s;
        }
        .progress-dot.answered-dot {
            background: #16a34a;
        }
        .progress-dot.current-dot {
            background: var(--accent);
            transform: scale(1.4);
        }
        .progress-dot.wrong-dot {
            background: #dc2626;
        }
        @media (max-width: 640px) {
            header h1 {
                font-size: 1rem;
            }
            .question-card {
                padding: .9rem .7rem;
            }
            .q-text {
                font-size: .85rem;
            }
            .option-label {
                font-size: .8rem;
                padding: .45rem .6rem;
            }
            .tab-nav button {
                padding: .4rem .7rem;
                font-size: .75rem;
            }
            .score-grid {
                gap: .75rem;
            }
            .score-item {
                padding: .7rem 1rem;
                min-width: 70px;
            }
            .score-item .big-num {
                font-size: 1.5rem;
            }
        }
        @media print {
            header,
            .timer-bar,
            .tab-nav,
            .btn-row,
            .progress-dots {
                display: none !important;
            }
            .subject-section {
                display: block !important;
            }
            .question-card {
                break-inside: avoid;
                box-shadow: none;
            }
            body {
                background: #fff;
            }
            main {
                max-width: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>📝 COMEDK 2022 - Full Mock Test</h1>
        <span class="badge">180 Questions • 3 Hours</span>
    </header>

    <div class="timer-bar">
        ⏱️ <span class="time" id="timer">03:00:00</span>
        <span style="margin-left:auto;font-size:.8rem;color:#6b7280;">Physics (1-60) | Chemistry (61-120) | Maths (121-180)</span>
    </div>

    <div class="tab-nav" id="tabNav">
        <button class="active" onclick="switchTab('physics')">🔬 Physics (Q1-60)</button>
        <button onclick="switchTab('chemistry')">⚗️ Chemistry (Q61-120)</button>
        <button onclick="switchTab('maths')">📐 Maths (Q121-180)</button>
        <button onclick="switchTab('all')" style="background:#fef3c7;border-color:#f59e0b;">📋 All Questions</button>
    </div>

    <div class="progress-dots" id="progressDots" style="padding:.4rem 1.5rem;background:#fff;border-bottom:1px solid #e0e0e0;position:sticky;top:155px;z-index:97;"></div>

    <main id="mainContent">
        <!-- Score Panel -->
        <div class="score-panel" id="scorePanel">
            <h2>📊 Your Results</h2>
            <div class="score-grid">
                <div class="score-item"><div class="big-num green" id="scoreCorrect">0</div><div class="label">Correct</div></div>
                <div class="score-item"><div class="big-num red" id="scoreIncorrect">0</div><div class="label">Incorrect</div></div>
                <div class="score-item"><div class="big-num" id="scoreUnanswered">0</div><div class="label">Unanswered</div></div>
                <div class="score-item"><div class="big-num" id="scoreTotal">0</div><div class="label">Total Score</div></div>
            </div>
            <p style="color:#6b7280;font-size:.85rem;">Scroll down to review each question with correct answers highlighted.</p>
        </div>

        <!-- All 180 questions will be injected by JavaScript -->
        <div id="questionsContainer"></div>

        <div class="btn-row">
            <button class="btn btn-submit" onclick="submitExam()">✅ Submit & Review</button>
            <button class="btn btn-reset" onclick="resetExam()">🔄 Reset All</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ Print</button>
        </div>
    </main>

    <script>
        // ──────────────────────────────────────
        // COMPLETE QUESTION BANK (180 Questions)
        // ──────────────────────────────────────
        const questionBank = [
            // ===== PHYSICS (Q1-60) =====
            { id: 1, subject: 'physics', text: 'During the phenomenon of resonance', options: ['the amplitude of oscillation becomes large',
                    'the frequency of oscillation becomes large', 'the time period of oscillation becomes large',
                    'All of the above'
                ], answer: 'A', diagram: null },
            { id: 2, subject: 'physics',
                text: 'If the earth were to spin faster, acceleration due to gravity at the poles',
                options: ['increases', 'decreases', 'remains the same', 'depends on how fast it spins'], answer: 'C',
                diagram: null },
            { id: 3, subject: 'physics',
                text: 'Maximum amplitude of message signal in amplitude modulation is 20 cm. If the amplitude of carrier wave is 40 cm, then modulation index of modulated wave is',
                options: ['1', '0.5', '0.25', '2'], answer: 'B', diagram: null },
            { id: 4, subject: 'physics',
                text: 'If heat engine is filled at temperature 27°C and heat of 100 kcal is taken from source at temperature 677°C. Work done (in J) is',
                options: ['0.28 × 10⁶', '2.8 × 10⁶', '28 × 10⁶', '0.028 × 10⁶'], answer: 'A', diagram: null },
            { id: 5, subject: 'physics', text: 'During α-decay, atomic mass of parent nuclei is',
                options: ['decreased by 2 units', 'increased by 2 units', 'decreased by 4 units',
                    'increased by 4 units'
                ], answer: 'C', diagram: null },
            { id: 6, subject: 'physics',
                text: 'A point object is placed on the optic axis of a convex lens of focal length f at a distance of 2f to the left of it. The diameter of the lens is d. An eye is placed at a distance of 3f to the right of the lens and a distance h below the optic axis. The maximum value of h to see the image is',
                options: ['d', 'd/2', 'd/3', 'd/4'], answer: 'D', diagram: 'lens_diagram' },
            { id: 7, subject: 'physics',
                text: 'For CE transistor amplifier, the audio signal voltage across the collector resistance of 4kΩ is 5V. If the current amplification factor of the transistor is 100 and base resistance is 2kΩ, then input signal voltage is',
                options: ['75 mV', '25 mV', '20 mV', '50 mV'], answer: 'B', diagram: null },
            { id: 8, subject: 'physics',
                text: 'From the following p-V diagram, an ideal gas undergoing a change of state from A to B. Four different processes I, II, III and IV as shown in the figure may lead to same change of state.',
                options: ['Work done is maximum in case I', 'Change in internal energy is same in all the four cases',
                    'Change in internal energy is same in IV and III cases, but not in I and II',
                    'Work done is minimum in case II'
                ], answer: 'AB', diagram: 'pv_diagram' },
            { id: 9, subject: 'physics',
                text: 'A copper and a steel wire of same diameter are connected end to end. A deforming force F is applied to the wire which causes an elongation of 1 cm. The two wires will have',
                options: ['the same stress', 'different stress', 'the same strain', 'different strain'], answer: 'AD',
                diagram: null },
            { id: 10, subject: 'physics',
                text: 'If kinetic energy of a body is increased by 300%, then percentage change in momentum will be',
                options: ['100%', '150%', '265%', '73.2%'], answer: 'A', diagram: null },
            { id: 11, subject: 'physics',
                text: 'Which of the following diagram represents the variation of the electric field with distance r from the centre of a uniformly charged non-conducting sphere of radius R?',
                options: ['Graph A (E ∝ 1/r² outside, linear inside)', 'Graph B', 'Graph C (E=0 at centre, linear rise, then 1/r² fall)',
                    'Graph D'
                ], answer: 'C', diagram: 'efield_graph' },
            { id: 12, subject: 'physics',
                text: 'A DC ammeter and a hot wire ammeter are connected to a circuit in series. When a direct current is passed through circuit, the DC ammeter shows 6A. When AC current flows through circuit, what is the average readings in DC ammeter and the AC ammeter, if DC and AC currents flow simultaneously through the circuit?',
                options: ['DC=6A, AC=10A', 'DC=3A, AC=5A', 'DC=5A, AC=8A', 'DC=2A, AC=3A'], answer: 'A',
                diagram: null },
            { id: 13, subject: 'physics',
                text: 'A bullet of mass m hits a mass M and gets embedded in it. If the block rises to a height h as a result of this collision, the velocity of the bullet before collision is',
                options: ['v = √(2gh)', 'v = √(2gh)[1 + (m/M)]', 'v = √(2gh)(1 + M/m)', 'v = √(2gh)[1 - (m/M)]'],
                answer: 'C', diagram: null },
            { id: 14, subject: 'physics',
                text: 'A particle of mass m is moving in a horizontal circle of radius r under a centripetal force given by (-K/r²), where K is a constant. Then',

            { id: 15, subject: 'physics',

            { id: 16, subject: 'physics',
                text: 'Which of the following series spectrum of hydrogen atom lies in ultraviolet region?',
                options: ['Paschen series', 'Brackett series', 'Pfund series', 'Lyman series'], answer: 'D',
            diagram: null },
            { id: 17, subject: 'physics',
                text: 'Speed of electromagnetic wave in a medium having relative permittivity εᵣ and relative permeability μᵣ is (speed of light in air, c = 3×10⁸ m/s)',

            { id: 18, subject: 'physics',

                options: ['78.8 nm', '121.6 nm', '418.2 nm', '610.5 nm'], answer: 'B', diagram: null },
            { id: 19, subject: 'physics',

                    '4.67×10³ Hz, 4.34×10⁴ Hz'
                ], answer: 'A', diagram: 'bat_walls' },
            { id: 20, subject: 'physics',
                text: 'A disc of moment of inertia 4 kg-m² revolving with 16 rad/s is placed on another disc of moment of inertia 8 kg-m² revolving 4 rad/s. The angular frequency of composite disc',

            { id: 26, subject: 'physics',

            { id: 27, subject: 'physics',
                text: 'In Young\'s double slit experiment, the two slits are separated by 0.2 mm and they are 1 m from the screen. The wavelength of the light used is 500 nm. The distance between 6th maxima and 10th minima on the screen is closest to',

            { id: 28, subject: 'physics',
                text: 'A series L-C-R circuit is connected to an AC source of 220V and 50 Hz shown in figure. If the readings of the three voltmeters V₁, V₂ and V₃ are 65V, 415V and 204V respectively, the value of inductance and capacitance will be',

            { id: 31, subject: 'physics',

        // ──────────────────────────────────────

        function renderAllQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            const subjects = ['physics', 'chemistry', 'maths'];
            const subjectLabels = { physics: 'PHYSICS', chemistry: 'CHEMISTRY', maths: 'MATHEMATICS' };
            const subjectClasses = { physics: 'physics', chemistry: 'chemistry', maths: 'maths' };

            subjects.forEach(subj => {
                html +=
                    `<div class="subject-section" id="section-${subj}"><h2 style="margin:1rem 0;color:#374151;border-bottom:2px solid #e5e7eb;padding-bottom:.5rem;">📘 ${subjectLabels[subj]} (Questions ${subj==='physics'?'1-60':subj==='chemistry'?'61-120':'121-180'})</h2>`;
                const qs = questionBank.filter(q => q.subject === subj);
                qs.forEach(q => {
                    html += renderQuestionCard(q, subjectClasses[subj]);
                });
                html += '</div>';
            });

            // Also create "all" section
            html +=
                `<div class="subject-section" id="section-all"><h2 style="margin:1rem 0;color:#374151;border-bottom:2px solid #e5e7eb;padding-bottom:.5rem;">📋 All 180 Questions</h2>`;
            questionBank.forEach(q => {
                html += renderQuestionCard(q, subjectClasses[q.subject]);
            });
            html += '</div>';

            container.innerHTML = html;
            updateProgressDots();
        }

        function renderQuestionCard(q, subjectClass) {
            const qNum = q.id;
            const diagramHTML = getDiagramSVG(q.diagram, qNum);
            let optionsHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                optionsHTML += `
                <label class="option-label" id="label-${qNum}-${letters[i]}">
                    <input type="radio" name="q${qNum}" value="${letters[i]}" onchange="selectAnswer(${qNum}, '${letters[i]}')">
                    <span><strong>${letters[i]}.</strong> ${opt}</span>
                </label>`;
            });

            return `
            <div class="question-card" id="card-${qNum}">
                <div class="q-header">
                    <span class="q-num ${subjectClass}">Q${qNum}</span>
                    <div class="q-text">${q.text}</div>
                </div>
                ${diagramHTML}
                <div class="options">${optionsHTML}</div>
                <div class="correct-answer-display" id="correct-display-${qNum}">
                    ✅ Correct Answer: <strong>${q.answer}</strong>
                </div>
            </div>`;
        }

                    svg = `<svg width="270" height="100" viewBox="0 0 270 100"><rect x="20" y="30" width="40" height="30" fill="none" stroke="#333" stroke-width="1.5"/><text x="25" y="48" font-size="10">R=100Ω</text><circle cx="100" cy="45" r="15" fill="none" stroke="#333" stroke-width="1.5"/><text x="88" y="48" font-size="9">L</text><line x1="60" y1="45" x2="85" y2="45" stroke="#333" stroke-width="1.5"/><line x1="115" y1="45" x2="145" y2="45" stroke="#333" stroke-width="1.5"/><rect x="145" y="30" width="50" height="30" fill="none" stroke="#333" stroke-width="1.5"/><text x="150" y="48" font-size="10">C</text><line x1="195" y1="45" x2="230" y2="45" stroke="#333" stroke-width="1.5"/><circle cx="235" cy="45" r="12" fill="none" stroke="#333" stroke-width="1.5"/><text x="228" y="49" font-size="9">~</text><text x="245" y="40" font-size="9">220V</text><text x="245" y="55" font-size="9">50Hz</text></svg>`;
                    break;
                case 'hexagon':
                    svg = `<svg width="180" height="160" viewBox="0 0 180 160"><polygon points="90,15 160,55 160,115 90,155 20,115 20,55" fill="none" stroke="#2563eb" stroke-width="2"/><text x="130" y="40" font-size="10">m</text></svg>`;

                    svg = `<svg width="280" height="90" viewBox="0 0 280 90"><text x="10" y="35" font-size="11">A</text><line x1="25" y1="30" x2="55" y2="30" stroke="#333"/><text x="10" y="65" font-size="11">B</text><line x1="25" y1="60" x2="55" y2="60" stroke="#333"/><path d="M55,20 L55,70 L90,70 L90,20 Z" fill="none" stroke="#333" stroke-width="1.5"/><text x="58" y="48" font-size="9">OR</text><line x1="90" y1="45" x2="120" y2="45" stroke="#333"/><path d="M120,25 L120,65 L150,65 L150,25 Z" fill="none" stroke="#333" stroke-width="1.5"/><text x="123" y="48" font-size="9">AND</text><line x1="150" y1="45" x2="180" y2="45" stroke="#333"/><circle cx="190" cy="45" r="3" fill="#333"/><text x="200" y="48" font-size="11">Y</text></svg>`;
                    break;
                case 'cycle_pv':
                    svg = `<svg width="200" height="150" viewBox="0 0 200 150"><line x1="30" y1="130" x2="180" y2="130" stroke="#333" stroke-width="1.5"/><text x="185" y="133" font-size="10">V</text><line x1="30" y1="130" x2="30" y2="10" stroke="#333" stroke-width="1.5"/><text x="15" y="15" font-size="10">p</text><polygon points="50,100 140,20 140,100" fill="#e8f4fd" stroke="#2563eb" stroke-width="2"/><text x="45" y="115" font-size="10">A</text><text x="145" y="18" font-size="10">B</text><text x="145" y="115" font-size="10">C</text></svg>`;
                    break;
                case 'disc_square':
                    svg = `<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="#333" stroke-width="1.5"/><rect x="60" y="60" width="80" height="80" fill="none" stroke="#dc2626" stroke-width="1.5" transform="rotate(45,100,100)"/><circle cx="100" cy="100" r="2" fill="#333"/><text x="95" y="95" font-size="10">C</text></svg>`;
                    break;
                case 'doppler_graph':
                    svg = `<svg width="280" height="130" viewBox="0 0 280 130"><line x1="30" y1="110" x2="250" y2="110" stroke="#333" stroke-width="1.5"/><text x="255" y="113" font-size="10">v₀</text><line x1="30" y1="110" x2="30" y2="10" stroke="#333" stroke-width="1.5"/><text x="15" y="15" font-size="10">f</text><line x1="30" y1="80" x2="240" y2="30" stroke="#2563eb" stroke-width="2"/><text x="210" y="25" font-size="10">Graph A</text></svg>`;
                    break;
                case 'cap_network':
                    svg = `<svg width="280" height="120" viewBox="0 0 280 120"><text x="10" y="60" font-size="11">P</text><line x1="25" y1="55" x2="55" y2="55" stroke="#333"/><rect x="55" y="40" width="15" height="30" fill="none" stroke="#333" stroke-width="1.5"/><text x="80" y="58" font-size="9">3μF</text><line x1="70" y1="55" x2="100" y2="55" stroke="#333"/><rect x="100" y="40" width="15" height="30" fill="none" stroke="#333" stroke-width="1.5"/><text x="125" y="58" font-size="9">3μF</text><line x1="115" y1="55" x2="145" y2="55" stroke="#333"/><rect x="145" y="40" width="15" height="30" fill="none" stroke="#333" stroke-width="1.5"/><text x="165" y="58" font-size="9">3μF</text><line x1="160" y1="55" x2="200" y2="55" stroke="#333"/><text x="205" y="58" font-size="11">Q</text></svg>`;
                    break;
                case 'reaction_xy':
                    svg = `<svg width="300" height="80" viewBox="0 0 300 80"><text x="10" y="40" font-size="11">CH₃-C(=O)-C₂H₅</text><text x="140" y="40" font-size="14">→</text><text x="160" y="30" font-size="10">HCN</text><text x="200" y="40" font-size="11">X (cyanohydrin)</text><text x="30" y="65" font-size="10">then Y (LiAlH₄) → CH₃-CH₂-NH₂</text></svg>`;
                    break;
                case 'org_reaction':
                    svg = `<svg width="280" height="70" viewBox="0 0 280 70"><text x="10" y="35" font-size="11">Reactant + Reagent</text><text x="140" y="35" font-size="14">→</text><text x="160" y="35" font-size="11">Product B</text></svg>`;
                    break;
                case 'feasible_region':
                    svg = `<svg width="260" height="160" viewBox="0 0 260 160"><line x1="30" y1="140" x2="230" y2="140" stroke="#333" stroke-width="1.5"/><text x="235" y="143" font-size="10">x</text><line x1="30" y1="140" x2="30" y2="10" stroke="#333" stroke-width="1.5"/><text x="15" y="15" font-size="10">y</text><polygon points="30,140 180,30 180,100 30,120" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="100" y="90" font-size="9">Feasible</text><text x="100" y="105" font-size="9">Region</text></svg>`;
                    break;
                default:
                    svg = '';
            }
            if (svg) {
                return `<div class="svg-diagram">${svg}</div>`;
            }
            return '';
        }

        // ──────────────────────────────────────
        // TAB SWITCHING
        // ──────────────────────────────────────
        function switchTab(subject) {
            document.querySelectorAll('.subject-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));

            if (subject === 'all') {
                document.getElementById('section-all').classList.add('active');
                document.querySelectorAll('.tab-nav button')[3].classList.add('active');
            } else {
                document.getElementById('section-' + subject).classList.add('active');
                const tabMap = { physics: 0, chemistry: 1, maths: 2 };
                document.querySelectorAll('.tab-nav button')[tabMap[subject]].classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ──────────────────────────────────────
        // ANSWER SELECTION
        // ──────────────────────────────────────
        function selectAnswer(qNum, letter) {
            if (examSubmitted) return;
            userAnswers[qNum] = letter;
            // Update label styling
            ['A', 'B', 'C', 'D'].forEach(l => {
                const label = document.getElementById(`label-${qNum}-${l}`);
                if (label) {
                    label.classList.remove('selected');
                    if (l === letter) label.classList.add('selected');
                }
            });
            updateProgressDots();
            updateTabIndicators();
        }

        // ──────────────────────────────────────
        // PROGRESS DOTS
        // ──────────────────────────────────────
        function updateProgressDots() {
            const dotsContainer = document.getElementById('progressDots');
            let html = '';
            for (let i = 1; i <= 180; i++) {
                let cls = 'progress-dot';
                if (userAnswers[i]) cls += ' answered-dot';
                html +=
                    `<span class="${cls}" title="Q${i}" onclick="scrollToQuestion(${i})" style="cursor:pointer;"></span>`;
            }
            dotsContainer.innerHTML = html;
            updateTabIndicators();
        }

        function updateTabIndicators() {
            const tabs = document.querySelectorAll('.tab-nav button');
            const physicsAnswered = questionBank.filter(q => q.subject === 'physics' && userAnswers[q.id]).length;
            const chemistryAnswered = questionBank.filter(q => q.subject === 'chemistry' && userAnswers[q.id]).length;
            const mathsAnswered = questionBank.filter(q => q.subject === 'maths' && userAnswers[q.id]).length;

            if (physicsAnswered > 0) tabs[0].classList.add('answered-tab');
            else tabs[0].classList.remove('answered-tab');
            if (chemistryAnswered > 0) tabs[1].classList.add('answered-tab');
            else tabs[1].classList.remove('answered-tab');
            if (mathsAnswered > 0) tabs[2].classList.add('answered-tab');
            else tabs[2].classList.remove('answered-tab');
        }

        function scrollToQuestion(qNum) {
            const card = document.getElementById('card-' + qNum);
            if (card) {
                // Switch to all tab
                switchTab('all');
                setTimeout(() => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.classList.add('reviewed');
                    setTimeout(() => card.classList.remove('reviewed'), 2000);
                }, 200);
            }
        }

        // ──────────────────────────────────────
        // SUBMIT & REVIEW
        // ──────────────────────────────────────
        function submitExam() {
            if (examSubmitted) {
                alert('Exam already submitted! Scroll down to review your results.');
                return;
            }
            if (!confirm('Are you sure you want to submit? You cannot change answers after submission.')) return;

            examSubmitted = true;
            clearInterval(timerInterval);

            // Switch to all tab
            switchTab('all');

            let correct = 0;
            let incorrect = 0;
            let unanswered = 0;

            questionBank.forEach(q => {
                const card = document.getElementById('card-' + q.id);
                const correctDisplay = document.getElementById('correct-display-' + q.id);
                const userAns = userAnswers[q.id];

                // Show correct answer
                if (correctDisplay) correctDisplay.style.display = 'block';

                if (!userAns) {
                    unanswered++;
                    if (card) card.classList.add('incorrect-card');
                } else if (q.answer.includes(userAns)) {
                    // Accept single-letter matches (for multi-answer questions like Q8, Q9, any match counts as correct)
                    correct++;
                    if (card) card.classList.add('correct-card');
                    // Highlight selected option green
                    const label = document.getElementById(`label-${q.id}-${userAns}`);
                    if (label) label.classList.add('correct-highlight');
                } else {
                    incorrect++;
                    if (card) card.classList.add('incorrect-card');
                    const label = document.getElementById(`label-${q.id}-${userAns}`);
                    if (label) label.classList.add('incorrect-highlight');
                    // Highlight correct option
                    q.answer.split('').forEach(l => {
                        const correctLabel = document.getElementById(`label-${q.id}-${l}`);
                        if (correctLabel) correctLabel.classList.add('correct-highlight');
                    });
                }

                // Disable radio buttons
                const radios = card ? card.querySelectorAll('input[type="radio"]') : [];
                radios.forEach(r => r.disabled = true);
            });

            // Update score panel
            const totalScore = correct; // 1 mark per correct, no negative marking shown
            document.getElementById('scoreCorrect').textContent = correct;
            document.getElementById('scoreIncorrect').textContent = incorrect;
            document.getElementById('scoreUnanswered').textContent = unanswered;
            document.getElementById('scoreTotal').textContent = totalScore + ' / 180';
            document.getElementById('scorePanel').classList.add('visible');
            document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth' });

            // Update progress dots with wrong answers
            updateProgressDotsPostSubmit();
        }

        function updateProgressDotsPostSubmit() {
            const dotsContainer = document.getElementById('progressDots');
            let html = '';
            for (let i = 1; i <= 180; i++) {
                let cls = 'progress-dot';
                const q = questionBank.find(qq => qq.id === i);
                const userAns = userAnswers[i];
                if (userAns) {
                    if (q.answer.includes(userAns)) {
                        cls += ' answered-dot';
                    } else {
                        cls += ' wrong-dot';
                    }
                }
                html +=
                    `<span class="${cls}" title="Q${i}" onclick="scrollToQuestion(${i})" style="cursor:pointer;"></span>`;
            }
            dotsContainer.innerHTML = html;
        }

        function resetExam() {
            if (examSubmitted && !confirm('Reset the exam? This will clear all answers and re-enable the form.'))
        return;
            examSubmitted = false;
            userAnswers = {};
            totalSeconds = 3 * 3600;
            document.getElementById('timer').textContent = '03:00:00';
            document.getElementById('scorePanel').classList.remove('visible');
            clearInterval(timerInterval);
            startTimer();
            renderAllQuestions();
            switchTab('physics');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ──────────────────────────────────────
        // TIMER
        // ──────────────────────────────────────
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!examSubmitted && totalSeconds > 0) {
                    totalSeconds--;
                    updateTimerDisplay();
                    if (totalSeconds <= 0 && !examSubmitted) {
                        alert('⏰ Time is up! The exam will be auto-submitted.');
                        submitExam();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            document.getElementById('timer').textContent =
                String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            if (totalSeconds < 600) {
                document.getElementById('timer').style.background = '#dc2626';
            }
        }

        // ──────────────────────────────────────
        // INITIALIZATION
        // ──────────────────────────────────────
        function init() {
            renderAllQuestions();
            switchTab('physics');
            startTimer();
            updateProgressDots();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
