<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMEDK Rank Booster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
--bg:#070510;
--card:#15122b;
--card2:#1d1a3f;
--accent:#8b5cf6;
--accent2:#a78bfa;
--text:#f1efff;
--muted:#a1a1c2;
--border:rgba(139,92,246,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter;background:linear-gradient(180deg,#070510,#020109);color:var(--text)}

nav{position:sticky;top:0;background:#070510e6;backdrop-filter:blur(12px);padding:18px 30px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);z-index:99}
nav h1{font-size:22px;font-weight:800;color:var(--accent)}

.container{max-width:1200px;margin:auto;padding:40px 20px}
.hero{text-align:center;margin:40px 0}
.hero h2{font-size:42px;font-weight:800;background:linear-gradient(90deg,#c4b5fd,#8b5cf6);-webkit-background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:10px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:30px}
.card{background:var(--card);padding:25px;border-radius:18px;border:1px solid var(--border);transition:.3s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;width:100%;height:100%;background:radial-gradient(circle at top right,#8b5cf633,transparent 60%);top:0;left:0}
.card:hover{transform:translateY(-7px);background:var(--card2);box-shadow:0 0 25px rgba(139,92,246,.35)}
.card h3{margin-bottom:10px}
.card button{margin-top:15px;width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#8b5cf6,#a78bfa);color:white;font-weight:600;cursor:pointer}
.card button:hover{opacity:.9}

.leaderboard{margin-top:70px;background:var(--card);padding:25px;border-radius:18px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--accent2)}

.feedback{margin-top:60px;text-align:center}
.feedback a{display:inline-block;padding:14px 26px;border-radius:12px;background:linear-gradient(90deg,#8b5cf6,#a78bfa);color:white;text-decoration:none;font-weight:600}
footer{margin-top:60px;padding:20px;text-align:center;color:var(--muted)}
</style>
</head>

<body>
<nav>
<h1>COMEDK Rank Booster</h1>
</nav>

<div class="container">
<div class="hero">
<h2>Practice • Compete • Improve 🚀</h2>
<p>All COMEDK PYQs + Shifts + Mock Tests</p>
</div>

<div class="grid" id="cards"></div>

<div class="leaderboard">
<h2>🏆 Live Leaderboard</h2>
<table id="board">
<tr><th>Rank</th><th>Name</th><th>Test</th><th>Score</th></tr>
</table>
</div>

<div class="feedback">
<h2>Send Feedback / Bugs</h2><br>
<a href="https://t.me/Harvey_Spec7er" target="_blank">Message on Telegram</a>
</div>

<footer>Made for COMEDK Aspirants 💜</footer>
</div>

<!-- 🔐 LOGIN MODAL -->
<div id="loginBox" style="position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center">
  <div style="background:#15122b;padding:30px;border-radius:16px;width:320px;text-align:center">
    <h2>Login</h2><br>
    <input id="email" placeholder="Email" style="width:100%;padding:10px;margin:5px"><br>
    <input id="pass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:5px"><br>
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
/* ---------------- FIREBASE CONFIG ---------------- */
const firebaseConfig = {
  apiKey: "PASTE_KEY",
  authDomain: "PASTE.firebaseapp.com",
  projectId: "PASTE",
  storageBucket: "PASTE.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ---------------- AUTH ---------------- */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginBox").style.display="none";
    loadLeaderboard();
  }
});

function signup(){
  auth.createUserWithEmailAndPassword(email.value,pass.value)
  .then(()=>alert("Account created"))
  .catch(e=>alert(e.message));
}
function login(){
  auth.signInWithEmailAndPassword(email.value,pass.value)
  .catch(e=>alert(e.message));
}

/* ---------------- CLOUD LEADERBOARD ---------------- */
async function loadLeaderboard(){
  const snap = await db.collection("scores").orderBy("score","desc").limit(20).get();
  scores=[];
  snap.forEach(doc=>scores.push(doc.data()));
  updateBoard();
}

async function sendScoreToCloud(data){
  const user = auth.currentUser;
  if(!user) return;
  await db.collection("scores").add({
    name:data.name,
    test:data.test,
    score:data.score,
    uid:user.uid,
    time:Date.now()
  });
}

/* ---------------- RECEIVE SCORE FROM MOCK ---------------- */
window.addEventListener("focus", async ()=>{
  const pending = localStorage.getItem("pendingScore");
  if(!pending) return;
  const data = JSON.parse(pending);
  localStorage.removeItem("pendingScore");
  await sendScoreToCloud(data);
  loadLeaderboard();
});
</script>
</body>
</html>
