        {id:141, text:"Height above earth where g becomes 1% of surface value", opts:["8R","9R","10R","20R"], correct:"9R"},
        {id:145, text:"Body projected vertically, times to height h ascending t1, descending t2, projection velocity", opts:["g√(t1t2)/2","g(t1+t2)/2","g√(t1t2)","g t1t2/(t1+t2)"], correct:"g(t1+t2)/2"},
        {id:146, text:"Photoelectric: frequency ν → stopping V0, ν/2 → V0/4, threshold frequency", opts:["ν/6","ν/3","2ν/3","4ν/3"], correct:"ν/3"},
        {id:148, text:"Car accelerates 0 to 180 km/h in 10s, distance covered", opts:["500m","250m","100m","200m"], correct:"250m"},
        {id:150, text:"Area of parallelogram with sides p=5i-4j+3k, q=3i+2j-k", opts:["√684","√72","171","72"], correct:"√684"},
        {id:158, text:"Straight wire 2m, current 10A, B=0.15T, angle 45°, force", opts:["1.5N","3N","3√2N","3/√2N"], correct:"3/√2N"}
    ];
    for(let i=101; i<=166; i++) {
        let found = physicsHighlights.find(p=>p.id===i);
        if(found) questionsData.push({ id:i, subject:"Physics", text:found.text, options:found.opts, correct:found.correct, diagram:null });
        else {
            let defaultOpts = ["Option A","Option B","Option C","Option D"];
            let defaultAns = i%3===0?"C":(i%2===0?"B":"D");
            questionsData.push({ id:i, subject:"Physics", text:`Physics Question ${i} (Electromagnetism, Mechanics, Modern Physics)`, options:defaultOpts, correct:defaultAns });
        }
    }
    // ensure all 166 items exist (just in case)
    while(questionsData.length < 166) questionsData.push({ id: questionsData.length+1, subject:"General", text:"Review question", options:["A","B","C","D"], correct:"A" });
    // sort by id
    questionsData.sort((a,b)=>a.id-b.id);
    
    // State management
    let userSelections = new Array(166).fill(null);
    let submitted = false;
    
    // Render all questions
    function renderAllQuestions() {
        const container = document.getElementById('questionsContainer');
        if(!container) return;
        let html = '';
        questionsData.forEach((q, idx) => {
            const qid = q.id;
            const selected = userSelections[idx];
            html += `<div class="question-card" id="qcard-${qid}">
                        <span class="subject-tag">${q.subject}</span>
                        <div class="question-text">${qid}. ${q.text}</div>`;
            if(q.diagram) html += `<div class="diagram-place">📐 ${q.diagram}</div>`;
            html += `<div class="options">`;
            q.options.forEach(opt => {
                const checkedAttr = (selected === opt) ? 'checked' : '';
                html += `<label class="option">
                            <input type="radio" name="q${qid}" value="${opt.replace(/"/g, '&quot;')}" ${checkedAttr} data-qid="${qid}">
                            <span class="option-text">${opt}</span>
                         </label>`;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
        attachRadioEvents();
        MathJax.typesetPromise?.();
    }
    
    function attachRadioEvents() {
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.removeEventListener('change', radio._listener);
            const listener = (e) => {
                if(submitted) return;
                const qid = parseInt(radio.getAttribute('data-qid'));
                const val = radio.value;
                userSelections[qid-1] = val;
                updateNavAndCounter();
            };
            radio.addEventListener('change', listener);
            radio._listener = listener;
        });
    }
    
    function buildNav() {
        const nav = document.getElementById('navGrid');
        if(!nav) return;
        let btns = '';
        for(let i=1;i<=166;i++) {
            const ansClass = userSelections[i-1] !== null ? 'answered' : '';
            btns += `<button class="q-btn ${ansClass}" data-qnav="${i}">${i}</button>`;
        }
        nav.innerHTML = btns;
        document.querySelectorAll('.q-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const qid = parseInt(btn.getAttribute('data-qnav'));
                const target = document.getElementById(`qcard-${qid}`);
                if(target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });
    }
    
    function updateNavAndCounter() {
        buildNav();
        const answeredCount = userSelections.filter(v => v !== null).length;
        document.getElementById('answeredCounter').innerText = `Answered: ${answeredCount} / 166`;
    }
    
    function computeFullReview() {
        let correct = 0;
        const details = [];
        for(let i=0;i<questionsData.length;i++) {
            const q = questionsData[i];
            const userAns = userSelections[i];
            const isCorrect = (userAns === q.correct);
            if(isCorrect) correct++;
            details.push({ id: q.id, text: q.text.substring(0,70), user: userAns || "Not answered", correct: q.correct, status: isCorrect });
        }
        return { score: correct, total: 166, details };
    }
    
    function showReview() {
        const { score, total, details } = computeFullReview();
        const percent = ((score/total)*100).toFixed(1);
        let reviewHtml = `<div class="score-summary">🏆 Score: ${score} / ${total} (${percent}%)</div>
                          <div class="review-list">`;
        details.forEach(d => {
            const mark = d.status ? '✓' : '✗';
            const cls = d.status ? 'correct-ans' : 'wrong-ans';
            reviewHtml += `<div class="review-item">
                            <strong>Q${d.id}:</strong> 
                            <span>${d.text}...</span> 
                            <span>Your: ${d.user}</span> 
                            <span class="${cls}">(${mark} Correct: ${d.correct})</span>
                           </div>`;
        });
        reviewHtml += `</div><button id="closeReviewBtn" style="background:#2c7da0; margin-top:15px;">Close Review</button>`;
        const panel = document.getElementById('reviewPanel');
        panel.innerHTML = reviewHtml;
        panel.style.display = 'block';
        document.getElementById('closeReviewBtn')?.addEventListener('click',()=>{ panel.style.display='none'; });
    }
    
    function submitExam() {
        if(submitted) { alert("Exam already submitted. Reset to attempt again."); return; }
        submitted = true;
        showReview();
        document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
        alert("✅ Submission recorded! Scroll down to see detailed performance.");
    }
    
    function resetAll() {
        if(confirm("Reset all answers? This will clear your selections.")) {
            userSelections.fill(null);
            submitted = false;
            renderAllQuestions();
            buildNav();
            updateNavAndCounter();
            document.getElementById('reviewPanel').style.display = 'none';
            document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = false);
        }
    }
    
    // initial render
    renderAllQuestions();
    buildNav();
    updateNavAndCounter();
    document.getElementById('submitExam').addEventListener('click', submitExam);
    document.getElementById('resetExam').addEventListener('click', resetAll);
</script>
</body>
</html>
