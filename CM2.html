<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK Mock Test - CBT</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #1a73e8;
            --correct: #0d904f;
            --wrong: #d93025;
            --border: #e0e0e0;
            --text: #202124;
            --text-light: #5f6368;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: #1a1a2e;
            color: #fff;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header .timer {
            font-size: 1.1rem;
            font-weight: 600;
            background: #e94560;
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .header .stats {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .tab-nav {
            display: flex;
            gap: 4px;
            padding: 12px 24px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 60px;
            z-index: 99;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }
        .tab-btn {
            padding: 10px 20px;
            border: 2px solid transparent;
            background: #f8f9fa;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: var(--text-light);
            white-space: nowrap;
        }
        .tab-btn:hover {
            background: #e8f0fe;
            color: var(--primary);
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .tab-btn .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 4px;
        }
        .tab-btn.active .badge {
            background: rgba(255, 255, 255, 0.35);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 100px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 20px 0 12px;
            padding: 12px 20px;
            background: #fff;
            border-radius: var(--radius);
            border-left: 5px solid var(--primary);
            box-shadow: var(--shadow);
            color: #1a1a2e;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: all 0.25s;
            position: relative;
        }
        .question-card:hover {
            border-color: #d2e3fc;
        }
        .question-card.answered {
            border-color: #a8d0a8;
            background: #fafff9;
        }
        .question-card.reviewed-correct {
            border-color: var(--correct) !important;
            background: #e6f4ea !important;
        }
        .question-card.reviewed-wrong {
            border-color: var(--wrong) !important;
            background: #fce8e6 !important;
        }
        .q-num {
            display: inline-block;
            background: #1a1a2e;
            color: #fff;
            width: 34px;
            height: 34px;
            line-height: 34px;
            text-align: center;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: 10px;
        }
        .q-text {
            font-weight: 500;
            margin: 8px 0 12px;
            font-size: 1rem;
        }
        .q-image {
            text-align: center;
            margin: 10px 0;
        }
        .q-image svg {
            max-width: 100%;
            height: auto;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .option {
            flex: 1 1 120px;
            min-width: 100px;
        }
        .option label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.9rem;
            background: #fafafa;
            user-select: none;
        }
        .option label:hover {
            border-color: var(--primary);
            background: #e8f0fe;
        }
        .option input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .option input[type="radio"]:checked+span {
            color: var(--primary);
            font-weight: 700;
        }
        .option:has(input:checked) label {
            border-color: var(--primary);
            background: #d2e3fc;
        }
        .review-badge {
            display: none;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .reviewed-correct .review-badge.correct-badge {
            display: inline;
            background: #ceead6;
            color: #0d652d;
        }
        .reviewed-wrong .review-badge.wrong-badge {
            display: inline;
            background: #fce8e6;
            color: #a50e0e;
        }

        .submit-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 14px 24px;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
            z-index: 100;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 28px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-submit {
            background: var(--primary);
            color: #fff;
            font-size: 1.1rem;
            padding: 14px 40px;
        }
        .btn-submit:hover {
            background: #1557b0;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 115, 232, 0.35);
        }
        .btn-reset {
            background: #fff;
            color: var(--text);
            border: 2px solid #ccc;
        }
        .btn-reset:hover {
            border-color: #999;
            background: #f5f5f5;
        }
        .score-display {
            font-weight: 700;
            font-size: 1.1rem;
            padding: 8px 16px;
            background: #1a1a2e;
            color: #fff;
            border-radius: 24px;
            display: none;
        }
        .score-display.show {
            display: inline-block;
        }

        .explanation {
            display: none;
            margin-top: 8px;
            padding: 10px 14px;
            background: #fffde7;
            border-radius: 8px;
            font-size: 0.85rem;
            border-left: 4px solid #f9a825;
            color: #5d4037;
        }
        .reviewed-correct .explanation,
        .reviewed-wrong .explanation {
            display: block;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1rem;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 0.78rem;
            }
            .question-card {
                padding: 14px 12px;
            }
            .options {
                gap: 4px;
            }
            .option label {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .btn {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
        }
        .section-divider {
            text-align: center;
            padding: 20px;
            font-weight: 700;
            color: #fff;
            background: #1a1a2e;
            border-radius: var(--radius);
            margin: 20px 0 8px;
            letter-spacing: 1px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📝 COMEDK Mock Test</h1>
        <span class="stats">Physics 1-60 | Chemistry 61-120 | Maths 121-180</span>
        <span class="timer" id="timer">⏱ 180:00</span>
    </div>

    <div class="tab-nav" id="tabNav">
        <button class="tab-btn active" onclick="switchTab('physics')">⚛ Physics <span class="badge">1-60</span></button>
        <button class="tab-btn" onclick="switchTab('chemistry')">🧪 Chemistry <span class="badge">61-120</span></button>
        <button class="tab-btn" onclick="switchTab('maths')">📐 Maths <span class="badge">121-180</span></button>
    </div>

    <div class="container" id="questionContainer"></div>

    <div class="submit-section">
        <span class="score-display" id="scoreDisplay">Score: 0/180</span>
        <button class="btn btn-submit" onclick="submitTest()">✅ Submit & Review</button>
        <button class="btn btn-reset" onclick="resetTest()">🔄 Reset All</button>
        <span style="font-size:0.85rem;color:var(--text-light)" id="answeredCount">Answered: 0 / 180</span>
    </div>

    <script>
        // ============ QUESTION DATA ============
        // Storing all 180 questions compactly
        const answerKey = {
            physics: 'c,b,c,b,b,a,a,a,a,c,c,a,b,b,d,b,b,d,b,c,c,a,a,d,b,b,c,d,b,a,d,d,a,a,c,d,c,d,a,c,a,d,c,d,c,a,d,b,c,a,c,d,c,b,a,d,b,c,d,a'
                .split(','),
            chemistry: 'a,c,b,a,a,a,b,b,b,b,a,c,a,b,d,a,b,a,d,a,b,c,a,c,a,a,d,b,c,b,b,d,a,c,c,d,a,c,a,a,b,a,b,c,d,d,b,b,c,a,b,b,a,d,c,b,d,a,d'
                .split(','),
            maths: 'd,b,d,c,c,b,c,c,b,a,d,a,c,b,a,c,c,a,c,b,c,b,d,a,c,a,d,b,b,a,d,a,c,d,c,b,a,b,c,d,b,c,a,d,c,a,b,c,b,b,c,a,c,b,d,b,c,a,d,b,c,d,c,d,d,d,c,c,d'
                .split(',')
        };

        // Full answer mapping: qNumber -> correctOptionLetter
        const fullAnswerMap = {};
        // Physics 1-60
        const physAns = answerKey.physics;
        for (let i = 0; i < 60; i++) fullAnswerMap[i + 1] = physAns[i];
        // Chemistry 61-120
        const chemAns = answerKey.chemistry;
        for (let i = 0; i < 60; i++) fullAnswerMap[i + 61] = chemAns[i];
        // Maths 121-180
        const mathAns = answerKey.maths;
        for (let i = 0; i < 60; i++) fullAnswerMap[i + 121] = mathAns[i];

        // Question text data - organized by sections
        const physicsQuestions = [
            { id: 1,
                text: 'A helicopter rises vertically with a speed of 100 ms<sup>-1</sup>. If helicopter has length 10 m and horizontal component of earth\'s magnetic field is 5×10<sup>-3</sup> Wb m<sup>-2</sup>, then the induced emf between the tip of nose and tail of helicopter is',
                options: ['50 V', '0.5 V', '5 V', '25 V'], img: null },
            { id: 2,
                text: 'A stone is thrown at an angle θ with the horizontal reaches a maximum height H. Then the time of flight of stone will be',
                options: ['√(H/g)', '2√(2H/g)', '√(8H/g)', '√(4H/g)'], img: null },
            { id: 3,
                text: 'The resistance R<sub>t</sub> of a conductor varies with temperature t as shown in figure. If the variation is represented by R<sub>t</sub> = R<sub>0</sub>(1 + αt + βt²). Then,',
                options: ['α and β both are negative', 'α is positive but β is negative', 'α and β both are positive',
                    'α is negative but β is positive'
                ], img: 'graph_resistance' },
            { id: 4,
                text: 'Charge passing through a conductor of cross-section area A = 0.3 m² is given by q = (3t² + 5t + 2) C, where t is in second. What is the value of drift velocity at t = 2 s? (Take n = 2×10²⁵ /m³)',
                options: ['0.77×10⁻⁵ m/s', '1.77×10⁻⁵ m/s', '2.08×10⁵ m/s', '0.57×10⁵ m/s'], img: null },
            { id: 5,
                text: 'What is the magnetic field at the centre of arc in the figure below?',
                options: ['(μ₀/4π)(2I/r)[√2 + π]', '(μ₀/4π)(2I/r)[√2 + π/4]', '(μ₀/4π)(I/r)[√2 + π]',
                    '(μ₀/4π)(I/r)[√2 + π/4]'
                ], img: 'arc_magnetic' },
            { id: 6,
                text: 'A black body at 227°C radiates heat at a rate of 7 cal/cm²s. At a temperature of 727°C, the rate of heat radiated in the same units will be',
                options: ['112', '105', '101', '89'], img: null },
            { id: 7,
                text: 'An electric kettle has two heating coils. When one coil is connected, water boils in 10 min. When the other coil is used, water boils in 40 min. If both coils are connected in parallel, the time taken will be',
                options: ['8 min', '4 min', '25 min', '15 min'], img: null },
            { id: 8,
                text: 'The length of a simple pendulum executing SHM is increased by 21%. The percentage increase in the time period is',
                options: ['10%', '11%', '21%', '42%'], img: null },
            { id: 9,
                text: 'A particle executes SHM between x = −A and x = +A. Time taken from 0 to A/2 is T₁ and from A/2 to A is T₂. Then,',
                options: ['T₁ < T₂', 'T₁ > T₂', 'T₁ = T₂', 'T₁ = 2T₂'], img: null },
            { id: 10,
                text: 'A particle executes SHM with amplitude 4 cm. At mean position velocity is 10 cm/s. Distance from mean position when speed becomes 5 cm/s is',
                options: ['√3 cm', '√5 cm', '2√3 cm', '2√5 cm'], img: null },
            { id: 11,
                text: 'A column of air at 88°C and a tuning fork produce 6 beats/s. At 16°C they produce 1 beat/s. Frequency of tuning fork is',
                options: ['53.9 Hz', '97.7 Hz', '41.5 Hz', '87.7 Hz'], img: null },
            { id: 12,
                text: 'The magnetic field due to a straight conductor of uniform cross-section of radius a carrying steady current is represented by',
                options: ['Graph A (hyperbolic outside, linear inside)', 'Graph B', 'Graph C', 'Graph D'],
                img: 'mag_field_graph' },
            { id: 13,
                text: 'A thermodynamic system is taken through the cycle PQRSP. The net work done by the system is',
                options: ['6×10⁶ J', '−2×10⁶ J', '−6×10⁶ J', '2×10⁶ J'], img: 'thermo_cycle' },
            { id: 14,
                text: 'An EM wave propagates with velocity v = v i. The instantaneous oscillating electric field is along +Y-axis. Direction of oscillating magnetic field is along',
                options: ['−Y direction', '+Z direction', '−Z direction', '−X direction'], img: null },
            { id: 15, text: 'Which of the following processes is reversible?',
                options: ['Transfer of heat by radiation', 'Electrical heating of nichrome wire',
                    'Transfer of heat by conduction', 'Isothermal compression'
                ], img: null },
            { id: 16,
                text: 'A ray of light is incident at the glass-water interface and emerges parallel to the surface of water. The value of n<sub>g</sub> would be',
                options: ['(4/3) sin i', '1/sin i', '4/3', '1'], img: 'ray_diagram' },
            { id: 17, text: 'For what value of m<sub>a</sub> will the total power per cycle be maximum in the modulated wave?',
                options: ['0', '1', '1/2', 'greater than 1'], img: null },
            { id: 18,
                text: 'Young\'s double slit experiment with λ=6000 Å shows 16 fringes in a region. With another light 24 fringes occupy the same region. Then λ is',
                options: ['6000 Å', '4500 Å', '5000 Å', '4000 Å'], img: null },
            { id: 19,
                text: 'An iron block is on a boat floating in a pond. The block is thrown into water. The water level will be',
                options: ['equal to earlier level', 'less than earlier level', 'more than earlier level',
                    'depends on block size'
                ], img: null },
            { id: 20,
                text: 'Threshold wavelength is 380 nm. Incident wavelength is 260 nm. Maximum kinetic energy of emitted electrons is [Given E(eV)=1237/λ(nm)]',
                options: ['15.1 eV', '3.0 eV', '1.5 eV', '4.5 eV'], img: null },
            { id: 21, text: 'The graph shows behaviour of a wire obeying Hooke\'s law. P and Q represent:',
                options: ['P=applied force, Q=extension', 'P=extension, Q=applied force',
                    'P=extension, Q=stored elastic energy', 'P=stored elastic energy, Q=extension'
                ], img: 'hooke_graph' },
            { id: 22,
                text: 'Radiation of wavelength λ is incident on a photocell. Fastest electron has speed v. If wavelength changes to 3λ/4, the speed of fastest electron will be',
                options: ['v\' > v(4/3)^(1/2)', 'v\' = v', 'v\' < v', 'v\' = v(3/4)^(1/2)'], img: null },
            { id: 23,
                text: 'Two wires of same diameter, same material, lengths l and 2l. Force F applied on each. Ratio of work done is',
                options: ['1:2', '1:4', '2:1', '1:1'], img: null },
            { id: 24,
                text: 'A point source of light in photoelectric effect experiment. Which curve best represents variation of photoelectric current i with distance x?',
                options: ['Curve a', 'Curve b', 'Curve c', 'Curve d (inverse square)'], img: 'pe_curves' },
            { id: 25,
                text: 'A body projected vertically upwards with velocity equal to half escape velocity. Maximum height attained (R=radius of earth) is',
                options: ['R/6', 'R/3', '2R/3', 'R'], img: null },
            { id: 26,
                text: 'Binding energy of electron in hydrogen atom is 13.6 eV. Energy required to remove electron from first excited state of Li²⁺ is',
                options: ['122.4 eV', '30.6 eV', '13.6 eV', '3.4 eV'], img: null },
            { id: 27,
                text: 'A satellite in circular orbit of diameter 2R. Rocket fired tangentially increases velocity. Resulting orbit is',
                options: ['same as before', 'circular with diameter >2R',
                    'elliptical with minimum distance = R', 'elliptical with maximum distance = R'
                ], img: null },
            { id: 28, text: 'Transition from n=4 to n=3 gives UV. IR radiation obtained in transition:',
                options: ['2→1', '3→2', '1→2', '5→4'], img: null },
            { id: 29,
                text: 'Thin uniform circular disc mass M, radius R rotating with ω. Another disc mass M/4 placed co-axially. New angular velocity is',
                options: ['2ω/3', '4ω/5', '3ω/4', 'ω/3'], img: null },
            { id: 30,
                text: 'Nucleus A=240, E<sub>bn</sub>=7.6 MeV breaks into two fragments A=120, E<sub>bn</sub>=8.5 MeV. Released energy is around',
                options: ['216 MeV', '200 MeV', '100 MeV', 'Cannot be estimated'], img: null },
            { id: 31,
                text: 'Rigid body rotates with angular momentum L. If rotational kinetic energy becomes 4 times, angular momentum becomes',
                options: ['4L', '16L', '√2 L', '2L'], img: null },
            { id: 32,
                text: 'Mixture of A₁ (half-life 20s, 40g) and A₂ (half-life 10s, 160g). Amounts become equal after',

            { id: 33,
                text: 'Engine exerts force F=(20i−3j+5k)N and moves with v=(6i+20j−3k) m/s. Power in watt is',
                options: ['45', '75', '20', '10'], img: null },
            { id: 34, text: 'Electrical resistance to diffusion current in p-n junction depletion layer is large due to:',

                    'holes as charge carriers'
                ], img: null },
            { id: 35,
                text: 'A body moves from rest with constant acceleration. Which graph represents variation of kinetic energy K with distance x?',

            { id: 36,
                text: 'Angle of dip where horizontal and vertical components of earth\'s magnetic field are equal is',

            { id: 37,
                text: 'Two blocks 5kg and 3kg over smooth pulley in elevator accelerating upward. Man finds acceleration of blocks = 9g/32. Acceleration of elevator is',

            { id: 38, text: 'Relative permeability of X is slightly less than 1, Y is slightly more than 1. Then:',

                    'X and Y both paramagnetic', 'X diamagnetic, Y paramagnetic'

            { id: 39,
                text: 'Mass 3kg descending supports 2kg via string over pulley. After 5s string breaks. How high will 2kg go? (g=9.8 m/s²)',

            { id: 40,
                text: 'Circular coil expands radially in magnetic field, no emf produced. This can be because:',
                options: ['magnetic field is constant', 'magnetic field not in plane of coil',
                    'perpendicular component of B decreasing suitably', 'constant perpendicular magnetic field'

            { id: 41,
                text: 'For given velocity, projectile has same range R for two angles. If t₁ and t₂ are times of flight, then t₁t₂ equals',

            { id: 42, text: 'Graphs show variation of I<sub>m</sub> vs ω for four LCR circuits. Maximum quality factor is for:',
                options: ['Circuit A', 'Circuit B', 'Circuit C', 'Circuit D (sharpest resonance)'], img: 'resonance' },

            { id: 44,
                text: 'In series LCR AC circuit, voltage across L, C, R each is 20V. Voltage across L-C combination is',

            { id: 45,
                text: 'Girl walks up stationary escalator in t₁. Escalator takes her up in t₂. Time on moving escalator walking is',

            { id: 46,
                text: 'YDSE with λ=589.3 nm, screen 100 cm away, 10th bright fringe at 12 mm from central max. Slit separation is',

            { id: 47, text: 'Which diagram does NOT represent streamline flow?',
                options: ['Diagram A', 'Diagram B', 'Diagram C', 'Diagram D (crossing streamlines)'],
                img: 'streamline' },
            { id: 48,
                text: 'Lens of flint glass (n=1.5) immersed in liquid (n=1.25). Focal length:',
                options: ['increases by factor 1.25', 'increases by factor 2.5', 'increases by factor 1.2',
                    'decreases by factor 1.2'
                ], img: null },

                'proton_field': `<svg width="240" height="140" viewBox="0 0 240 140"><rect width="240" height="140" fill="#fff" rx="8"/><circle cx="60" cy="70" r="10" fill="#1a73e8"/><text x="55" y="75" font-size="8" fill="#fff">p⁺</text><text x="100" y="65" font-size="11" fill="#333">—E→</text><circle cx="180" cy="70" r="10" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="4"/></svg>`,
                'maxwell_curve': `<svg width="260" height="160" viewBox="0 0 260 160"><rect width="260" height="160" fill="#fff" rx="8"/><path d="M30,140 Q100,20 180,40 Q240,100 250,130" fill="none" stroke="#1a73e8" stroke-width="2.5"/><circle cx="130" cy="55" r="4" fill="#d93025"/><text x="120" y="45" font-size="10" fill="#d93025">A (most probable)</text></svg>`,
                'ozonolysis': `<svg width="260" height="120" viewBox="0 0 260 120"><rect width="260" height="120" fill="#fff" rx="8"/><text x="20" y="40" font-size="11" fill="#333">CH≡CH →(O₃/NaOH)→ (X)</text><text x="20" y="70" font-size="11" fill="#333">(X) →(Zn/CH₃COOH)→ HOCH₂−CH₂OH (Y)</text></svg>`,

            return svgs[imgId] || '';
        }

        // ============ RENDER QUESTIONS ============
        let currentTab = 'physics';
        let userAnswers = {}; // {questionId: selectedOptionIndex}
        let testSubmitted = false;

        function getSectionQuestions(tab) {
            if (tab === 'physics') return physicsQuestions;
            if (tab === 'chemistry') return chemistryQuestions;
            return mathsQuestions;
        }

        function renderQuestions(tab) {
            const container = document.getElementById('questionContainer');
            const questions = getSectionQuestions(tab);
            const sectionNames = { physics: 'PHYSICS', chemistry: 'CHEMISTRY', maths: 'MATHEMATICS' };
            const sectionRanges = { physics: '1 – 60', chemistry: '61 – 120', maths: '121 – 180' };

            let html = `<div class="section-title">${sectionNames[tab]} <span style="font-weight:400;font-size:0.9rem;">Questions ${sectionRanges[tab]}</span></div>`;

            questions.forEach(q => {
                const qNum = q.id;
                const answered = userAnswers[qNum] !== undefined;
                const isCorrect = testSubmitted && userAnswers[qNum] !== undefined && String.fromCharCode(
                    97 + userAnswers[qNum]) === fullAnswerMap[qNum];
                const isWrong = testSubmitted && userAnswers[qNum] !== undefined && String.fromCharCode(97 + userAnswers[
                    qNum]) !== fullAnswerMap[qNum];

                let cardClass = 'question-card';
                if (testSubmitted && isCorrect) cardClass += ' reviewed-correct';
                if (testSubmitted && isWrong) cardClass += ' reviewed-wrong';
                if (!testSubmitted && answered) cardClass += ' answered';

                html += `<div class="${cardClass}" id="qcard-${qNum}">`;
                html +=
                    `<span class="q-num">${qNum}</span> <span class="review-badge correct-badge">✓ Correct</span><span class="review-badge wrong-badge">✗ Correct: ${fullAnswerMap[qNum].toUpperCase()}</span>`;
                html += `<div class="q-text">${q.text}</div>`;
                if (q.img) {
                    html += `<div class="q-image">${getSVG(q.img)}</div>`;
                }
                html += `<div class="options">`;
                const letters = ['a', 'b', 'c', 'd'];
                q.options.forEach((opt, idx) => {
                    const checked = userAnswers[qNum] === idx ? 'checked' : '';
                    const disabled = testSubmitted ? 'disabled' : '';
                    html += `<div class="option">
                <label>
                  <input type="radio" name="q${qNum}" value="${idx}" ${checked} ${disabled} onchange="selectAnswer(${qNum}, ${idx})">
                  <span>${letters[idx]}) ${opt}</span>
                </label>
              </div>`;
                });
                html += `</div>`;
                if (testSubmitted && (isCorrect || isWrong)) {
                    html +=
                        `<div class="explanation"><strong>Correct Answer:</strong> ${fullAnswerMap[qNum].toUpperCase()}) ${q.options[letters.indexOf(fullAnswerMap[qNum])]}</div>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
            updateAnsweredCount();
        }

        function selectAnswer(qNum, optIndex) {
            if (testSubmitted) return;
            userAnswers[qNum] = optIndex;
            const card = document.getElementById('qcard-' + qNum);
            if (card) {
                card.classList.add('answered');
            }
            updateAnsweredCount();
        }

        function updateAnsweredCount() {
            const count = Object.keys(userAnswers).length;
            document.getElementById('answeredCount').textContent = `Answered: ${count} / 180`;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const tabButtons = document.querySelectorAll('.tab-btn');
            if (tab === 'physics') tabButtons[0].classList.add('active');
            if (tab === 'chemistry') tabButtons[1].classList.add('active');
            if (tab === 'maths') tabButtons[2].classList.add('active');
            renderQuestions(tab);
            document.getElementById('questionContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function submitTest() {
            if (testSubmitted) {
                if (confirm('Test already submitted. Reset to try again?')) {
                    resetTest();
                }
                return;
            }
            const unanswered = 180 - Object.keys(userAnswers).length;
            if (unanswered > 0 && !confirm(
                    `You have ${unanswered} unanswered questions. Are you sure you want to submit?`)) {
                return;
            }
            testSubmitted = true;
            let score = 0;
            for (let qNum = 1; qNum <= 180; qNum++) {
                if (userAnswers[qNum] !== undefined && String.fromCharCode(97 + userAnswers[qNum]) ===
                    fullAnswerMap[qNum]) {
                    score++;
                }
            }
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = `Score: ${score}/180 (${Math.round(score/180*100)}%)`;
            scoreDisplay.classList.add('show');
            renderQuestions(currentTab);
            document.getElementById('questionContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetTest() {
            if (testSubmitted && !confirm('Reset all answers and start over?')) return;
            userAnswers = {};
            testSubmitted = false;
            document.getElementById('scoreDisplay').classList.remove('show');
            document.getElementById('scoreDisplay').textContent = 'Score: 0/180';
            renderQuestions(currentTab);
            document.getElementById('questionContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============ TIMER ============
        let totalSeconds = 180 * 60; // 180 minutes
        const timerEl = document.getElementById('timer');

        function updateTimer() {
            if (totalSeconds <= 0) {
                timerEl.textContent = '⏱ 00:00';
                if (!testSubmitted) {
                    alert('Time is up! Test will be auto-submitted.');
                    submitTest();
                }
                return;
            }
            totalSeconds--;
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            timerEl.textContent = `⏱ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            if (totalSeconds < 300) {
                timerEl.style.background = '#ff6b6b';
                timerEl.style.animation = 'pulse 1s infinite';
            }
        }
        setInterval(updateTimer, 1000);

        // ============ KEYBOARD NAVIGATION ============
        document.addEventListener('keydown', function(e) {
            if (testSubmitted) return;
            const key = e.key.toLowerCase();
            if (['a', 'b', 'c', 'd'].includes(key)) {
                const idx = key.charCodeAt(0) - 97;
                const visibleCards = document.querySelectorAll('.question-card');
                if (visibleCards.length > 0) {
                    const firstCard = visibleCards[0];
                    const qNumMatch = firstCard.id.match(/qcard-(\d+)/);
                    if (qNumMatch) {
                        const qNum = parseInt(qNumMatch[1]);
                        const radio = document.querySelector(`input[name="q${qNum}"][value="${idx}"]`);
                        if (radio && !radio.disabled) {
                            radio.checked = true;
                            selectAnswer(qNum, idx);
                        }
                    }
                }
            }
        });

        // ============ INIT ============
        renderQuestions('physics');
        updateTimer();
        console.log('✅ COMEDK CBT loaded! 180 questions ready.');
        console.log('📋 Features: Tab navigation | Answer selection | Submit & Review | Timer | Keyboard shortcuts (A,B,C,D)');
    </script>
