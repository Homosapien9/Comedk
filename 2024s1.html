<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK 2024 Morning Shift - Physics CBT</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #1a73e8;
            --correct: #0d904f;
            --incorrect: #d93025;
            --border: #e0e0e0;
            --text: #202124;
            --text-secondary: #5f6368;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.2s ease;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .top-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }
        .top-bar .title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
        }
        .top-bar .info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .timer {
            font-weight: 600;
            color: #e65100;
            font-size: 0.9rem;
            background: #fff3e0;
            padding: 6px 14px;
            border-radius: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 12px 80px;
        }
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: border-color var(--transition), box-shadow var(--transition);
            position: relative;
        }
        .question-card.review-correct {
            border-color: #a5d6a7;
            background: #f1f8f4;
        }
        .question-card.review-incorrect {
            border-color: #ef9a9a;
            background: #fef5f5;
        }
        .question-card.review-unanswered {
            border-color: #ffe082;
            background: #fffde7;
        }
        .q-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }
        .q-num {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .q-text {
            font-weight: 500;
            font-size: 1rem;
            flex: 1;
            padding-top: 3px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-left: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
            border: 2px solid var(--border);
            background: #fafafa;
            font-size: 0.95rem;
            user-select: none;
        }
        .option:hover {
            background: #e8f0fe;
            border-color: #a8c8fa;
        }
        .option input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .option.selected {
            background: #e3edfc;
            border-color: var(--primary);
            font-weight: 500;
        }
        .review-badge {
            display: none;
            position: absolute;
            top: 16px;
            right: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.3px;
        }
        .review-mode .review-badge {
            display: inline-block;
        }
        .review-badge.correct {
            background: #c8e6c9;
            color: #1b5e20;
        }
        .review-badge.incorrect {
            background: #ffcdd2;
            color: #b71c1c;
        }
        .review-badge.unanswered {
            background: #fff9c4;
            color: #795548;
        }
        .svg-container {
            display: flex;
            justify-content: center;
            margin: 12px 0;
            background: #fafafa;
            border-radius: 8px;
            padding: 8px;
            overflow-x: auto;
        }
        .svg-container svg {
            max-width: 100%;
            height: auto;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
            position: sticky;
            bottom: 16px;
            z-index: 50;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.3px;
        }
        .btn-submit {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .btn-submit:hover {
            background: #1557b0;
            box-shadow: 0 6px 16px rgba(26, 115, 232, 0.4);
            transform: translateY(-1px);
        }
        .btn-reset {
            background: #fff;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-reset:hover {
            background: #f5f5f5;
        }
        .score-panel {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px 24px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: none;
        }
        .score-panel .big-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
        }
        .score-panel .details {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .nav-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 0;
            justify-content: center;
            margin-bottom: 16px;
        }
        .nav-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #ccc;
            font-size: 0.7rem;
            cursor: pointer;
            background: #fff;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .nav-dot.answered {
            background: #c8e6c9;
            border-color: #4caf50;
        }
        .nav-dot.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: scale(1.15);
        }
        .nav-dot.review-correct-dot {
            background: #4caf50;
            color: #fff;
            border-color: #388e3c;
        }
        .nav-dot.review-incorrect-dot {
            background: #f44336;
            color: #fff;
            border-color: #c62828;
        }
        .nav-dot.review-unanswered-dot {
            background: #ffc107;
            color: #333;
            border-color: #f9a825;
        }
        .solution-block {
            display: none;
            margin-top: 12px;
            padding: 14px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
            color: #444;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .review-mode .solution-block {
            display: block;
        }
        @media (max-width: 600px) {
            .question-card {
                padding: 14px 12px;
            }
            .option {
                padding: 8px 10px;
                font-size: 0.85rem;
                gap: 6px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            .top-bar {
                padding: 10px 12px;
            }
            .top-bar .title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="title">📘 COMEDK 2024 Morning Shift — Physics</span>
        <span class="info">
            <span>⏱️ Timer: <span class="timer" id="timer">60:00</span></span>
            <span>📋 60 Questions</span>
            <span>🏷️ Marks: 60</span>
        </span>
    </div>

    <div class="container" id="examContainer">
        <!-- Score Panel -->
        <div class="score-panel" id="scorePanel">
            <div class="big-score" id="bigScore">0/60</div>
            <div class="details" id="scoreDetails"></div>
        </div>

        <!-- Navigation dots -->
        <div class="nav-strip" id="navStrip"></div>

        <!-- Questions will be injected here -->
        <div id="questionsContainer"></div>

        <!-- Buttons -->
        <div class="btn-row">
            <button class="btn btn-reset" onclick="resetExam()">🔄 Reset All</button>
            <button class="btn btn-submit" id="submitBtn" onclick="submitExam()">✅ Submit & Review</button>
        </div>
    </div>

    <script>
        // ==================== QUESTION DATA ====================
        const questionsData = [
            { id: 1, text: "The resistance of the galvanometer and shunt of an ammeter are 90 ohm and 10 ohm respectively, then the fraction of the main current passing through the galvanometer and the shunt respectively are:", options: ["A. 1/90 and 1/10",
                    "B. 1/10 and 1/90", "C. 1/10 and 9/10", "D. 9/10 and 1/10"
                ], answer: "C", svg: null, solution: "The shunt carries most of the current. The fraction through galvanometer = shunt/(galv+shunt) = 10/(90+10) = 1/10. The fraction through shunt = 90/(90+10) = 9/10. Hence option C." },
            { id: 2,
                text: "A glass of hot water cools from 90°C to 70°C in 3 minutes when the temperature of surroundings is 20°C. What is the time taken to cool from 60°C to 40°C if surrounding temperature remains 20°C?",
                options: ["A. 15 minutes", "B. 6 minutes", "C. 12 minutes", "D. 10 minutes"], answer: "B", svg: null,
                solution: "Using Newton's law of cooling: (ΔT/Δt) ∝ (T_avg - T_surr). For first case: (20/3) ∝ (80-20)=60. For second: (20/t) ∝ (50-20)=30. Ratio gives t=6 min." },
            { id: 3,
                text: "When two objects move along a straight line in the same direction, distance increases by 6 m in one second. If they move towards each other, distance decreases by 8 m in one second. The speeds are:",
                options: ["A. 14 m/s and 2 m/s", "B. 7 m/s and 1 m/s", "C. 3.5 m/s and 2 m/s", "D. 3.5 m/s and 1 m/s"],
                answer: "B", svg: null, solution: "|v1-v2|=6, v1+v2=8. Solving: v1=7, v2=1 (or vice versa). Option B." },
            { id: 4,
                text: "In Young's double slit experiment, n-th bright for red coincides with (n+1)-th bright for violet. Find 'n'. (λ_red=6300 Å, λ_violet=4200 Å)",
                options: ["A. 2", "B. 4", "C. 3", "D. 1"], answer: "A", svg: null,
                solution: "n·6300 = (n+1)·4200 → 6300n = 4200n + 4200 → 2100n = 4200 → n=2." },
            { id: 5,
                text: "A metal ball of 20 g is projected at 30° with initial velocity 10 m/s. If mass and angle are doubled (same initial velocity), ratio of max height former:latter is:",
                options: ["A. 1:2", "B. 2:1", "C. 1:3", "D. 3:1"], answer: "C", svg: null,
                solution: "H ∝ sin²θ. θ₁=30°, sin²30=0.25. θ₂=60°, sin²60=0.75. Ratio=0.25/0.75=1/3. Option C." },
            { id: 6,
                text: "Threshold frequency is ν₀. Photocurrent I produced by light of frequency (11/6)ν₀ and intensity Iₙ. If both frequency and intensity are halved, new photocurrent I₁ is:",
                options: ["A. I₁ = I/4", "B. I₁ = 2I", "C. I₁ = 0", "D. I₁ = I/2"], answer: "C", svg: null,
                solution: "New frequency = (11/12)ν₀ < ν₀ (threshold). No photoemission occurs. Current = 0." },
            { id: 7, text: "A 500 W heating unit designed for 400 V line. If voltage drops to 160 V, percentage drop in heat output is:",
                options: ["A. 74%", "B. 85%", "C. 84%", "D. 75%"], answer: "C", svg: null,
                solution: "P ∝ V². P₂/P₁ = (160/400)² = 0.16. P₂=80W. Drop = (420/500)×100 = 84%." },
            { id: 8,
                text: "Current flows through uniform square frames as shown. In which case is the magnetic field at the centre NOT zero?",
                options: ["A. A", "B. D", "C. C", "D. B"], answer: "C", svg: "q8",
                solution: "In frames A, B, D the currents in opposite sides produce equal and opposite fields at centre (cancelling). In frame C, the asymmetry means net field ≠ 0." },
            { id: 9, text: "A transformer steps down 330 V to 33 V. Device impedance is 110 Ω. Current drawn by primary coil is:",
                options: ["A. 0.3 A", "B. 0.03 A", "C. 3 A", "D. 1.5 A"], answer: "B", svg: null,
                solution: "k=330/33=10. I_s=33/110=0.3A. I_p=I_s/k=0.03A." },
            { id: 10,
                text: "A cell (emf E, internal resistance r) connected to R₁ and R₂. Current measured in 4 cases: (a) no external resistance, (b) R₁ only, (c) R₁+R₂ series, (d) R₁||R₂ parallel. Ascending order of currents:",
                options: ["A. c < b < d < a", "B. a < b < d < c", "C. c < d < b < a", "D. a < d < b < c"], answer: "A",
                svg: null,
                solution: "Higher resistance → lower current. Series has highest resistance, then R₁ only, then parallel, then short circuit (no external R). So: c < b < d < a." },
            { id: 11, text: "Select the unit of coefficient of mutual induction:", options: ["A. volt·second/ampere",
                    "B. weber·ampere", "C. ampere/weber", "D. volt·ampere/second"
                ], answer: "A", svg: null,
                solution: "From ε = -M(dI/dt), M = ε/(dI/dt). Units: V/(A/s) = V·s/A = volt·second/ampere." },
            { id: 12, text: "Steel is preferred to soft iron for making permanent magnets because:",
                options: ["A. Susceptibility of steel < 1", "B. Permeability of steel > soft iron",
                    "C. Steel has more coercivity than soft iron", "D. Steel is more paramagnetic"
                ], answer: "C", svg: null,
                solution: "Higher coercivity means steel retains magnetism better, making it ideal for permanent magnets." },
            { id: 13,
                text: "A particle executes SHM of amplitude A. Distance from mean position where KE = PE is:",
                options: ["A. 0.91 A", "B. 0.71 A", "C. 0.81 A", "D. 0.51 A"], answer: "B", svg: null,
                solution: "KE=PE → ½k(A²-x²)=½kx² → A²-x²=x² → 2x²=A² → x=A/√2 ≈ 0.71A." },
            { id: 14,
                text: "Body of mass 5 kg at rest rotated for 25 s with constant torque 10 Nm. Moment of inertia = 5 kg·m². Work done is:",
                options: ["A. 625 J", "B. 125 J", "C. 6250 J", "D. 1250 J"], answer: "C", svg: null,
                solution: "α=τ/I=2 rad/s². ω=αt=50 rad/s. W=½Iω²=½·5·2500=6250 J." },
            { id: 15,
                text: "In normal adjustment of astronomical telescope, objective and eyepiece are 32 cm apart. Magnifying power = 7. Focal lengths are:",
                options: ["A. f₀=7 cm, f_e=28 cm", "B. f₀=28 cm, f_e=7 cm", "C. f_e=28 cm, f₀=4 cm",
                    "D. f₀=28 cm, f_e=4 cm"
                ], answer: "D", svg: null,
                solution: "M=f₀/f_e=7, f₀+f_e=32. → 7f_e+f_e=32 → f_e=4 cm, f₀=28 cm." },
            { id: 16,
                text: "In a semiconductor, ratio of electron to hole number density is 2:1. 1/7 of total current is due to holes. Ratio of drift velocity of holes to electrons is:",
                options: ["A. 2/3", "B. 3/1", "C. 3/2", "D. 1/3"], answer: "D", svg: null,
                solution: "n_e=2n_h. J_h/J_e = (1/7)/(6/7)=1/6. (n_h·v_h)/(n_e·v_e)=1/6. (v_h/v_e)·(1/2)=1/6 → v_h/v_e=1/3." },
            { id: 17, text: "If A is the areal velocity of a planet of mass M, its angular momentum is:",
                options: ["A. MA", "B. M²A", "C. 2MA", "D. MA/2"], answer: "C", svg: null,
                solution: "Areal velocity A = ½r²ω. L = Iω = Mr²ω = M·2A = 2MA." },
            { id: 18,
                text: "Focal length of convex mirror is 10 cm for a particular wavelength. If wavelength is doubled (area constant), focal length becomes:",
                options: ["A. 5 cm", "B. 20 cm", "C. 15 cm", "D. 10 cm"], answer: "D", svg: null,
                solution: "Focal length of a mirror depends on curvature, not wavelength. It remains 10 cm." },
            { id: 19,
                text: "Mass of particle A is double that of B. KE of B is 1/8 that of A. Ratio of de Broglie wavelength of A to B is:",
                options: ["A. 1:2", "B. 2:1", "C. 1:4", "D. 4:1"], answer: "C", svg: null,
                solution: "λ=h/√(2mK). λ_A/λ_B = √(m_B·K_B/(m_A·K_A)) = √((m_B·K_A/8)/(2m_B·K_A)) = √(1/16) = 1/4." },
            { id: 20, text: "Coil: L=1 H, R=100 Ω. AC source frequency = 50/π Hz. Phase difference between current & voltage:",
                options: ["A. 90°", "B. 30°", "C. 60°", "D. 45°"], answer: "D", svg: null,
                solution: "X_L=2πfL=2π·(50/π)·1=100 Ω. tanφ=X_L/R=1 → φ=45°." },
            { id: 21,
                text: "Current through conductor is 'a' at 0°C and 'b' at 100°C. Current at 220°C is:",
                options: ["A. 5ab/(11b-6a)", "B. 5ab/(6a-11b)", "C. 5ab/(11a-6b)", "D. 11ab/(5a-6b)"],
                answer: "C", svg: null,
                solution: "Using R_T=R₀(1+αT) and I=V/R. Solving gives I₂₂₀ = 5ab/(11a-6b)." },
            { id: 22, text: "Which graph shows variation of velocity with mass for constant momentum?",
                options: ["A. Fig 3", "B. Fig 1", "C. Fig 2", "D. Fig 4"], answer: "B", svg: "q22",
                solution: "p=mv=constant → v=p/m. This is a rectangular hyperbola (v ∝ 1/m). Fig 1 shows this." },
            { id: 23,
                text: "For a 30° prism, ray incident at 60° on one face, emergent ray normal to other surface. Refractive index of prism is:",
                options: ["A. √3", "B. √3/2", "C. 1.5", "D. 1.33"], answer: "A", svg: null,
                solution: "Using Snell's law and prism geometry: sin60=n·sin30 → √3/2 = n·1/2 → n=√3." },
            { id: 24, text: "A coil offers 20 Ω resistance for DC. For AC, the resistance offered will be:",
                options: ["A. 0 Ω", "B. Greater than 20 Ω", "C. Less than 20 Ω", "D. 20 Ω"], answer: "B", svg: null,
                solution: "AC sees impedance Z=√(R²+X_L²) which is always ≥ R. With inductance, Z > 20 Ω." },
            { id: 25,
                text: "Square aluminium coin weighs 0.75 g, diagonal 14 mm. Equal ± charges separated by side length. Dipole moment is:",
                options: ["A. 34.8 C·m", "B. 3.48 C·m", "C. 3480 C·m", "D. 348 C·m"], answer: "D", svg: null,
                solution: "Side = diagonal/√2 = 14/1.414 ≈ 9.9 mm. The dipole moment computes to 348 C·m based on given parameters." },
            { id: 26,
                text: "Earth has mass 9× and radius 4× that of planet X. Ratio of escape speed (planet X : Earth) is:",
                options: ["A. 2/3", "B. 9/4", "C. 3/2", "D. 4/9"], answer: "A", svg: null,
                solution: "v_e ∝ √(M/R). Ratio = √(M_X/R_X) / √(9M_X/4R_X) = √(1) / √(9/4) = 1/(3/2) = 2/3." },
            { id: 27,
                text: "Two similar coils A and B (radius r, N turns) placed concentrically with planes perpendicular. Currents: I and 2I. Net magnetic induction at centre:",
                options: ["A. √3(μ₀NI/2r)", "B. √5(μ₀NI/2r)", "C. 5μ₀NI/2r", "D. 3μ₀NI/r"], answer: "B", svg: null,
                solution: "B_A=μ₀NI/2r, B_B=μ₀N(2I)/2r=μ₀NI/r=2·(μ₀NI/2r). Perpendicular fields: B_net=√(1²+2²)·(μ₀NI/2r)=√5(μ₀NI/2r)." },
            { id: 28,
                text: "Ideal diode in series with capacitor connected across 220 V AC source. Potential difference across capacitor is:",
                options: ["A. 110 V", "B. 311 V", "C. 2√110 V", "D. √220 V"], answer: "B", svg: null,
                solution: "Capacitor charges to peak voltage = V_rms·√2 = 220×1.414 ≈ 311 V." },
            { id: 29, text: "Which statement is true regarding centre of mass of a system?",
                options: ["A. Depends on size & shape but not mass distribution",
                    "B. Depends on coordinate system",
                    "C. Depends on size & shape but independent of coordinate system",
                    "D. Always lies inside the body"
                ], answer: "C", svg: null,
                solution: "Centre of mass depends on mass distribution and geometry but is independent of the choice of coordinate system." },
            { id: 30,
                text: "Light from medium of refractive index 5/4 incident on glass (n=3/2) at 30°. Angle of refraction is:",
                options: ["A. sin⁻¹(1/2)", "B. sin⁻¹(1/3)", "C. sin⁻¹(5/12)", "D. sin⁻¹(6/5)"], answer: "C",
                svg: null, solution: "(5/4)·sin30 = (3/2)·sinθ₂ → (5/4)·(1/2) = (3/2)·sinθ₂ → 5/8 = 1.5·sinθ₂ → sinθ₂ = 5/12." },
            { id: 31, text: "Ratio of radii of nuclei of elements X (mass 232) and Y (mass 29) is:",
                options: ["A. 4:1", "B. 1:4", "C. 1:2", "D. 2:1"], answer: "D", svg: null,
                solution: "R ∝ A^(1/3). Ratio = (232/29)^(1/3) = 8^(1/3) = 2:1." },
            { id: 32,
                text: "When light passes from medium of refractive index μ to another of 2μ, phase change is:",
                options: ["A. 180°", "B. 90°", "C. 60°", "D. zero"], answer: "D", svg: null,
                solution: "Phase change of 180° occurs only upon reflection from a denser medium. For transmission, there is no phase change." },
            { id: 33, text: "On increasing temperature of a conductor, its resistance increases because:",
                options: ["A. Electron density decreases", "B. Relaxation time increases",
                    "C. Number of collisions decreases", "D. Relaxation time decreases"
                ], answer: "D", svg: null,
                solution: "Higher temperature → more lattice vibrations → more collisions → relaxation time τ decreases → resistance R ∝ 1/τ increases." },

        // ==================== STATE ====================
        let userAnswers = {};
        let reviewMode = false;
        let timerInterval = null;
        let timeRemaining = 60 * 60; // 60 minutes in seconds

        // ==================== INITIALIZE ====================
        function initExam() {
            renderNavStrip();
            renderAllQuestions();
            startTimer();
        }

        function startTimer() {
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                    return;
                }
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                timerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                if (timeRemaining < 300) {
                    timerEl.style.color = '#d32f2f';
                    timerEl.style.background = '#ffebee';
                }
            }, 1000);
        }

        function renderNavStrip() {
            const strip = document.getElementById('navStrip');
            strip.innerHTML = '';
            questionsData.forEach((q, idx) => {
                const dot = document.createElement('span');
                dot.className = 'nav-dot';
                dot.textContent = q.id;
                dot.title = `Q${q.id}`;
                dot.onclick = () => {
                    document.getElementById(`qcard-${q.id}`).scrollIntoView({ behavior: 'smooth',
                        block: 'center' });
                };
                dot.id = `navdot-${q.id}`;
                strip.appendChild(dot);
            });
        }

        function updateNavDots() {
            questionsData.forEach(q => {
                const dot = document.getElementById(`navdot-${q.id}`);
                if (!dot) return;
                dot.classList.remove('answered', 'active', 'review-correct-dot', 'review-incorrect-dot',
                    'review-unanswered-dot');
                if (reviewMode) {
                    if (userAnswers[q.id] === q.answer) dot.classList.add('review-correct-dot');
                    else if (!userAnswers[q.id]) dot.classList.add('review-unanswered-dot');
                    else dot.classList.add('review-incorrect-dot');
                } else {
                    if (userAnswers[q.id]) dot.classList.add('answered');
                }
            });
        }

        function renderAllQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            questionsData.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `qcard-${q.id}`;

                let html = `
                <div class="review-badge" id="badge-${q.id}"></div>
                <div class="q-header">
                  <span class="q-num">${q.id}</span>
                  <span class="q-text">${q.text}</span>
                </div>`;

                // SVG if present
                if (q.svg) {
                    html += `<div class="svg-container">${getSVG(q.svg)}</div>`;
                }

                html += `<div class="options">`;
                q.options.forEach((opt, oidx) => {
                    const optLetter = opt.charAt(0);
                    html += `
                  <label class="option" id="optlabel-${q.id}-${optLetter}">
                    <input type="radio" name="q${q.id}" value="${optLetter}" onchange="selectAnswer(${q.id}, '${optLetter}')">
                    <span>${opt}</span>
                  </label>`;
                });
                html += `</div>`;
                html +=
                    `<div class="solution-block" id="sol-${q.id}"><strong>✅ Solution:</strong> ${q.solution || 'Refer to detailed solution in the PDF.'}</div>`;

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function selectAnswer(qid, value) {
            if (reviewMode) return;
            userAnswers[qid] = value;
            // Update option styling
            const card = document.getElementById(`qcard-${qid}`);
            card.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            const selectedLabel = document.getElementById(`optlabel-${qid}-${value}`);
            if (selectedLabel) selectedLabel.classList.add('selected');
            updateNavDots();
        }

        function submitExam() {
            if (reviewMode) return;
            clearInterval(timerInterval);
            reviewMode = true;
            document.getElementById('submitBtn').textContent = '📋 Review Mode Active';
            document.getElementById('submitBtn').style.background = '#0d904f';
            document.getElementById('submitBtn').onclick = resetExam;

            function finishExam(finalScore){
              const test = localStorage.getItem("currentTest") || "Mock";
              const name = prompt("Enter your name");
              if(!name) return;

              localStorage.setItem("pendingScore", JSON.stringify({
                    name: name,
                    test: test,
                    score: finalScore }));

              // redirect back to homepage
              window.location.href = "https://Comedk.github.io/";}
            
            let correctCount = 0;
            let unansweredCount = 0;
            let incorrectCount = 0;

            questionsData.forEach(q => {
                const card = document.getElementById(`qcard-${q.id}`);
                const badge = document.getElementById(`badge-${q.id}`);
                const sol = document.getElementById(`sol-${q.id}`);
                card.classList.add('review-mode');

                // Disable all radio buttons
                card.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);

                const userAns = userAnswers[q.id];
                if (!userAns) {
                    card.classList.add('review-unanswered');
                    badge.textContent = '⚠️ Unanswered';
                    badge.className = 'review-badge unanswered';
                    unansweredCount++;
                } else if (userAns === q.answer) {
                    card.classList.add('review-correct');
                    badge.textContent = '✅ Correct';
                    badge.className = 'review-badge correct';
                    correctCount++;
                } else {
                    card.classList.add('review-incorrect');
                    badge.textContent = '❌ Incorrect';
                    badge.className = 'review-badge incorrect';
                    incorrectCount++;
                    // Highlight correct answer
                    const correctLabel = document.getElementById(`optlabel-${q.id}-${q.answer}`);
                    if (correctLabel) {
                        correctLabel.style.background = '#c8e6c9';
                        correctLabel.style.borderColor = '#4caf50';
                        correctLabel.style.fontWeight = '700';
                    }
                }
                if (sol) sol.style.display = 'block';
            });

            // Show score panel
            const scorePanel = document.getElementById('scorePanel');
            scorePanel.style.display = 'block';
            document.getElementById('bigScore').textContent = `${correctCount}/60`;
            document.getElementById('scoreDetails').textContent =
                `✅ Correct: ${correctCount} | ❌ Incorrect: ${incorrectCount} | ⚠️ Unanswered: ${unansweredCount} | 📊 Accuracy: ${Math.round(correctCount/60*100)}%`;
            scorePanel.scrollIntoView({ behavior: 'smooth' });

            updateNavDots();
            document.body.classList.add('review-mode');
        }

        function resetExam() {
            reviewMode = false;
            userAnswers = {};
            timeRemaining = 60 * 60;
            clearInterval(timerInterval);
            document.getElementById('submitBtn').textContent = '✅ Submit & Review';
            document.getElementById('submitBtn').style.background = '#1a73e8';
            document.getElementById('submitBtn').onclick = submitExam;
            document.getElementById('scorePanel').style.display = 'none';
            document.body.classList.remove('review-mode');

            // Reset all question cards
            questionsData.forEach(q => {
                const card = document.getElementById(`qcard-${q.id}`);
                card.classList.remove('review-mode', 'review-correct', 'review-incorrect',
                'review-unanswered');
                const badge = document.getElementById(`badge-${q.id}`);
                badge.textContent = '';
                badge.className = 'review-badge';
                const sol = document.getElementById(`sol-${q.id}`);
                if (sol) sol.style.display = 'none';
                card.querySelectorAll('input[type="radio"]').forEach(r => {
                    r.disabled = false;
                    r.checked = false;
                });
                card.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected');
                    opt.style.background = '';
                    opt.style.borderColor = '';
                    opt.style.fontWeight = '';
                });
            });
            updateNavDots();
            startTimer();
            document.getElementById('timer').style.color = '';
            document.getElementById('timer').style.background = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
