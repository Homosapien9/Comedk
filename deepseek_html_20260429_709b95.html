<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>COMEDK 2012 - CBT Mock Test</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --primary: #1a56db;
            --primary-light: #e8f0fe;
            --correct: #0d904f;
            --wrong: #d93025;
            --border: #ddd;
            --text: #202124;
            --text-light: #5f6368;
            --radius: 6px;
            --shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            --header-bg: #1a56db;
            --submit-red: #dc2626;
            --font: Arial, sans-serif;
            --tap-min: 48px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 0;
        }

        /* ============ HEADER ============ */
        .header {
            background: var(--header-bg);
            color: #fff;
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: nowrap;
            min-height: 52px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 1;
            min-width: 0;
        }
        .avatar-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .candidate-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .test-title {
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .timer-box {
            background: #0d3b8c;
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            transition: background 0.3s;
            min-width: 90px;
            text-align: center;
        }
        .timer-box.warning {
            background: #dc2626;
            animation: pulse-timer 0.8s infinite;
        }
        @keyframes pulse-timer {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        .header-right {
            flex-shrink: 0;
        }
        .btn-submit-header {
            background: var(--submit-red);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.3px;
            white-space: nowrap;
            min-height: var(--tap-min);
            transition: background 0.2s;
        }
        .btn-submit-header:hover {
            background: #b91c1c;
        }

        /* ============ SUBJECT TABS ============ */
        .subject-tabs {
            display: flex;
            background: #fff;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 52px;
            z-index: 150;
            gap: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            box-shadow: var(--shadow);
        }
        .subject-tabs::-webkit-scrollbar {
            display: none;
        }
        .subj-tab {
            flex: 1 1 0;
            min-width: 80px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            border: none;
            background: transparent;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
            min-height: var(--tap-min);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .subj-tab:hover {
            background: #f8f9fa;
            color: var(--primary);
        }
        .subj-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 700;
        }
        .subj-tab .tab-count {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-light);
        }
        .subj-tab.active .tab-count {
            color: var(--primary);
        }

        /* ============ MAIN LAYOUT ============ */
        .main-layout {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px 20px;
            gap: 14px;
            min-height: calc(100vh - 200px);
        }
        .question-panel {
            flex: 1 1 72%;
            min-width: 0;
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .palette-sidebar {
            flex: 0 0 250px;
            width: 250px;
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 14px 10px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: flex-start;
            position: sticky;
            top: 120px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }
        .palette-title {
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text);
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .palette-name {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-light);
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            justify-items: center;
        }
        .palette-btn {
            width: 100%;
            aspect-ratio: 1;
            min-width: 20px;
            min-height: 24px;
            max-height: 28px;
            border-radius: 3px;
            border: 1px solid #ccc;
            background: #e0e0e0;
            cursor: pointer;
            font-size: 0.6rem;
            font-weight: 600;
            color: #555;
            transition: all 0.1s;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .palette-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(26, 86, 219, 0.2);
        }
        .palette-btn.visited-unanswered {
            background: #fca5a5;
            border-color: #ef4444;
            color: #7f1d1d;
        }
        .palette-btn.answered {
            background: #86efac;
            border-color: #22c55e;
            color: #14532d;
        }
        .palette-btn.current {
            box-shadow: 0 0 0 3px #1a56db;
            border-color: #1a56db;
            z-index: 2;
            position: relative;
            font-weight: 700;
            font-size: 0.65rem;
        }
        .palette-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.65rem;
            color: var(--text-light);
            justify-content: center;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid #999;
            flex-shrink: 0;
        }
        .legend-dot.gray {
            background: #e0e0e0;
        }
        .legend-dot.red {
            background: #fca5a5;
            border-color: #ef4444;
        }
        .legend-dot.green {
            background: #86efac;
            border-color: #22c55e;
        }

        /* ============ QUESTION PANEL ELEMENTS ============ */
        .q-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .q-counter {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
        }
        .q-subject-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .q-text {
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.6;
            color: var(--text);
            padding: 4px 0;
        }
        .q-image {
            text-align: center;
            margin: 6px 0;
        }
        .q-image svg {
            max-width: 100%;
            height: auto;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .opt-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 500;
            font-size: 0.95rem;
            background: #fafafa;
            user-select: none;
            min-height: 52px;
            -webkit-tap-highlight-color: transparent;
        }
        .opt-row:hover {
            border-color: var(--primary);
            background: #f0f4ff;
        }
        .opt-row.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            font-weight: 700;
        }
        .opt-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e0e0e0;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .opt-row.selected .opt-letter {
            background: var(--primary);
            color: #fff;
        }
        .opt-text {
            flex: 1;
            min-width: 0;
        }
        .nav-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
            justify-content: center;
        }
        .btn-nav {
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.15s;
            letter-spacing: 0.2px;
            min-height: var(--tap-min);
            white-space: nowrap;
            background: #fff;
            color: var(--text);
        }
        .btn-nav:hover {
            border-color: #999;
            background: #f5f5f5;
        }
        .btn-save-next {
            background: #22c55e;
            color: #fff;
            border-color: #22c55e;
            font-weight: 700;
        }
        .btn-save-next:hover {
            background: #16a34a;
            border-color: #16a34a;
        }
        .btn-clear {
            background: #fff;
            color: #dc2626;
            border-color: #dc2626;
        }
        .btn-clear:hover {
            background: #fef2f2;
        }
        .btn-prev {
            background: #fff;
            color: var(--text);
            border-color: #ccc;
        }

        /* ============ MOBILE PALETTE DRAWER ============ */
        .mobile-palette-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 300;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        .mobile-palette-overlay.open {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .mobile-palette-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            z-index: 310;
            border-radius: 16px 16px 0 0;
            padding: 14px 16px 24px;
            box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.2);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 75vh;
            overflow-y: auto;
        }
        .mobile-palette-drawer.open {
            transform: translateY(0);
        }
        .drawer-handle {
            width: 40px;
            height: 5px;
            background: #ccc;
            border-radius: 3px;
            margin: 0 auto 10px;
        }
        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .drawer-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #666;
            padding: 4px 10px;
            min-height: 40px;
            min-width: 40px;
        }
        .mobile-palette-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 5px;
            justify-items: center;
        }
        .mobile-palette-grid .palette-btn {
            min-height: 28px;
            max-height: 32px;
            font-size: 0.6rem;
        }
        .mobile-toggle-btn {
            display: none;
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 250;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 28px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(26, 86, 219, 0.4);
            letter-spacing: 0.3px;
            min-height: var(--tap-min);
        }
        .mobile-toggle-btn:active {
            transform: scale(0.95);
        }

        /* ============ RESULTS SCREEN ============ */
        .results-container {
            max-width: 700px;
            margin: 24px auto;
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .results-container h2 {
            font-size: 1.4rem;
            color: var(--text);
            margin-bottom: 6px;
        }
        .results-container .big-score {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -1px;
        }
        .results-container .score-sub {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 16px;
        }
        .results-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }
        .stat-chip {
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 2px solid #e0e0e0;
        }
        .stat-chip.correct {
            background: #e6f4ea;
            border-color: #22c55e;
            color: #0d652d;
        }
        .stat-chip.wrong {
            background: #fce8e6;
            border-color: #ef4444;
            color: #a50e0e;
        }
        .stat-chip.unattempted {
            background: #f5f5f5;
            border-color: #ccc;
            color: #666;
        }
        .subject-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.85rem;
        }
        .subject-table th,
        .subject-table td {
            border: 1px solid var(--border);
            padding: 10px 8px;
            text-align: center;
        }
        .subject-table th {
            background: #f0f4ff;
            font-weight: 700;
            color: var(--primary);
        }
        .subject-table td {
            font-weight: 500;
        }
        .name-input-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .name-input-row input {
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: var(--font);
            min-height: var(--tap-min);
            flex: 1;
            max-width: 240px;
        }
        .name-input-row button {
            padding: 10px 18px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            min-height: var(--tap-min);
            font-size: 0.9rem;
        }
        .results-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 14px;
        }
        .btn-retake {
            padding: 12px 24px;
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            min-height: var(--tap-min);
            font-size: 0.9rem;
        }
        .btn-home {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            min-height: var(--tap-min);
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-retake:hover {
            background: var(--primary-light);
        }
        .btn-home:hover {
            background: #1345b0;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .palette-sidebar {
                display: none !important;
            }
            .mobile-toggle-btn {
                display: block;
            }
            .main-layout {
                flex-direction: column;
                padding: 8px 8px 80px;
                gap: 8px;
            }
            .question-panel {
                padding: 12px 10px;
                border-radius: 4px;
            }
            .q-text {
                font-size: 0.95rem;
            }
            .opt-row {
                padding: 10px 10px;
                font-size: 0.88rem;
                min-height: 50px;
                gap: 8px;
            }
            .opt-letter {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
            .btn-nav {
                padding: 8px 10px;
                font-size: 0.78rem;
                min-height: 44px;
            }
            .header {
                padding: 6px 8px;
                min-height: 46px;
                gap: 4px;
            }
            .candidate-name {
                font-size: 0.75rem;
                max-width: 90px;
            }
            .avatar-circle {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .test-title {
                font-size: 0.78rem;
            }
            .timer-box {
                font-size: 0.78rem;
                padding: 5px 8px;
                min-width: 72px;
            }
            .btn-submit-header {
                font-size: 0.75rem;
                padding: 6px 10px;
                min-height: 38px;
            }
            .subj-tab {
                font-size: 0.72rem;
                padding: 8px 4px;
                min-height: 42px;
            }
            .subject-tabs {
                top: 46px;
            }
            .nav-buttons {
                gap: 4px;
            }
            .mobile-palette-grid {
                grid-template-columns: repeat(12, 1fr);
                gap: 4px;
            }
            .mobile-palette-grid .palette-btn {
                min-height: 24px;
                max-height: 30px;
                font-size: 0.55rem;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 4px 6px;
                min-height: 42px;
                gap: 2px;
            }
            .candidate-name {
                font-size: 0.7rem;
                max-width: 70px;
            }
            .avatar-circle {
                width: 24px;
                height: 24px;
                font-size: 0.65rem;
            }
            .test-title {
                font-size: 0.7rem;
            }
            .timer-box {
                font-size: 0.7rem;
                padding: 4px 6px;
                min-width: 64px;
                letter-spacing: 0.5px;
            }
            .btn-submit-header {
                font-size: 0.7rem;
                padding: 5px 8px;
                min-height: 34px;
            }
            .subj-tab {
                font-size: 0.65rem;
                padding: 6px 3px;
                min-height: 38px;
            }
            .subj-tab .tab-count {
                font-size: 0.6rem;
            }
            .subject-tabs {
                top: 42px;
            }
            .question-panel {
                padding: 10px 6px;
            }
            .q-text {
                font-size: 0.88rem;
            }
            .opt-row {
                padding: 8px 8px;
                font-size: 0.82rem;
                min-height: 46px;
                gap: 6px;
            }
            .opt-letter {
                width: 26px;
                height: 26px;
                font-size: 0.75rem;
            }
            .btn-nav {
                padding: 7px 8px;
                font-size: 0.72rem;
                min-height: 40px;
            }
            .mobile-palette-grid {
                grid-template-columns: repeat(10, 1fr);
                gap: 3px;
            }
            .mobile-palette-grid .palette-btn {
                min-height: 22px;
                max-height: 26px;
                font-size: 0.5rem;
            }
            .results-container .big-score {
                font-size: 2.2rem;
            }
            .results-container {
                padding: 14px 10px;
                margin: 10px 4px;
            }
            .subject-table th,
            .subject-table td {
                padding: 6px 4px;
                font-size: 0.7rem;
            }
        }

        /* ============ MISC ============ */
        .hidden {
            display: none !important;
        }
        .no-scroll {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- ============ HEADER ============ -->
    <header class="header" id="mainHeader">
        <div class="header-left">
            <div class="avatar-circle" id="avatarInit">👤</div>
            <span class="candidate-name" id="headerName">Candidate</span>
        </div>
        <div class="header-center">
            <span class="test-title">COMEDK 2012</span>
            <span class="timer-box" id="timerBox">03:00:00</span>
        </div>

                'ray_diagram': `<svg width="280" height="160" viewBox="0 0 280 160"><rect width="280" height="160" fill="#fff" rx="8"/><rect x="60" y="20" width="80" height="100" fill="#d2e3fc" rx="4"/><text x="70" y="75" font-size="10" fill="#333">Glass n_g</text><rect x="140" y="20" width="80" height="100" fill="#e8f5e9" rx="4"/><text x="150" y="75" font-size="10" fill="#333">Water n_w</text><line x1="20" y1="40" x2="100" y2="55" stroke="#d93025" stroke-width="2"/></svg>`,

                'proton_field': `<svg width="240" height="140" viewBox="0 0 240 140"><rect width="240" height="140" fill="#fff" rx="8"/><circle cx="60" cy="70" r="10" fill="#1a73e8"/><text x="55" y="75" font-size="8" fill="#fff">p⁺</text><text x="100" y="65" font-size="11" fill="#333">—E→</text><circle cx="180" cy="70" r="10" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="4"/></svg>`,
                'maxwell_curve': `<svg width="260" height="160" viewBox="0 0 260 160"><rect width="260" height="160" fill="#fff" rx="8"/><path d="M30,140 Q100,20 180,40 Q240,100 250,130" fill="none" stroke="#1a73e8" stroke-width="2.5"/><circle cx="130" cy="55" r="4" fill="#d93025"/><text x="120" y="45" font-size="10" fill="#d93025">A (most probable)</text></svg>`,
                'ozonolysis': `<svg width="260" height="120" viewBox="0 0 260 120"><rect width="260" height="120" fill="#fff" rx="8"/><text x="20" y="40" font-size="11" fill="#333">CH≡CH →(O₃/NaOH)→ (X)</text><text x="20" y="70" font-size="11" fill="#333">(X) →(Zn/CH₃COOH)→ HOCH₂−CH₂OH (Y)</text></svg>`,
            };
            return svgs[imgId] || '';
        }

        // ============================================================
        // ============ GLOBAL STATE ============
        // ============================================================
        let userAnswers = {}; // {questionId: optionIndex}
        let visitedQuestions = new Set(); // Set of question IDs visited
        let currentGlobalIndex = 0; // 0-179
        let testSubmitted = false;
        let totalSeconds = 180 * 60;
        let timerInterval = null;

        // ============================================================
        // ============ HELPER FUNCTIONS ============
        // ============================================================
        function getQuestionByIndex(index) {
            return allQuestions[index];
        }
        function getSubjectForIndex(index) {
            if (index < 60) return 'physics';
            if (index < 120) return 'chemistry';
            return 'maths';
        }
        function getSubjectName(subject) {
            return { physics: 'Physics', chemistry: 'Chemistry', maths: 'Mathematics' } [subject];
        }
        function getSubjectStartIndex(subject) {
            if (subject === 'physics') return 0;
            if (subject === 'chemistry') return 60;
            return 120;
        }
        function getAnsweredCountInRange(start, end) {
            let count = 0;
            for (let i = start; i < end; i++) {
                const qId = allQuestions[i].id;
                if (userAnswers[qId] !== undefined) count++;
            }
            return count;
        }

        // ============================================================
        // ============ RENDER QUESTION PANEL ============
        // ============================================================
        function renderQuestionPanel() {
            const panel = document.getElementById('questionPanel');
            const q = getQuestionByIndex(currentGlobalIndex);
            const qNum = q.id;
            const subject = getSubjectForIndex(currentGlobalIndex);
            const totalInSubject = 60;
            const subjectStart = getSubjectStartIndex(subject);
            const qInSubject = currentGlobalIndex - subjectStart + 1;

            // Mark as visited
            visitedQuestions.add(qNum);

            const selectedIdx = userAnswers[qNum];
            const letters = ['A', 'B', 'C', 'D'];

            let html = '';
            // Meta row
            html += `<div class="q-meta">`;
            html += `<span class="q-counter">Question ${qNum} of 180</span>`;
            html +=
                `<span class="q-subject-badge">${getSubjectName(subject)} — Q${qInSubject}/${totalInSubject}</span>`;
            html += `</div>`;

            // Question text
            html += `<div class="q-text">${q.text}</div>`;

            // Image if any
            if (q.img) {
                html += `<div class="q-image">${getSVG(q.img)}</div>`;
            }

            // Options
            html += `<div class="options-list">`;
            q.options.forEach((opt, idx) => {
                const isSelected = selectedIdx === idx;
                html += `<div class="opt-row${isSelected ? ' selected' : ''}" onclick="selectOption(${qNum}, ${idx})" id="optRow-${qNum}-${idx}">
              <span class="opt-letter">${letters[idx]}</span>
              <span class="opt-text">${opt}</span>
            </div>`;
            });
            html += `</div>`;

            // Navigation buttons
            html += `<div class="nav-buttons">`;
            html +=
                `<button class="btn-nav btn-save-next" onclick="saveAndNext()" style="min-width:120px;">🟢 Save &amp; Next</button>`;
            html +=
                `<button class="btn-nav btn-clear" onclick="clearResponse()" style="min-width:100px;">🔴 Clear Response</button>`;
            if (currentGlobalIndex > 0) {
                html +=
                    `<button class="btn-nav btn-prev" onclick="goToPrevious()" style="min-width:100px;">⬅ Previous</button>`;
            }
            html += `</div>`;

            panel.innerHTML = html;

            // Update palette highlights
            updatePaletteHighlights();
            updateSubjectTabs();
            updateHeaderName();
        }

        // ============================================================
        // ============ OPTION SELECTION ============
        // ============================================================
        function selectOption(qNum, optIndex) {
            if (testSubmitted) return;
            userAnswers[qNum] = optIndex;
            visitedQuestions.add(qNum);
            // Update UI for current question
            const allOptRows = document.querySelectorAll('.opt-row');
            allOptRows.forEach(row => row.classList.remove('selected'));
            const selectedRow = document.getElementById('optRow-' + qNum + '-' + optIndex);
            if (selectedRow) selectedRow.classList.add('selected');
            // Update all opt-letter backgrounds
            const letters = ['A', 'B', 'C', 'D'];
            for (let i = 0; i < 4; i++) {
                const row = document.getElementById('optRow-' + qNum + '-' + i);
                if (row) {
                    const letterSpan = row.querySelector('.opt-letter');
                    if (letterSpan) {
                        if (i === optIndex) {
                            letterSpan.style.background = '#1a56db';
                            letterSpan.style.color = '#fff';
                        } else {
                            letterSpan.style.background = '#e0e0e0';
                            letterSpan.style.color = '#202124';
                        }
                    }
                }
            }
            updatePaletteHighlights();
            updateSubjectTabs();
        }

        // ============================================================
        // ============ NAVIGATION ============
        // ============================================================
        function saveAndNext() {
            if (testSubmitted) return;
            if (currentGlobalIndex < 179) {
                currentGlobalIndex++;
                renderQuestionPanel();
                document.getElementById('questionPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                // At last question, ask if they want to submit
                if (confirm('You are at the last question. Submit the test?')) {
                    submitTest();
                }
            }
        }
        function clearResponse() {
            if (testSubmitted) return;
            const q = getQuestionByIndex(currentGlobalIndex);
            const qNum = q.id;
            if (userAnswers[qNum] !== undefined) {
                delete userAnswers[qNum];
                // Reset UI
                const allOptRows = document.querySelectorAll('.opt-row');
                allOptRows.forEach(row => row.classList.remove('selected'));
                const letters = ['A', 'B', 'C', 'D'];
                for (let i = 0; i < 4; i++) {
                    const row = document.getElementById('optRow-' + qNum + '-' + i);
                    if (row) {
                        const letterSpan = row.querySelector('.opt-letter');
                        if (letterSpan) {
                            letterSpan.style.background = '#e0e0e0';
                            letterSpan.style.color = '#202124';
                        }
                    }
                }
                updatePaletteHighlights();
                updateSubjectTabs();
            }
        }
        function goToPrevious() {
            if (testSubmitted) return;
            if (currentGlobalIndex > 0) {
                currentGlobalIndex--;
                renderQuestionPanel();
                document.getElementById('questionPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        function jumpToQuestion(qNum) {
            if (testSubmitted) return;
            const idx = qNum - 1;
            if (idx >= 0 && idx < 180) {
                currentGlobalIndex = idx;
                renderQuestionPanel();
                document.getElementById('questionPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Close mobile drawer if open
                closeMobileDrawer();
            }
        }
        function jumpToSubject(subject) {
            if (testSubmitted) return;
            currentGlobalIndex = getSubjectStartIndex(subject);
            renderQuestionPanel();
            document.getElementById('questionPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Update active tab
            document.querySelectorAll('.subj-tab').forEach(t => t.classList.remove('active'));
            const tabMap = { physics: 0, chemistry: 1, maths: 2 };
            const tabBtns = document.querySelectorAll('.subj-tab');
            if (tabBtns[tabMap[subject]]) tabBtns[tabMap[subject]].classList.add('active');
            closeMobileDrawer();
        }

        // ============================================================
        // ============ PALETTE ============
        // ============================================================
        function buildPalette() {
            const desktopGrid = document.getElementById('paletteGridDesktop');
            const mobileGrid = document.getElementById('paletteGridMobile');
            let desktopHTML = '';
            let mobileHTML = '';
            for (let qNum = 1; qNum <= 180; qNum++) {
                desktopHTML +=
                    `<button class="palette-btn" id="palBtnD-${qNum}" onclick="jumpToQuestion(${qNum})" title="Q${qNum}">${qNum}</button>`;
                mobileHTML +=
                    `<button class="palette-btn" id="palBtnM-${qNum}" onclick="jumpToQuestion(${qNum})" title="Q${qNum}">${qNum}</button>`;
            }
            desktopGrid.innerHTML = desktopHTML;
            mobileGrid.innerHTML = mobileHTML;
            updatePaletteHighlights();
        }
        function updatePaletteHighlights() {
            const currentQNum = getQuestionByIndex(currentGlobalIndex).id;
            for (let qNum = 1; qNum <= 180; qNum++) {
                const btnD = document.getElementById('palBtnD-' + qNum);
                const btnM = document.getElementById('palBtnM-' + qNum);
                const isAnswered = userAnswers[qNum] !== undefined;
                const isVisited = visitedQuestions.has(qNum);
                const isCurrent = qNum === currentQNum;
                [btnD, btnM].forEach(btn => {
                    if (!btn) return;
                    btn.classList.remove('visited-unanswered', 'answered', 'current');
                    if (isAnswered) btn.classList.add('answered');
                    else if (isVisited) btn.classList.add('visited-unanswered');
                    if (isCurrent) btn.classList.add('current');
                });
            }
        }
        function updateSubjectTabs() {
            const physCount = getAnsweredCountInRange(0, 60);
            const chemCount = getAnsweredCountInRange(60, 120);
            const mathCount = getAnsweredCountInRange(120, 180);
            document.getElementById('tabCountPhysics').textContent = `(${physCount}/60)`;
            document.getElementById('tabCountChemistry').textContent = `(${chemCount}/60)`;
            document.getElementById('tabCountMaths').textContent = `(${mathCount}/60)`;
            // Update active tab based on current question
            const subject = getSubjectForIndex(currentGlobalIndex);
            document.querySelectorAll('.subj-tab').forEach(t => t.classList.remove('active'));
            const tabMap = { physics: 0, chemistry: 1, maths: 2 };
            const tabBtns = document.querySelectorAll('.subj-tab');
            if (tabBtns[tabMap[subject]]) tabBtns[tabMap[subject]].classList.add('active');
        }
        function updateHeaderName() {
            const name = localStorage.getItem('comedk_username') || 'Candidate';
            document.getElementById('headerName').textContent = name;
            document.getElementById('paletteName').textContent = name;
            const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || '👤';
            document.getElementById('avatarInit').textContent = initials;
        }

        // ============================================================
        // ============ MOBILE DRAWER ============
        // ============================================================
        function openMobileDrawer() {
            if (testSubmitted) return;
            document.getElementById('mobileOverlay').classList.add('open');
            document.getElementById('mobileDrawer').classList.add('open');
            document.body.classList.add('no-scroll');
            updatePaletteHighlights();
        }
        function closeMobileDrawer() {
            document.getElementById('mobileOverlay').classList.remove('open');
            document.getElementById('mobileDrawer').classList.remove('open');
            document.body.classList.remove('no-scroll');
        }

        // ============================================================
        // ============ SUBMIT & RESULTS ============
        // ============================================================
        function submitTest() {
            if (testSubmitted) return;
            const unanswered = 180 - Object.keys(userAnswers).length;
            if (unanswered > 0 && !confirm(
                    `You have ${unanswered} unanswered question(s). Are you sure you want to submit?`)) {
                return;
            }
            if (!confirm('Final confirmation: Submit the test? This action cannot be undone.')) return;

            testSubmitted = true;
            clearInterval(timerInterval);
            let score = 0;
            let correctCount = 0;
            let wrongCount = 0;
            const subjectScores = { physics: { correct: 0, wrong: 0, unattempted: 0 },
                chemistry: { correct: 0, wrong: 0, unattempted: 0 }, maths: { correct: 0, wrong: 0, unattempted: 0 } };

            for (let qNum = 1; qNum <= 180; qNum++) {
                const subject = qNum <= 60 ? 'physics' : qNum <= 120 ? 'chemistry' : 'maths';
                if (userAnswers[qNum] !== undefined) {
                    const userLetter = String.fromCharCode(97 + userAnswers[qNum]);
                    if (userLetter === fullAnswerMap[qNum]) {
                        score++;
                        correctCount++;
                        subjectScores[subject].correct++;
                    } else {
                        wrongCount++;
                        subjectScores[subject].wrong++;
                    }
                } else {
                    subjectScores[subject].unattempted++;
                }
            }
            const unattemptedCount = 180 - correctCount - wrongCount;
            const accuracy = score + '/180 (' + Math.round(score / 180 * 100) + '%)';

            // Save to localStorage
            const bestKey = 'comedk_best_score_2012';
            const prevBest = parseInt(localStorage.getItem(bestKey) || '0');
            if (score > prevBest) {
                localStorage.setItem(bestKey, score);
            }
            const attemptedTests = parseInt(localStorage.getItem('comedk_attempted_tests') || '0');
            localStorage.setItem('comedk_attempted_tests', attemptedTests + 1);

            // Show results
            showResultsScreen(score, correctCount, wrongCount, unattemptedCount, subjectScores, accuracy);

            // Save to Firebase
            const name = localStorage.getItem('comedk_username') || 'Anonymous';
            if (typeof window.saveScoreToFirebase === 'function') {
                setTimeout(() => {
                    window.saveScoreToFirebase(name, '2012', score, 180, accuracy);
                }, 500);
            } else {
                console.warn('Firebase not ready yet. Score will not be saved to leaderboard.');
            }

            // Update header
            document.getElementById('headerSubmitBtn').textContent = 'Submitted';
            document.getElementById('headerSubmitBtn').disabled = true;
            document.getElementById('headerSubmitBtn').style.opacity = '0.6';
        }

        function showResultsScreen(score, correctCount, wrongCount, unattemptedCount, subjectScores, accuracy) {
            // Hide main layout
            document.getElementById('mainLayout').classList.add('hidden');
            document.getElementById('mobileToggleBtn').classList.add('hidden');
            document.getElementById('mobileOverlay').classList.remove('open');
            document.getElementById('mobileDrawer').classList.remove('open');
            document.body.classList.remove('no-scroll');

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.classList.remove('hidden');

            const name = localStorage.getItem('comedk_username') || '';
            const showNamePrompt = !name;

            let html = `<h2>📊 Test Results — COMEDK 2012</h2>`;
            html += `<div class="big-score">${score} / 180</div>`;
            html += `<div class="score-sub">Accuracy: ${Math.round(score/180*100)}%</div>`;
            html += `<div class="results-stats">`;
            html +=
                `<span class="stat-chip correct">✅ Correct: ${correctCount}</span>`;
            html +=
                `<span class="stat-chip wrong">❌ Incorrect: ${wrongCount}</span>`;
            html +=
                `<span class="stat-chip unattempted">⬜ Unattempted: ${unattemptedCount}</span>`;
            html += `</div>`;

            // Subject-wise table
            html += `<table class="subject-table">`;
            html +=
                `<tr><th>Subject</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Unattempted</th></tr>`;
            const subjects = ['physics', 'chemistry', 'maths'];
            const subjectNames = ['⚛ Physics', '🧪 Chemistry', '📐 Mathematics'];
            subjects.forEach((subj, i) => {
                const s = subjectScores[subj];
                html +=
                    `<tr><td><strong>${subjectNames[i]}</strong></td><td>${s.correct}/60</td><td>${s.correct}</td><td>${s.wrong}</td><td>${s.unattempted}</td></tr>`;
            });
            html += `</table>`;

            // Name prompt if not set
            if (showNamePrompt) {
                html += `<div style="margin-top:12px;font-weight:600;">Enter your name for the leaderboard:</div>`;
                html += `<div class="name-input-row">`;
                html +=
                    `<input type="text" id="nameInput" placeholder="Your Name" maxlength="40" autocomplete="off">`;
                html += `<button onclick="saveNameAndRetry()">💾 Save Name</button>`;
                html += `</div>`;
            }

            html += `<div class="results-buttons">`;
            html += `<button class="btn-retake" onclick="retakeTest()">🔄 Retake Test</button>`;
            html +=
                `<a href="index.html" class="btn-home">🏠 Back to Home</a>`;
            html += `</div>`;

            // Firebase status
            html +=
                `<p style="font-size:0.75rem;color:#888;margin-top:12px;">Score saved to leaderboard${showNamePrompt ? ' (name required)' : ' as "'+name+'"'}.</p>`;

            resultsContainer.innerHTML = html;
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function saveNameAndRetry() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            if (!name) {
                alert('Please enter a valid name.');
                return;
            }
            localStorage.setItem('comedk_username', name);
            updateHeaderName();
            // Resubmit score with new name
            const score = parseInt(document.querySelector('.big-score').textContent.split(' ')[0]) || 0;
            const accuracy = Math.round(score / 180 * 100) + '%';
            if (typeof window.saveScoreToFirebase === 'function') {
                window.saveScoreToFirebase(name, '2012', score, 180, score + '/180 (' + accuracy + ')');
            }
            // Refresh results screen
            location.reload();
        }

        function retakeTest() {
            userAnswers = {};
            visitedQuestions = new Set();
            currentGlobalIndex = 0;
            testSubmitted = false;
            totalSeconds = 180 * 60;
            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('mainLayout').classList.remove('hidden');
            document.getElementById('mobileToggleBtn').classList.remove('hidden');
            document.getElementById('headerSubmitBtn').textContent = 'Submit Test';
            document.getElementById('headerSubmitBtn').disabled = false;
            document.getElementById('headerSubmitBtn').style.opacity = '1';
            const timerBox = document.getElementById('timerBox');
            timerBox.classList.remove('warning');
            timerBox.textContent = '03:00:00';
            clearInterval(timerInterval);
            startTimer();
            renderQuestionPanel();
            buildPalette();
            updateSubjectTabs();
            updateHeaderName();
            document.getElementById('mainLayout').scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Recalculate answered counts
        }

        // ============================================================
        // ============ TIMER ============
        // ============================================================
        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return String(hrs).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2,
                '0');
        }
        function updateTimerDisplay() {
            const timerBox = document.getElementById('timerBox');
            timerBox.textContent = formatTime(totalSeconds);
            if (totalSeconds < 300) {
                timerBox.classList.add('warning');
            } else {
                timerBox.classList.remove('warning');
            }
        }
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    updateTimerDisplay();
                    if (!testSubmitted) {
                        alert('⏰ Time is up! Test will be auto-submitted.');
                        submitTest();
                    }
                    return;
                }
                totalSeconds--;
                updateTimerDisplay();
            }, 1000);
        }

        // ============================================================
        // ============ KEYBOARD SHORTCUTS ============
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (testSubmitted) return;
            const key = e.key.toLowerCase();
            if (['a', 'b', 'c', 'd'].includes(key)) {
                const idx = key.charCodeAt(0) - 97;
                const q = getQuestionByIndex(currentGlobalIndex);
                selectOption(q.id, idx);
            }
            if (key === 'arrowright' && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                saveAndNext();
            }
            if (key === 'arrowleft' && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                goToPrevious();
            }
            if (key === 'escape') {
                closeMobileDrawer();
            }
        });

        // ============================================================
        // ============ INIT ============
        // ============================================================
        function init() {
            updateHeaderName();
            buildPalette();
            renderQuestionPanel();
            updateSubjectTabs();
            updateTimerDisplay();
            startTimer();
            console.log('✅ COMEDK 2012 CBT Loaded!');
            console.log('📋 180 questions | JEE Main CBT Interface | Firebase Leaderboard Ready');
            console.log('⌨ Keyboard shortcuts: A/B/C/D to answer, Arrow keys to navigate, Esc to close drawer');
        }

        // Handle window resize for mobile drawer
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeMobileDrawer();
            }
        });

        init();
    </script>
</body>
</html>
