<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMEDK Mock Test 3 - CBT</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #fff;
            --text: #1a1a2e;
            --border: #dde1e7;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --correct: #16a34a;
            --wrong: #dc2626;
            --neutral: #6b7280;
            --shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .06);
            --radius: 10px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            background: #1e293b;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
        }
        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: .3px;
        }
        header .info {
            font-size: .85rem;
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        #timer {
            background: #ef4444;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: .9rem;
            letter-spacing: .5px;
        }
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 0;
            min-height: calc(100vh - 60px);
        }
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid var(--border);
            padding: 15px 10px;
            position: sticky;
            top: 60px;
            height: calc(100vh - 60px);
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar h3 {
            font-size: .9rem;
            color: var(--neutral);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px 0 6px;
            padding-left: 8px;
        }
        .q-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .q-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #dde1e7;
            background: #f9fafb;
            border-radius: 6px;
            cursor: pointer;
            font-size: .75rem;
            font-weight: 500;
            transition: all .15s;
            color: #374151;
        }
        .q-btn:hover {
            background: #e0e7ff;
            border-color: #a5b4fc;
        }
        .q-btn.answered {
            background: #dbeafe;
            border-color: #93c5fd;
            font-weight: 700;
            color: #1d4ed8;
        }
        .q-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .q-btn.correct-review {
            background: #dcfce7;
            border-color: #86efac;
            color: #166534;
        }
        .q-btn.wrong-review {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        .main {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            max-height: calc(100vh - 60px);
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 6px;
            margin: 20px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .badge {
            background: var(--accent);
            color: #fff;
            font-size: .75rem;
            padding: 3px 10px;
            border-radius: 12px;
        }
        .question-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all .2s;
            scroll-margin-top: 80px;
        }
        .question-card:hover {
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
        }
        .question-card.review-correct {
            border-left: 4px solid var(--correct);
            background: #f0fdf4;
        }
        .question-card.review-wrong {
            border-left: 4px solid var(--wrong);
            background: #fef2f2;
        }
        .q-num {
            font-weight: 700;
            color: var(--accent);
            font-size: .9rem;
            margin-bottom: 6px;
        }
        .q-text {
            font-weight: 500;
            margin-bottom: 10px;
            font-size: .95rem;
        }
        .q-text p {
            margin: 4px 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .15s;
            border: 1px solid transparent;
            font-size: .9rem;
        }
        .option:hover {
            background: #f1f5f9;
        }
        .option input[type="radio"] {
            margin-top: 2px;
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .option.selected {
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        .option.correct-answer {
            background: #dcfce7 !important;
            border-color: #86efac !important;
            font-weight: 600;
        }
        .option.wrong-answer {
            background: #fee2e2 !important;
            border-color: #fca5a5 !important;
        }
        .result-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: .75rem;
            font-weight: 700;
            margin-left: 8px;
        }
        .result-badge.correct {
            background: #dcfce7;
            color: #166534;
        }
        .result-badge.wrong {
            background: #fee2e2;
            color: #991b1b;
        }
        .svg-diagram {
            display: block;
            margin: 8px auto;
            max-width: 100%;
            background: #fafafa;
            border-radius: 6px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
            position: sticky;
            bottom: 10px;
            background: #f0f2f5;
            padding: 12px;
            border-radius: 10px;
            z-index: 10;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: .9rem;
            letter-spacing: .3px;
            transition: all .2s;
        }
        .btn-submit {
            background: var(--accent);
            color: #fff;
        }
        .btn-submit:hover {
            background: var(--accent-hover);
        }
        .btn-reset {
            background: #fff;
            border: 1px solid #d1d5db;
            color: #374151;
        }
        .btn-reset:hover {
            background: #f3f4f6;
        }
        .btn-review {
            background: #f59e0b;
            color: #fff;
        }
        .btn-review:hover {
            background: #d97706;
        }
        .score-panel {
            background: #1e293b;
            color: #fff;
            padding: 16px 20px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .score-panel span {
            color: #fbbf24;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 10px;
            }
            .main {
                max-height: none;
                padding: 12px;
            }
            header {
                font-size: .85rem;
            }
            .q-btn {
                width: 26px;
                height: 26px;
                font-size: .65rem;
            }
        }
    </style>
</head>

        const totalQuestions = 180;

        let totalSeconds = 3 * 60 * 60; // 3 hours

        // ==================== TIMER ====================
        function updateTimer() {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('timer').textContent =
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert('⏰ Time is up! Your test will be submitted automatically.');
                submitTest();
            }
            totalSeconds--;
        }
        timerInterval = setInterval(updateTimer, 1000);

        // ==================== QUESTION DATA ====================
        function getAllQuestions() {
            const q = [];

            // ---------- PHYSICS (1-60) ----------
            q.push({ id: 1, sec: 'physics',
                text: 'The displacement-time graph of a particle executing SHM is shown in figure. Which of the following statements is false?',
                img: 'shm_graph',
                opts: ['a. The acceleration is maximum at t = T', 'b. The force is zero at t = 3T/4',
                    'c. The potential energy equals the total oscillation energy at t = T/2', 'd. None of the above'
                ] });
            q.push({ id: 2, sec: 'physics',
                text: 'The flux linked with a coil at any instant t is given by φ = 10t² − 50t + 250. Then, induced emf at t = 3 is',
                opts: ['a. −10 V', 'b. 10 V', 'c. 190 V', 'd. −190 V'] });
            q.push({ id: 3, sec: 'physics',
                text: 'The fringe width in a Young\'s double slit interference pattern is 3.2×10⁻⁴ m when red light of wavelength 5600 Å is used. How much will it change, if blue light of wavelength 4200 Å is used?',
                opts: ['a. 8×10⁻⁴ m', 'b. 0.8×10⁻⁴ m', 'c. 4.2×10⁻⁴ m', 'd. 0.45×10⁻⁴ m'] });
            q.push({ id: 4, sec: 'physics',
                text: 'A vehicle needs an engine of 7500 W to keep it moving with a constant velocity of 20 m/s on a horizontal surface. The force resisting the motion is',
                opts: ['a. 375 dyne', 'b. 375 N', 'c. 150000 dyne', 'd. 150000 N'] });
            q.push({ id: 5, sec: 'physics',
                text: 'The cell has an emf of 2V and internal resistance 0.1Ω. It is connected to a resistance of 3.9Ω. The voltage across the cell will be',
                opts: ['a. 1.95 V', 'b. 1.5 V', 'c. 2 V', 'd. 1.8 V'] });
            q.push({ id: 6, sec: 'physics',
                text: 'In Young\'s double slit experiment, the slit width and the distance of slits from the screen both are doubled. The fringe width will',
                opts: ['a. increase', 'b. decrease', 'c. remain unchanged', 'd. None of the above'] });
            q.push({ id: 7, sec: 'physics',
                text: 'The counting rate observed from a radioactive source at t=0 was 1600 counts and at t=8s, it was 100 counts. The counting rate observed at t=6s was',
                opts: ['a. 400', 'b. 300', 'c. 200', 'd. 150'] });
            q.push({ id: 8, sec: 'physics',
                text: 'Two discs of the same material and thickness have radii 0.2m and 0.6m. Their moment of inertia about their axes will be in the ratio',
                opts: ['a. 1:81', 'b. 1:27', 'c. 1:91', 'd. 1:3'] });
            q.push({ id: 9, sec: 'physics',
                text: 'A solenoid of length 0.5m has radius 1cm and 500 turns. It carries 5A current. What is the magnetic field inside the solenoid?',
                opts: ['a. 6.28×10⁻³ T', 'b. 6.28×10³ T', 'c. 6.28×10⁻⁵ T', 'd. 6.28×10⁵ T'] });
            q.push({ id: 10, sec: 'physics',
                text: 'For H¹, H², He⁴⁺, Li⁸²⁺ (all one electron), electron transition n=2→1. If wavelengths are λ₁,λ₂,λ₃,λ₄ respectively, which is correct?',
                opts: ['a. 4λ₁=2λ₂=2λ₃=λ₄', 'b. λ₁=2λ₂=2λ₃=λ₄', 'c. λ₁=λ₂=4λ₃=9λ₄', 'd. λ₁=2λ₂=3λ₃=4λ₄'] });
            q.push({ id: 11, sec: 'physics',
                text: 'A 4kg block A is placed on top of 8kg block B on a smooth table. A just slips on B when 12N is applied on A. The maximum horizontal force F on B to make both move together is',
                img: 'blocks_ab',
                opts: ['a. 12 N', 'b. 24 N', 'c. 36 N', 'd. 48 N'] });
            q.push({ id: 12, sec: 'physics',
                text: 'A solid cylinder has mass M, length L, and radius R. The moment of inertia about a generator is',
                opts: ['a. M(L²/12 + R²/4)', 'b. M(L²/12 + R²/2)', 'c. ½MR²', 'd. (3/2)MR²'] });
            q.push({ id: 13, sec: 'physics',
                text: 'In a mixture of H-He⁺ gas, H atoms and He⁺ ions are excited to their first excited states. H atoms transfer total excitation energy to He⁺ ions. The quantum number n finally populated in He⁺ is',
                opts: ['a. 2', 'b. 3', 'c. 4', 'd. 5'] });
            q.push({ id: 14, sec: 'physics',
                text: 'The displacement (x)-time (t) graph of a particle is shown. Which is correct?',
                img: 'xt_graph',
                opts: ['a. Particle starts with zero velocity and variable acceleration',
                    'b. Particle starts with non-zero velocity and variable acceleration',
                    'c. Particle starts with zero velocity and uniform acceleration',
                    'd. Particle starts with non-zero velocity and uniform acceleration'
                ] });
            q.push({ id: 15, sec: 'physics',
                text: 'A student plots a graph for photoelectric effect at various frequencies. Identify X, Y, Z.',
                img: 'photoelectric_graph',
                opts: ['a. X→Photoelectric current; Y→Retarding potential; Z→Stopping potential',
                    'b. X→Retarding plate potential; Y→Photocurrent; Z→Stopping potential',
                    'c. X→Collector plate potential; Y→Photocurrent; Z→Saturation current',
                    'd. X→Retarding plate potential; Y→Photocurrent; Z→Saturation current'
                ] });
            q.push({ id: 16, sec: 'physics',
                text: 'A block of mass m is on an inclined plane of a lift moving down with acceleration 2 m/s². What should be the coefficient of friction for constant velocity relative to lift?',
                img: 'block_incline',
                opts: ['a. μ=1/√3', 'b. μ=0.4', 'c. μ=0.8', 'd. μ=√3/2'] });
            q.push({ id: 17, sec: 'physics',
                text: 'Magnetic susceptibility of a rod material is 499. Permeability of vacuum is 4π×10⁻⁷ H/m. Absolute permeability is',
                opts: ['a. π×10⁻⁴', 'b. 2π×10⁻⁴', 'c. 3π×10⁻⁴', 'd. 4π×10⁻⁴'] });
            q.push({ id: 18, sec: 'physics',
                text: 'Two drops of same radius fall through air at 5 cm/s. If they coalesce to form one drop, the terminal velocity is',
                opts: ['a. 2.5 cm/s', 'b. 10 cm/s', 'c. 5√2 cm/s', 'd. 5×4¹/³ cm/s'] });
            q.push({ id: 19, sec: 'physics',
                text: 'Two projectiles A and B are thrown with velocities v and v/2. B is at 45°. If ranges are same, the inclination of A is',
                opts: ['a. sin⁻¹(1/4)', 'b. ½sin⁻¹(1/4)', 'c. 2sin⁻¹(1/4)', 'd. ½sin⁻¹(1/8)'] });
            q.push({ id: 20, sec: 'physics',
                text: 'A metallic surface is irradiated by light of frequency ν₁ with stopping potential V₁. For frequency ν₂, the stopping potential will be',
                opts: ['a. V₁+h/e(ν₁+ν₂)', 'b. V₁−h/e(ν₁−ν₂)', 'c. V₁+e/h(ν₂−ν₁)', 'd. V₁−h/e(ν₁+ν₂)'] });
            q.push({ id: 21, sec: 'physics',
                text: 'Work done when n smaller equal spherical drops combine to form a bigger drop is proportional to',
                opts: ['a. (n⁻²/³−1)', 'b. (n⁻¹/³−1)', 'c. (n¹/³−1)', 'd. (n⁴/³−1)'] });
            q.push({ id: 22, sec: 'physics',
                text: 'A ball is thrown up at an angle θ to horizontal. The kinetic energy KE varies with height h as which graph?',
                img: 'ke_graph',
                opts: ['a. Linear decreasing', 'b. Parabolic', 'c. Constant', 'd. Linear increasing'] });
            q.push({ id: 23, sec: 'physics',
                text: 'Temperature of a wire (L=1m, A=1cm²) increased from 0°C to 100°C. If not allowed to expand, force required is (α=10⁻⁵/°C, Y=10¹¹ N/m²)',
                opts: ['a. 10³ N', 'b. 10⁴ N', 'c. 10⁵ N', 'd. 10⁹ N'] });
            q.push({ id: 24, sec: 'physics',
                text: 'An ideal gas at 27°C is compressed adiabatically to 8/27 of original volume. Rise in temperature (γ=5/3) is',
                opts: ['a. 475°C', 'b. 150°C', 'c. 275°C', 'd. 402°C'] });
            q.push({ id: 25, sec: 'physics',
                text: 'Which graph shows potential difference between p-side and n-side of a p-n junction in equilibrium?',
                img: 'pn_junction',
                opts: ['a. Graph A', 'b. Graph B', 'c. Graph C', 'd. Graph D'] });
            q.push({ id: 26, sec: 'physics',
                text: 'The figure shows a logic circuit with inputs A, B and output C. Based on waveforms, the logic gate is',
                img: 'logic_gate',
                opts: ['a. OR gate', 'b. NOR gate', 'c. AND gate', 'd. NAND gate'] });
            q.push({ id: 27, sec: 'physics',
                text: 'Magnetic field at centre of circular current-carrying conductor of radius r is Bc. Field on axis at distance r from centre is Ba. Bc:Ba is',
                opts: ['a. 1:√2', 'b. 1:2√2', 'c. 2√2:1', 'd. √2:1'] });

                'chem_reaction68': `<svg class="svg-diagram" width="200" height="60" viewBox="0 0 200 60"><text x="10" y="25" font-size="10" fill="#333">R−X →(KCN)→ A</text><text x="10" y="45" font-size="9" fill="#666">(nucleophilic substitution)</text></svg>`,
                'nitration': `<svg class="svg-diagram" width="180" height="80" viewBox="0 0 180 80"><polygon points="60,10 20,40 40,70 80,70 100,40" fill="none" stroke="#333" stroke-width="1.5"/><text x="50" y="45" font-size="9" fill="#333">OH</text><text x="55" y="60" font-size="9" fill="#333">CH₃</text><text x="120" y="40" font-size="11" fill="#2563eb">+ HNO₃</text></svg>`,
                'antipyretic': `<svg class="svg-diagram" width="180" height="80" viewBox="0 0 180 80"><polygon points="60,10 20,40 40,70 80,70 100,40" fill="none" stroke="#333" stroke-width="1.5"/><text x="45" y="45" font-size="8" fill="#333">COOH</text><text x="50" y="58" font-size="8" fill="#333">OCOCH₃</text><text x="120" y="40" font-size="10" fill="#2563eb">Aspirin</text></svg>`,
                'iupac101': `<svg class="svg-diagram" width="220" height="60" viewBox="0 0 220 60"><text x="10" y="25" font-size="10" fill="#333">CH₃−CH=C(CH₃)−CH(Br)−CH₃</text><text x="30" y="50" font-size="9" fill="#666">4-bromo-3-methylpent-2-ene</text></svg>`,
                'mechanism105': `<svg class="svg-diagram" width="200" height="70" viewBox="0 0 200 70"><text x="10" y="25" font-size="9" fill="#333">Tetrahedral intermediate</text><text x="10" y="45" font-size="8" fill="#666">(Structure II is incorrect)</text></svg>`,
                'isomers106': `<svg class="svg-diagram" width="200" height="60" viewBox="0 0 200 60"><text x="10" y="20" font-size="9" fill="#333">cis/trans isomers</text><text x="10" y="40" font-size="9" fill="#666">Restricted rotation around C=C</text></svg>`,
                'parabola_mirror': `<svg class="svg-diagram" width="220" height="120" viewBox="0 0 220 120"><path d="M30 110 Q110 10 190 110" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="110" cy="60" r="3" fill="#dc2626"/><text x="100" y="50" font-size="8" fill="#dc2626">F</text><text x="115" y="115" font-size="9" fill="#333">A</text><text x="195" y="115" font-size="9" fill="#333">B</text><text x="95" y="105" font-size="8" fill="#666">5cm</text></svg>`,
            };
            return svgs[imgName] || '';
        }

        function renderAllQuestions() {
            const main = document.getElementById('mainContent');
            let html = '';
            let currentSection = '';

            allQuestions.forEach(q => {
                if (q.sec !== currentSection) {
                    const sectionNames = { physics: '📐 PHYSICS (1-60)', chemistry: '⚗️ CHEMISTRY (61-120)',
                        maths: '📊 MATHEMATICS (121-180)' };
                    const badges = { physics: 'Q 1-60', chemistry: 'Q 61-120', maths: 'Q 121-180' };
                    html +=
                        `<div class="section-title">${sectionNames[q.sec]} <span class="badge">${badges[q.sec]}</span></div>`;
                    currentSection = q.sec;
                }

                const svg = q.img ? getSVG(q.img) : '';
                const optLabels = ['a', 'b', 'c', 'd'];
                const optionsHTML = q.opts.map((opt, i) => {
                    const val = optLabels[i];
                    const checked = userAnswers[q.id] === val ? 'checked' : '';
                    return `<label class="option" data-q="${q.id}" data-val="${val}">
                        <input type="radio" name="q${q.id}" value="${val}" ${checked} onchange="selectAnswer(${q.id},'${val}')">
                        <span>${opt}</span>
                    </label>`;
                }).join('');

                html += `
                <div class="question-card" id="qcard${q.id}">
                    <div class="q-num">Question ${q.id}</div>
                    <div class="q-text">${q.text}</div>
                    ${svg}
                    <div class="options">${optionsHTML}</div>
                    <div class="result-badge-container" id="badge${q.id}" style="display:none;"></div>
                </div>`;
            });

            main.innerHTML = html;
            updateSidebar();
            updateOptionHighlights();
        }

        function selectAnswer(qId, val) {
            if (submitted) return;
            userAnswers[qId] = val;
            updateSidebar();
            updateOptionHighlights();
        }

        function updateOptionHighlights() {
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            for (const [qId, val] of Object.entries(userAnswers)) {
                const opt = document.querySelector(`.option[data-q="${qId}"][data-val="${val}"]`);
                if (opt) opt.classList.add('selected');
            }
        }

        function updateSidebar() {
            ['physics', 'chemistry', 'maths'].forEach(sec => {
                const gridId = sec === 'physics' ? 'qGridPhysics' : sec === 'chemistry' ? 'qGridChemistry' :
                    'qGridMaths';
                const grid = document.getElementById(gridId);
                const questions = allQuestions.filter(q => q.sec === sec);
                grid.innerHTML = questions.map(q => {
                    const cls = userAnswers[q.id] ? 'answered' : '';
                    const activeCls = '';
                    return `<button class="q-btn ${cls}" onclick="scrollToQ(${q.id})" title="Q${q.id}">${q.id}</button>`;
                }).join('');
            });
        }

        function scrollToQ(qId) {
            const card = document.getElementById('qcard' + qId);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.boxShadow = '0 0 0 3px #2563eb';
                setTimeout(() => { card.style.boxShadow = ''; }, 2000);
            }
        }

        // ==================== SUBMIT & REVIEW ====================
        function submitTest() {
            if (submitted) {
                if (!confirm('Test already submitted. Review again?')) return;
            }
            submitted = true;
            clearInterval(timerInterval);

            let correctCount = 0;
            let attemptedCount = 0;

            for (const q of allQuestions) {
                const userAns = userAnswers[q.id];
                const correctAns = answerKey[q.id];
                const card = document.getElementById('qcard' + q.id);
                const badgeEl = document.getElementById('badge' + q.id);

                if (card) {
                    card.classList.remove('review-correct', 'review-wrong');
                    if (userAns) {
                        attemptedCount++;
                        if (userAns === correctAns) {
                            card.classList.add('review-correct');
                            correctCount++;
                            if (badgeEl) {
                                badgeEl.style.display = 'block';
                                badgeEl.innerHTML = '<span class="result-badge correct">✓ Correct</span>';
                            }
                        } else {
                            card.classList.add('review-wrong');
                            if (badgeEl) {
                                badgeEl.style.display = 'block';
                                badgeEl.innerHTML =
                                    `<span class="result-badge wrong">✗ Your: ${userAns} | Correct: ${correctAns}</span>`;
                            }
                        }
                    } else {
                        if (badgeEl) {
                            badgeEl.style.display = 'block';
                            badgeEl.innerHTML =
                                `<span class="result-badge wrong" style="background:#fef3c7;color:#92400e;">Not attempted | Answer: ${correctAns}</span>`;
                        }
                        card.classList.add('review-wrong');
                    }
                }

                // Highlight correct option
                if (card) {
                    const correctOpt = card.querySelector(`.option[data-val="${correctAns}"]`);
                    if (correctOpt) correctOpt.classList.add('correct-answer');
                    if (userAns && userAns !== correctAns) {
                        const wrongOpt = card.querySelector(`.option[data-val="${userAns}"]`);
                        if (wrongOpt) wrongOpt.classList.add('wrong-answer');
                    }
                }
            }

            // Update sidebar with review colors
            ['physics', 'chemistry', 'maths'].forEach(sec => {
                const gridId = sec === 'physics' ? 'qGridPhysics' : sec === 'chemistry' ? 'qGridChemistry' :
                    'qGridMaths';
                const grid = document.getElementById(gridId);
                const questions = allQuestions.filter(q => q.sec === sec);
                grid.innerHTML = questions.map(q => {
                    const userAns = userAnswers[q.id];
                    const correctAns = answerKey[q.id];
                    let cls = '';
                    if (userAns && userAns === correctAns) cls = 'correct-review';
                    else if (userAns && userAns !== correctAns) cls = 'wrong-review';
                    else if (!userAns) cls = 'wrong-review';
                    return `<button class="q-btn ${cls}" onclick="scrollToQ(${q.id})" title="Q${q.id}">${q.id}</button>`;
                }).join('');
            });

            // Score panel
            const scoreHTML = `
            <div class="score-panel">
                🎯 Your Score: <span>${correctCount}</span> / ${totalQuestions} | 
                Attempted: <span>${attemptedCount}</span> | 
                Accuracy: <span>${attemptedCount > 0 ? Math.round(correctCount/attemptedCount*100) : 0}%</span>
            </div>`;
            const main = document.getElementById('mainContent');
            const existingScore = document.getElementById('scorePanel');
            if (existingScore) existingScore.remove();
            main.insertAdjacentHTML('afterbegin', `<div id="scorePanel">${scoreHTML}</div>`);

            document.getElementById('btnReview').style.display = 'inline-block';
            document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth' });

            alert(
                `✅ Test Submitted!\n\nScore: ${correctCount}/${totalQuestions}\nAttempted: ${attemptedCount}\nAccuracy: ${attemptedCount > 0 ? Math.round(correctCount/attemptedCount*100) : 0}%\n\nScroll down to review all answers. Correct answers are highlighted in green.`);
        }

        function scrollToReview() {
            const firstWrong = document.querySelector('.review-wrong');
            if (firstWrong) {
                firstWrong.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                const main = document.getElementById('mainContent');
                main.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function resetTest() {
            if (submitted && !confirm('Reset all answers and start over?')) return;
            submitted = false;
            userAnswers = {};
            totalSeconds = 3 * 60 * 60;
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            document.getElementById('timer').textContent = '180:00';
            document.getElementById('btnReview').style.display = 'none';
            const scorePanel = document.getElementById('scorePanel');
            if (scorePanel) scorePanel.remove();
            renderAllQuestions();
            document.getElementById('mainContent').scrollIntoView({ behavior: 'smooth' });
        }

        // ==================== INIT ====================
        renderAllQuestions();
        updateSidebar();
    </script>
</body>
</html>
